  water_p:{c:["#6f9fd8","#bcd8f2","#dfe6f2"], n:2.6, w:6,  h:6, g:1.3,
           splat:"rgba(111,159,216,.30)", shake:4},
  copy_p :{c:["#8f959e","#c7ccd4","#f2f5fa"], n:2.8, w:9,  h:7, g:0.9, shake:7},
  plant_p:{c:["#4b8f86","#6fbfa8","#6b4a33"], n:2.2, w:7,  h:6, g:1.1,
           splat:"rgba(75,143,134,.26)"},
  chair_p:{c:["#3f4a63","#5b6a88","#2b3140"], n:2.0, w:8,  h:6, g:1.2, shake:4},
};
const DEB_DEF={c:["#6f9fd8","#dfe6f2","#f2f5fa"], n:1, w:5, h:4, g:1};
function burstBits(bn,away,big,kind){
  const D=DEBRIS[kind]||DEB_DEF;
  const bits=[]; const n=Math.round(bn*(D.n||1));
  for(let k=0;k<n;k++){
    bits.push({a:away+(Math.random()-.5)*2.4, d:(big?70:34)*(.55+Math.random()*.95),
               sp:Math.random()*10-5,
               w:D.w*(.55+Math.random()*.75), h:D.h*(.55+Math.random()*.75),
               g:D.g, c:D.c[(Math.random()*D.c.length)|0]});
  }
  return bits;
}
function killFoe(g,f,i){
  /* 집기는 일이 아니라 화풀이다 — 미결에도 콤보에도 안 잡힌다 */
  if(E[f.kind].prop){
    g.foes.splice(i,1);
    const away=Math.atan2(f.y-g.P.y, f.x-g.P.x);
    g.fx.push({type:"burst",x:f.x,y:f.y,t:0,r:f.r,bits:burstBits(12,away,false,f.kind)});
    const D=DEBRIS[f.kind];
    if(D&&D.splat&&g.stains.length<70)
      g.stains.push({x:f.x,y:f.y,r:13+Math.random()*13,c:D.splat,t:0});
    if(D&&D.shake) g.shake=Math.max(g.shake,D.shake);
    g.hitstop=Math.max(g.hitstop,.04);
    S("killBoss");
    if(Math.random()<(E[f.kind].drop||0)) dropAt(g,f.x,f.y);
    return;
  }
  g.foes.splice(i,1); g.kills++;
  // 점심시간과 발표 자리 밖의 처치는 진도에 안 잡힌다
  const Zx=zoneOf(g);
  if(g.lunchT>0 || (Zx.ev==="present" && g.podSet && !g.podOn))
    g.killHold=(g.killHold||0)+(g.P.work||1);           // 근로계약서 — 유입 감소
  // 보스 처치는 그 구역 몫을 크게 깎는다 — 큰 걸 잡았으면 그만큼 일한 것이다
  if(f.boss){ g.zoneBonus=(g.zoneBonus||0)+45;
              g.bossKill[f.kind]=1;                    // 업적 — 누구를 넘었나
              flash(g, E[f.kind].name+" 처리 — 미결 45건"); }
  if(f.boss){                            // 보스 처치 — 경험치가 쏟아진다
    for(let k=0;k<14;k++){
      const a=Math.random()*6.283, r=30+Math.random()*90;
      g.orbs.push({x:f.x+Math.cos(a)*r,y:f.y+Math.sin(a)*r,xp:Math.ceil(f.xp/14),t:0,boss:true});
    }
    g.fx.push({type:"ring",x:f.x,y:f.y,t:0,r0:30,r1:280,c:"#f5c451"});
    g.flash=Math.max(g.flash,1);
  } else {
    g.orbs.push({x:f.x,y:f.y,xp:f.xp,t:0,boss:false});
  }
  // 시체 — 쓰러지는 동작을 재생하고 바닥에 잠시 남는다.
  // 죽은 게 그냥 사라지면 "갈아버렸다"는 감각이 남지 않는다.
  g.bodies.push({kind:f.kind, x:f.x, y:f.y, face:f.face, boss:f.boss, t:0,
                 fall:f.boss?.55:.4, life:f.boss?5:3.5});
  if(g.bodies.length>48) g.bodies.splice(0, g.bodies.length-48);
  // 타격이 온 방향(플레이어 → 적)으로 치우쳐 흩어진다. 방향이 읽히면 충격이 커진다.
  const away=Math.atan2(f.y-g.P.y, f.x-g.P.x);
  g.fx.push({type:"burst",x:f.x,y:f.y,t:0,boss:f.boss,r:f.r,
             bits:burstBits(f.boss?18:8,away,f.boss,f.kind)});
  /* 쏟아진 것은 바닥에 남는다 — 커피도 소주도. 지나온 자리가 보여야
     「내가 여기를 갈아버렸다」가 쌓인다 */
  const D=DEBRIS[f.kind];
  if(D&&D.splat&&g.stains.length<70)
    g.stains.push({x:f.x+(Math.random()-.5)*10, y:f.y+(Math.random()-.5)*8,
                   r:9+Math.random()*11, c:D.splat, t:0});
  if(D&&D.shake) g.shake=Math.max(g.shake,D.shake);
  // 히트스톱 3~5프레임이 정석 — 그 사이 뇌가 타격을 등록한다
  g.hitstop=Math.max(g.hitstop, f.boss?.16:.05);
  kick(g, f.x-g.P.x, f.y-g.P.y, f.boss?9:2.2);
  // 콤보 — 연속 처치가 쌓이는 게 눈에 보여야 계속 몰아치게 된다
  dropFrom(g,f);
  /* 창이 1.6초면 적 400명 사이에서 판 전체가 한 콤보가 된다(측정: 5,728).
     숫자가 의미를 가지려면 손을 멈추면 끊겨야 한다. */
  g.combo++; g.comboT=0.85; g.comboPop=1;
  if(g.combo>g.comboBest) g.comboBest=g.combo;
  if(g.combo%10===0){ g.flash=Math.max(g.flash,.5); S("coin"); }
  S("kill",!!f.boss,g.combo);
}

/* ── 갱신 ────────────────────────────────────────────────────── */
function step(g,dt){
  const P=g.P;
  g.t+=dt;
  g.zoneT+=dt;
  stepGate(g,dt);
  if(!g.ot){
    if(!g.warned && hourOf(g.t)>=17){
      g.warned=true;
      flash(g,"17:00 — "+(ZONES.length-g.zone)+"개 구역 남았습니다"); S("deny");
    }
    if(g.t>=DAY){
      g.ot=true; g.otT=0; g.warned=true;
      flash(g,"18:00 — 아직 "+zoneOf(g).name+"입니다. 야근입니다");
      S("overtimeIn"); g.flash=Math.max(g.flash,.9); kick(g,0,-1,14);
    }
  }else{
    g.otT+=dt;
    // 야근 피로 — 버티기만 해선 끝나지 않는다. 시간이 그대로 체력이다.
    // 이게 없으면 계속 도망치는 플레이가 야근에서 영영 안 끝난다(무한 루프).
    P.hp -= (0.8 + g.otT*0.045)*dt*(P.fatigue||1);           // 노동조합 — 야근 피로 감소
    if(P.hp<=0 && !revive(g)){ finish(g,"lose"); return; }
  }
  if(g.toastT>0){ g.toastT-=dt; if(g.toastT<=0) g.toast=""; }
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*34);
  g.shakeX*=Math.max(0,1-dt*11); g.shakeY*=Math.max(0,1-dt*11);
  if(g.comboT>0){ g.comboT-=dt; if(g.comboT<=0) g.combo=0; }
  if(g.comboPop>0) g.comboPop=Math.max(0,g.comboPop-dt*4.5);
  if(g.flash>0) g.flash=Math.max(0,g.flash-dt*2.2);

  // 이동
  let ix=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);
  let iy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
  const m=Math.hypot(ix,iy)||1; ix/=m; iy/=m;
  if(TOUCH.on){ ix=TOUCH.dx; iy=TOUCH.dy; }      // 터치가 있으면 터치 우선
  P.x+=ix*P.spd*(g.rndSlow||1)*dt; P.y+=iy*P.spd*(g.rndSlow||1)*dt;
  if(ix) P.face=ix<0?-1:1;
  P.moving = !!(ix||iy);
  if(P.moving) P.walk += dt*7.5;
  { const pdx=P.x-P.px0, pdy=P.y-P.py0, pd=Math.hypot(pdx,pdy);
    P.px0=P.x; P.py0=P.y;
    // 지연 추적 — 즉시 반영하면 방향만 홱 틀어도 포위가 바로 풀린다
    if(pd>0.01){ const k=Math.min(1,dt*1.6);
                 P.hx+=(pdx/pd-P.hx)*k; P.hy+=(pdy/pd-P.hy)*k; } }
  if(P.inv>0) P.inv-=dt;
  if(P.hurt>0) P.hurt-=dt;
  if(g.lowT>0) g.lowT-=dt;
  /* 야근은 맞지 않아도 체력이 깎인다. 그쪽에도 경고가 필요하다 */
  else if(g.ot && P.hp>0 && P.hp/P.maxhp<0.25){ g.lowT=2.6; S("lowhp"); }
  if(P.atk>0) P.atk-=dt;

  g.baristaOn=0;                 // 커피머신 범위 안이면 stepBuilds가 채운다
  doSpawns(g,dt);
  stepBuilds(g,dt);
  fireWeapons(g,dt);
  stepAllies(g,dt);
  stepPolicy(g,dt);
  stepSay(g,dt);
  stepRobots(g,dt);
  stepEvent(g,dt);
  stepRnd(g,dt);
  stepMeddle(g,dt);
  stepBargain(g,dt);

  // 퇴근 시계(지속형 감속)
  const CK = g.weapons.ontime ? WEAPONS.ontime.lv(1)
           : g.weapons.clock ? WEAPONS.clock.lv(g.weapons.clock) : null;
  const ckR=CK?CK.r*P.range:0;

  // 적
  for(let i=g.foes.length-1;i>=0;i--){
    const f=g.foes[i];
    if(f.hp<=0){ killFoe(g,f,i); continue; }
    if(f.hit>0) f.hit-=dt;
    const dx=P.x-f.x, dy=P.y-f.y, d=Math.hypot(dx,dy)||1;
    /* 점심시간은 여기서 곱한다 — 적 루프가 매 프레임 slow를 되돌리기 때문에
       stepEvent에서 미리 넣어 둔 값은 지워진다 */
    f.slow = ((CK && d<ckR) ? CK.slow : 1) * (g.lunchT>0 ? 0.42 : 1) * (g.rndSpd||1);
    f.face = dx<0 ? -1 : 1;
    if(E[f.kind].eatXp){                     // 인사팀 — 경험치를 가로챈다
      for(let k=g.orbs.length-1;k>=0;k--){
        const o=g.orbs[k];
        if(Math.hypot(o.x-f.x,o.y-f.y) < f.r+9){
          g.orbs.splice(k,1); f.hp+=14;
          g.fx.push({type:"spark",x:o.x,y:o.y,t:0});
        }
      }
    }
    if(f.boss) bossStep(g,f,dt);
    if(f.dash>0){                          // 돌진 중 — 조준은 이미 끝났다
      f.dash-=dt; f.x+=f.dvx*dt; f.y+=f.dvy*dt;
      if(d < f.r+P.r && P.inv<=0){
        if(hurtPlayer(g,f.dmg,P.x-f.x,P.y-f.y,11)) return;
      }
      continue;
    }
    if(f.wind>0){                          // 예비동작 — 멈춰서 힘을 모은다
      f.wind-=dt; if(f.wind<=0 && f.pending) bossFire(g,f);
      continue;
    }
    if(E[f.kind].prop) continue;                      // 집기 — 가만히 서서 맞기만 한다
    /* 던지는 놈 — 사거리 안이면 멈춰서 던지고, 너무 가까우면 물러난다 */
    const SH=E[f.kind].shoot;
    /* hold는 회의에 묶일 때 비로소 생기는 값이라 undefined일 수 있다.
       undefined<=0 은 false여서 조건이 통째로 안 걸렸다 */
    if(SH && !(f.hold>0) && !(f.kb>0) && !f.mv){
      f.shT=(f.shT===undefined?Math.random()*SH.cd:f.shT)-dt;
      if(d<SH.r && f.shT<=0){
        f.shT=SH.cd*(0.75+Math.random()*0.5);
        const a=Math.atan2(dy,dx);
        g.eshots.push({x:f.x, y:f.y, vx:Math.cos(a)*SH.spd, vy:Math.sin(a)*SH.spd,
                       dmg:SH.dmg*(g.ot?1.2:1), t:0, c:SH.c, sp:Math.random()*8-4});
        f.walk+=0.3;
      }
      if(d<SH.keep){                                  // 붙으면 물러난다
        f.x-=dx/d*f.spd*f.slow*dt*0.85; f.y-=dy/d*f.spd*f.slow*dt*0.85;
        f.face=dx<0?1:-1;
        continue;
      }
      if(d<SH.r*0.92){ f.walk+=dt*0.5; continue; }    // 사거리 안이면 멈춰서 던진다
    }
    if(E[f.kind].robot){                              // 로봇 — 나를 무시하고 제 일을 한다
      if(f.hold>0){ f.hold-=dt; }
      else{
        if(f.wx===undefined){ f.wx=f.x+(Math.random()-.5)*300; f.wy=f.y+(Math.random()-.5)*300; }
        const wdx=f.wx-f.x, wdy=f.wy-f.y, wd=Math.hypot(wdx,wdy)||1;
        if(wd<24){ f.wx=f.x+(Math.random()-.5)*420; f.wy=f.y+(Math.random()-.5)*420; }
        else { f.x+=wdx/wd*f.spd*f.slow*dt; f.y+=wdy/wd*f.spd*f.slow*dt;
               f.walk+=dt*f.spd*f.slow/44; f.face=wdx<0?-1:1; }
      }
      continue;                                       // 접촉 피해 없음
    }
    if(f.hold>0){ f.hold-=dt; f.walk+=dt*0.6; }      // 회의에 묶임 — 못 움직인다
    else if(f.kb>0){ f.kb-=dt; f.x+=f.kbx*dt*9; f.y+=f.kby*dt*9; }
    else {
      /* 이동 방식 — 전부 나를 쫓으면 화면은 한 덩어리가 된다.
         같은 장르 오픈소스를 열어 보니 대형마다 이동 방식이 달랐다:
         한 방향으로 흘러가는 줄(벽), 중앙으로 조여드는 원.
         쫓지 않는 적이 섞여야 「읽히는 위협」이 되고 피하는 맛이 생긴다. */
      let gx=dx/d, gy=dy/d;
      if(f.mv===1){                                   // drift — 한 방향으로 밀려온다
        gx=f.mvx; gy=f.mvy;
        f.mvT-=dt; if(f.mvT<=0) f.mv=0;               // 지나가면 다시 쫓는다
      }else if(f.mv===2){                             // center — 한 점으로 조여든다
        const cx=f.cx-f.x, cy=f.cy-f.y, cd=Math.hypot(cx,cy)||1;
        if(cd<40){ f.mv=0; } else { gx=cx/cd; gy=cy/cd; }
        f.mvT-=dt; if(f.mvT<=0) f.mv=0;
      }
      // 도발 — 노조원이 시선을 끌면 그쪽으로 간다
      if(f.tauntT>0){ f.tauntT-=dt;
        const tdx=f.tx-f.x, tdy=f.ty-f.y, td=Math.hypot(tdx,tdy)||1;
        gx=tdx/td; gy=tdy/td; f.mv=0; }
      f.x+=gx*f.spd*f.slow*dt*(f.mv?1.25:1); f.y+=gy*f.spd*f.slow*dt*(f.mv?1.25:1);
      f.walk += dt*f.spd*f.slow/44;
      f.face = gx<0?-1:1;
    }
    // 접촉
    if(d < f.r+P.r && P.inv<=0){
      if(hurtPlayer(g,f.dmg,P.x-f.x,P.y-f.y,7)) return;
    }
  }
  // 적끼리 겹침 완화 — 뭉쳐서 한 덩어리로 보이는 걸 막는다
  for(let a=0;a<g.foes.length;a++){
    const f=g.foes[a];
    const fp=E[f.kind].prop;                       // 가구는 떠밀려 다니지 않는다
    for(let b=a+1;b<Math.min(g.foes.length,a+9);b++){
      const o=g.foes[b], dx=o.x-f.x, dy=o.y-f.y, dd=dx*dx+dy*dy, mr=f.r+o.r;
      if(dd>0.01 && dd<mr*mr){ const d=Math.sqrt(dd), push=(mr-d)*.34/d, op=E[o.kind].prop;
        if(!fp){ f.x-=dx*push; f.y-=dy*push; }
        if(!op){ o.x+=dx*push; o.y+=dy*push; } }
    }
  }

  // 탄
  for(let i=g.shots.length-1;i>=0;i--){
    const s=g.shots[i];
    s.life-=dt; if(s.life<=0){ g.shots.splice(i,1); continue; }
    if(s.kind==="mail"){
      const tgt=nearest(g,s.x,s.y,420);
      if(tgt){ const want=Math.atan2(tgt.y-s.y,tgt.x-s.x);
        const cur=Math.atan2(s.vy,s.vx), sp=Math.hypot(s.vx,s.vy);
        let dA=((want-cur+Math.PI*3)%(Math.PI*2))-Math.PI;
        const na=cur+clamp(dA,-s.turn*dt,s.turn*dt);
        s.vx=Math.cos(na)*sp; s.vy=Math.sin(na)*sp; }
    }
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    for(const f of g.foes){
      const dx=f.x-s.x, dy=f.y-s.y;
      if(dx*dx+dy*dy < (f.r+s.r)*(f.r+s.r)){
        if(s.pierce){                        // 근태기록·전사 공지 — 막히지 않는다
          if(s.hitSet.has(f)) continue;
          s.hitSet.add(f);
          damage(g,f,s.dmg,s.x,s.y,4); S("hit");
          g.fx.push({type:"spark",x:s.x,y:s.y,t:0});
          continue;
        }
        damage(g,f,s.dmg,s.x,s.y,8); S("hit");
        g.fx.push({type:"spark",x:s.x,y:s.y,t:0});
        g.shots.splice(i,1); break;
      }
    }
  }
  // 커피 장판
  for(let i=g.pools.length-1;i>=0;i--){
    const p=g.pools[i]; p.life-=dt; p.t+=dt;
    if(p.life<=0){ g.pools.splice(i,1); continue; }
    for(const f of g.foes){
      const dx=f.x-p.x, dy=f.y-p.y;
      if(dx*dx+dy*dy < p.r*p.r) damage(g,f,p.dps*dt,0,0,0);
    }
  }
  // 경험치 구슬 — 자석 범위는 무기 사거리보다 넓어야 한다.
  // 그렇지 않으면 멀리서 죽인 경험치가 영영 바닥에 남는다.
  const mag=140*P.magnet;
  if(g.orbs.length>70){                 // 구슬이 너무 많으면 합친다
    const keep=g.orbs.slice(0,40);
    let rest=0; for(let i=40;i<g.orbs.length;i++) rest+=g.orbs[i].xp;
    if(rest>0) keep.push({x:P.x+(Math.random()-.5)*90, y:P.y+(Math.random()-.5)*90,
                          xp:rest, t:0, boss:true});
    g.orbs=keep;
  }
  for(let i=g.orbs.length-1;i>=0;i--){
    const o=g.orbs[i]; o.t+=dt;
    const dx=P.x-o.x, dy=P.y-o.y, d=Math.hypot(dx,dy)||1;
    const pull = d<mag ? Math.min(620,150+(mag-d)*6.5)
                       : 26;                       // 범위 밖에서도 천천히 따라온다
    o.x+=dx/d*pull*dt; o.y+=dy/d*pull*dt;
    if(d<P.r+10){ g.orbs.splice(i,1); gainXp(g,o.xp); }
  }
  // 야근 / 카페인 — 내 주변 지속 피해
  if(g.weapons.overtime){
    const L=WEAPONS.overtime.lv(g.weapons.overtime), R=L.r*P.range;
    for(const f of g.foes){
      if(Math.hypot(f.x-P.x,f.y-P.y)<R) damage(g,f,L.dps*dt,0,0,0);
    }
  }
  // 회의 소집 — 한 점으로 끌어당기고 그 안을 깎는다
  for(let i=g.vortex.length-1;i>=0;i--){
    const v=g.vortex[i]; v.life-=dt; v.t+=dt;
    if(v.life<=0){ g.vortex.splice(i,1); continue; }
    for(const f of g.foes){
      if(f.boss) continue;                   // 보스는 끌려오지 않는다
      const dx=v.x-f.x, dy=v.y-f.y, d=Math.hypot(dx,dy)||1;
      if(d>v.r*1.6) continue;
      f.x+=dx/d*v.pull*dt; f.y+=dy/d*v.pull*dt;
      if(d<v.r) damage(g,f,v.dps*dt,0,0,0);
    }
  }
  // 법인카드 — 날아갔다 돌아온다
  /* 적이 던진 것 — 맞으면 아프다. 벽은 없으니 수명으로 지운다 */
  for(let i=g.eshots.length-1;i>=0;i--){
    const e2=g.eshots[i]; e2.t+=dt;
    e2.x+=e2.vx*dt; e2.y+=e2.vy*dt;
    if(e2.t>2.6){ g.eshots.splice(i,1); continue; }
    if(Math.hypot(e2.x-g.P.x, e2.y-g.P.y) < g.P.r+9){
      g.eshots.splice(i,1);
      if(g.P.inv<=0 && hurtPlayer(g,e2.dmg,g.P.x-e2.x,g.P.y-e2.y,6)) return;
      continue;
    }
  }
  /* 던진 사직서 — 포물선으로 날아가 닿는 곳에서 터진다 */
  for(let i=g.paper.length-1;i>=0;i--){
    const q=g.paper[i]; q.t+=dt;
    const u=Math.min(1,q.t/q.dur);
    q.x=q.sx+(q.tx-q.sx)*u; q.y=q.sy+(q.ty-q.sy)*u;
    if(u>=1){
      g.paper.splice(i,1);
      let n=0;
      for(const f of g.foes){
        if(Math.hypot(f.x-q.x,f.y-q.y)>q.r) continue;
        damage(g,f,q.dmg,q.x,q.y,30); n++;
      }
      g.fx.push({type:"ring",x:q.x,y:q.y,t:0,r0:18,r1:q.r*1.6,c:"#f5c451"});
      g.fx.push({type:"burst",x:q.x,y:q.y,t:0,r:q.r*0.4,
                 bits:burstBits(16,Math.random()*6.283,true,"manager")});
      g.shake=Math.max(g.shake,9); g.hitstop=Math.max(g.hitstop,.06);
      g.flash=Math.max(g.flash,.45);
      S("nuke");
      if(n) flash(g,"사직서 — "+n+"명 정리");
    }
  }
  for(let i=g.cards.length-1;i>=0;i--){
    const c=g.cards[i]; c.t+=dt;
    const T=1.05;
    if(c.t>=T){ g.cards.splice(i,1); continue; }
    const k=Math.sin(c.t/T*Math.PI);          // 0→1→0, 갔다가 돌아온다
    c.px=P.x+Math.cos(c.a)*c.reach*k;
    c.py=P.y+Math.sin(c.a)*c.reach*k;
    for(const f of g.foes){
      if(c.hitSet.has(f)) continue;
      if(Math.hypot(f.x-c.px,f.y-c.py) < f.r+11){
        c.hitSet.add(f); damage(g,f,c.dmg,c.px,c.py,7); S("hit");
        setTimeout(()=>c.hitSet.delete(f), 260);   // 돌아올 때 한 번 더
      }
    }
  }
  // 보스 충격파 — 퍼지는 링에 닿으면 맞는다
  for(let i=g.shocks.length-1;i>=0;i--){
    const w=g.shocks[i]; w.t+=dt;
    w.r += (w.max-26)/0.55*dt;
    if(w.r>=w.max){ g.shocks.splice(i,1); continue; }
    if(!w.done && P.inv<=0){
      const dd=Math.hypot(P.x-w.x,P.y-w.y);
      if(Math.abs(dd-w.r) < P.r+14){
        w.done=true;
        if(hurtPlayer(g,w.dmg,P.x-w.x,P.y-w.y,12)) return;
      }
    }
  }
  // 드롭 아이템
  for(let i=g.drops.length-1;i>=0;i--){
    const d=g.drops[i]; d.t+=dt;
    const dx=P.x-d.x, dy=P.y-d.y, dd=Math.hypot(dx,dy)||1;
    if(dd<mag*0.8){ const pull=Math.min(500,140+(mag-dd)*5);
      d.x+=dx/dd*pull*dt; d.y+=dy/dd*pull*dt; }
    if(dd<P.r+14){ g.drops.splice(i,1); takeDrop(g,d); }
  }
  // 시체 — 쓰러지는 동작이 끝나면 서서히 사라진다
  for(let i=g.bodies.length-1;i>=0;i--){
    const bd=g.bodies[i]; bd.t+=dt;
    if(bd.t>bd.life) g.bodies.splice(i,1);
  }
  // 이펙트
  for(let i=g.fx.length-1;i>=0;i--){ g.fx[i].t+=dt; if(g.fx[i].t>.55) g.fx.splice(i,1); }
  for(let i=g.stains.length-1;i>=0;i--){ g.stains[i].t+=dt; if(g.stains[i].t>16) g.stains.splice(i,1); }
  for(let i=g.floats.length-1;i>=0;i--){ g.floats[i].t+=dt; if(g.floats[i].t>.45) g.floats.splice(i,1); }
}

function gainXp(g,n){
  g.xp += n*g.P.xpMul; S("coin");
  if(g.xp>=g.next && !g.paused){    // 오버레이는 한 번에 하나만
    g.xp-=g.next; g.lv++;
    g.next=Math.round(g.next*1.34+3);
    levelUp(g);
  }
}
/* 비상금 — 한 번은 다시 일어난다 */
function revive(g){
  if(g.revives<=0) return false;
  g.revives--;
  g.P.hp=g.P.maxhp; g.P.inv=2.2;
  for(const f of g.foes) damage(g,f,400,g.P.x,g.P.y,26);
  g.fx.push({type:"quit",t:0});
  g.fx.push({type:"ring",x:g.P.x,y:g.P.y,t:0,r0:20,r1:340,c:"#57d98a"});
  kick(g,0,-1,16); g.hitstop=Math.max(g.hitstop,.2); g.flash=Math.max(g.flash,1);
  S("nuke"); flash(g,"비상금 — 다시 일어납니다");
  return true;
}
function flash(g,msg){ g.toast=msg; g.toastT=2.6; }

/* ── 일시정지 ──────────────────────────────────────────────────
   모바일에서 전화가 오면, PC에서 누가 부르면 멈출 방법이 있어야 한다.
   출시 필수 요소인데 없었다. */
function togglePause(){
  const g=G; if(!g || g.over) return;
  if($("#ov").classList.contains("on") && !g.userPaused) return;   // 레벨업 창은 건드리지 않는다
  g.userPaused=!g.userPaused;
  g.paused=g.userPaused;
  if(g.userPaused){ S("select"); renderPause(g); }
  else { closeOverlay(); }
}
function renderPause(g){
  const Z=zoneOf(g);
  $("#card").innerHTML=`
    <div id="pausecard">
      <h1 class="ttl" style="font-size:30px;margin:0 0 6px">잠깐 멈춤</h1>
      <div class="sub" style="margin:0 0 4px">${clockStr(g.t)} · ${esc(Z.name)} (${g.zone+1}/${ZONES.length})</div>
      <div class="crow" style="margin-top:16px">
        <div class="cstat"><b class="num">${g.kills.toLocaleString()}</b><span>처리</span></div>
        <div class="cstat"><b class="num" style="color:${todoOf(g)>0?"var(--bad)":"var(--good)"}">${todoOf(g)}</b><span>미결</span></div>
        <div class="cstat"><b class="num">${g.lv}</b><span>레벨</span></div>
        <div class="cstat"><b class="num">${Math.max(0,Math.ceil(g.P.hp))}</b><span>체력</span></div>
      </div>
      ${loadoutHTML(g,"지금 구성")}
      <button class="primary" id="resume" style="margin-top:18px">계속하기</button>
      <div class="pr">
        <span style="font-size:12px;color:var(--dim)">${isTouch?"화면 드래그로 이동":"WASD 이동"}
          · 공격 자동 · <b style="color:var(--ink)">P</b> 또는 <b style="color:var(--ink)">Esc</b>로 멈춤
          · <b style="color:var(--ink)">M</b> 음소거</span>
      </div>
    </div>`;
  $("#resume").onclick=()=>{ S("resume"); togglePause(); };
  openOverlay();
}
/* 플레이어 피격 — 접촉·돌진·충격파가 전부 여기로 온다.
   제도(이어폰 = 무적 시간, 주 52시간 = 17시 이후 피해 감소)가 규칙을 바꾸는 자리라 한 곳에 둔다.
   쓰러졌으면 true. */
function hurtPlayer(g,dmg,kx,ky,power){
  const P=g.P;
  const late = hourOf(g.t)>=17 ? (P.late||1) : 1;
  P.hp -= dmg*late;
  P.inv = .62 + (P.inv0||0);
  P.hurt = .30;
  kick(g,kx,ky,power); S("hurt"); g.zoneHit=1;
  /* 퇴근 중에 붙잡히면 그만큼 밀린다 — 「5분이면 됩니다」가 5분이 아니다 */
  if(g.gate && g.gate.p>0){ g.gate.p=Math.max(0,g.gate.p-0.16); flash(g,"붙잡혔습니다"); }
  /* 야근엔 시간이 곧 체력이라, 경고가 없으면 갑자기 죽는다 */
  if(P.hp>0 && P.hp/P.maxhp<0.25 && (g.lowT||0)<=0){ g.lowT=2.2; S("lowhp"); }
  if(P.hp<=0 && !revive(g)){ finish(g,"lose"); return true; }
  return false;
}
function finish(g,how){
  if(g.over) return;
  g.over=how; if(raf) cancelAnimationFrame(raf); raf=null;
  S("bgmStop");
  S(how==="win"||how==="late"||how==="union"?"win":"lose");
  syncHud(g);                                     // 18:00으로 맞춰 놓고 결과를 띄운다
  renderEnd(g);
}

/* ── 그리기 ──────────────────────────────────────────────────── */
function drawFloor(g,camX,camY,VW,VH){
  /* 산 구역 배경이 있으면 그걸 타일로 깐다. 없으면 코드 배경 */
  const zi=asset("zone-"+g.zone);
  if(zi){
    const w=zi.naturalWidth, h=zi.naturalHeight;
    const ox=-(((camX%w)+w)%w), oy=-(((camY%h)+h)%h);
    for(let y=oy;y<VH;y+=h) for(let x=ox;x<VW;x+=w) ctx.drawImage(zi,x,y);
    return;
  }
  const B=window.BACKDROP;
  /* 하루가 얼마나 갔는지를 넘긴다 — 0=09시, 1=18시, 그 위는 야근 */
  if(B && B.office){ try{ B.office(ctx,VW,VH,camX,camY,g.t,g.zone,
        g.ot ? 1+Math.min(0.4,(g.otT||0)/220) : Math.min(1,g.t/DAY)); return; }catch(e){} }
  // 폴백 — 배경 모듈이 없어도 게임은 돈다
  ctx.fillStyle=(window.BACKDROP&&window.BACKDROP.floorOf&&window.BACKDROP.floorOf(g.zone))||"#4a443b";
  ctx.fillRect(0,0,VW,VH);
  const T=96, ox=-((camX%T)+T)%T, oy=-((camY%T)+T)%T;
  ctx.strokeStyle="rgba(158,200,255,.055)"; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=ox;x<VW+T;x+=T){ ctx.moveTo(x|0,0); ctx.lineTo(x|0,VH); }
  for(let y=oy;y<VH+T;y+=T){ ctx.moveTo(0,y|0); ctx.lineTo(VW,y|0); }
  ctx.stroke();
}

/* 적의 현재 동작을 고른다 — 맞는 중이면 피격, 아니면 걷기 */
/* ══════════════ 스프라이트 캐시 ══════════════
   캐릭터는 Canvas2D 패스 수십 개로 그린다. 적이 수백 명이면 프레임마다
   수천 번의 패스 연산이 된다(측정: 200명 25 FPS, 450명 13 FPS).
   동작을 프레임 단위로 미리 구워두고 drawImage로 찍는다. */
/* ── 에셋 레이어 ────────────────────────────────────────────────
   tools/build-assets.mjs 가 만든 window.ASSETS를 먼저 본다.
   없으면 지금처럼 코드로 그리고 합성한다 — 하나씩 갈아끼울 수 있게.
   그래서 그림이 한 장만 들어와도 그 한 장만 바뀐다. */
const AST={ img:{}, sfx:{}, ready:{} };
(function(){
  const A=window.ASSETS;
  if(!A) return;
  for(const k in (A.img||{})){
    const im=new Image();
    im.onload =()=>{ AST.ready[k]=true; };
    im.onerror=()=>{ delete AST.img[k]; };
    im.src=A.img[k];
    AST.img[k]=im;
  }
  for(const k in (A.sfx||{})) AST.sfx[k]=A.sfx[k];
  if(window.SFX){
    /* 효과음도 Web Audio로 — <audio>로 틀면 음소거·컴프레서·스로틀을
       전부 비켜간다. 음악 두 겹은 게인·필터가 따로 필요해 별도로 넘긴다 */
    const one={}; for(const k in AST.sfx) if(k!=="bgmPad"&&k!=="bgmDrum") one[k]=AST.sfx[k];
    if(window.SFX.sampleSrc) window.SFX.sampleSrc(one);
    if(AST.sfx.bgmPad && AST.sfx.bgmDrum && window.SFX.bgmSrc)
      window.SFX.bgmSrc(AST.sfx.bgmPad, AST.sfx.bgmDrum);
  }
})();
/* 쓸 수 있는 그림인가 — 로딩이 끝났고 실제로 픽셀이 있는 것만 */
function asset(name){
  const im=AST.img[name];
  return (im && AST.ready[name] && im.naturalWidth>0) ? im : null;
}

const FRAMES={ walk:8, hit:4, die:8, attack:4, idle:1 };
const BAKE=2;
const _cache=new Map();
function baked(kind,size,action,fi){
  const key=kind+"|"+size+"|"+action+"|"+fi;
  if(_cache.has(key)) return _cache.get(key);
  const R=window.SPRITES_RANK, SP=window.SPRITES;
  const fn=(R&&R[kind])||(SP&&SP.foes&&SP.foes[kind]);
  if(!fn){ _cache.set(key,null); return null; }
  const pad=Math.ceil(size*0.62);
  const c=document.createElement("canvas");
  c.width=c.height=Math.ceil(pad*2*BAKE);
  const x=c.getContext("2d");
  x.scale(BAKE,BAKE);
  const n=FRAMES[action]||1;
  try{ fn(x,pad,pad,size,{a:action,p:n>1?fi/n:0,t:0}); }
  catch(e){ _cache.set(key,null); return null; }
  /* ── 외곽선 ──────────────────────────────────────────────────
     어두운 바닥 위에 어두운 정장이 서 있으면 형체가 배경에 먹힌다.
     같은 장르 오픈소스 적 시트를 열어 보니 전부 굵은 외곽선을 두르고
     있었다 — 32px에서 형체가 읽히게 하는 건 색이 아니라 테두리다.

     구운 캔버스에 실루엣을 여덟 방향으로 밀어 깔고(destination-over)
     그 위에 원본이 앉는다. 프레임마다 한 번만 굽고 캐시하니 매 프레임
     비용은 0이다. */
  try{
    /* 두께 — 참조로 연 16px 시트는 외곽선이 폭의 12%였다(2px/16px).
       처음 1.6배로 두니 3.6%밖에 안 돼서 있으나 마나였다.
       크기에 비례시키되 상한을 둔다 — 보스에 너무 두꺼우면 뭉개진다. */
    const w=c.width, h=c.height,
          R=Math.max(2, Math.min(7, Math.round(size*0.055*BAKE)));
    const o=document.createElement("canvas"); o.width=w; o.height=h;
    const ox=o.getContext("2d");
    for(let i=0;i<8;i++){
      const a2=i/8*6.2832;
      ox.drawImage(c, Math.cos(a2)*R, Math.sin(a2)*R);
    }
    ox.globalCompositeOperation="source-in";
    ox.fillStyle="#0a0d13"; ox.fillRect(0,0,w,h);      // 바닥보다 어두운 테두리
    x.setTransform(1,0,0,1,0,0);
    x.globalCompositeOperation="destination-over";
    x.drawImage(o,0,0);
    x.globalCompositeOperation="source-over";
  }catch(e){}
  c._pad=pad;
  _cache.set(key,c);
  return c;
}
function blit(g2,kind,size,action,p,x,y){
  /* 산 스프라이트 시트가 있으면 그것부터. 가로로 8프레임을 기대한다 */
  const sheet=asset(kind==="hero"?"hero":"foe-"+kind);
  if(sheet){
    const cols=Math.max(1,Math.round(sheet.naturalWidth/sheet.naturalHeight));
    const n0=FRAMES[action]||1;
    const fi0=n0>1 ? clamp(Math.floor(p*n0),0,n0-1) : 0;
    const col=cols>1 ? fi0%cols : 0;
    const fw=sheet.naturalWidth/cols;
    g2.drawImage(sheet, col*fw, 0, fw, sheet.naturalHeight,
                 x-size/2, y-size*0.72, size, size*(sheet.naturalHeight/fw));
    return true;
  }
  const n=FRAMES[action]||1;
  const fi=n>1 ? clamp(Math.floor(p*n),0,n-1) : 0;
  const c=baked(kind,size,action,fi);
  if(!c) return false;
  g2.drawImage(c, x-c._pad, y-c._pad, c._pad*2, c._pad*2);
  return true;
}

function poseOf(f,g){
  if(f.hit>0) return {a:"hit", p:clamp(1-f.hit/.15,0,1), t:g.t};
  return {a:"walk", p:(f.walk||0)%1, t:g.t};
}
function drawFoe(g,f,sx,sy){
  const SP=window.SPRITES, R=window.SPRITES_RANK;
  const fn=(R&&R[f.kind])||(SP&&SP.foes&&SP.foes[f.kind]);
  const size=f.boss?76:52;
  // 바닥 그림자 — 이게 없으면 캐릭터가 공중에 떠 보인다
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.42)";
  ctx.beginPath(); ctx.ellipse(sx,sy+f.r*0.82,f.r*0.92,f.r*0.34,0,0,7); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(sx,sy);
  // 스프라이트는 왼쪽을 본다. 오른쪽으로 갈 때만 뒤집는다.
  if(f.face>0) ctx.scale(-1,1);
  const ps=poseOf(f,g);
  if(!blit(ctx,f.kind,size,ps.a,ps.p,0,0) && fn) fn(ctx,0,0,size,ps);
  ctx.restore();
  if(f.hit>0){                           // 얇은 링만 — 흰 덩어리로 얼굴을 지우지 않는다
    const a=clamp(f.hit/.12,0,1);
    ctx.save();
    ctx.strokeStyle="rgba(255,255,255,"+(a*.75)+")"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(sx,sy,f.r*0.9+(1-a)*10,0,7); ctx.stroke();
    ctx.restore();
  }
  // 체력바 — 보스와 다친 적만
  if(f.wind>0){                          // 예비동작 — 무엇이 올지 보여준다
    const w0=f.pending==="shock"?0.45:0.55;
    const a=clamp(1-f.wind/w0,0,1);
    ctx.save();
    ctx.strokeStyle="rgba(245,196,81,.85)"; ctx.lineWidth=3;
    ctx.setLineDash([6,5]); ctx.lineDashOffset=-g.t*40;
    if(f.pending==="shock"){
      ctx.beginPath(); ctx.arc(sx,sy,30+a*200,0,7); ctx.stroke();
    } else {
      const dx=g.P.x-f.x, dy=g.P.y-f.y, dd=Math.hypot(dx,dy)||1;
      ctx.beginPath(); ctx.moveTo(sx,sy);
      ctx.lineTo(sx+dx/dd*260*a, sy+dy/dd*260*a); ctx.stroke();
    }
    ctx.restore();
    ctx.save(); ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=a*.5; ctx.fillStyle="#f5c451";
    ctx.beginPath(); ctx.arc(sx,sy,f.r+8,0,7); ctx.fill(); ctx.restore();
  }
  if(f.rage){                            // 격노 — 붉은 아지랑이
    ctx.save(); ctx.globalAlpha=.22+Math.sin(g.t*9)*.08;
    ctx.fillStyle="#ff6b6b";
    ctx.beginPath(); ctx.arc(sx,sy,f.r+11,0,7); ctx.fill(); ctx.restore();
  }
  if(f.boss || f.hp<f.maxhp){
    const w=f.boss?70:30, rt=clamp(f.hp/f.maxhp,0,1);
    ctx.fillStyle="rgba(11,14,20,.85)"; ctx.fillRect(sx-w/2,sy+f.r+6,w,4);
    ctx.fillStyle=f.boss?"#ff6b6b":"#c3cbe0"; ctx.fillRect(sx-w/2,sy+f.r+6,w*rt,4);
  }
}

/* ── 설치기·동료 그리기 ───────────────────────────────────────
   집기는 바닥에 붙어 있고, 동료는 사람이라 그림자를 받는다. */
/* 구역 사건을 화면에 — 안 보이면 없는 것과 같다 */
function drawEvent(g,X,Y){
  const Z=zoneOf(g), ev=Z.ev, t=g.t;
  const pulse=0.5+0.5*Math.sin(t*3.2);
  ctx.save();
  if(ev==="desk" && g.deskSet){                      // 내 자리
    const x=X(g.deskX), y=Y(g.deskY);
    ctx.fillStyle="rgba(87,217,138,"+(g.deskOn?0.16:0.08)+")";
    ctx.beginPath(); ctx.ellipse(x,y,74,42,0,0,7); ctx.fill();
    ctx.strokeStyle="rgba(87,217,138,"+(g.deskOn?0.7:0.35)+")"; ctx.lineWidth=2.5;
    ctx.setLineDash([9,7]); ctx.beginPath(); ctx.ellipse(x,y,74,42,0,0,7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="rgba(87,217,138,.9)"; ctx.font="700 13px 'Gothic A1',system-ui";
    ctx.textAlign="center"; ctx.fillText("내 자리", x, y-50);
  }
  if(ev==="present" && g.podSet){                    // 발표 자리
    const x=X(g.podX), y=Y(g.podY);
    const on=g.podOn;
    ctx.fillStyle=on?"rgba(245,196,81,.18)":"rgba(245,196,81,"+(0.06+pulse*0.06)+")";
    ctx.beginPath(); ctx.ellipse(x,y,96,52,0,0,7); ctx.fill();
    ctx.strokeStyle=on?"rgba(245,196,81,.85)":"rgba(245,196,81,.45)"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(x,y,96,52,0,0,7); ctx.stroke();
    ctx.fillStyle="#2f3138"; ctx.fillRect(x-62,y-96,124,26);
    ctx.fillStyle="#e9ecf2"; ctx.fillRect(x-59,y-93,118,20);
    ctx.fillStyle=on?"rgba(245,196,81,.95)":"rgba(245,196,81,.6)";
    ctx.font="700 13px 'Gothic A1',system-ui"; ctx.textAlign="center";
    ctx.fillText(on?"발표 중":"여기 서세요", x, y-104);
  }
  if(ev==="printer" && g.prnSet && !g.prnDone){      // 고장난 복합기
    const x=X(g.prnX), y=Y(g.prnY);
    ctx.fillStyle="rgba(158,200,255,"+(0.08+pulse*0.08)+")";
    ctx.beginPath(); ctx.ellipse(x,y,62,34,0,0,7); ctx.fill();
    ctx.fillStyle="rgba(0,0,0,.4)"; ctx.beginPath(); ctx.ellipse(x,y+14,22,8,0,0,7); ctx.fill();
    ctx.fillStyle="#3b4658"; ctx.fillRect(x-20,y-26,40,40);
    ctx.strokeStyle="rgba(6,8,13,.85)"; ctx.lineWidth=2; ctx.strokeRect(x-20,y-26,40,40);
    ctx.fillStyle="#f2f5fa"; ctx.fillRect(x-13,y-20,26,12);
    ctx.fillStyle=pulse>0.5?"#ff6b6b":"#8a3b3b"; ctx.fillRect(x-6,y-2,12,5);
    ctx.fillStyle="rgba(255,107,107,.9)"; ctx.font="700 13px 'Gothic A1',system-ui";
    ctx.textAlign="center"; ctx.fillText("용지 걸림", x, y-38);
  }
  if(g.ambWarn>0){                                 // 기습 예고
    const x=X(g.ambX), y=Y(g.ambY);
    const k=1-g.ambWarn/0.7;
    ctx.fillStyle="rgba(255,107,107,"+(0.10+k*0.22)+")";
    ctx.beginPath(); ctx.ellipse(x,y,60+k*30,34+k*18,0,0,7); ctx.fill();
    ctx.strokeStyle="rgba(255,107,107,.9)"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(x,y,60+k*30,34+k*18,0,0,7); ctx.stroke();
  }
  if(g.lunchT>0){                                  // 점심시간 남은 시간
    ctx.restore(); return;
  }
  ctx.restore();
}
/* 고객사 — 건드리면 안 되는 파란 표시 */
function drawClients(g,X,Y){
  for(const c of g.clients){
    const x=X(c.x), y=Y(c.y);
    const near=(c.hitT||0)>0;
    const blink=near ? (0.4+0.6*Math.abs(Math.sin(g.t*11))) : 0.55;
    ctx.save();
    ctx.fillStyle="rgba(0,0,0,.42)";
    ctx.beginPath(); ctx.ellipse(x,y+13,12,4.5,0,0,7); ctx.fill();
    ctx.strokeStyle="rgba(110,180,255,"+blink+")"; ctx.lineWidth=near?3.5:2.5;
    ctx.beginPath(); ctx.ellipse(x,y+13,17,6.5,0,0,7); ctx.stroke();
    ctx.translate(x,y); if(c.face>0) ctx.scale(-1,1);
    if(!blit(ctx,"vendor",46,"walk",(c.walk/6.283)%1,0,0)){
      const R=window.SPRITES_RANK; if(R&&R.vendor) R.vendor(ctx,0,0,46,{a:"walk",p:(c.walk/6.283)%1,t:g.t});
    }
    ctx.restore();
    ctx.save();
    ctx.fillStyle="rgba(110,180,255,"+blink+")";
    ctx.font="700 12px 'Gothic A1',system-ui"; ctx.textAlign="center";
    ctx.fillText(near?"건드리지 마세요!":"고객사", x, y-34);
    ctx.restore();
  }
}

function drawGate(g,X,Y){
  if(!g.gate) return;
  const x=X(g.gate.x), y=Y(g.gate.y), t=g.gate.t;
  const pulse=0.5+0.5*Math.sin(t*3.4);
  ctx.save();
  // 바닥 표시
  ctx.fillStyle="rgba(87,217,138,"+(0.10+pulse*0.07)+")";
  ctx.beginPath(); ctx.ellipse(x,y+6,58,24,0,0,7); ctx.fill();
  ctx.strokeStyle="rgba(87,217,138,"+(0.45+pulse*0.35)+")"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(x,y+6,58,24,0,0,7); ctx.stroke();
  // 문틀
  ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(x-34,y-66,68,72);
  ctx.fillStyle="#1d2835"; ctx.fillRect(x-32,y-68,64,70);
  ctx.strokeStyle="#57d98a"; ctx.lineWidth=3; ctx.strokeRect(x-32,y-68,64,70);
  // 열린 틈에서 새어나오는 빛
  const gr=ctx.createLinearGradient(x,y-68,x,y+2);
  gr.addColorStop(0,"rgba(87,217,138,"+(0.5+pulse*0.3)+")");
  gr.addColorStop(1,"rgba(87,217,138,0)");
  ctx.fillStyle=gr; ctx.fillRect(x-12,y-66,24,66);
  // 퇴근 게이지 — 문 위에 붙여야 「여기서 버티는 중」으로 읽힌다
  if(g.gate.p>0){
    const w=96, h=11, gy=y-92;
    ctx.fillStyle="rgba(11,14,20,.85)"; ctx.fillRect(x-w/2-3,gy-3,w+6,h+6);
    ctx.fillStyle="#1b2430"; ctx.fillRect(x-w/2,gy,w,h);
    ctx.fillStyle="#57d98a"; ctx.fillRect(x-w/2,gy,w*Math.min(1,g.gate.p),h);
    ctx.strokeStyle="#57d98a"; ctx.lineWidth=1.5; ctx.strokeRect(x-w/2,gy,w,h);
    ctx.fillStyle="#57d98a"; ctx.font="700 12px 'Gothic A1',system-ui"; ctx.textAlign="center";
    ctx.fillText("퇴근 중", x, gy-6);
  }
  // 위로 흐르는 화살표
  ctx.fillStyle="rgba(87,217,138,"+(0.55+pulse*0.4)+")";
  const ay=y-84-((t*46)%26);
  ctx.beginPath(); ctx.moveTo(x,ay-13); ctx.lineTo(x+11,ay+4); ctx.lineTo(x-11,ay+4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
/* 문이 화면 밖이면 가장자리에 방향 표시 — 안 그러면 어디로 갈지 모른다 */
function drawGateArrow(g){
  if(!g.gate) return;
  // 화면 좌표계에서 직접 계산한다 — drawWorld의 X/Y는 여기서 못 쓴다
  const x=(g.gate.x-g.P.x)*ZOOM+VW/2, y=(g.gate.y-g.P.y)*ZOOM+VH/2;
  const m=52, W=VW, H=VH;
  if(x>m && x<W-m && y>m && y<H-m) return;
  const cx=W/2, cy=H/2;
  let dx=x-cx, dy=y-cy; const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
  const rad=Math.min(W,H)/2-58;
  const ax=cx+dx*rad, ay=cy+dy*rad;
  const dist=Math.round(Math.hypot(g.gate.x-g.P.x,g.gate.y-g.P.y));
  ctx.save();
  ctx.translate(ax,ay); ctx.rotate(Math.atan2(dy,dx));
  ctx.fillStyle="rgba(87,217,138,.92)";
  ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(-12,13); ctx.lineTo(-12,-13);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.fillStyle="rgba(87,217,138,.92)";
  ctx.font="700 13px 'Gothic A1',system-ui,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("출구 "+dist, ax-dx*26, ay-dy*26);
  ctx.restore();
}

function drawBuilds(g,X,Y){
  for(const b of g.builds){
    const x=X(b.x), y=Y(b.y), L=b.L;
    const fade=Math.min(1,(b.life-b.t)/0.8);
    ctx.save(); ctx.globalAlpha=clamp(fade,0,1);
    if(b.id==="part"){
      const hw=L.w/2, ca=Math.cos(b.a)*hw, sa=Math.sin(b.a)*hw;
      ctx.strokeStyle="rgba(0,0,0,.45)"; ctx.lineWidth=15; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(x-ca,y-sa+5); ctx.lineTo(x+ca,y+sa+5); ctx.stroke();
      ctx.strokeStyle="#2f3a4c"; ctx.lineWidth=12;
      ctx.beginPath(); ctx.moveTo(x-ca,y-sa); ctx.lineTo(x+ca,y+sa); ctx.stroke();
      ctx.strokeStyle="#44536b"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(x-ca,y-sa-5); ctx.lineTo(x+ca,y+sa-5); ctx.stroke();
      const rt=clamp(b.hp/b.maxhp,0,1);                 // 내구도
      ctx.fillStyle="rgba(11,14,20,.8)"; ctx.fillRect(x-hw,y-16,L.w,3);
      ctx.fillStyle=rt>.4?"#9ec8ff":"#ff6b6b"; ctx.fillRect(x-hw,y-16,L.w*rt,3);
    } else {
      const r = L.r || 40;
      if(b.id!=="book"){                                 // 작동 범위
        ctx.strokeStyle = b.id==="water"?"rgba(87,217,138,.28)"
                        : b.id==="barista"?"rgba(245,196,81,.26)"
                        : b.id==="wet"?"rgba(158,200,255,.24)":"rgba(158,200,255,.18)";
        ctx.lineWidth=2; ctx.setLineDash([7,7]);
        ctx.beginPath(); ctx.ellipse(x,y,r,r*0.62,0,0,7); ctx.stroke();
        ctx.setLineDash([]);
      }
      if(b.id==="wet"){
        ctx.fillStyle="rgba(158,200,255,.10)";
        ctx.beginPath(); ctx.ellipse(x,y,r,r*0.62,0,0,7); ctx.fill();
      }
      ctx.fillStyle="rgba(0,0,0,.42)";
      ctx.beginPath(); ctx.ellipse(x,y+11,15,5,0,0,7); ctx.fill();
      const body = b.id==="printer"?"#3b4658" : b.id==="water"?"#2e5a4b"
                 : b.id==="barista"?"#5a4a2e" : b.id==="wet"?"#c8a33a" : "#3f4a63";
      ctx.fillStyle=body; ctx.fillRect(x-13,y-22,26,32);
      ctx.strokeStyle="rgba(6,8,13,.85)"; ctx.lineWidth=1.8; ctx.strokeRect(x-13,y-22,26,32);
      ctx.fillStyle="rgba(255,255,255,.13)"; ctx.fillRect(x-11,y-20,5,28);
      const eye = b.id==="water"?"#9fe6c2" : b.id==="barista"?"#f5c451"
                : b.id==="wet"?"#1d2129" : "#9ec8ff";
      ctx.fillStyle=eye; ctx.fillRect(x-7,y-16,14,5);
    }
    ctx.restore();
  }
}
function drawAllies(g,X,Y){
  for(const al of g.allies){
    const x=X(al.x), y=Y(al.y);
    ctx.save();
    ctx.fillStyle="rgba(0,0,0,.42)";
    ctx.beginPath(); ctx.ellipse(x,y+13,12,4.5,0,0,7); ctx.fill();
    /* 아군 표식 — 적과 섞이면 안 된다. 초록 링으로 구분한다 */
    ctx.strokeStyle="rgba(87,217,138,.55)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(x,y+13,14,5.5,0,0,7); ctx.stroke();
    ctx.translate(x,y);
    if(al.face>0) ctx.scale(-1,1);
    const kind = al.id==="unionist" ? "staff" : al.id==="peer" ? "intern" : "rookie";
    if(!blit(ctx,kind,46,"walk",(al.walk/6.283)%1,0,0)){
      const R=window.SPRITES_RANK; if(R&&R[kind]) R[kind](ctx,0,0,46,{a:"walk",p:(al.walk/6.283)%1,t:g.t});
    }
    ctx.restore();
    const rt=clamp(al.hp/al.maxhp,0,1);
    if(rt<1){
      ctx.fillStyle="rgba(11,14,20,.85)"; ctx.fillRect(x-14,y-24,28,3);
      ctx.fillStyle="#57d98a"; ctx.fillRect(x-14,y-24,28*rt,3);
    }
  }
}

function drawPlayer(g,sx,sy){
  const P=g.P;
  // 바닥 그림자 — 회전/반전 밖에서 그린다
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.beginPath(); ctx.ellipse(sx,sy+19,14,5,0,0,7); ctx.fill();
  ctx.restore();
  /* 발밑 표식 — 적 400명 사이에서 내가 어디 있는지 한눈에 찾으려면
     체형만으로는 부족하다. 얇은 링 하나면 충분하고, 색은 노랑(내 편) 고정. */
  ctx.save();
  ctx.strokeStyle="rgba(245,196,81,.55)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(sx,sy+19,16.5,6,0,0,7); ctx.stroke();
  ctx.strokeStyle="rgba(245,196,81,.16)"; ctx.lineWidth=5;
  ctx.beginPath(); ctx.ellipse(sx,sy+19,16.5,6,0,0,7); ctx.stroke();
  ctx.restore();
  const R=window.SPRITES_RANK;
  if(R && R.hero){
    // 동작 선택: 공격 > 피격 > 걷기 > 대기
    let a="idle", pr=0;
    if(P.atk>0){ a="attack"; pr=clamp(1-P.atk/.25,0,1); }
    else if(P.hurt>0){ a="hit"; pr=clamp(1-P.hurt/.3,0,1); }
    else if(P.moving){ a="walk"; pr=(P.walk/6.283)%1; }
    ctx.save(); ctx.translate(sx,sy);
    if(P.face>0) ctx.scale(-1,1);
    if(!blit(ctx,"hero",56,a,pr,0,0)) R.hero(ctx,0,0,56,{a:a,p:pr,t:g.t});
    ctx.restore();
    if(P.hurt>0){                       // 피격 플래시
      ctx.save(); ctx.globalCompositeOperation="lighter";
      ctx.globalAlpha=clamp(P.hurt/.3,0,1)*.6; ctx.fillStyle="#ff6b6b";
      ctx.beginPath(); ctx.arc(sx,sy,P.r+9,0,7); ctx.fill(); ctx.restore();
    }
    if(P.inv>0 && ((g.t*18)|0)%2===0){
      ctx.save(); ctx.globalAlpha=.28; ctx.fillStyle="#ff6b6b";
      ctx.beginPath(); ctx.arc(sx,sy,P.r+8,0,7); ctx.fill(); ctx.restore();
    }
    return;
  }
  ctx.save(); ctx.translate(sx,sy);
  ctx.translate(0,Math.sin(P.walk)*2.0);
  if(P.face>0) ctx.scale(-1,1);
  const hurt=P.hurt>0;
  // 다리
  const sw=Math.sin(P.walk)*4;
  ctx.fillStyle="#2f3542";
  ctx.fillRect(-7, 6, 5, 12+sw); ctx.fillRect( 2, 6, 5, 12-sw);
  // 몸통 (셔츠)
  ctx.fillStyle=hurt?"#ff9f9f":"#dfe6f2";
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(-10,-8,20,16,4):ctx.rect(-10,-8,20,16); ctx.fill();
  // 넥타이
  ctx.fillStyle="#6f9fd8";
  ctx.beginPath(); ctx.moveTo(-2,-8); ctx.lineTo(2,-8); ctx.lineTo(1.5,4); ctx.lineTo(-1.5,4); ctx.closePath(); ctx.fill();
  // 머리
  ctx.fillStyle=hurt?"#ffd0d0":"#e8d3bd";
  ctx.beginPath(); ctx.arc(0,-15,8,0,7); ctx.fill();
  ctx.fillStyle="#2f3542";                       // 머리카락
  ctx.beginPath(); ctx.arc(0,-17,8,Math.PI,0); ctx.fill();
  ctx.fillStyle="#2f3542";                       // 눈 (왼쪽 보는 얼굴)
  ctx.fillRect(-5,-16,2,2); ctx.fillRect(-1,-16,2,2);
  ctx.restore();
  // 무적 깜빡임
  if(P.inv>0 && ((g.t*18)|0)%2===0){
    ctx.save(); ctx.globalAlpha=.35; ctx.fillStyle="#ff6b6b";
    ctx.beginPath(); ctx.arc(sx,sy,P.r+8,0,7); ctx.fill(); ctx.restore();
  }
}

function draw(g){
  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,0,0);
  try{ drawWorld(g); } finally { ctx.setTransform(DPR,0,0,DPR,0,0); }
  drawBossBar(g);
  drawBargain(g);
  drawCombo(g);
  drawGateArrow(g);           // 화면 좌표계 — 배율 변환 밖
  drawStick();
}
/* 콤보 — 10단위마다 화면이 번쩍인다 */
/* 상단 보스 체력바 — 얼마나 남았는지 모르면 보스전이 아니다 */
function drawBossBar(g){
  const bs=g.foes.filter(f=>f.boss);
  if(!bs.length) return;
  const b=bs.reduce((a,c)=>c.hp>a.hp?c:a,bs[0]);
  const w=Math.min(560,VW-80), x=(VW-w)/2, y=VW<=560?110:64;   // 좁은 화면은 슬롯 아래로
  const rt=clamp(b.hp/b.maxhp,0,1);
  ctx.save();
  ctx.fillStyle="rgba(11,14,20,.82)"; ctx.fillRect(x-2,y-2,w+4,16);
  ctx.strokeStyle=b.rage?"#ff6b6b":"#5a2b2f"; ctx.lineWidth=1;
  ctx.strokeRect(x-2.5,y-2.5,w+5,17);
  ctx.fillStyle="#241016"; ctx.fillRect(x,y,w,12);
  const gr=ctx.createLinearGradient(x,0,x+w,0);
  gr.addColorStop(0,b.rage?"#b93b3b":"#6f9fd8");
  gr.addColorStop(1,b.rage?"#ff6b6b":"#9ec8ff");
  ctx.fillStyle=gr; ctx.fillRect(x,y,w*rt,12);
  ctx.font="800 12px 'Gothic A1','Malgun Gothic',sans-serif";
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=b.rage?"#ff6b6b":"#9ec8ff";
  ctx.fillText(E[b.kind].name + (b.rage?" · 격노":"") + (bs.length>1?"  외 "+(bs.length-1):""), x, y-6);
  ctx.textAlign="right";
  ctx.fillStyle="#7d8699";
  ctx.fillText(Math.ceil(b.hp)+" / "+b.maxhp, x+w, y-6);
  ctx.restore();
}
function drawCombo(g){
  if(g.flash>0){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="rgba(245,196,81,"+(g.flash*.13)+")";
    ctx.fillRect(0,0,VW,VH); ctx.restore();
  }
  if(g.combo<3) return;
  const a=clamp(g.comboT/0.85,0,1);
  const pop=1+g.comboPop*0.30;
  const tier=g.combo>=40?"#ff6b6b":g.combo>=20?"#f5c451":"#9ec8ff";
  ctx.save();
  ctx.translate(VW*0.5, VH*0.30);
  ctx.scale(pop,pop);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font="400 "+(38+Math.min(26,g.combo*0.5))+"px 'Black Han Sans','Malgun Gothic',sans-serif";
  ctx.fillStyle="rgba(11,14,20,"+(a*.8)+")";
  ctx.fillText(g.combo,2,3);
  ctx.globalAlpha=a; ctx.fillStyle=tier;
  ctx.fillText(g.combo,0,0);
  ctx.font="800 14px 'Gothic A1','Malgun Gothic',sans-serif";
  ctx.fillStyle="rgba(232,236,244,"+(a*.75)+")";
  ctx.fillText("연속 처리",0,34);
  ctx.restore();
}
function drawWorld(g){
  const P=g.P;
  const VWz=VW/ZOOM, VHz=VH/ZOOM;
  let camX=P.x-VWz/2, camY=P.y-VHz/2;
  if(opt("shake")){                          // 설정 — 어지러운 사람을 위해
    camX+=g.shakeX; camY+=g.shakeY;
    if(g.shake>0){ camX+=(Math.random()-.5)*g.shake*.7; camY+=(Math.random()-.5)*g.shake*.7; }
  }
  const X=v=>v-camX, Y=v=>v-camY;

  drawFloor(g,camX,camY,VWz,VHz);

  // 커피 장판
  for(const p of g.pools){
    const a=clamp(p.life/1.2,0,1)*.5;
    const gr=ctx.createRadialGradient(X(p.x),Y(p.y),4,X(p.x),Y(p.y),p.r);
    gr.addColorStop(0,"rgba(245,196,81,"+(a*.7)+")");
    gr.addColorStop(1,"rgba(217,169,78,0)");
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(X(p.x),Y(p.y),p.r,0,7); ctx.fill();
  }
  /* 쏟아진 자국 — 커피와 소주. 지나온 자리가 남아야 「갈아버렸다」가 쌓인다 */
  for(const st of g.stains){
    const al=Math.min(1,st.t<0.3?st.t/0.3:1)*(st.t>14?Math.max(0,(16-st.t)/2):1);
    if(al<=0) continue;
    ctx.save(); ctx.globalAlpha=al;
    ctx.fillStyle=st.c;
    ctx.beginPath(); ctx.ellipse(X(st.x),Y(st.y),st.r,st.r*0.42,0,0,7); ctx.fill();
    ctx.restore();
  }
  drawMeddle(g,X,Y);              // 상사 반경 — 바닥에 깔아야 적에 안 가린다
  // 퇴근 시계 범위
  if(g.weapons.clock){
    const L=WEAPONS.clock.lv(g.weapons.clock), r=L.r*P.range;
    ctx.save(); ctx.globalAlpha=.16; ctx.strokeStyle="#9ec8ff"; ctx.lineWidth=2;
    ctx.setLineDash([6,6]); ctx.lineDashOffset=-g.t*20;
    ctx.beginPath(); ctx.arc(X(P.x),Y(P.y),r,0,7); ctx.stroke(); ctx.restore();
  }
  // 드롭 아이템 — 눈에 확 띄어야 주우러 간다
  for(const d of g.drops){
    const C=DROPS[d.kind], sx=X(d.x), sy=Y(d.y);
    const bob=Math.sin(g.t*4+d.x*.05)*3;
    ctx.save(); ctx.globalAlpha=.22; ctx.fillStyle=C.color;
    ctx.beginPath(); ctx.arc(sx,sy+bob,17+Math.sin(g.t*5)*3,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.ellipse(sx,sy+13,9,3,0,0,7); ctx.fill();
    ctx.save(); ctx.translate(sx,sy+bob);
    ctx.fillStyle="#0b0e14"; ctx.strokeStyle=C.color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(0,0,10,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle=C.color;
    if(d.kind==="chest"){                    // 상자 — 크고 금색이라 못 지나친다
      ctx.fillStyle="#8a6b47"; ctx.fillRect(-9,-6,18,12);
      ctx.fillStyle="#c9a227"; ctx.fillRect(-9,-6,18,3.4);
      ctx.fillStyle="#c9a227"; ctx.fillRect(-2,-6,4,12);
      ctx.fillStyle="#f5c451"; ctx.fillRect(-1,-1,2,3);
    }
    else if(d.kind==="heal"){ ctx.fillRect(-5,-1.6,10,3.2); ctx.fillRect(-1.6,-5,3.2,10); }
    else if(d.kind==="magnet"){ ctx.beginPath(); ctx.arc(0,0,4.5,0,7); ctx.fill(); }
    else { ctx.fillRect(-4,-5,8,10); ctx.fillStyle="#0b0e14";
           ctx.fillRect(-2.5,-3,5,1.4); ctx.fillRect(-2.5,-.5,5,1.4); ctx.fillRect(-2.5,2,3,1.4); }
    ctx.restore();
  }

  // 경험치 구슬
  for(const o of g.orbs){
    const s=o.boss?5:3, pul=1+Math.sin(g.t*8+o.x)*0.18;
    ctx.fillStyle=o.boss?"#57d98a":"#f5c451";
    ctx.beginPath(); ctx.arc(X(o.x),Y(o.y),s*pul,0,7); ctx.fill();
    if(o.boss){ ctx.save(); ctx.globalAlpha=.22;
      ctx.beginPath(); ctx.arc(X(o.x),Y(o.y),s*2.6*pul,0,7); ctx.fill(); ctx.restore(); }
  }
  // 시체 — 바닥에 쌓인다. 갈아버린 게 사라지면 갈아버린 감각이 안 남는다.
  for(const bd of g.bodies){
    const sx=X(bd.x), sy=Y(bd.y);
    if(sx<-90||sx>VWz+90||sy<-90||sy>VHz+90) continue;
    const pr=clamp(bd.t/bd.fall,0,1);
    const fade=clamp((bd.life-bd.t)/1.2,0,1);
    ctx.save();
    ctx.globalAlpha=fade*0.85;
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.beginPath();
    ctx.ellipse(sx,sy+(bd.boss?24:16),(bd.boss?26:19)*(.6+pr*.7),(bd.boss?7:5),0,0,7);
    ctx.fill();
    ctx.translate(sx,sy);
    if(bd.face>0) ctx.scale(-1,1);
    const sz=bd.boss?76:52;
    if(!blit(ctx,bd.kind,sz,"die",pr,0,0)){
      ctx.rotate(pr*1.35); ctx.globalAlpha*=0.75;
      blit(ctx,bd.kind,sz,"idle",0,0,0);
    }
    ctx.restore();
  }

  drawEvent(g,X,Y);           // 구역 사건 — 안 보이면 없는 것과 같다
  drawGate(g,X,Y);            // 출구 — 화면에 「저기로」가 있어야 한다
  drawBuilds(g,X,Y);          // 집기는 사람 아래에 깔린다

  // 적 (아래쪽이 앞)
  const sorted=g.foes.slice().sort((a,b)=>a.y-b.y);
  for(const f of sorted){
    const sx=X(f.x), sy=Y(f.y);
    if(sx<-90||sx>VWz+90||sy<-90||sy>VHz+90) continue;
    drawFoe(g,f,sx,sy);
    if(f.sayT>0) drawSay(g,f,sx,sy);
  }
  drawAllies(g,X,Y);
  drawClients(g,X,Y);
  drawPlayer(g,X(P.x),Y(P.y));

  /* 적이 던진 것 — 흰 종이가 돌면서 날아온다. 피할 수 있어야 한다 */
  for(const e2 of g.eshots){
    ctx.save(); ctx.translate(X(e2.x),Y(e2.y)); ctx.rotate(e2.t*e2.sp);
    ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(-6,-8,13,17);
    ctx.fillStyle=e2.c; ctx.fillRect(-7,-9,13,17);
    ctx.fillStyle="rgba(0,0,0,.22)"; ctx.fillRect(-7,-9,13,4);
    ctx.restore();
  }
  /* 던진 사직서 — 떠서 날아가는 게 보여야 한다. 그림자로 높이를 준다 */
  for(const q of g.paper){
    const u=Math.min(1,q.t/q.dur), h=Math.sin(u*Math.PI)*46;
    const sx=X(q.x), sy=Y(q.y);
    ctx.fillStyle="rgba(0,0,0,.28)";
    ctx.beginPath(); ctx.ellipse(sx,sy,9*(1-h/90),4*(1-h/90),0,0,7); ctx.fill();
    ctx.save(); ctx.translate(sx,sy-h); ctx.rotate(q.t*13);
    ctx.fillStyle="#f7f9fc"; ctx.fillRect(-9,-12,18,24);
    ctx.fillStyle="#c3ccdb"; ctx.fillRect(-9,-12,18,4);
    ctx.fillStyle="#ff6b6b"; ctx.fillRect(-6,-4,12,2.6); ctx.fillRect(-6,1,9,2.6);
    ctx.restore();
    /* 떨어질 자리 — 미리 보여야 피할 수도, 몰 수도 있다 */
    ctx.save(); ctx.globalAlpha=.16+u*.30; ctx.strokeStyle="#f5c451"; ctx.lineWidth=2;
    ctx.setLineDash([6,6]); ctx.lineDashOffset=-q.t*40;
    ctx.beginPath(); ctx.arc(X(q.tx),Y(q.ty),q.r,0,7); ctx.stroke(); ctx.restore();
  }
  // 탄
  for(const s of g.shots){
    ctx.save(); ctx.translate(X(s.x),Y(s.y));
    ctx.rotate(Math.atan2(s.vy,s.vx));
    if(s.kind==="pierce"){ ctx.fillStyle="#9ec8ff"; ctx.fillRect(-12,-2.5,24,5);
      ctx.fillStyle="#cfe4ff"; ctx.fillRect(6,-2.5,6,5); }
    else if(s.kind==="paper"){ ctx.fillStyle="#f2f5fa"; ctx.fillRect(-6,-4,12,8);
      ctx.fillStyle="#c3ccdb"; ctx.fillRect(-6,-4,12,2); }
    else { ctx.fillStyle="#dfe6f2"; ctx.fillRect(-7,-5,14,10);
      ctx.strokeStyle="#7d8699"; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(-7,-5); ctx.lineTo(0,1); ctx.lineTo(7,-5); ctx.stroke(); }
    ctx.restore();
  }
  // 이펙트
  for(const e of g.fx){
    const a=1-e.t/.55;
    const busy=g.fx.length>14;
    if(busy && (e.type==="spark"||e.type==="stamp")) continue;
    if(e.type==="spark"){ ctx.fillStyle="rgba(255,255,255,"+a+")";
      ctx.beginPath(); ctx.arc(X(e.x),Y(e.y),3+(1-a)*7,0,7); ctx.fill(); }
    else if(e.type==="stamp"){
      ctx.save(); ctx.translate(X(e.x),Y(e.y)); ctx.rotate(-.2);
      ctx.globalAlpha=a*.85; ctx.strokeStyle="#ff6b6b"; ctx.lineWidth=2.2;
      const r=6+(1-a)*13; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke();
      ctx.restore(); }
    else if(e.type==="burst"){
      // 처치 — 서류가 흩날린다. 개체마다 방향·거리·회전이 다르다.
      const p=1-a;                       // 진행도
      for(const b of (e.bits||[])){
        const dist=b.d*(1-(1-p)*(1-p));  // 처음에 빠르게 튀고 감속
        ctx.save();
        ctx.translate(X(e.x)+Math.cos(b.a)*dist,
                      Y(e.y)+Math.sin(b.a)*dist + p*p*14*(b.g===undefined?1:b.g));
        /* 낙하가 종류마다 다르다 — 서류는 천천히 내려앉고 유리는 바로 떨어진다 */
        ctx.rotate(b.a+e.t*b.sp); ctx.globalAlpha=a;
        ctx.fillStyle=b.c;
        ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
        ctx.restore();
      }
      if(!busy){                       // 링이 수십 개 겹치면 화면이 안 읽힌다
        ctx.globalAlpha=a*.38; ctx.strokeStyle="#ff6b6b"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(X(e.x),Y(e.y),(e.r||16)*(.7+(1-a)*1.2),0,7); ctx.stroke();
      }
      ctx.globalAlpha=1; }
    else if(e.type==="quit"){
      ctx.fillStyle="rgba(245,196,81,"+(a*.5)+")"; ctx.fillRect(0,0,VWz,VHz); }
  }
  // 데미지 숫자
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const t of g.floats){
    const a=1-t.t/.45;
    ctx.font=(t.big?"800 17px":"800 12px")+" 'Gothic A1','Malgun Gothic',sans-serif";
    ctx.fillStyle="rgba(11,14,20,"+a+")";
    ctx.fillText(t.v,X(t.x)+1,Y(t.y)-t.t*34+1);
    ctx.fillStyle=t.big?"rgba(245,196,81,"+a+")":"rgba(255,255,255,"+a+")";
    ctx.fillText(t.v,X(t.x),Y(t.y)-t.t*34);
  }
  // 화면 밖 보스 표시
  for(const f of g.foes){ if(!f.boss) continue;
    const sx=X(f.x), sy=Y(f.y);
    if(sx>=0&&sx<=VWz&&sy>=0&&sy<=VHz) continue;
    const cx=VWz/2, cy=VHz/2, ang=Math.atan2(sy-cy,sx-cx);
    const px=cx+Math.cos(ang)*(Math.min(VWz,VHz)/2-26), py=cy+Math.sin(ang)*(Math.min(VWz,VHz)/2-26);
    ctx.save(); ctx.translate(px,py); ctx.rotate(ang);
    ctx.fillStyle="#ff6b6b"; ctx.beginPath();
    ctx.moveTo(12,0); ctx.lineTo(-8,-7); ctx.lineTo(-8,7); ctx.closePath(); ctx.fill();
    ctx.restore(); }
}

/* ── 아이콘 (무기/강화 카드용) ────────────────────────────────── */
/* ── 아이콘 ────────────────────────────────────────────────────
   전에는 스프라이트 5장을 40여 항목이 돌려 썼다. 파티션과 노조원이
   같은 그림이고 복사기와 복합기가 같은 그림이라, 슬롯만 봐서는 뭘 들었는지
   알 수 없었다. 레벨업마다 보이는 그림이라 매판 눈에 걸린다.
   64×64 설계 좌표에 항목마다 하나씩 그린다. 도형은 단순하게, 외곽선은 굵게 —
   40px로 줄여도 실루엣이 남아야 한다. */
const IC=(function(){
  const OUT="rgba(6,8,13,.85)";
  function R(x,r,px,py,w,h,rad,fill){          // 둥근 사각
    const c=x; c.beginPath();
    const xx=px,yy=py; rad=Math.min(rad,w/2,h/2);
    c.moveTo(xx+rad,yy); c.arcTo(xx+w,yy,xx+w,yy+h,rad);
    c.arcTo(xx+w,yy+h,xx,yy+h,rad); c.arcTo(xx,yy+h,xx,yy,rad);
    c.arcTo(xx,yy,xx+w,yy,rad); c.closePath();
    if(fill){ c.fillStyle=fill; c.fill(); }
    c.strokeStyle=OUT; c.lineWidth=2.4; c.stroke();
  }
  function F(c,px,py,w,h,rad,fill){            // 외곽선 없는 채움
    c.beginPath(); rad=Math.min(rad,w/2,h/2);
    c.moveTo(px+rad,py); c.arcTo(px+w,py,px+w,py+h,rad);
    c.arcTo(px+w,py+h,px,py+h,rad); c.arcTo(px,py+h,px,py,rad);
    c.arcTo(px,py,px+w,py,rad); c.closePath(); c.fillStyle=fill; c.fill();
  }
  function D(c,px,py,r,fill,line){             // 원
    c.beginPath(); c.arc(px,py,r,0,6.2832); c.fillStyle=fill; c.fill();
    if(line!==false){ c.strokeStyle=OUT; c.lineWidth=2.4; c.stroke(); }
  }
  function L(c,col,w,fn){ c.strokeStyle=col; c.lineWidth=w; c.lineCap="round";
                          c.lineJoin="round"; c.beginPath(); fn(c); c.stroke(); }
  function lines(c,px,py,w,n,col){             // 서류 줄
    L(c,col||"#aab3c2",2,k=>{ for(let i=0;i<n;i++){ k.moveTo(px,py+i*5); k.lineTo(px+w*(i%2?0.7:1),py+i*5); } });
  }
  const PAPER="#f2f5fa", INK="#2b3140", GOLD="#f5c451", RED="#ff6b6b",
        BLUE="#9ec8ff", GREEN="#57d98a", STEEL="#8f959e", WOOD="#8a6b47", VIO="#a78bd0";
  function doc(c,col){ R(c,0,18,10,28,40,3,col||PAPER); lines(c,24,20,16,5); }
  return {
  /* ── 무기 ── */
  stamp:c=>{ doc(c); D(c,42,42,12,RED); L(c,"#fff",3,k=>{k.moveTo(37,42);k.lineTo(41,46);k.lineTo(48,37);}); },
  copy:c=>{ R(c,0,10,26,44,26,3,STEEL); F(c,14,30,36,6,1,"#5a616c");
            R(c,0,18,8,28,20,2,PAPER); lines(c,23,13,18,3); },
  mail:c=>{ R(c,0,10,18,44,30,3,PAPER); L(c,INK,2.6,k=>{k.moveTo(10,18);k.lineTo(32,34);k.lineTo(54,18);});
            D(c,48,44,10,BLUE); L(c,INK,2.4,k=>{k.moveTo(44,44);k.lineTo(52,44);k.moveTo(49,41);k.lineTo(52,44);k.lineTo(49,47);}); },
  coffee:c=>{ D(c,32,40,17,"#6b4a33"); F(c,17,36,30,10,4,"#3c2a1e");
              L(c,"#c9a227",3,k=>{k.moveTo(24,24);k.lineTo(27,16);k.moveTo(32,23);k.lineTo(34,14);k.moveTo(40,24);k.lineTo(43,16);}); },
  clock:c=>{ D(c,32,32,22,PAPER); L(c,INK,3,k=>{k.moveTo(32,32);k.lineTo(32,19);k.moveTo(32,32);k.lineTo(43,36);}); D(c,32,32,3,INK,false); },
  quit:c=>{ doc(c); L(c,RED,3.4,k=>{k.moveTo(22,44);k.lineTo(44,22);}); L(c,INK,2,k=>{k.moveTo(24,20);k.lineTo(38,20);}); },
  meeting:c=>{ D(c,32,34,20,"#3f4a63"); [0,1,2,3,4].forEach(i=>{const a=i/5*6.2832-1.57;
               D(c,32+Math.cos(a)*20,34+Math.sin(a)*20,6,PAPER);}); },
  overtime:c=>{ D(c,32,32,21,"#2b3140"); D(c,32,32,13,"#3f4a63");
                L(c,GOLD,3,k=>{k.moveTo(32,32);k.lineTo(32,22);k.moveTo(32,32);k.lineTo(40,36);}); },
  msg:c=>{ R(c,0,8,14,36,26,6,PAPER); L(c,INK,2.4,k=>{k.moveTo(18,40);k.lineTo(14,50);k.lineTo(28,40);});
           lines(c,15,24,20,3); D(c,50,44,9,GREEN); },
  card:c=>{ R(c,0,8,20,48,26,3,"#4a6fa5"); F(c,12,26,20,5,1,PAPER); F(c,12,35,30,3,1,"rgba(255,255,255,.5)");
            F(c,40,24,12,9,2,GOLD); },
  attend:c=>{ R(c,0,12,10,40,44,3,PAPER); lines(c,18,20,28,6);
              L(c,GREEN,3.4,k=>{k.moveTo(24,40);k.lineTo(30,46);k.lineTo(44,28);}); },
  elev:c=>{ R(c,0,12,10,40,44,3,STEEL); L(c,INK,2.4,k=>{k.moveTo(32,12);k.lineTo(32,54);});
            L(c,INK,3,k=>{k.moveTo(20,28);k.lineTo(25,22);k.lineTo(30,28);k.moveTo(34,36);k.lineTo(39,42);k.lineTo(44,36);}); },
  /* 진화형 — 원본 위에 금색 표식 */
  jeongyeol:c=>{ IC.stamp(c); D(c,52,14,10,GOLD); },
  notice:c=>{ IC.copy(c); D(c,52,14,10,GOLD); },
  replyall:c=>{ IC.mail(c); D(c,52,14,10,GOLD); },
  caffeine:c=>{ IC.coffee(c); D(c,52,14,10,GOLD); },
  ontime:c=>{ IC.clock(c); D(c,52,14,10,GOLD); },
  resign:c=>{ IC.quit(c); D(c,52,14,10,GOLD); },
  /* ── 설치기 ── */
  part:c=>{ F(c,8,44,48,6,2,"rgba(0,0,0,.3)"); R(c,0,8,24,48,20,2,"#6d6a62");
            L(c,"#8f8c84",2.2,k=>{k.moveTo(12,30);k.lineTo(52,30);k.moveTo(12,38);k.lineTo(52,38);}); },
  printer:c=>{ R(c,0,8,24,48,28,3,"#3b4658"); R(c,0,18,12,28,16,2,PAPER); lines(c,23,17,18,2);
               F(c,14,34,36,6,2,"#9ec8ff"); D(c,48,46,4,GREEN,false); },
  water:c=>{ R(c,0,20,6,24,24,4,"#6fc3e0"); R(c,0,18,30,28,26,3,"#e8ecf4");
             F(c,24,36,16,6,2,"#2e5a4b"); },
  barista:c=>{ R(c,0,12,12,40,34,3,"#5a4a2e"); F(c,20,20,24,10,2,"#2b2118");
               D(c,32,46,9,"#3c2a1e"); L(c,"#c9a227",2.6,k=>{k.moveTo(28,32);k.lineTo(28,38);k.moveTo(36,32);k.lineTo(36,38);}); },
  wet:c=>{ L(c,"#c8a33a",0,k=>{}); c.beginPath(); c.moveTo(32,10); c.lineTo(54,50); c.lineTo(10,50);
           c.closePath(); c.fillStyle="#e0b83a"; c.fill(); c.strokeStyle=OUT; c.lineWidth=2.6; c.stroke();
           L(c,INK,3.4,k=>{k.moveTo(32,26);k.lineTo(32,38);}); D(c,32,44,2.6,INK,false); },
  book:c=>{ R(c,0,10,12,44,40,3,PAPER); L(c,"#9ec8ff",2.4,k=>{
            for(let i=0;i<3;i++){k.moveTo(18,24+i*8);k.lineTo(46,24+i*8);} });
            D(c,46,44,11,RED); L(c,"#fff",2.6,k=>{k.moveTo(42,44);k.lineTo(50,44);}); },
  /* ── 동료 ── */
  junior:c=>{ D(c,32,22,11,"#e8d3bd"); F(c,23,12,18,7,3,"#262b38");

function icon(id,size,kind){
  const c=document.createElement("canvas"); c.width=c.height=72;
  const x=c.getContext("2d");
  x.translate(4,4);                            // 64 설계 좌표를 72 안에 여백 두고 앉힌다
  /* 법인카드(무기)와 명함(강화)이 둘 다 id "card"다. 종류로 가른다 */
  const key = (id==="card" && kind==="p") ? "namecard" : id;
  const bought=asset("icon-"+key);
  if(bought){ x.drawImage(bought,0,0,64,64); c.style.width=c.style.height=size+"px"; return c; }
  const f = IC[key] || (key==="namecard" ? IC.card : null);
  if(f) { try{ f(x); }catch(e){} }
  else { x.fillStyle="#6f9fd8"; x.fillRect(18,18,36,36); }
  c.style.width=c.style.height=size+"px";
  return c;
}

/* ── 레벨업 선택 ─────────────────────────────────────────────── */
function evoReady(g){
  const out=[];
  for(const base in EVO){
    const e=EVO[base];
    if(!g.weapons[base] || g.weapons[base]<WEAPONS[base].max) continue;
    if((g.perks[e.perk]|0) < PERKS[e.perk].max) continue;
    if(g.weapons[e.to]) continue;
    out.push({kind:"e", id:e.to, base:base, lv:0});
  }
  return out;
}
function offers(g){
  const ev=evoReady(g);
  if(ev.length) return [ev[0]];            // 진화가 가능하면 그것만 보여준다
  const out=[];
  for(const id in WEAPONS){ const lv=g.weapons[id]||0;
    if(WEAPONS[id].evo) continue;                                // 진화형은 evoReady로만 나온다
    if(!lv && !unlocked(id)) continue;                           // 아직 이야기가 안 풀렸다
    if(lv>=WEAPONS[id].max) continue;
    if(!lv && Object.keys(g.weapons).length>=6) continue;      // 무기는 최대 6종
    out.push({kind:"w",id,lv}); }
  /* 지금 쓸모가 없는 건 내놓지 않는다. Lv2에 「노동조합」(동료가 없다),
     09시에 「주 52시간」(17시 이후에만 걸린다)이 뜨면 고를 게 없는 판이 된다. */
  const hasAlly = Object.keys(g.weapons).some(k=>WEAPONS[k]&&WEAPONS[k].ally);
  const hasBuild= Object.keys(g.weapons).some(k=>WEAPONS[k]&&WEAPONS[k].build);
  const gate={
    union   : ()=>hasAlly,                      // 동료가 있어야 의미가 있다
    law52   : ()=>g.zone>=6,                    // 16시 이후 구역부터
    contract: ()=>g.zone>=2,                    // 미결이 실제로 쌓이기 시작한 뒤
    remote  : ()=>g.lv>=6,
    annual  : ()=>g.lv>=5,
  };
  for(const id in PERKS){ const lv=g.perks[id]||0;
    if(lv>=PERKS[id].max) continue;
    if(!lv && gate[id] && !gate[id]()) continue;
    out.push({kind:"p",id,lv}); }
  void hasBuild;
  // 셋 뽑기 — 이미 가진 걸 조금 더 자주 준다(빌드가 완성되게)
  const pool=[];
  for(const o of out){ pool.push(o); if(o.lv>0) pool.push(o); }
  const pick=[],seen=new Set();
  while(pick.length<3 && pool.length){
    const i=(Math.random()*pool.length)|0, o=pool[i];
    pool.splice(i,1);
    const key=o.kind+o.id; if(seen.has(key)) continue;
    seen.add(key); pick.push(o);
  }
  return pick;
}
/* 지금 들고 있는 무기 — 뭘 키울지 판단하려면 보여야 한다 */
function loadoutHTML(g,label){
  const ids=Object.keys(g.weapons);
  if(!ids.length) return "";
  const chips=ids.map(id=>{
    const W=WEAPONS[id], lv=g.weapons[id];
    return W.evo
      ? `<span class="wchip evo">${esc(W.name)}</span>`
      : `<span class="wchip">${esc(W.name)} <b class="num">${lv}</b></span>`;
  }).join("");
  const free=Math.max(0,6-ids.length);
  return `<div class="wrow">${label?'<span class="k">'+esc(label)+'</span>':""}${chips}`
    + (free?`<span class="wchip empty">빈 칸 ${free}</span>`:"") + `</div>`;
}

/* ── 승진 딜레마 ───────────────────────────────────────────────
   이 게임의 중심 선택이다. 정답이 있으면 선택이 아니다.
   받으면 세지지만 오늘 몫이 늘고 그 직급이 내일까지 따라온다.
   안 받으면 그대로지만 오늘이 편해진다.
   레벨 카드를 뺏지 않는다 — 딜레마는 빌드가 아니라 태도를 묻는 것이라
   승진 화면이 먼저 뜨고, 고르고 나면 평소의 레벨 카드가 이어진다. */
const PROMO_EVERY = 5;                        // 5·10·15… 레벨
const PROMO_LOAD  = 30;                       // 받으면 오늘 미결 +30
const PROMO_EASE  = 20;                       // 안 받으면 오늘 미결 −20
function promoDue(g){
  return g.lv>=PROMO_EVERY && g.lv%PROMO_EVERY===0
      && g.lv>(g.promoLv||0) && rankOf(g)<RANK_MAX;
}
function promoUp(g){
  g.paused=true; g.promoLv=g.lv; S("levelup");
  const now=rankOf(g), next=Math.min(RANK_MAX,now+1);
  const card=$("#card");
  card.innerHTML='<div class="title" style="align-items:baseline;gap:10px">'
    +'<h1 class="ttl" style="font-size:30px;color:#c9a227">승진</h1>'
    +'<span style="font-size:13px;color:var(--dim)">'
    +esc(rankName(now))+' → '+esc(rankName(next))+' · 정답은 없습니다</span></div>'
    +'<div class="picks" style="margin-top:16px"></div>';
  const box=card.querySelector(".picks");
  const opt=(name,lvl,desc,accent,fn)=>{
    const b=document.createElement("button");
    b.className="pick"; if(accent) b.style.borderColor="#c9a227";
    b.appendChild(icon(accent?"promo":"stay",40));
    const t=document.createElement("div");
    t.innerHTML='<span class="n"'+(accent?' style="color:#c9a227"':'')+'>'+esc(name)+'</span>'
      +'<span class="lvl">'+esc(lvl)+'</span><span class="d">'+desc+'</span>';
    b.appendChild(t);
    b.onclick=()=>{ fn(); S("place"); closeOverlay(); g.paused=false;
                    levelUp(g); };            // 승진을 고른 뒤 평소의 레벨 카드
    box.appendChild(b);
  };
  opt("승진을 받는다", rankName(next),
      '능력 +'+Math.round(RANK_PWR*100)+'% · 구역 몫 +'+Math.round(RANK_LOAD*100)+'%<br>'
      +'<b style="color:var(--bad)">오늘 미결 +'+PROMO_LOAD+'</b> · 이 직급은 내일도 따라옵니다',
      true, ()=>{
        g.rank++; applyPerks(g);
        g.zoneBonus=(g.zoneBonus||0)-PROMO_LOAD;
        flash(g, rankName(rankOf(g))+" 승진 — 미결 +"+PROMO_LOAD);
        g.flash=Math.max(g.flash,.7); kick(g,0,-1,10);
      });
  opt("받는 만큼만 한다", rankName(now),
      '능력 그대로 · 직급 그대로<br>'
      +'<b style="color:var(--good)">오늘 미결 −'+PROMO_EASE+'</b> · 내일도 오늘만큼만 합니다',
      false, ()=>{
        g.zoneBonus=(g.zoneBonus||0)+PROMO_EASE; g.declined=1;
        flash(g,"받는 만큼만 — 미결 −"+PROMO_EASE);
      });
  openOverlay();
}

function levelUp(g){
  if(promoDue(g)){ promoUp(g); return; }
  g.paused=true; S("levelup");
  const list=offers(g);
  if(!list.length){ g.paused=false; return; }
  const card=$("#card");
  const isEvo = list.length===1 && list[0].kind==="e";
  card.innerHTML='<div class="title" style="align-items:baseline;gap:10px">'
    +'<h1 class="ttl" style="font-size:30px">'+(isEvo?"진화":"레벨 "+g.lv)+'</h1>'
    +'<span style="font-size:13px;color:'+(isEvo?"var(--good)":"var(--dim)")+'">'
    +(isEvo?"조건이 맞았습니다":"하나를 고르세요")+'</span></div>'
    + (isEvo?"":loadoutHTML(g))
    +'<div class="picks" style="margin-top:16px"></div>';
  const box=card.querySelector(".picks");
  list.forEach(o=>{
    const D = o.kind==="p"?PERKS[o.id]:WEAPONS[o.id];
    const b=document.createElement("button");
    b.className = o.kind==="e" ? "pick evo" : "pick";
    b.appendChild(icon(o.kind==="e"?o.base:o.id,40,o.kind));
    const txt=document.createElement("div");
    const lvl = o.kind==="e" ? ("진화 — "+WEAPONS[o.base].name+"을 대체합니다")
              : o.lv===0 ? "신규" : ("Lv "+o.lv+" → "+(o.lv+1));
    const desc = o.kind==="p" ? D.desc : (o.lv===0?D.desc:D.up(o.lv+1));
    txt.innerHTML='<span class="n">'+esc(D.name)+'</span>'
      +'<span class="lvl">'+lvl+'</span><span class="d">'+esc(desc)+'</span>';
    b.appendChild(txt);
    b.onclick=()=>{
        if(o.kind==="e"){
        delete g.weapons[o.base]; delete g.cds[o.base];
        g.weapons[o.id]=1;
        flash(g,WEAPONS[o.id].name+" — 진화");
        S("nuke"); g.flash=Math.max(g.flash,1); kick(g,0,-1,12);
      }
      else if(o.kind==="w") g.weapons[o.id]=(g.weapons[o.id]||0)+1;
      else { g.perks[o.id]=(g.perks[o.id]||0)+1; applyPerks(g); }
      S("place"); closeOverlay(); g.paused=false; syncSlots(g);
      if(g.pendingLv>0){ g.pendingLv--; levelUp(g); }   // 「짬」 — 남은 시작 선택
    };
    box.appendChild(b);
  });
  openOverlay();
}
function openOverlay(){ $("#ov").classList.add("on"); }

function syncSlots(g){
  const el=$("#slots"); el.innerHTML="";
  for(const id in g.weapons){
    const W=WEAPONS[id];
    const d=document.createElement("div");
    d.className = W.evo ? "slot evo" : "slot";      // 진화한 무기는 눈에 띄어야 한다
    d.appendChild(icon(W.evo && EVO_BASE[id] ? EVO_BASE[id] : id, 34));
    const b=document.createElement("b");
    b.textContent = W.evo ? "★" : g.weapons[id];
    d.appendChild(b);
    d.title=W.name+(W.evo?" (진화)":" Lv"+g.weapons[id]);
    el.appendChild(d);
  }
}
/* 구역 경계를 시간 막대에 눈금으로 — 하루가 몇 토막인지 보여야 한다 */
function markBossTicks(){
  const bar=$("#daybar"); if(!bar) return;
  bar.querySelectorAll("u").forEach(u=>u.remove());
  ZONES.forEach(b=>{
    const p=((b.h-H0)/(H1-H0))*100;
    if(p<0||p>100) return;
    const u=document.createElement("u");
    u.style.left=p.toFixed(1)+"%";
    u.title=b.name;
    bar.appendChild(u);
  });
}
function syncHud(g){
  const P=g.P;
  if(g.ot){
    const oh=(g.otT/DAY)*(H1-H0);                 // 야근 경과(게임 시간)
    const hh=Math.floor(oh), mm=Math.floor((oh-hh)*60);
    $("#clock").innerHTML="야근 <small>"
      +(hh>0?hh+"시간 ":"")+String(Math.floor(mm/5)*5)+"분째</small>";
  }else{
    $("#clock").innerHTML=clockStr(g.t)+"<small>"
      +(hourOf(g.t)>=17?"곧 퇴근":"근무 중")+"</small>";
  }
  $("#daybar i").style.width=Math.min(100,g.t/DAY*100).toFixed(1)+"%";
  $("#daybar").classList.toggle("ot",g.ot);
  const td=todoOf(g), te=$("#todo"), Z=zoneOf(g);
  te.querySelector("b").textContent=td;
  te.classList.toggle("ok",td<=0);
  const re2=$("#rnd");
  if(re2){
    /* 지금 뭐가 걸려 있는지 — 효과가 있는데 안 보이면 버그처럼 느껴진다 */
    if(g.rndName && (g.rndT>0 || g.rndShow>0)){
      re2.style.display="";
      re2.className=g.rndKind||"";
      re2.innerHTML=esc(g.rndName)+(g.rndT>0?"<small>"+Math.ceil(g.rndT)+"초</small>":"");
    } else re2.style.display="none";
  }
  const rb=$("#repl");
  if(rb){
    if(g.robotSeen){
      const rr=Math.round(replaceRate(g)*100);
      rb.style.display="";
      rb.querySelector("b").textContent=rr+"%";
      rb.className = rr>=45?"hot" : rr>=30?"warn" : "";
    } else rb.style.display="none";
  }
  const zn=$("#zone");
  if(zn){
    zn.innerHTML=(g.zone+1)+" / "+ZONES.length+" <b>"+esc(Z.name)+"</b>";
    zn.classList.toggle("open", !!g.gate);
  }
  $("#lv b").textContent=g.lv;
  $("#kills b").textContent=g.kills;
  $("#hpn").textContent=Math.max(0,Math.ceil(P.hp))+" / "+P.maxhp;
  $("#hpb i").style.width=clamp(P.hp/P.maxhp,0,1)*100+"%";
  $("#xpb i").style.width=clamp(g.xp/g.next,0,1)*100+"%";
  $("#toast").textContent=g.toast;
}

const BLANK_SAVE = () => ({career:0, lv:{}, best:0, days:0, cleared:false, rank:0, last:null,
  score:0, clear:0, wins:0, unions:0, runs:0, zone:0, combo:0, opt:{}, ach:{}, grudge:""});
function loadSave(){

/* 저장된 등급을 실제 보너스로 */
function metaBonus(){
  const M={hp:0, spd:0, haste:0, xp:0, magnet:0, startLv:0, stampLv:0, revive:0};
  for(const k in CAREER){ const l=SAVE.lv[k]|0; if(l>0) CAREER[k].f(M,l); }
  return M;
}
/* ── 점수 ──────────────────────────────────────────────────────
   경력은 화폐다 — 쓰면 줄어드니 「내가 얼마나 잘하나」를 못 나타낸다.
   출근 일수는 실력과 무관하고, 최다 처리는 오래 살기만 해도 오른다.
   다섯 숫자가 동등하게 놓여 있어서 어느 것도 나를 대표하지 못했다.

   그래서 한 판을 하나의 정수로 접는다. 경력과 따로 계산한다 —
   상점 물가를 조정할 때마다 옛 기록이 깨지면 기록이 아니다. */
function scoreOf(g){
  const hours=(Math.min(g.t,DAY)/DAY)*(H1-H0);
  const end = g.over==="union"?2200 : g.over==="win"?1500
            : g.over==="late"?600 : g.over==="replaced"?250 : 0;
  return Math.round((hours*120 + g.kills*2.2 + (g.comboBest||0)*3
                    + Math.min(g.zone,ZONES.length)*160 + end) * (1+rankOf(g)*0.12));
}
/* 하루 결과 → 경력. 오래 버틸수록, 많이 처리할수록. */
function careerEarned(g){
  const hours=(Math.min(g.t,DAY)/DAY)*(H1-H0);
  const bonus = g.over==="union" ? 400 : g.over==="win" ? 150
              : g.over==="late" ? 60 : g.over==="replaced" ? 25 : 0;
  /* 직급 배수 — 승진이 순수한 함정이면 그건 선택이 아니라 실수다.
     몫이 8% 늘면 하루가 남기는 것도 12% 늘어야 어려운 쪽을 고를 이유가 생긴다 */
  return Math.round((hours*12 + g.kills*0.22 + bonus)*(1+rankOf(g)*0.12));
}

/* ── 이야기 ────────────────────────────────────────────────────
   하데스가 재플레이를 만드는 방식: 판이 끝날 때마다 이야기를 조금씩 풀고,
   인물들이 지금까지의 진행에 반응해 새 말을 한다. 실패도 이야기의 일부라
   다시 하는 게 자연스럽다. 우리는 「매일 출근한다」가 이미 그 구조다.

   출근 일수(SAVE.days)가 곧 진도다. 해금도 상점이 아니라 이야기로 푼다 —
   후임이 4일차에 「같이 가도 돼요?」 하고 따라붙는 게, 상점에서 후임을
   사는 것보다 이 게임답다. */
const DAYS=[

  {d:1,  head:"2일차",          line:"어제 6시에 나가는 걸 누가 봤다."},

  {d:5,  head:"6일차",          line:"오늘 12시에 뭔가 들어온다고 했다.",

  {d:7,  head:"8일차",          line:"인사팀이 면담을 잡자고 한다. 피할 수 없다."},

         unlock:"__bargain", unlockName:"단체교섭"},
];
function dayStage(days){
  let cur=DAYS[0];
  for(const s of DAYS) if(days>=s.d) cur=s;
  return cur;
}
function nextStage(days){ return DAYS.find(s=>s.d>days)||null; }
/* 이야기로 풀리는 것들 — 그 전에는 아예 없는 셈 친다 */
/* ── 업적 ──────────────────────────────────────────────────────
   「계속하면 목표가 뭐야?」에 답이 없었다. 해금이 출근 일수에만
   묶여 있어서, 잘하든 못하든 판 수만 채우면 열렸다. 실력과 무관했다.

   같은 장르 오픈소스를 여덟 개 받아 코드를 열어 보니 구조가 분명했다 —
   ACHIEVEMENTS(조건) → UNLOCKS(무기 보상). 「한 판에 1000명」이면 무기
   하나, 「보스 처치」면 무기 하나. 잘해야 열린다. 그게 다음 판을
   시작하는 이유가 된다.

   이야기 해금(일수)은 그대로 둔다 — 그건 「내일도 출근한다」는
   서사고, 업적은 「오늘 잘했다」는 실력이다. 둘은 다른 축이다. */

const achDone = id => !!(SAVE.ach&&SAVE.ach[id]);
/* 업적이 연 것들 — 이야기 해금과 따로 모은다 */
function achUnlocked(id){
  for(const a of ACH){
    if(!achDone(a.id)) continue;
    if(a.w===id||a.p===id||a.a===id) return true;
  }
  return false;
}
function unlocked(id){
  const d=SAVE.days|0;
  for(const s of DAYS) if(s.unlock===id) return d>=s.d || achUnlocked(id);

/* 판이 끝나면 한 번에 판정한다. 진행 중 판정은 화면을 시끄럽게 만든다 */
function gradeAch(g){
  const r={ kills:g.kills, combo:g.comboBest|0, over:g.over, zone:g.zone,
            rank:rankOf(g), score:scoreOf(g), repl:replaceRate(g),
            sawRobot:!!g.robotSeen, boss:g.bossKill||{}, noonZone:g.noonZone|0,
            cleanZone:!!g.cleanZone, declined:!!g.declined,
            maxed:Object.keys(g.weapons).some(k=>WEAPONS[k]&&g.weapons[k]>=WEAPONS[k].max) };
  SAVE.ach=SAVE.ach||{};
  const got=[];
  for(const a of ACH){
    if(SAVE.ach[a.id]) continue;
    let ok=false; try{ ok=!!a.f(r); }catch(e){}
    if(!ok) continue;
    SAVE.ach[a.id]=1;
    got.push(a);
  }
  return got;
}
function achReward(a){
  const id=a.w||a.p||a.a; if(!id) return "";
  const W=WEAPONS[id]||PERKS[id];

/* ── 로비 ──────────────────────────────────────────────────────
   이 화면은 「게임의 홈」이어야 하는데 「시작 전 안내문」이었다.
   세로의 60%가 게임 설명이라 두 번째 판부터는 전부 소음이고,
   그 소음이 「출근」을 접힘 아래로 밀어냈다.

   구조를 넷으로 나눈다 — 상위 게임 로비가 공통으로 가진 것들이다.
     ① 내 상태  : 최고 점수 하나. 다섯 숫자를 나열하면 어느 것도 나를 대표 못 한다
     ② 진행     : 이야기 + 다음 해금 + 아홉 구역 중 어디까지
     ③ 시작     : 하단 고정. 스크롤과 무관하게 항상 같은 자리
     ④ 갈 곳    : 자기계발 · 기록 · 설정. 「플레이 말고도 할 일이 있다」는 신호

   설명 3단계는 첫 판에만 띄운다. 그 뒤로는 「?」 뒤로 들어간다.
   이야기 카드는 중앙에 남긴다 — 이게 이 게임이 서바이버즈와 다른 점이라
   흔한 로비로 갈아엎으면 남는 게 없다. */
function lobbyOn(v){
  document.body.classList.toggle("lobby", !!v);
  if(v) lobbyBackdrop();
}
/* 로비 뒤 — 아무것도 안 그리면 새까만 화면에 카드만 뜬다.
   게임과 같은 지하 주차장을 한 장 깔고 어둡게 덮는다. 카드가 주인공이라
   배경은 「여기가 그 건물이다」만 말하면 된다. */
function lobbyBackdrop(){
  if(!ctx||G) return;
  try{
    ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,0,0);
    const W=VW/ZOOM, H=VH/ZOOM;
    ctx.clearRect(0,0,W,H);
    const B=window.BACKDROP;
    if(B&&B.office) B.office(ctx,W,H,140,90,0,0,0);
    else { ctx.fillStyle="#0b0e14"; ctx.fillRect(0,0,W,H); }
    ctx.fillStyle="rgba(8,10,15,.55)"; ctx.fillRect(0,0,W,H);
  }catch(e){}
}

function zmapHTML(){
  const mx=Math.min(SAVE.zone|0, ZONES.length);
  const cells=ZONES.map((z,i)=>`<i class="${i<mx?"on":""}${i===mx-1?" now":""}"></i>`).join("");
  return `<div class="zmap">${cells}</div>
    <div class="zlab"><span>${esc(ZONES[0].name)}</span>
      <span>${mx>0?"최고 "+mx+" / "+ZONES.length+" 구역":"아직 출근 전"}</span>
      <span>${esc(ZONES[ZONES.length-1].name)}</span></div>`;
}
function unlockHTML(){
  const d=SAVE.days|0, NX=nextStage(d);
  const dots=DAYS.filter(x=>x.unlock).map(x=>`<i class="${d>=x.d?"on":""}"></i>`).join("");
  if(!NX) return `<div class="unl"><div class="dots">${dots}</div>
    <span style="color:var(--good)">이야기를 끝까지 봤습니다</span></div>`;

}

/* ── 기록 ──────────────────────────────────────────────────────
   사용자가 찾은 「랭킹」의 실체는 「내 기록이 남는 곳」이다.
   서버 랭킹은 계정·치트 방어·개인정보 처리가 따라오고, 무엇보다
   「내가 1,000등」이라는 정보는 스트레스 해소와 정면으로 충돌한다.
   이 게임에서 이겨야 하는 상대는 남이 아니라 어제의 나다. */
function clockOfT(t){
  const h=H0+(Math.min(t,DAY)/DAY)*(H1-H0);
  return String(Math.floor(h)).padStart(2,"0")+":"+String(Math.floor((h%1)*60)).padStart(2,"0");
}

/* ── 루프 ────────────────────────────────────────────────────── */
function resize(){
  /* 렌더 배율 상한. 바닥 패턴을 매 프레임 화면 전체에 채우기 때문에
     DPR 2에서는 픽셀 수가 4배가 되어 프레임이 무너진다(측정: 61 → 23 FPS).
     어두운 플랫 벡터라 1배로 그려도 육안 차이가 거의 없다. */
  DPR=Math.min(1.35,window.devicePixelRatio||1);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ZOOM=calcZoom();
  if(!G) lobbyBackdrop();          // 로비에서 창 크기가 바뀌면 다시 깔아야 한다
}
function start(grudge){
  closeOverlay(); lobbyOn(false);
  G=newGame(grudge); applyPerks(G); syncSlots(G); markBossTicks();
  if(opt("bgm")) S("bgmStart");      // 배경음 — 하루가 흐르는 걸 귀로도
  if(G.pendingLv>0){ G.pendingLv--; levelUp(G); }   // 「짬」 — 시작부터 고를 게 있다
  let last=performance.now();
  const loop=now=>{
    const g=G; if(!g||g.over) return;
    let dt=(now-last)/1000; last=now;
    dt=Math.min(dt,0.05)*(window.__fast||1);
    if(g.hitstop>0){ g.hitstop-=dt; dt*=0.12; }   // 히트스톱
    if(!g.paused) step(g,dt);
    if(!G||G.over) return;
      // 배경음 긴장도 — 시각이 갈수록 템포가 빨라진다
    /* 야근이면 얼마나 깊이 들어왔는지까지 넘긴다 — 18시 이후엔 음악이
       세지는 게 아니라 성격이 바뀐다(박자가 밀리고 패드가 빠진다) */
    S("bgmTense", g.ot ? 1 : Math.min(1, g.t/DAY), g.ot ? Math.min(1, g.otT/90) : 0);
    draw(g); syncHud(g);
    raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop);
}

/* ══════════════ 터치 조이스틱 ══════════════
   화면 아무 데나 누르면 그 자리에 조이스틱이 생긴다(플로팅 방식).
   고정식은 엄지로 위치를 더듬어야 해서 작은 화면에서 불리하다. */
const TOUCH={ on:false, id:null, ox:0, oy:0, x:0, y:0, dx:0, dy:0, R:62 };
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints>0;

function touchStart(e){
  if(!G || G.over || G.paused) return;
  if(e.target && e.target.closest && e.target.closest("button")) return;
  if(e.target.closest("button,input")) return;      // 음소거 버튼 등은 버튼이 받는다
  for(const t of e.changedTouches){
    if(TOUCH.id!==null) break;
    TOUCH.id=t.identifier; TOUCH.on=true;
    TOUCH.ox=TOUCH.x=t.clientX; TOUCH.oy=TOUCH.y=t.clientY;
    TOUCH.dx=TOUCH.dy=0;
  }
  e.preventDefault();
}
function touchMove(e){
  if(!TOUCH.on) return;
  for(const t of e.changedTouches){
    if(t.identifier!==TOUCH.id) continue;
    TOUCH.x=t.clientX; TOUCH.y=t.clientY;
    let dx=TOUCH.x-TOUCH.ox, dy=TOUCH.y-TOUCH.oy;
    const d=Math.hypot(dx,dy);
    if(d>TOUCH.R){                       // 손가락이 멀어지면 원점을 끌고 간다
      TOUCH.ox+=dx*(1-TOUCH.R/d); TOUCH.oy+=dy*(1-TOUCH.R/d);
      dx=TOUCH.x-TOUCH.ox; dy=TOUCH.y-TOUCH.oy;
    }
    const m=Math.hypot(dx,dy)||1;
    const f=Math.min(1, m/(TOUCH.R*0.72));   // 가운데는 둔감, 바깥은 최대속도
    TOUCH.dx=dx/m*f; TOUCH.dy=dy/m*f;
  }
  e.preventDefault();
}
function touchEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier!==TOUCH.id) continue;
    TOUCH.on=false; TOUCH.id=null; TOUCH.dx=TOUCH.dy=0;
  }
}
/* 마우스 드래그도 같은 조이스틱으로 받는다.
   터치 지원 PC(터치스크린·정밀 터치패드)에서는 isTouch가 true라
   예전엔 안내가 「화면 드래그」뿐이었는데 마우스로 끌면 아무 일도
   안 일어났다 — 「이동이 안 된다」의 정체. */
function mouseDown(e){
  if(!G || G.over || G.paused || e.button!==0) return;
  if(e.target.closest("button,input,.pick,.shoprow")) return;
  TOUCH.id="mouse"; TOUCH.on=true;
  TOUCH.ox=TOUCH.x=e.clientX; TOUCH.oy=TOUCH.y=e.clientY;
  TOUCH.dx=TOUCH.dy=0;
}
function mouseMove(e){
  if(!TOUCH.on || TOUCH.id!=="mouse") return;
  TOUCH.x=e.clientX; TOUCH.y=e.clientY;
  let dx=TOUCH.x-TOUCH.ox, dy=TOUCH.y-TOUCH.oy;
  const d=Math.hypot(dx,dy);
  if(d>TOUCH.R){ TOUCH.ox+=dx*(1-TOUCH.R/d); TOUCH.oy+=dy*(1-TOUCH.R/d);
                 dx=TOUCH.x-TOUCH.ox; dy=TOUCH.y-TOUCH.oy; }
  const m=Math.hypot(dx,dy)||1;
  const k=Math.min(1,m/(TOUCH.R*0.42));
  TOUCH.dx=dx/m*k; TOUCH.dy=dy/m*k;
}
function mouseUp(){
  if(TOUCH.id!=="mouse") return;
  TOUCH.on=false; TOUCH.id=null; TOUCH.dx=TOUCH.dy=0;
}
function bindTouch(){
  const el=$("#wrap");
  el.addEventListener("touchstart",touchStart,{passive:false});
  el.addEventListener("touchmove", touchMove, {passive:false});
  el.addEventListener("touchend",  touchEnd,  {passive:false});
  el.addEventListener("touchcancel",touchEnd,{passive:false});
  const pb=$("#pause");
  if(pb){ pb.addEventListener("click",e=>{ e.stopPropagation(); togglePause(); });
          pb.addEventListener("touchstart",e=>{ e.stopPropagation(); },{passive:true}); }
  el.addEventListener("mousedown",mouseDown);
  addEventListener("mousemove",mouseMove);
  addEventListener("mouseup",mouseUp);
  addEventListener("blur",mouseUp);
}
/* 조이스틱 그리기 — 화면 좌표계(배율 밖) */
function drawStick(){
  if(!TOUCH.on) return;
  const ox=TOUCH.ox, oy=TOUCH.oy;
  ctx.save();
  ctx.globalAlpha=.30;
  ctx.strokeStyle="#9ec8ff"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(ox,oy,TOUCH.R,0,7); ctx.stroke();
  ctx.fillStyle="#0b0e14"; ctx.globalAlpha=.28;
  ctx.beginPath(); ctx.arc(ox,oy,TOUCH.R,0,7); ctx.fill();
  ctx.globalAlpha=.62;
  ctx.fillStyle="#9ec8ff";
  ctx.beginPath();
  ctx.arc(ox+TOUCH.dx*TOUCH.R*0.72, oy+TOUCH.dy*TOUCH.R*0.72, 22, 0, 7);
  ctx.fill();
  ctx.restore();
}

/* ── 입력 ────────────────────────────────────────────────────── */
/* 한글 입력 상태면 e.key가 "ㅈ"·"ㅁ"으로 들어와 WASD가 죽는다. 물리 키 코드를 먼저 본다. */
const CODE_KEY={KeyW:"w",KeyA:"a",KeyS:"s",KeyD:"d",KeyM:"m",KeyP:"p",Escape:"Escape",
                ArrowUp:"ArrowUp",ArrowDown:"ArrowDown",ArrowLeft:"ArrowLeft",ArrowRight:"ArrowRight"};
const keyOf=e=>CODE_KEY[e.code] || (e.key.length===1?e.key.toLowerCase():e.key);
addEventListener("keydown",e=>{
  const k=keyOf(e);
  keys[k]=true;
  const typing=/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(k==="m" && !typing){ e.preventDefault(); toggleMute(); }
  if((k==="p"||k==="Escape") && !typing){ e.preventDefault(); togglePause(); }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
});
addEventListener("keyup",e=>{ keys[keyOf(e)]=false; });
addEventListener("blur",()=>{ for(const k in keys) keys[k]=false; });

function toggleMute(){
  if(!window.SFX) return;
  S("resume"); window.SFX.setMuted(!window.SFX.muted);
  const b=$("#mute"), m=!!window.SFX.muted;
  b.setAttribute("aria-pressed",m?"true":"false");
  b.setAttribute("aria-label",m?"소리 켜기":"소리 끄기");
  if(!m) S("select");
}

/* ── 부팅 ────────────────────────────────────────────────────── */
cv=$("#cv"); ctx=cv.getContext("2d");
resize(); addEventListener("resize",resize);
$("#mute").onclick=toggleMute;
bindTouch();
(function(){ const m=!!(window.SFX&&window.SFX.muted);
  $("#mute").setAttribute("aria-pressed",m?"true":"false"); })();
window.__g=()=>G;                       // 테스트 훅
window.__finish=finish;                 // 결말 화면 검증용
window.__offers=offers;                 // 선택지 검증용
window.__applyPerks=applyPerks;         // 강화 반영 검증용
window.__icon=icon;
window.__gainXp=gainXp;
window.__killFoe=killFoe;            // 처치 연출 검증용
window.spawnWall=spawnWall; window.spawnClose=spawnClose; window.spawnSpiral=spawnSpiral;  // 대형 검증용             // 레벨업·승진 검증용                     // 아이콘 검증용
window.__RND=RND;                       // 무작위 사건 검증용
window.__api={WEAPONS,PERKS,E,ZONES,DAY,hourOf,clockStr,spawnRing,start,todoOf,zoneOf,gateReady,
             RANKS,rankOf,rankName,quotaOf,promoDue,stats,SAVE:()=>SAVE};
renderStart();

</script>
