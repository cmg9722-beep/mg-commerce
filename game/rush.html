    }

    /* 하루의 빛 — 바닥과 가구 위에, 비네트 아래에 얹는다.
       screen 합성이라 어두운 곳은 들뜨고 밝은 곳은 그대로다 */
    if (day !== undefined && day !== null) {
      var L = dayTint(day);
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = L.a;
      ctx.fillStyle = "rgb(" + (L.r | 0) + "," + (L.g | 0) + "," + (L.b | 0) + ")";
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }

    /* 비네트 — 시선을 중앙(플레이어)으로. 실제 가시 영역 크기로 */
    ctx.drawImage(getVig(Math.round(effW), Math.round(effH)), 0, 0);

    ctx.restore();
  }

  window.BACKDROP = { office: office, floorOf: function (z) { return lookOf(z).f; } };
})();
</script>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   정시 퇴근 — 오늘도 6시에 나간다
   생존형 액션(뱀서라이크). 09:00에 출근해서 18:00까지 버티면 정시 퇴근.
   사방에서 몰려오는 상사들을 갈아버리며 레벨을 올린다.
   ════════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
/* 소리 — 산 음원이 있으면 그걸 쓰고, 없으면 합성음.
   음원 이름은 효과음 이름 그대로다(hit·kill·killBoss·coin·levelup…). */
/* 음량 — 파일들을 진피크 −3dBTP로 먼저 맞췄다(원래 평균이 26dB,
   400배 차이가 나서 어떤 건 안 들리고 어떤 건 귀를 때렸다. 게다가
   명중음과 보스 처치음은 원본이 이미 0dB에 붙어 찌그러져 있었다).
   그 위에서 이 표는 「역할」만 정한다 — 자주 나는 건 낮게, 판을
   가르는 순간은 높게. 정규화 뒤 평균(dB)과 목표는 이렇다:
     hit −21.5 → −34   초당 여러 번. 여기서 피로가 온다
     kill −21.6 → −28  주된 피드백
     killBoss −15.8 → −23   판당 3회. 음악과 같은 높이로 튀어나온다
     coin −26.6 → −33  경험치 구슬마다. 틱 수준이어야 한다
     place −26.1 → −30
     levelup −14.4 → −24 · win −19.4 → −22 · lose −13.0 → −22
       (이 셋은 화면이 멈춘 뒤에 울리니 앞에 나와도 된다) */
const SFX_GAIN={ hit:.237, kill:.478, killBoss:.437, coin:.478, place:.638,
                 levelup:.331, win:.741, lose:.355 };
/* 같은 소리가 연달아 나면 귀가 기계음으로 듣는다. 재생 속도를 살짝 흔든다 */
const SFX_VARY={ hit:.10, kill:.07, coin:.06 };
/* 콤보 사다리 — 연속으로 처치할수록 처치음이 올라간다.
   합성 쪽에만 있던 것이라 음원을 붙이면서 사라졌다. 짧은 소리라
   재생 속도만 밀어도 그대로 산다. */
const SFX_LADDER=[1, 1.125, 1.25, 1.5, 1.6875, 2, 2.25, 2.5, 3];
function playAsset(name, combo){
  const X=window.SFX;
  if(!X || !X.sampleReady || !X.sampleReady(name)) return false;
  let rate=1;
  const v=SFX_VARY[name];
  if(v) rate=1+(Math.random()*2-1)*v;
  if(name==="kill" && combo)                     // 사다리는 흔들림 위에 얹는다
    rate*=SFX_LADDER[Math.min(SFX_LADDER.length-1, Math.floor(combo/6))];
  return X.playSample(name, SFX_GAIN[name]!==undefined?SFX_GAIN[name]:.6, rate);
}
/* 설정에서 효과음을 끄면 여기서 막는다. 배경음(bgm*)과 컨텍스트 깨우기는
   효과음이 아니므로 통과시킨다 — 안 그러면 음악까지 같이 죽는다 */
const SFX_ALWAYS={bgmStart:1,bgmStop:1,bgmTense:1,bgmSrc:1,resume:1,setMuted:1};
const S = (m,...a) => { try{
  if(!SFX_ALWAYS[m] && typeof opt==="function" && !opt("sfx")) return;
  const alias = (m==="kill" && a[0]) ? "killBoss" : m;        // 보스 처치는 따로
  if(playAsset(alias, m==="kill"?a[1]:0)) return;
  if(alias!==m && playAsset(m, a[1])) return;
  const x=window.SFX; if(x&&typeof x[m]==="function") x[m](...a);
}catch(e){} };

/* 하루 = 09:00 → 18:00, 9시간을 DAY초에 압축 */
const DAY = 420;                 // 한 판 길이(초)
const H0 = 9, H1 = 18;
const hourOf = t => H0 + (t/DAY)*(H1-H0);
function clockStr(t){
  const h=hourOf(t), hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  return String(hh).padStart(2,"0")+":"+String(Math.floor(mm/5)*5).padStart(2,"0");
}

/* ── 구역과 결재함 ──────────────────────────────────────────────
   앞선 판에서 미결은 장식이었다. 하루치 유입이 460건인데 실제로는
   1,000~6,000건을 처리하니 단 한 번도 0을 넘지 않았다. 화면에 목표가
   없다는 지적도 같은 뿌리다 — 제자리에서 버티기만 하니까.

   구역으로 끊는다. 아홉 개 공간을 순서대로 지나고, 구역마다 할당량이
   있다. 그 구역 몫을 끝내야 문이 열리고, 문을 지나야 다음으로 간다.
   시계는 그동안에도 계속 간다 — 18:00까지 정문을 못 나가면 야근.

   방어가 아니라 돌파다. 그래서 「무엇을 방어하는지」라는 질문이 없어진다. */
const ZONES=[
  {h:9,  name:"지하 주차장",     quota:25,  kinds:["rookie","intern"],                    rate:1.30, n:2,
   story:"오늘은 다르다. 6시에 나갈 거다.", ev:"none"},
  {h:10, name:"출입구 · 로비",   quota:40,  kinds:["intern","staff","rookie"],            rate:1.10, n:3,
   story:"게이트를 찍는 순간부터 하루가 시작된다.", ev:"client"},
  {h:11, name:"사무실",          quota:60,  kinds:["staff","senior","hrteam"],            rate:0.95, n:4,
   story:"앉기도 전에 이미 쌓여 있다.", ev:"desk"},
  {h:12, name:"구내식당",        quota:85,  kinds:["drunk","vendor","staff"],             rate:0.82, n:5,
   story:"밥 먹는 사십 분이 오늘의 유일한 휴전이다.", ev:"lunch"},
  {h:13, name:"소회의실 복도",   quota:110, kinds:["senior","manager","hrteam","rookie"], rate:0.70, n:7,
   story:"문이 열릴 때마다 한 명씩 나온다.", ev:"ambush"},
  {h:14, name:"대회의실",        quota:85,  kinds:["manager","gm","staff"],               rate:0.58, n:9,  boss:"chief",
   story:"보고. 오늘의 첫 번째 관문.", ev:"present"},
  {h:15, name:"탕비실 · 복사실", quota:170, kinds:["drunk","senior","vendor","rookie"],   rate:0.48, n:11,
   story:"커피 한 잔 뽑는 데 이십 분이 걸렸다.", ev:"printer"},
  {h:16, name:"임원층 복도",     quota:125, kinds:["manager","gm","hrteam","drunk"],      rate:0.40, n:13, boss:"audit",
   story:"위로 올라갈수록 조용하다. 그게 더 무섭다.", ev:"quiet"},
  {h:17, name:"대표이사실",      quota:150, kinds:["gm","manager","drunk","rookie"],      rate:0.32, n:16, boss:"ceo",
   story:"마지막 문. 저 너머가 정문이다.", ev:"client"},
];
const zoneOf = g => ZONES[Math.min(g.zone,ZONES.length-1)];
/* ── 직급 ──────────────────────────────────────────────────────
   승진은 보상이 아니라 거래다. 능력이 오르는 만큼 몫도 오른다.
   그리고 직급은 남는다 — 내일 출근할 때 이미 그 자리에서 시작한다.
   정답이 없어야 한다. 쌓으면 세지지만 매일이 더 힘들어진다. */
const RANKS=["사원","주임","대리","과장","차장","부장","이사"];
const RANK_MAX=RANKS.length-1;
const RANK_PWR=0.08;                          // 직급당 능력
const RANK_LOAD=0.08;                         // 직급당 미결
const rankOf   = g => Math.min(RANK_MAX,(g.rank0||0)+(g.rank||0));
const rankName = n => RANKS[Math.min(RANK_MAX,Math.max(0,n|0))];
/* 이 구역 몫 — 직급이 오르면 같은 구역도 더 준다 */
const quotaOf = g => Math.round(zoneOf(g).quota*(1+rankOf(g)*RANK_LOAD));
/* 이 구역에 남은 미결 */
/* 처리한 만큼 줄지만, 구역 사건이 그걸 막기도 한다.
   점심시간엔 아무도 일을 안 하고, 발표 중엔 자리에 서 있어야 진도가 나간다. */
/* 두 항의 뜻이 다르다. 섞으면 조용히 아무 일도 안 일어난다.
   killHold — 「이 처치는 진도에 안 잡힌다」. Math.max(0,…) 안쪽이라
              아직 한 건도 안 잡았으면 아무 효과가 없다(점심·발표용).
   zoneBonus — 「일이 얹혔다/덜어졌다」. 음수가 업무 추가다(감사·고객사·승진용). */
const todoOf = g => Math.max(0, Math.ceil(quotaOf(g)
  - Math.max(0,(g.kills-g.zoneK0)-(g.killHold||0)) - (g.zoneBonus||0)));
/* 문이 열릴 조건 — 몫을 끝내고, 보스가 남아 있으면 그것도 끝내야 한다 */
const gateReady = g => todoOf(g)<=0 && !g.foes.some(f=>f.boss);

/* ── 자동화 ────────────────────────────────────────────────────
   오늘 처리된 일 중 로봇이 한 몫의 비율. 45%를 넘긴 채로 하루가 끝나면
   정시 퇴근한 채로 진다 — 「내일부터는 안 나오셔도 됩니다」. */
const REPLACE_LIMIT = 0.45;
function replaceRate(g){
  const t=g.robotWork+g.kills;
  return t>0 ? g.robotWork/t : 0;
}
/* ── 단체교섭 ──────────────────────────────────────────────────
   이야기가 15일차에 「오늘은 문을 두드리는 게 아니라, 앉아서 얘기한다」고
   예고한다. 그 약속을 지키는 곳이 여기다.

   대표이사실에 조합원을 데리고 들어가면 최종전이 전투에서 협상으로
   바뀐다. 대표이사를 때려서 이기는 게 아니라, 버티면서 요구안을
   관철시킨다 — 협상력은 조합원 수다. 혼자서는 안 된다.
   이게 이 게임이 하려는 말이고, 규칙으로도 그래야 한다. */
const BARGAIN_DAY = 14;                       // 15일차부터
function bargainReady(g){
  return (SAVE.days|0) >= BARGAIN_DAY
      && g.allies.some(a=>a.id==="unionist");
}
function stepBargain(g,dt){
  if(g.zone!==ZONES.length-1) return;                      // 대표이사실에서만
  if(!g.barOn){
    if(g.bossOut && bargainReady(g)){
      g.barOn=1; g.barP=0;
      flash(g,"단체교섭 시작 — 조합원이 많을수록 빨리 끝납니다");
      S("bossIn"); g.flash=Math.max(g.flash,.9); kick(g,0,-1,14);
    }
    return;
  }
  const n=g.allies.filter(a=>a.id==="unionist").length;
  /* 교섭 상대가 자리를 뜨면(쓰러뜨렸으면) 교섭은 없던 일이 된다 */
  const ceo=g.foes.find(f=>E[f.kind].robot!==true && f.boss);
  if(!ceo){ g.barOn=0; g.barP=0; return; }
  /* 대표이사 가까이서 버티는 동안 요구안이 관철된다. 조합원 수가 속도다 */
  const near = Math.hypot(ceo.x-g.P.x, ceo.y-g.P.y) < 320;
  if(near) g.barP += (2.4 + n*2.2) * dt;
  else     g.barP -= 1.1 * dt;                 // 자리를 뜨면 밀린다
  g.barP=clamp(g.barP,0,100);
  if(g.barP>=100){ finish(g,"union"); }
}
function drawBargain(g){
  if(!g.barOn) return;
  const W=VW, x=Math.round(W*0.5), y=118;
  const w=Math.min(560, W-80), h=16;
  ctx.save();
  ctx.fillStyle="rgba(11,14,20,.88)";
  ctx.fillRect(x-w/2-3, y-3, w+6, h+6);
  ctx.fillStyle="#1b2430"; ctx.fillRect(x-w/2, y, w, h);
  const p=clamp(g.barP/100,0,1);
  const gr=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
  gr.addColorStop(0,"#3f7a52"); gr.addColorStop(1,"#57d98a");
  ctx.fillStyle=gr; ctx.fillRect(x-w/2, y, w*p, h);
  ctx.strokeStyle="#57d98a"; ctx.lineWidth=1.5;
  ctx.strokeRect(x-w/2, y, w, h);
  const n=g.allies.filter(a=>a.id==="unionist").length;
  ctx.fillStyle="#57d98a"; ctx.font="700 13px 'Gothic A1',system-ui";
  ctx.textAlign="left";  ctx.fillText("단체교섭", x-w/2, y-7);
  ctx.textAlign="right"; ctx.fillText("조합원 "+n+"명 · "+Math.round(g.barP)+"%", x+w/2, y-7);
  ctx.restore();
}

/* ── 간섭 ──────────────────────────────────────────────────────
   정시에 나가는 걸 막는 건 넷이다 — 야근·회식·진급·간섭.
   앞의 셋은 규칙이 있는데 이것만 없었다.

   상사 반경 안에 있으면 「지금 뭐 하고 있나?」 손이 느려진다.
   때려서 푸는 게 아니라 걸어 나와서 푸는 것이라, 이 적은 체력이 아니라
   서 있는 자리로 위협한다. 원이 보이고, 벗어나면 바로 풀린다.
   노동조합을 올리면 반경이 준다 — 뭉치면 덜 쪼인다.

   반경 크기를 나눈 이유: 부장은 임원층에 여럿 깔린다. 보스급 반경을 주면
   그 구역 내내 손이 느린 채로 걷게 된다. 부장은 「옆에 서 있지 마라」 정도의
   개인 반경(118)이고, 판을 바꿀 만큼 넓은 건 보스 셋뿐이다 — 그건 자리를
   골라 들락거리는 문제가 되어야 재미가 된다. */
const MEDDLE_SLOW = 0.55;                     // 최대 쿨타임 +55%
function stepMeddle(g,dt){
  const P=g.P, R=P.meddleR||1;
  let hit=0, src=null, nd=1e9;
  for(const f of g.foes){
    const r=E[f.kind].meddle; if(!r) continue;
    const rr=r*R, d=Math.hypot(f.x-P.x,f.y-P.y);
    if(d<rr){ hit=1; if(d<nd){ nd=d; src=f; } }
  }
  /* 켜고 끄는 걸 부드럽게 — 경계에서 깜빡이면 읽히지 않는다 */
  g.meddle += ((hit?1:0)-g.meddle)*Math.min(1,dt*5);
  if(g.meddle<0.01) g.meddle=0;
  g.meddleSrc = hit ? src : null;
  /* 안내는 판에 한 번이 아니라 구역마다 한 번. 상사가 처음 나오는
     구역이 6구역이라, 한 번만 띄우면 그 뒤로는 영영 설명이 없다 */
  if(hit && g.meddleSaid!==g.zone+1){ g.meddleSaid=g.zone+1;
    flash(g,"간섭 — 상사 곁에서는 손이 느려집니다. 벗어나면 풀립니다"); }
}
function drawMeddle(g,X,Y){
  const P=g.P, R=P.meddleR||1;
  /* 가까운 것만 그린다. 부장이 여럿이면 화면이 원으로 덮인다 */
  const near=[];
  for(const f of g.foes){
    const r=E[f.kind].meddle; if(!r) continue;
    const rr=r*R, d=Math.hypot(f.x-P.x,f.y-P.y);
    if(d<rr*1.7) near.push({f,rr,d});
  }
  if(!near.length) return;
  near.sort((a,b)=>a.d-b.d);
  ctx.save(); ctx.lineWidth=2;
  for(const n of near.slice(0,3)){
    const inside=n.d<n.rr;
    /* 원이 도는 게 보여야 「장식」이 아니라 「지금 켜져 있는 규칙」으로 읽힌다 */
    ctx.setLineDash([7,7]); ctx.lineDashOffset=-g.t*(inside?26:10);
    ctx.strokeStyle = inside ? "rgba(255,107,107,.58)" : "rgba(255,107,107,.20)";
    ctx.beginPath(); ctx.arc(X(n.f.x),Y(n.f.y),n.rr,0,6.2832); ctx.stroke();
    /* 원에 이름을 붙인다. 빨간 동그라미만 뜨고 아무 말이 없으면
       규칙이 아니라 버그로 읽힌다 — 실제로 「점선동그라미는 뭐지?」를 들었다 */
    ctx.setLineDash([]);
    const cx=X(n.f.x), cy=Y(n.f.y)-n.rr;
    const t=E[n.f.kind].name+" — 간섭";
    ctx.font="700 11px 'Gothic A1',system-ui"; ctx.textAlign="center";
    const w=ctx.measureText(t).width+12;
    ctx.fillStyle="rgba(11,14,20,"+(inside?.82:.5)+")";
    F2(cx-w/2, cy-9, w, 16, 4);
    ctx.fillStyle = inside ? "rgba(255,107,107,.95)" : "rgba(255,107,107,.5)";
    ctx.fillText(t, cx, cy+3);
  }
  ctx.restore();
  if(g.meddle>0.15){
    /* 머리 위는 적 말풍선 자리다. 발밑에 짧게 — 길면 화면이 시끄러워진다 */
    const a=Math.min(1,g.meddle);
    const pct=Math.round(MEDDLE_SLOW*100*g.meddle/(1+MEDDLE_SLOW*g.meddle));
    const t="간섭 −"+pct+"%";
    ctx.save();
    ctx.font="800 13px 'Gothic A1',system-ui"; ctx.textAlign="center";
    const w=ctx.measureText(t).width+14, x=X(P.x), y=Y(P.y)+30;
    ctx.fillStyle="rgba(11,14,20,"+(a*.78)+")";
    F2(x-w/2, y-13, w, 18, 5);
    ctx.fillStyle="rgba(255,107,107,"+a+")";
    ctx.fillText(t, x, y);
    ctx.restore();
  }
}
/* 둥근 채움 — drawMeddle 전용 */
function F2(x,y,w,h,r){
  ctx.beginPath(); r=Math.min(r,w/2,h/2);
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
}

   룰렛을 돌려 좋은 것·나쁜 것·그냥 웃긴 것을 섞는다.
   우리는 구역에 들어갈 때마다 굴린다. 첫 구역은 굴리지 않는다(배우는 중).

function rollEvent(g){
  if(g.zone===0) return;                    // 첫 구역은 배우는 중이라 굴리지 않는다
  if(Math.random()<0.22) return;            // 아무 일도 없는 날도 있어야 특별함이 산다
  const e=RND[(Math.random()*RND.length)|0];
  g.rndT=0; g.rndSpd=1; g.rndSlow=1; g.rndHp=1; g.rndSpawn=1; g.rndNoBot=0; g.rndNoSpawn=0;
  e.f(g);
  g.rndName=e.name; g.rndKind=e.kind; g.rndShow=3.4;
  flash(g, e.name+" — "+e.desc);
  S(e.kind==="bad"?"deny":"levelup");
  g.flash=Math.max(g.flash, e.kind==="bad"?.5:.35);
}
function stepRnd(g,dt){
  if(g.rndShow>0) g.rndShow-=dt;
  if(g.rndT>0){
    g.rndT-=dt;
    if(g.rndT<=0){ g.rndSpd=1; g.rndSlow=1; g.rndHp=1; g.rndSpawn=1;
                   g.rndNoBot=0; g.rndNoSpawn=0; }
  }
}

/* ── 구역 사건 ──────────────────────────────────────────────────
   「출구 찾고 그다음엔 뭐?」 — 지금까지는 같은 걸 아홉 번이었다.
   기획서에 「실무 이름 하나 = 규칙 하나」라고 써 놓고 배경만 바꿨다.
   구역마다 그 공간에서만 성립하는 사건을 하나씩 둔다. */
function stepEvent(g,dt){
  const P=g.P, Z=zoneOf(g), ev=Z.ev||"none";
  g.evT+=dt;

  if(ev==="lunch"){
    /* 점심시간 — 다들 밥 먹으러 간다. 적이 느려지지만 미결도 안 줄어든다.
       이 사십 초를 뭘로 쓸 것인가가 이 구역의 질문이다. */
    if(g.evPhase===0 && g.evT>1.5){
      g.evPhase=1; g.lunchT=14;
      flash(g,"점심시간 — 다들 나갔습니다. 미결도 멈춥니다"); S("levelup");
    }
    if(g.lunchT>0){
      g.lunchT-=dt;
      if(g.lunchT<=0){ flash(g,"점심시간 끝"); S("deny"); }
    }
  }

  else if(ev==="desk"){
    /* 내 자리 — 서 있으면 체력이 차지만 그동안 일이 쌓인다 */
    if(!g.deskSet){ g.deskSet=1; g.deskX=P.x+220; g.deskY=P.y-60; }
    const d=Math.hypot(P.x-g.deskX,P.y-g.deskY);
    g.deskOn = d<74;
    if(g.deskOn){
      P.hp=Math.min(P.maxhp,P.hp+7*dt);
      /* 서 있는 동안 일이 얹힌다. 원래 Math.max(0,…)로 감싸 0 아래로 못 내려가서
         한 건도 안 쌓였다 — 음수가 곧 업무 추가라 그 clamp가 기능을 죽이고 있었다 */
      g.zoneBonus=(g.zoneBonus||0)-2.2*dt*(P.work||1);
      if(!g.deskSaid){ g.deskSaid=1; flash(g,"내 자리 — 체력이 찹니다. 대신 일이 쌓입니다"); }
    }
  }

  else if(ev==="ambush"){
    /* 유리문 기습 — 복도라 좌우로 못 피한다. 0.7초 예고 뒤 바로 옆에서 */
    g.ambCd-=dt;
    if(g.ambCd<=0){
      g.ambCd=7+Math.random()*4;
      const a=Math.random()*6.283, r=210;
      g.ambX=P.x+Math.cos(a)*r; g.ambY=P.y+Math.sin(a)*r; g.ambWarn=0.7;
      S("deny");
    }
    if(g.ambWarn>0){
      g.ambWarn-=dt;
      if(g.ambWarn<=0){
        for(let i=0;i<5;i++){
          const a=Math.random()*6.283, r=Math.random()*54;
          spawnAt(g,["manager","senior","rookie"][(Math.random()*3)|0],
                  g.ambX+Math.cos(a)*r, g.ambY+Math.sin(a)*r);
        }
        g.fx.push({type:"ring",x:g.ambX,y:g.ambY,t:0,r0:14,r1:120,c:"#ff6b6b"});
        kick(g,g.ambX-P.x,g.ambY-P.y,5); S("bossIn");
      }
    }
  }

  else if(ev==="present"){
    /* 발표 — 화이트보드 앞에 서 있어야 미결이 준다.
       가장 위험한 자리에서 가장 오래 버텨야 한다. */
    if(!g.podSet){ g.podSet=1; g.podX=P.x; g.podY=P.y-120;
                   flash(g,"발표 — 표시된 자리에 서 있어야 처리됩니다"); S("levelup"); }
    g.podOn = Math.hypot(P.x-g.podX,P.y-g.podY)<96;
  }

  else if(ev==="printer"){
    /* 복합기 용지 걸림 — 고치면 그 자리에서 광역 한 방 */
    if(!g.prnSet){ g.prnSet=1; g.prnX=P.x-260; g.prnY=P.y+120;
                   flash(g,"복합기 용지 걸림 — 가서 고치면 한 방 나옵니다"); }
    if(g.prnSet && !g.prnDone && Math.hypot(P.x-g.prnX,P.y-g.prnY)<62){
      g.prnDone=1;
      for(const f of g.foes){
        const d=Math.hypot(f.x-g.prnX,f.y-g.prnY);
        if(d<420) damage(g,f,260,g.prnX,g.prnY,22);
      }
      g.fx.push({type:"ring",x:g.prnX,y:g.prnY,t:0,r0:20,r1:420,c:"#9ec8ff"});
      g.flash=Math.max(g.flash,1); kick(g,0,-1,14); g.hitstop=Math.max(g.hitstop,.18);
      flash(g,"복합기 수리 — 밀린 출력이 한꺼번에 쏟아집니다"); S("nuke");
    }
  }

  else if(ev==="quiet"){
    /* 조용한 층 — 소리를 내면 더 온다. 몰아칠수록 빨리 끝나지만 위험해진다 */
    if(!g.quietSaid){ g.quietSaid=1; flash(g,"조용한 층 — 몰아칠수록 더 몰려옵니다"); }
    g.quietK = 1 - Math.min(0.45, g.combo*0.012);
  }

  else if(ev==="client"){
    /* 고객사 — 건드리면 안 되는 중립. 공격이 자동이라 가까이 가는 것만으로 사고가 난다 */
    g.cliCd-=dt;
    if(g.cliCd<=0 && g.clients.length<2){
      g.cliCd=15+Math.random()*10;
      const a=Math.random()*6.283, r=340;
      g.clients.push({x:P.x+Math.cos(a)*r, y:P.y+Math.sin(a)*r,
                      wx:0, wy:0, t:0, life:26, r:17, walk:0, face:-1});
      if(!g.cliSaid){ g.cliSaid=1;
        flash(g,"고객사 방문 — 파란 표시는 건드리면 안 됩니다"); S("deny"); }
    }
    for(let i=g.clients.length-1;i>=0;i--){
      const c=g.clients[i]; c.t+=dt;
      if(c.t>c.life){ g.clients.splice(i,1); continue; }
      if(!c.wx || Math.hypot(c.wx-c.x,c.wy-c.y)<20){
        c.wx=c.x+(Math.random()-.5)*260; c.wy=c.y+(Math.random()-.5)*260; }
      const dx=c.wx-c.x, dy=c.wy-c.y, d=Math.hypot(dx,dy)||1;
      c.x+=dx/d*42*dt; c.y+=dy/d*42*dt; c.walk+=dt*4; c.face=dx<0?-1:1;
      /* 내 공격 범위에 들어오면 사고다 */
      if(Math.hypot(c.x-P.x,c.y-P.y) < 120){
        c.hitT=(c.hitT||0)+dt;
        if(c.hitT>1.1){
          g.clients.splice(i,1);
          g.zoneBonus=(g.zoneBonus||0)-35;            // 그 구역 진도가 크게 뒤로
          flash(g,"고객사를 건드렸습니다 — 미결 35건 추가"); S("lose");
          g.flash=Math.max(g.flash,.8); kick(g,0,-1,12);
        }
      } else c.hitT=0;
    }
  }
}

function stepRobots(g,dt){
  const P=g.P;
  /* 투입 — 12시(구역 4) 이후부터. 노조가 있으면 도입이 느려진다 */
  if(g.zone>=3 && unlocked("__robot") && !g.rndNoBot){
    const live=g.foes.filter(f=>E[f.kind].robot).length;
    g.robotCd-=dt*(P.union?0.55:1);
    if(g.robotCd<=0 && live<2){
      g.robotCd=26+Math.random()*12;
      spawnRing(g,"bot",1);
      if(!g.robotSeen){
        g.robotSeen=true;
        flash(g,"자동화 로봇 투입 — 저게 내 일을 합니다"); S("bossIn");
        g.flash=Math.max(g.flash,.7);
      }else S("deny");
    }
  }
  /* 일을 대신 한다 — 단체협약이 있으면 상한에 걸려 더 못 올라간다 */
  let n=0;
  for(const f of g.foes) if(E[f.kind].robot) n++;
  if(n){
    const capped = P.union>=3 && replaceRate(g)>=REPLACE_LIMIT-0.07;
    if(!capped) g.robotWork += n*0.62*dt*(P.union?0.7:1);
  }
  if(!g.robotWarn && replaceRate(g)>=0.30 && g.robotWork>8){
    g.robotWarn=true;
    flash(g,"대체율 30% — 이러다 자리가 없어집니다"); S("deny");
  }
}

const GRUDGE_KINDS=["manager","gm","chief"];      // 입력한 원한을 말할 사람들
function pickSay(g,f){
  const pool=SAY[f.kind]||["…"];
  if(g.grudge && GRUDGE_KINDS.includes(f.kind) && Math.random()<0.4) return g.grudge;
  return pool[(Math.random()*pool.length)|0];
}
function stepSay(g,dt){
  for(const f of g.foes) if(f.sayT>0) f.sayT-=dt;
  g.sayCd-=dt;
  if(g.sayCd>0) return;
  g.sayCd=1.6+Math.random()*1.4;
  const live=g.foes.filter(f=>f.sayT>0).length;
  if(live>=3) return;                             // 한 번에 셋까지 — 더 뜨면 소음이다
  const P=g.P, near=[];
  for(const f of g.foes){
    if(f.sayT>0) continue;
    const d=Math.hypot(f.x-P.x,f.y-P.y);
    if(d<430) near.push(f);
  }
  if(!near.length) return;
  const f=near[(Math.random()*near.length)|0];
  f.say=pickSay(g,f); f.sayT=f.boss?3.4:2.6; f.sayT0=f.sayT;
}
function drawSay(g,f,sx,sy){
  if(!(f.sayT>0) || !f.say) return;
  const a=clamp(Math.min(f.sayT, f.sayT0-f.sayT)*3.2, 0, 1);   // 들고 남
  if(a<=0.01) return;
  ctx.save();
  ctx.globalAlpha=a;
  ctx.font="600 13px 'Gothic A1',\"Malgun Gothic\",system-ui,sans-serif";
  const w=Math.min(ctx.measureText(f.say).width+20, 260);
  const h=25, x=sx-w/2, y=sy-f.r-h-16;
  ctx.fillStyle="rgba(232,236,244,.95)";
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,7); else ctx.rect(x,y,w,h);
  ctx.fill();
  ctx.beginPath();                                 // 꼬리
  ctx.moveTo(sx-6,y+h-1); ctx.lineTo(sx,y+h+7); ctx.lineTo(sx+6,y+h-1);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle="#171a21"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(f.say, sx, y+h/2+1, w-16);
  ctx.restore();
}

/* 배율 — 짧은 변 기준. 세로 화면(폰)에서 시야가 좁아지면

/* ── 파생 스탯 ───────────────────────────────────────────────── */
function stats(g){
  const M=g.meta||metaBonus();
  const P={ spd:168*(1+M.spd), haste:1*(1-M.haste), range:1,
            xpMul:1+M.xp, magnet:1+M.magnet, maxhp:160+M.hp,
            inv0:0, late:1, work:1, blink:0, annual:0, allyDmg:1, fatigue:1, meddleR:1 };
  for(const k in g.perks){ const p=PERKS[k]; for(let i=0;i<g.perks[k];i++) p.f(P,i+1); }
  /* 직급 — 올라간 만큼 능력이 오른다. 몫도 같이 오른다(quotaOf) */
  const r=rankOf(g);
  if(r){ const m=1+r*RANK_PWR;
         P.spd*=m; P.range*=m; P.xpMul*=m; P.magnet*=m;
         P.maxhp=Math.round(P.maxhp*m); P.haste/=m; }
  return P;
}
function applyPerks(g){
  const P=stats(g), p=g.P;
  const dh = P.maxhp - p.maxhp;
  p.spd=P.spd; p.haste=P.haste; p.range=P.range; p.xpMul=P.xpMul; p.magnet=P.magnet;
  // 제도 — 이 줄이 없으면 이어폰·주52시간·근로계약서·재택·연차·노조가 전부 무효가 된다
  p.inv0=P.inv0; p.late=P.late; p.work=P.work; p.blink=P.blink;
  p.annual=P.annual; p.allyDmg=P.allyDmg; p.fatigue=P.fatigue; p.meddleR=P.meddleR;
  p.maxhp=P.maxhp; if(dh>0) p.hp=Math.min(p.maxhp,p.hp+dh);
  p.hp=Math.min(p.hp,p.maxhp);
}

/* ── 스폰 ────────────────────────────────────────────────────── */
function schedFor(h){
  let s=SCHED[0];
  for(const e of SCHED) if(h>=e.h) s=e;
  return s;
}
/* ── 적 강화 ────────────────────────────────────────────────────
   시간이 갈수록 단단해지고 아프다. 이게 없으면 Lv20대 빌드의 화력이
   적 체력을 완전히 추월해, 오후 내내 적이 닿기도 전에 녹는다
   — 시드 고정 측정에서 하루 종일 맞은 횟수가 1~6회였다.
   17시 필드에 적이 54명밖에 안 남는 게 그 증거다.
   보스는 자체 체력 예산이 있으니 제외한다.
   세기: 4배·1.8배로 재 보니 도망 전략이 15:35에 죽었다 — 두 시간 반을
   잘라먹는 건 과하고, 특히 피해 배수가 셌다(4대에 100→25).
   체력 위주로 조이고 피해는 약하게 둔다. */
function foeHpScale(g){ const u=Math.min(1,g.t/DAY); return 1+u*u*3.2; }
function foeDmgScale(g){ return 1+Math.min(1,g.t/DAY)*0.30; }
function spawnAt(g,kind,x,y){
  const d=E[kind];
  const shp=d.boss ? d.hp : Math.round(d.hp*foeHpScale(g)*(g.rndHp||1));
  const sdmg=d.boss ? d.dmg : d.dmg*foeDmgScale(g);
  g.foes.push({kind, x, y, hp:shp, maxhp:shp, spd:d.spd, dmg:sdmg,
               r:d.r, xp:d.xp, boss:!!d.boss, hit:0, slow:1, kb:0, kbx:0, kby:0,
               walk:Math.random(), face:-1,
               atkT:d.atkCd?d.atkCd*0.6:0, sumT:d.summonCd||0,
               rage:0, wind:0, dash:0, dvx:0, dvy:0,
               mv:0, mvx:0, mvy:0, mvT:0, cx:0, cy:0});
}
/* ── 마감 압박 ─────────────────────────────────────────────────
   16시부터 스폰이 「가고 있는 쪽」으로 쏠린다.
   하루 종일 원형으로 뿌리면 플레이어보다 느린 적은 영원히 뒤만 따라온다
   — 측정 결과 아홉 시간 동안 맞은 횟수가 1~3회였다.
   앞을 막아야 비로소 「길을 뚫는」 게임이 된다. 뒤로 돌면 풀리지만,
   돌 때마다 그동안 벌어 둔 거리를 잃는다. 그게 대가다. */
function closingBias(g){
  if(g.ot) return 0.82;                        // 야근은 사방이 막힌다
  return clamp((g.zone-4)/4,0,1)*0.72;         // 뒤쪽 구역일수록 앞을 막는다
}
function spawnRing(g,kind,n){
  const P=g.P, R=Math.max(VW,VH)/ZOOM*0.62+90;
  const bias=closingBias(g);
  const hm=Math.hypot(P.hx,P.hy);
  const hd=hm>0.15 ? Math.atan2(P.hy,P.hx) : null;   // 멈춰 있으면 쏠릴 방향이 없다
  const a0=Math.random()*Math.PI*2;
  for(let i=0;i<n;i++){
    const a = (hd!==null && Math.random()<bias)
      ? hd + (Math.random()-.5)*1.5                  // 진행 방향 ±43도
      : a0 + i*(Math.PI*2/n) + (Math.random()-.5)*.5;
    spawnAt(g,kind,P.x+Math.cos(a)*R,P.y+Math.sin(a)*R);
  }
}
/* ── 대형 ──────────────────────────────────────────────────────
   지금까지 적은 언제나 「내 둘레에 랜덤하게」 나왔다. 한 종류뿐이라
   1구역과 8구역이 밀도만 다르고 생김새가 같았다.

   같은 장르 오픈소스의 스폰 코드를 열어 보니 답이 거기 있었다 —
   Random / Line(한쪽에서 벽처럼) / Circle(원이 조여듦) / Spiral(나선).
   그리고 대형마다 이동 방식이 달라서, 벽은 쫓지 않고 그냥 흘러간다.
   그래서 매 분이 다르게 보이고, 피하는 방법도 달라진다.

   우리 식으로 옮긴다. 사무실에서 사람이 몰려오는 모양들이다. */
function spawnWall(g,kind,n){                        // 복도 한쪽에서 밀려온다
  const P=g.P, R=Math.max(VW,VH)/ZOOM*0.66+110;
  const a=Math.random()*Math.PI*2;                   // 오는 방향
  const ux=Math.cos(a), uy=Math.sin(a);
  const px=-uy, py=ux;                               // 벽이 늘어서는 축
  const span=R*1.5;
  for(let i=0;i<n;i++){
    const t=(i/(n-1||1)-0.5)*span;
    spawnAt(g,kind, P.x+ux*R+px*t, P.y+uy*R+py*t);
    const f=g.foes[g.foes.length-1];
    f.mv=1; f.mvx=-ux; f.mvy=-uy; f.mvT=5.5;         // 나를 안 쫓고 지나간다
  }
  flash(g,"줄지어 옵니다");
}
function spawnClose(g,kind,n){                       // 둘러싸고 조여든다
  const P=g.P, R=Math.max(VW,VH)/ZOOM*0.60+90;
  const a0=Math.random()*Math.PI*2;
  const cx=P.x, cy=P.y;
  for(let i=0;i<n;i++){
    const a=a0+i*(Math.PI*2/n);
    spawnAt(g,kind, P.x+Math.cos(a)*R, P.y+Math.sin(a)*R);
    const f=g.foes[g.foes.length-1];
    f.mv=2; f.cx=cx; f.cy=cy; f.mvT=6.5;
  }
  g.fx.push({type:"ring",x:cx,y:cy,t:0,r0:R,r1:R*0.3,c:"#ff6b6b"});
  flash(g,"둘러쌉니다");
}
function spawnSpiral(g,kind,n){                      // 나선으로 감아 들어온다
  const P=g.P, R=Math.max(VW,VH)/ZOOM*0.62+90;
  const a0=Math.random()*Math.PI*2;
  for(let i=0;i<n;i++){
    const a=a0+i*0.46, r=R*(1+i*0.035);
    spawnAt(g,kind, P.x+Math.cos(a)*r, P.y+Math.sin(a)*r);
  }
}
/* 어떤 대형이 나올지는 구역이 정한다 — 구역마다 오는 모양이 달라야
   「여기는 복도구나」가 눈으로 읽힌다 */
const FORMS=[
  null,                 // 1 지하 주차장 — 배우는 중. 흩어져서만
  "wall",               // 2 로비 — 게이트를 지나 줄지어 들어온다
  null,                 // 3 사무실 — 사방에서
  "close",              // 4 구내식당 — 배식 줄이 둘러싼다
  "wall",               // 5 소회의실 복도 — 복도라 한쪽에서 민다
  "close",              // 6 대회의실 — 둘러앉는다
  "spiral",             // 7 탕비실·복사실 — 줄이 감긴다
  "close",              // 8 임원층 — 조여 온다
  "spiral",             // 9 대표이사실 — 전부
];
function doSpawns(g,dt){
  const s=zoneOf(g);                 // 구성·밀도는 시간이 아니라 구역이 정한다
  g.spawnAcc+=dt;
  const CAP=420;                       // 폭주 방지 상한 (성능·가독성 둘 다)
  // 야근은 시간이 갈수록 조여 온다 — 미결을 빨리 비우는 것 말고 답이 없게
  const otk = g.ot ? Math.max(0.55, 1-g.otT*0.012) : 1;
  // 보스가 살아 있으면 물량을 늦춘다. 보스전과 물량전이 겹치면 이중 부담이 된다
  const bk = (g.foes.some(f=>f.boss) ? 1.7 : 1) * (g.quietK||1) / (g.rndSpawn||1);
  if(g.rndNoSpawn){ g.spawnAcc=0; }              // 생일 케이크 — 잠시 아무도 안 온다
  if(g.foes.length<CAP && g.spawnAcc>=s.rate*otk*bk){
    g.spawnAcc=0;
    const k=s.kinds[(Math.random()*s.kinds.length)|0];
    /* 가끔 대형으로 온다. 매번이면 대형이 평범해지고, 없으면 한 덩어리가 된다 */
    const form=FORMS[Math.min(g.zone,FORMS.length-1)];
    g.formCd=(g.formCd||0)-1;
    if(form && g.formCd<=0 && g.foes.length<CAP-40){
      g.formCd=4+((Math.random()*3)|0);
      if(form==="wall")       spawnWall(g,k,Math.max(7,s.n+5));
      else if(form==="close") spawnClose(g,k,Math.max(9,s.n+7));
      else                    spawnSpiral(g,k,Math.max(8,s.n+6));
    }else{
      spawnRing(g,k,s.n);
    }
  }
  /* 사무집기 — 지나는 길에 깔려 있다. 부수는 건 선택이고, 부수면 뭔가 나온다 */
  g.propCd-=dt;
  if(g.propCd<=0){
    g.propCd=2.6+Math.random()*2.2;
    const P=g.P, R=Math.max(VW,VH)/ZOOM*0.58+70;
    const kinds=["desk_p","part_p","water_p","copy_p","plant_p","chair_p"];
    const alive=g.foes.reduce((a,f)=>a+(E[f.kind].prop?1:0),0);
    if(alive<14){
      const a=Math.random()*Math.PI*2;
      spawnAt(g,kinds[(Math.random()*kinds.length)|0],P.x+Math.cos(a)*R,P.y+Math.sin(a)*R);
    }
  }
  /* 따돌린 적 재배치 — 상한(CAP)에 걸린 뒤 무리를 따돌리면 스폰이 멎고 화면이 텅 빈다
     (측정: 16:30~18:00 처리 2건, 필드 460명). 화면에서 한참 벗어난 적은
     체력 그대로 앞쪽 스폰 링에 다시 세운다. 도망은 되지만 도망만으로는 안 끝난다. */
  g.recycleT=(g.recycleT||0)-dt;
  if(g.recycleT<=0){
    g.recycleT=0.5;
    const P=g.P, R=Math.max(VW,VH)/ZOOM*0.62+90, far=R*2.1;
    const bias=closingBias(g), hm=Math.hypot(P.hx,P.hy);
    const hd=hm>0.15 ? Math.atan2(P.hy,P.hx) : null;
    for(const f of g.foes){
      if(f.boss || f.hold>0 || E[f.kind].prop) continue;
      if(Math.hypot(f.x-P.x,f.y-P.y) < far) continue;
      const a = (hd!==null && Math.random()<Math.max(bias,0.35))
        ? hd + (Math.random()-.5)*1.5 : Math.random()*Math.PI*2;
      f.x=P.x+Math.cos(a)*R; f.y=P.y+Math.sin(a)*R; f.kb=0; f.tauntT=0;
    }
  }
}

/* ── 보스 ──────────────────────────────────────────────────────
   보스가 그냥 체력 많은 적이면 보스가 아니다. 패턴과 격노 단계를 준다. */
function bossStep(g,f,dt){
  const D=E[f.kind];
  // 격노 — 체력 절반에서 한 번, 눈에 띄게 바뀐다
  if(!f.rage && f.hp < f.maxhp*0.5){
    f.rage=1; f.spd*=1.35;
    flash(g, D.name+" — 표정이 바뀝니다");
    S("bossIn"); kick(g,0,-1,10); g.flash=Math.max(g.flash,.6);
  }
  const rk = f.rage ? 0.6 : 1;
  // 수행 인원 소환
  if(D.summon){
    f.sumT-=dt;
    if(f.sumT<=0){
      f.sumT=D.summonCd*rk;
      for(let i=0;i<D.summonN;i++){
        const a=Math.random()*6.283, r=80+Math.random()*70;
        spawnAt(g,D.summon,f.x+Math.cos(a)*r,f.y+Math.sin(a)*r);
      }
      g.fx.push({type:"ring",x:f.x,y:f.y,t:0,r0:20,r1:150,c:"#9ec8ff"});
      S("deny");
    }
  }
  if(!D.atk || f.wind>0 || f.dash>0) return;
  f.atkT-=dt;
  if(f.atkT>0) return;
  f.wind = D.atk==="shock" ? 0.45 : 0.55;
  S("windup");                      // 0.45~0.55초 전 — 귀로 피할 수 있게
  f.pending = D.atk;
  f.atkT = D.atkCd*rk;
}
/* 예비동작이 끝나는 순간 실제 공격이 나간다 */
function bossFire(g,f){
  const D=E[f.kind], P=g.P;
  if(f.pending==="shock"){
    // 「지적」 — 클립보드를 내리치고 충격파가 퍼진다
    g.shocks.push({x:f.x,y:f.y,r:26,max:230*(f.rage?1.25:1),dmg:D.dmg,t:0,done:false});
    S("nuke"); kick(g, f.x-P.x, f.y-P.y, 8);
  } else if(f.pending==="charge"){
    // 「호출」 — 조준하고 멈췄다가 돌진한다
    const dx=P.x-f.x, dy=P.y-f.y, d=Math.hypot(dx,dy)||1;
    const sp=520*(f.rage?1.25:1);
    f.dvx=dx/d*sp; f.dvy=dy/d*sp; f.dash=0.45;
    S("bossIn"); g.shake=Math.max(g.shake,6);
  }
  f.pending=null;
}

/* ── 무기 발사 ───────────────────────────────────────────────── */
function nearest(g,x,y,maxd){
  let best=null,bd=maxd*maxd;
  for(const f of g.foes){ const dx=f.x-x,dy=f.y-y,d=dx*dx+dy*dy; if(d<bd){bd=d;best=f;} }
  return best;
}
/* ── 설치기 ────────────────────────────────────────────────────
   깔아둔 집기가 알아서 일한다. 파티션은 맞으면 부서지고,
   나머지는 시간이 다 되면 걷힌다. */
/* ── 문 ────────────────────────────────────────────────────────
   구역 몫을 끝내면 출구가 열린다. 화면에 「저기로 가면 된다」가
   생기는 순간이고, 이게 없으면 하루가 한 덩어리로 흘러간다. */
function openGate(g){
  const P=g.P, Z=zoneOf(g);
  const hm=Math.hypot(P.hx,P.hy)||1;
  const a=Math.atan2(P.hy/hm,P.hx/hm)+(Math.random()-.5)*1.1;
  const R=560;
  g.gate={x:P.x+Math.cos(a)*R, y:P.y+Math.sin(a)*R, r:72, t:0, p:0, said:0};
  flash(g, Z.door||"문이 열렸습니다 — 표시된 곳으로");
  S("doorOpen"); g.flash=Math.max(g.flash,.7);
  g.fx.push({type:"ring",x:g.gate.x,y:g.gate.y,t:0,r0:20,r1:200,c:"#57d98a"});
}
function nextZone(g){
  const P=g.P;
  /* 업적 — 이 구역을 한 대도 안 맞고 지났나. 12시 전에 어디까지 갔나 */
  if(!g.zoneHit) g.cleanZone=1;
  g.zoneHit=0;
  if(hourOf(g.t)<12) g.noonZone=Math.max(g.noonZone, g.zone+1);
  g.zone++; g.cleared++;
  g.gate=null; g.zoneK0=g.kills; g.zoneT=0; g.zoneBonus=0;
  g.evT=0; g.evPhase=0; g.lunchT=0; g.killHold=0; g.deskX=0; g.deskSaid=0; g.ambCd=6; g.ambWarn=0;
  g.podX=0; g.podOn=false; g.podSet=0; g.deskSet=0; g.prnX=0; g.prnDone=0; g.prnSet=0;
  g.quietSaid=0; g.quietK=1;
  g.clients.length=0; g.cliCd=9; g.stains.length=0;
  g.eshots.length=0; g.paper.length=0;
  g.propCd=0;
  g.barOn=0; g.barP=0;
  rollEvent(g);           // 오늘의 사건 — 매 판을 다르게 만드는 주사위
  if(g.zone>=ZONES.length){                    // 정문을 나왔다
    // 대체 판정이 먼저다 — 정시에 나왔는데 자리가 없어진 경우
    if(replaceRate(g)>=REPLACE_LIMIT){ finish(g,"replaced"); return true; }
    finish(g, g.ot?"late":"win"); return true;
  }
  // 구역 통과 보상 — 긴장 뒤에 한숨 한 번. 이 리듬이 있어야 하루가 읽힌다
  // 야근에는 한숨 돌릴 틈이 없다. 회복이 피로보다 크면 야근이 안 끝난다
  if(!g.ot) P.hp=Math.min(P.maxhp, P.hp+P.maxhp*0.22);
  P.inv=Math.max(P.inv,1.6);
  /* 구역을 넘을 때 필드를 통째로 비우고 있었다. 측정에 그대로 찍힌다 —
     13:35에 285명이던 게 13:50에 18명, 15:10에 또 18명.
     이 장르가 사람을 붙잡는 건 「점점 쌓이는 압박」인데 그게 구역마다
     0으로 돌아가면, 플레이는 「몰려온다 → 갑자기 텅 빈다」의 반복이 된다.

     한숨은 필요하지만 리셋은 아니다. 멀리 있는 것만 지우고, 가까운
     것들은 남겨서 뒤로 밀어낸다 — 퇴근하면서 밀쳐낸 그 사람들이다. */
  let kept=0;
  for(let i=g.foes.length-1;i>=0;i--){
    const f=g.foes[i];
    if(f.boss) continue;
    const d=Math.hypot(f.x-P.x,f.y-P.y);
    if(d>760 || kept>=80){ g.foes.splice(i,1); continue; }
    kept++;
    const dx=f.x-P.x, dy=f.y-P.y, m=Math.hypot(dx,dy)||1;
    f.x=P.x+dx/m*(420+Math.random()*260);
    f.y=P.y+dy/m*(420+Math.random()*260);
    f.slow=0.45; f.kb=0;
  }
  g.bossOut=false;
  const Z=zoneOf(g);
  flash(g, Z.name+" — 미결 "+quotaOf(g)+"건");
  S("doorThru"); g.flash=Math.max(g.flash,.8); kick(g,0,-1,10);
  g.fx.push({type:"ring",x:P.x,y:P.y,t:0,r0:16,r1:240,c:"#f5c451"});
  return false;
}
function stepGate(g,dt){
  const P=g.P, Z=zoneOf(g);
  // 구역 보스는 들어오자마자 한 번만 부른다
  if(Z.boss && !g.bossOut){
    g.bossOut=true;
    spawnRing(g,Z.boss,1);
    flash(g, Z.name+" — "+E[Z.boss].name+" 등장"); S("bossIn");
    kick(g,0,-1,16); g.hitstop=Math.max(g.hitstop,.22); g.flash=Math.max(g.flash,.9);
  }
  if(!g.gate){ if(gateReady(g)) openGate(g); return; }
  g.gate.t+=dt;
  const gd=Math.hypot(P.x-g.gate.x,P.y-g.gate.y);
  // 너무 멀어지면 문을 다시 놓는다. 끝없는 필드라 랜드마크가 없어서
  // 한 번 등지고 달리면 「출구 11746」 같은 게 뜬다(측정에서 실제로 나왔다).
  if(gd>1500 && !g.gate.p){ openGate(g); return; }
  stepLeave(g,dt,gd);
}

/* ── 퇴근 ──────────────────────────────────────────────────────
   원 안에 들어가면 끝이었다. 게임 제목이 「정시 퇴근」인데 정작
   퇴근하는 순간에 아무 일도 안 일어났다.

   직장인에게 퇴근이 좋은 건 문을 통과해서가 아니라 붙잡히지 않고
   나왔기 때문이다. 진짜 공포는 6시 5분 전 「잠깐만」이다.
   아침 출근부터 퇴근까지가 전쟁이면, 문은 통과하는 게 아니라
   빠져나오는 것이어야 한다.

   그래서 문에 서면 「퇴근 중」 게이지가 찬다. 그동안 주변이 전부
   문으로 몰려온다 — 맞으면 게이지가 깎이고, 떠나면 처음부터다.
   버텨내면 그때 나간다. 마지막 정문은 더 길고, 더 크게 열린다. */
/* 재서 맞춘 값이다. 처음 2.3초/이탈 -0.55로 두니 같은 봇이 6구역을
   14:55 → 22:15에 지났다 — 문 앞에서 버티는 게 너무 어려워 야근이 5시간
   늘었다. 붙잡히는 맛은 남기되 나가는 건 나갈 수 있어야 한다. */
const LEAVE_T = 1.9, LEAVE_LAST = 2.8, LEAVE_DRAIN = 0.26;
function stepLeave(g,dt,gd){
  const G=g.gate, last=(g.zone===ZONES.length-1);
  const need=last?LEAVE_LAST:LEAVE_T;
  if(gd < G.r){
    if(!G.p){ G.p=0.0001;
      flash(g, last?"정문 — 회전문을 밉니다":"퇴근 중 — 버티세요");
      S("place"); }
    G.p += dt/need;
    /* 「잠깐만요」 — 문 앞에 서면 다들 이쪽으로 온다. 이게 없으면 너무 쉽다 */
    for(const f of g.foes){ if(f.boss) continue;
      const dx=G.x-f.x, dy=G.y-f.y, d=Math.hypot(dx,dy)||1;
      f.x += dx/d*f.spd*dt*0.55; f.y += dy/d*f.spd*dt*0.55;
    }
    if(!G.said && G.p>0.25){ G.said=1; sayNear(g,G.x,G.y); }
    /* 붙잡는 것들을 쏘면서 나간다. 가만히 맞고만 있으면 그건 카타르시스가
       아니라 스트레스다 — 이 게임이 하지 말아야 할 바로 그것이다.
       문에서 주기적으로 밀어내는 파동이 나가고, 손도 빨라진다.
       「마음은 이미 나갔다」가 규칙이 되는 자리다. */
    G.pulse=(G.pulse||0)-dt;
    if(G.pulse<=0){
      G.pulse=0.62;
      const R=190+(last?70:0), DMG=52+g.lv*7;
      let n=0;
      for(const f of g.foes){
        if(f.boss) continue;
        const d=Math.hypot(f.x-G.x,f.y-G.y);
        if(d>R) continue;
        damage(g,f,DMG,G.x,G.y,26); n++;
      }
      g.fx.push({type:"ring",x:G.x,y:G.y,t:0,r0:26,r1:R,c:"#57d98a"});
      if(n){ S("nuke"); kick(g,0,-1,5); }
    }
    if(G.p>=1){ leaveZone(g,last); return; }
  }else if(G.p){
    /* 자리를 뜨면 밀린다. 완전히 처음으로 돌리면 가혹해서 천천히 */
    G.p -= dt*LEAVE_DRAIN;
    if(G.p<=0){ G.p=0; G.said=0; flash(g,"퇴근이 밀렸습니다"); }
  }
}
/* 문 앞에서 붙잡는 말 — 가장 가까운 놈이 한 마디 한다 */
function sayNear(g,x,y){
  let best=null, bd=1e9;
  for(const f of g.foes){ const d=Math.hypot(f.x-x,f.y-y); if(d<bd){bd=d;best=f;} }
  if(!best || bd>420) return;
  const L=["잠깐만요!","김대리님 어디 가세요","이것만 보고 가시죠","5분이면 됩니다",
           "벌써 가세요?","내일 아침에 필요한데요"];
  best.say=L[(Math.random()*L.length)|0]; best.sayT=2.4; best.sayT0=2.4;
}
/* 빠져나왔다 — 화면이 밝아지고 뒤엣것들이 밀려난다 */
function leaveZone(g,last){
  const P=g.P;
  g.flash=1; g.hitstop=Math.max(g.hitstop,last?0.30:0.18);
  g.fx.push({type:"ring",x:g.gate.x,y:g.gate.y,t:0,r0:24,r1:last?520:320,c:"#57d98a"});
  /* 붙잡으려던 것들이 뒤로 밀려난다 — 이게 퇴근의 쾌감이다 */
  for(const f of g.foes){ if(f.boss) continue;
    const dx=f.x-g.gate.x, dy=f.y-g.gate.y, d=Math.hypot(dx,dy)||1;
    f.kbx=dx/d*(last?30:20); f.kby=dy/d*(last?30:20); f.kb=.22; f.slow=0.5;
  }
  kick(g,0,-1,last?18:12);
  nextZone(g);
}

function stepBuilds(g,dt){
  const P=g.P;
  for(let i=g.builds.length-1;i>=0;i--){
    const b=g.builds[i], L=b.L;
    b.t+=dt;
    if(b.t>=b.life || (b.maxhp>0 && b.hp<=0)){
      g.fx.push({type:"spark",x:b.x,y:b.y,t:0});
      g.builds.splice(i,1); continue;
    }
    if(b.id==="part"){
      // 벽 — 선분에 닿은 적을 밀어낸다. 밀 때마다 내구도가 깎인다
      const hw=L.w/2, ca=Math.cos(b.a), sa=Math.sin(b.a);
      for(const f of g.foes){
        const rx=f.x-b.x, ry=f.y-b.y;
        let u=rx*ca+ry*sa; u=clamp(u,-hw,hw);
        const px=b.x+ca*u, py=b.y+sa*u;
        const dx=f.x-px, dy=f.y-py, d=Math.hypot(dx,dy)||1;
        const need=f.r+9;
        if(d<need){
          f.x+=dx/d*(need-d); f.y+=dy/d*(need-d);
          b.hp-=f.dmg*dt*2.2;
        }
      }
    } else if(b.id==="printer"){
      b.tick-=dt;
      if(b.tick<=0){
        b.tick=L.every;
        for(let k=0;k<L.n;k++){
          const a=(k/L.n)*6.283+b.t*.8;
          g.shots.push({x:b.x,y:b.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,
                        dmg:L.dmg,life:1.3,kind:"paper",r:7});
        }
        S("shoot","copy");
      }
    } else if(b.id==="water"){
      if(Math.hypot(P.x-b.x,P.y-b.y)<L.r && P.hp<P.maxhp){
        P.hp=Math.min(P.maxhp,P.hp+L.hps*dt);
      }
    } else if(b.id==="barista"){
      if(Math.hypot(P.x-b.x,P.y-b.y)<L.r) g.baristaOn=Math.max(g.baristaOn||0,L.haste);
    } else if(b.id==="wet"){
      for(const f of g.foes){
        if(Math.hypot(f.x-b.x,f.y-b.y)<L.r+f.r){
          f.slow=Math.min(f.slow,L.slow);
          f.wetT=(f.wetT||0)+dt;
          if(f.wetT>0.9){ f.wetT=0; damage(g,f,L.dmg,b.x,b.y,4); }
        }
      }
    } else if(b.id==="book"){
      // 회의 소집 — 한 번만 잡고 사라진다. 잡힌 것은 회의가 끝날 때까지 못 움직인다
      if(!b.done){
        b.done=1;
        let n=0;
        for(const f of g.foes){
          if(f.boss) continue;
          if(Math.hypot(f.x-b.x,f.y-b.y)<L.r){ f.hold=L.hold; damage(g,f,L.dmg,b.x,b.y,0); n++; }
        }
        if(n){ S("deny"); flash(g,"회의실 예약 — "+n+"명 묶임"); }
        g.fx.push({type:"ring",x:b.x,y:b.y,t:0,r0:12,r1:L.r,c:"#f5c451"});
      }
    }
  }
}

/* ── 동료 ──────────────────────────────────────────────────────
   붙어 다니며 같이 싸운다. 맞으면 닳고, 닳으면 물러난다 —
   다음 재사용 때 다시 온다. */
function stepAllies(g,dt){
  const P=g.P;
  for(let i=g.allies.length-1;i>=0;i--){
    const al=g.allies[i], L=al.L;
    if(al.hp<=0){
      g.fx.push({type:"burst",x:al.x,y:al.y,t:0,r:14,bits:burstBits(8,Math.random()*6.283,false)});
      flash(g,WEAPONS[al.id].name+" — 물러났습니다. 곧 다시 옵니다");
      g.allies.splice(i,1); continue;
    }
    // 노조원은 앞에 서고, 나머지는 뒤를 따른다
    const lead = al.id==="unionist" ? 54 : -40;
    const hx=P.hx||-1, hy=P.hy||0, hm=Math.hypot(hx,hy)||1;
    const tx=P.x+hx/hm*lead + (i%2?26:-26), ty=P.y+hy/hm*lead;
    const dx=tx-al.x, dy=ty-al.y, d=Math.hypot(dx,dy)||1;
    if(d>16){ const sp=Math.min(d*3.4,P.spd*1.22);
              al.x+=dx/d*sp*dt; al.y+=dy/d*sp*dt; al.walk+=dt*7; al.face=dx<0?-1:1; }

    al.cd-=dt;
    if(al.id==="peer"){
      if(al.cd<=0 && P.hp<P.maxhp){ al.cd=L.cd; P.hp=Math.min(P.maxhp,P.hp+L.heal);
        g.floats.push({x:P.x,y:P.y-18,t:0,v:"+"+Math.round(L.heal),c:"#57d98a"}); S("coin"); }
    } else {
      if(al.cd<=0){
        const t=nearest(g,al.x,al.y,L.range);
        if(t){ al.cd=L.cd;
          damage(g,t,L.dmg*(P.allyDmg||1),al.x,al.y,6);
          g.fx.push({type:"stamp",x:t.x,y:t.y,t:0}); }
      }
      if(al.id==="unionist"){
        // 도발 — 주변 적이 나 대신 노조원을 본다
        for(const f of g.foes){
          if(f.boss) continue;
          const fd=Math.hypot(f.x-al.x,f.y-al.y);
          if(fd<L.taunt){ f.tx=al.x; f.ty=al.y; f.tauntT=.4; }
        }
      }
    }
    // 접촉 피해를 대신 받는다
    for(const f of g.foes){
      if(Math.hypot(f.x-al.x,f.y-al.y) < f.r+13){ al.hp-=f.dmg*dt*1.4; }
    }
  }
}

/* ── 제도 ──────────────────────────────────────────────────────
   숫자가 아니라 규칙을 바꾸는 것들. 연차는 주기적으로 무적을 주고,
   재택은 위험할 때 알아서 빠져나간다. */
function stepPolicy(g,dt){
  const P=g.P;
  if(P.annual>0){
    g.annualCd-=dt;
    if(g.annualCd<=0){
      g.annualCd=46-P.annual*8;
      g.annualT=3; P.inv=Math.max(P.inv,3);
      flash(g,"연차 — 3초간 아무도 못 건드립니다"); S("nuke");
      g.fx.push({type:"ring",x:P.x,y:P.y,t:0,r0:16,r1:160,c:"#57d98a"});
    }
  }
  if(g.annualT>0) g.annualT-=dt;
  if(P.blink>0){
    g.blinkCd-=dt;
    if(g.blinkCd<=0 && P.hp<P.maxhp*0.34){
      g.blinkCd=22-P.blink*4;
      // 제일 한산한 쪽으로 빠진다
      let best=null,bs=-1;
      for(let k=0;k<10;k++){
        const a=k/10*6.283, nx=P.x+Math.cos(a)*250, ny=P.y+Math.sin(a)*250;
        let sc=0; for(const f of g.foes){ const d=Math.hypot(f.x-nx,f.y-ny); if(d<300) sc-=(300-d); }
        if(sc>bs){ bs=sc; best=[nx,ny]; }
      }
      if(best){
        g.fx.push({type:"ring",x:P.x,y:P.y,t:0,r0:10,r1:90,c:"#9ec8ff"});
        P.x=best[0]; P.y=best[1]; P.inv=Math.max(P.inv,1.1);
        g.fx.push({type:"ring",x:P.x,y:P.y,t:0,r0:10,r1:90,c:"#9ec8ff"});
        flash(g,"재택근무 — 자리를 옮겼습니다"); S("place");
      }
    }
  }
}

function fireWeapons(g,dt){
  const P=g.P;
  // 커피머신 곁이면 손이 빨라지고, 상사 곁이면 느려진다
  /* 퇴근 중엔 손이 빨라진다 — 마음이 이미 나갔다 */
  const leaving = (g.gate && g.gate.p>0) ? 0.42 : 1;
  const haste = P.haste * (1-(g.baristaOn||0)) * (1 + MEDDLE_SLOW*(g.meddle||0)) * leaving;
  for(const id in g.weapons){
    const W=WEAPONS[id], L=W.lv(g.weapons[id]);
    if(id==="clock"||id==="ontime"||id==="overtime") continue;   // 지속형
    g.cds[id]=(g.cds[id]||0)-dt;
    if(g.cds[id]>0) continue;

    /* 설치기 — 내 발밑에 놓는다. 같은 종류는 상한을 넘기면 오래된 것부터 걷힌다 */
    if(W.build){
      const mine=g.builds.filter(b=>b.id===id);
      while(mine.length>=L.cap){ const old=mine.shift(); g.builds.splice(g.builds.indexOf(old),1); }
      /* 놓는 자리 — 발밑에 깔면 내 몸을 가린다.
         파티션은 가는 쪽 앞을 가로막게 세우고, 나머지는 살짝 옆에 둔다. */
      const hm=Math.hypot(P.hx,P.hy)||1, ux=P.hx/hm, uy=P.hy/hm;
      let bx=P.x, by=P.y, ang=0;
      if(id==="part"){
        bx=P.x+ux*62; by=P.y+uy*62;
        ang=Math.atan2(uy,ux)+Math.PI/2;       // 진행 방향을 가로지르게
      }else if(id!=="book"){
        const side=(mine.length%2)?1:-1;
        bx=P.x-uy*34*side; by=P.y+ux*34*side;
      }
      g.builds.push({id, x:bx, y:by, t:0, life:L.life, L,
                     hp:L.hp||0, maxhp:L.hp||0, tick:0, a:ang});
      S("place"); g.fx.push({type:"ring",x:bx,y:by,t:0,r0:8,r1:(L.r||L.w||60),c:"#9ec8ff"});
      g.cds[id]=L.cd*haste; continue;
    }
    /* 동료 — 인원이 모자라면 채운다. 죽으면 다시 온다 */
    if(W.ally){
      const mine=g.allies.filter(a=>a.id===id);
      if(mine.length<L.n){
        const a=Math.random()*6.283;
        g.allies.push({id, x:P.x+Math.cos(a)*42, y:P.y+Math.sin(a)*42,
                       hp:L.hp, maxhp:L.hp, cd:0, face:-1, walk:0, L});
        S("place");
      }
      for(const al of mine) al.L=L;            // 레벨업이 즉시 반영되게
      g.cds[id]=1.2; continue;
    }

    if(id==="stamp"){
      const R=L.range*P.range;
      let fired=0;
      const used=new Set();
      for(let i=0;i<L.count;i++){
        let tgt=null,bd=R*R;
        for(const f of g.foes){ if(used.has(f)) continue;
          const dx=f.x-P.x,dy=f.y-P.y,d=dx*dx+dy*dy; if(d<bd){bd=d;tgt=f;} }
        if(!tgt) break;
        used.add(tgt); fired++;
        damage(g,tgt,L.dmg,P.x,P.y,10);
        g.fx.push({type:"stamp",x:tgt.x,y:tgt.y,t:0});
      }
      if(fired){ S("hit"); P.atk=.25; g.cds[id]=L.cd*haste; } else g.cds[id]=.12;
      continue;
    }
    if(id==="copy"){
      for(let i=0;i<L.n;i++){
        const a=(i/L.n)*Math.PI*2 + g.t*.7;
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*L.spd,vy:Math.sin(a)*L.spd,
                      dmg:L.dmg,life:1.6*P.range,kind:"paper",r:7});
      }
      S("shoot","copy"); g.cds[id]=L.cd*haste; continue;
    }
    if(id==="mail"){
      for(let i=0;i<L.n;i++){
        const tgt=nearest(g,P.x,P.y,900);
        const a=tgt?Math.atan2(tgt.y-P.y,tgt.x-P.x):(Math.random()*7);
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,
                      dmg:L.dmg,life:3.2,kind:"mail",r:8,turn:L.turn});
      }
      S("shoot","stap"); g.cds[id]=L.cd*haste; continue;
    }
    if(id==="coffee"){
      g.pools.push({x:P.x,y:P.y,r:L.r*P.range,dps:L.dps,life:L.life,t:0});
      S("place","water"); g.cds[id]=L.cd*haste; continue;
    }
    if(id==="meeting"){
      // 회의 소집 — 한 점으로 끌어모으고 그 안을 계속 깎는다
      const tgt=nearest(g,P.x,P.y,520) || {x:P.x+120,y:P.y};
      g.vortex.push({x:tgt.x,y:tgt.y,r:L.r*P.range,pull:L.pull,dps:L.dps,life:L.life,t:0});
      S("bossIn"); g.cds[id]=L.cd*haste; continue;
    }
    if(id==="msg"){
      // 사내 메신저 — 적에서 적으로 옮겨 붙는다
      let cur=nearest(g,P.x,P.y,L.range*P.range);
      if(!cur){ g.cds[id]=.2; continue; }
      const seen=new Set(); let from={x:P.x,y:P.y};
      for(let j=0;j<=L.jumps && cur;j++){
        seen.add(cur);
        damage(g,cur,L.dmg,from.x,from.y,6);
        g.fx.push({type:"bolt",x1:from.x,y1:from.y,x2:cur.x,y2:cur.y,t:0});
        from={x:cur.x,y:cur.y};
        let nx=null,bd=(L.range*0.8)**2;
        for(const f2 of g.foes){ if(seen.has(f2)) continue;
          const dx=f2.x-cur.x,dy=f2.y-cur.y,d2=dx*dx+dy*dy; if(d2<bd){bd=d2;nx=f2;} }
        cur=nx;
      }
      S("hit"); g.cds[id]=L.cd*haste; continue;
    }
    if(id==="card"){
      for(let i=0;i<L.n;i++){
        const tgt=nearest(g,P.x,P.y,900);
        const a=(tgt?Math.atan2(tgt.y-P.y,tgt.x-P.x):Math.random()*7)+(i-(L.n-1)/2)*0.4;
        g.cards.push({x:P.x,y:P.y,a:a,t:0,reach:L.reach*P.range,dmg:L.dmg,hitSet:new Set()});
      }
      S("shoot","stap"); g.cds[id]=L.cd*haste; continue;
    }
    if(id==="attend"){
      for(let i=0;i<L.n;i++){
        const tgt=nearest(g,P.x,P.y,900);
        const a=(tgt?Math.atan2(tgt.y-P.y,tgt.x-P.x):Math.random()*7)+(i-(L.n-1)/2)*0.22;
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*L.spd,vy:Math.sin(a)*L.spd,
                      dmg:L.dmg,life:1.9*P.range,kind:"pierce",r:9,pierce:true,hitSet:new Set()});
      }
      S("shoot","copy"); g.cds[id]=L.cd*haste; continue;
    }
    if(id==="elev"){
      const R=L.r*P.range; let n=0;
      for(const f of g.foes){
        const dx=f.x-P.x, dy=f.y-P.y, d=Math.hypot(dx,dy)||1;
        if(d>R) continue;
        damage(g,f,L.dmg,P.x,P.y,L.push/9); n++;
      }
      g.fx.push({type:"ring",x:P.x,y:P.y,t:0,r0:20,r1:R,c:"#9ec8ff"});
      if(n){ S("nuke"); kick(g,0,1,5); }
      g.cds[id]=L.cd*haste; continue;
    }
    /* ── 진화형 ── */
    if(id==="jeongyeol"){
      const R=L.range*P.range; let n=0;
      for(const f of g.foes){
        if(Math.hypot(f.x-P.x,f.y-P.y)>R) continue;
        damage(g,f,L.dmg,P.x,P.y,9); n++;
        g.fx.push({type:"stamp",x:f.x,y:f.y,t:0});
      }
      if(n){ S("hit"); P.atk=.25; }
      g.cds[id]=L.cd*haste; continue;
    }
    if(id==="notice"){
      for(let i=0;i<L.n;i++){
        const a=(i/L.n)*Math.PI*2 + g.t*.5;
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*L.spd,vy:Math.sin(a)*L.spd,
                      dmg:L.dmg,life:2.2*P.range,kind:"pierce",r:8,pierce:true,hitSet:new Set()});
      }
      S("shoot","copy"); g.cds[id]=L.cd*haste; continue;
    }
    if(id==="replyall"){
      for(let i=0;i<L.n;i++){
        const a=Math.random()*7;
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*320,vy:Math.sin(a)*320,
                      dmg:L.dmg,life:4.5,kind:"mail",r:9,turn:L.turn});
      }
      S("shoot","stap"); g.cds[id]=L.cd*haste; continue;
    }
    if(id==="caffeine"){
      g.pools.push({x:P.x,y:P.y,r:L.r*P.range,dps:L.dps,life:L.life,t:0});
      g.cds[id]=L.cd; continue;                 // 지나간 자리마다 남는다
    }
    if(id==="resign"){
      let n=0;
      for(const f of g.foes){ damage(g,f,L.dmg,P.x,P.y,L.push/9); n++; }
      g.fx.push({type:"quit",t:0});
      g.fx.push({type:"ring",x:P.x,y:P.y,t:0,r0:30,r1:520,c:"#f5c451"});
      g.shake=Math.max(g.shake,20); g.hitstop=Math.max(g.hitstop,.14);
      S("nuke"); flash(g,"퇴사 — "+n+"명 정리");
      g.cds[id]=L.cd; continue;
    }
    if(id==="quit"){
      /* 가장 몰려 있는 쪽으로 던진다. 없으면 가는 방향으로 */
      for(let k=0;k<L.n;k++){
        let tx=P.x, ty=P.y, best=-1;
        for(const f of g.foes){
          if(E[f.kind].prop) continue;
          let c=0;
          for(const o of g.foes){ if(E[o.kind].prop) continue;
            if(Math.hypot(o.x-f.x,o.y-f.y)<L.r) c++; }
          if(c>best){ best=c; tx=f.x; ty=f.y; }
        }
        if(best<0){ const hm=Math.hypot(P.hx,P.hy)||1;
                    tx=P.x+P.hx/hm*320; ty=P.y+P.hy/hm*320; }
        tx+=(Math.random()-.5)*90; ty+=(Math.random()-.5)*90;
        g.paper.push({x:P.x, y:P.y, sx:P.x, sy:P.y, tx, ty, t:0,
                      dur:0.44+Math.random()*0.10, dmg:L.dmg, r:L.r});
      }
      S("place"); g.cds[id]=L.cd; continue;
    }
  }
}

/* ── 피해 / 처치 ─────────────────────────────────────────────── */
/* 타격 방향으로 카메라를 민다 — 무작위 진동보다 "어디서 맞았는지"가 읽힌다 */
function kick(g,dx,dy,power){
  const d=Math.hypot(dx,dy)||1;
  g.shakeX+=dx/d*power; g.shakeY+=dy/d*power;
  g.shake=Math.max(g.shake,power*0.55);
}
function damage(g,f,dmg,sx,sy,kb){
  /* 교섭 중엔 대표이사를 때리지 않는다 — 앉아서 얘기하기로 했으니까.
     때려서 이기는 싸움이 버텨서 관철시키는 싸움으로 규칙째 바뀐다 */
  if(g.barOn && f.boss && E[f.kind].robot!==true){
    f.hit=.06;
    if(g.floats.length<6 && Math.random()<0.05)
      g.floats.push({x:f.x,y:f.y-f.r-4,v:"교섭 중",t:0});
    return;
  }
  f.hp-=dmg; g.dmgDealt+=dmg; f.hit=.12;
  if(kb){ const dx=f.x-sx, dy=f.y-sy, d=Math.hypot(dx,dy)||1;
          f.kbx=dx/d*kb; f.kby=dy/d*kb; f.kb=.14; }
  // 숫자가 수십 개 뜨면 화면이 안 읽힌다. 큰 타격만, 최대 14개.
  if(dmg>=25 && g.floats.length<14)
    g.floats.push({x:f.x,y:f.y-f.r-4,v:Math.round(dmg),t:0,big:dmg>=120});
}
/* 드롭 — 처치 말고도 주울 게 있어야 계속 돌아다니게 된다 */
const DROPS={
  heal  :{id:"heal",  name:"믹스커피", color:"#57d98a"},
  magnet:{id:"magnet",name:"텀블러",   color:"#9ec8ff"},
  bomb  :{id:"bomb",  name:"사직서",   color:"#f5c451"},
  /* ── 인수인계 상자 ─────────────────────────────────────────────
     참조로 연 게임들엔 전부 보물상자가 있었다. 보스를 잡으면 떨어지고,
     열면 무기 여러 개가 한꺼번에 오른다 — 이 장르에서 가장 큰 한 방이다.
     우리 것으로는 「인수인계 상자」다. 누군가 나간 자리에서 넘어온 일감이
     한꺼번에 쏟아지는데, 그게 곧 내 무기가 된다. */
  chest :{id:"chest", name:"인수인계 상자", color:"#c9a227"},
};
/* 상자를 연다 — 가진 무기 중 둘에서 넷이 한꺼번에 오른다.
   빈 칸이 있으면 새 무기가 들어오고, 다 찼으면 있는 걸 올린다.
   한 번에 여러 개가 오르는 그 순간이 이 장르의 가장 큰 한 방이다. */
function openChest(g){
  const n=2+((Math.random()*3)|0);                 // 2~4개
  const got={};                                    // 같은 걸 두 번 올리면 최종만 적는다
  for(let k=0;k<n;k++){
    const own=Object.keys(g.weapons).filter(id=>WEAPONS[id] && g.weapons[id]<WEAPONS[id].max);
    const free=Math.max(0,6-Object.keys(g.weapons).length);
    let pick=null;
    if(free>0 && Math.random()<0.5){
      const pool=Object.keys(WEAPONS).filter(id=>!g.weapons[id] && !WEAPONS[id].evo && unlocked(id));
      if(pool.length) pick=pool[(Math.random()*pool.length)|0];
    }
    if(!pick && own.length) pick=own[(Math.random()*own.length)|0];
    if(!pick) break;
    g.weapons[pick]=(g.weapons[pick]||0)+1;
    got[pick]=g.weapons[pick];
  }
  const list=Object.keys(got).map(id=>WEAPONS[id].name+" "+got[id]);
  syncSlots(g);
  g.flash=1; g.hitstop=Math.max(g.hitstop,.22); kick(g,0,-1,14);
  g.fx.push({type:"ring",x:g.P.x,y:g.P.y,t:0,r0:20,r1:300,c:"#c9a227"});
  S("levelup");
  flash(g, list.length?("인수인계 상자 — "+list.join(" · ")):"인수인계 상자 — 더 받을 게 없습니다");
}
/* 집기를 부수면 나온다 — 경험치 구슬이 쏟아지거나, 가끔 아이템 */
function dropAt(g,x,y){
  const r=Math.random();
  if(r<0.16)      g.drops.push({kind:"heal",   x, y, t:0});
  else if(r<0.26) g.drops.push({kind:"magnet", x, y, t:0});
  else if(r<0.31) g.drops.push({kind:"bomb",   x, y, t:0});
  else {
    const n=3+((Math.random()*4)|0);
    for(let i=0;i<n;i++){
      const a=Math.random()*6.283, d=10+Math.random()*40;
      g.orbs.push({x:x+Math.cos(a)*d, y:y+Math.sin(a)*d, xp:2, t:0, boss:false});
    }
  }
}
function dropFrom(g,f){
  let kind=null;
  if(f.boss) kind = "chest";                 // 보스는 반드시 상자를 남긴다
  else {
    const r=Math.random();
    if(r<0.012) kind="heal";
    else if(r<0.020) kind="magnet";
    else if(r<0.025) kind="bomb";
  }
  if(kind) g.drops.push({kind, x:f.x, y:f.y, t:0});
}
function takeDrop(g,d){
  const P=g.P;
  if(d.kind==="heal"){
    P.hp=Math.min(P.maxhp, P.hp+Math.round(P.maxhp*0.3));
    flash(g,"믹스커피 — 체력 회복"); S("coin");
  } else if(d.kind==="magnet"){
    g.orbs.forEach(o=>{ o.x=P.x+(o.x-P.x)*0.06; o.y=P.y+(o.y-P.y)*0.06; });
    flash(g,"텀블러 — 경험치 전부 수집"); S("coin");
  } else if(d.kind==="chest"){
    openChest(g);
  } else {
    let n=0; for(const f of g.foes){ damage(g,f,240,P.x,P.y,24); n++; }
    g.fx.push({type:"quit",t:0});
    kick(g,0,-1,14); g.hitstop=Math.max(g.hitstop,.12);
    S("nuke"); flash(g,"사직서 — "+n+"명 정리");
  }
}
/* 처치 파편 — 서류 조각. 그리기 쪽이 배열을 순회하므로 반드시 배열이어야 한다
   (동료 사망에 숫자를 넣었다가 첫 사망에 루프가 죽은 전력). */
/* ── 처치 연출 ─────────────────────────────────────────────────
