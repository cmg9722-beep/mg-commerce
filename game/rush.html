  for(const e of SCHED) if(h>=e.h) s=e;
  return s;
}
function spawnAt(g,kind,x,y){
  const d=E[kind];
  g.foes.push({kind, x, y, hp:d.hp, maxhp:d.hp, spd:d.spd, dmg:d.dmg,
               r:d.r, xp:d.xp, boss:!!d.boss, hit:0, slow:1, kb:0, kbx:0, kby:0,
               walk:Math.random(), face:-1,
               atkT:d.atkCd?d.atkCd*0.6:0, sumT:d.summonCd||0,
               rage:0, wind:0, dash:0, dvx:0, dvy:0});
}
function spawnRing(g,kind,n){
  const P=g.P, R=Math.max(VW,VH)/ZOOM*0.62+90;
  const a0=Math.random()*Math.PI*2;
  for(let i=0;i<n;i++){
    const a=a0+i*(Math.PI*2/n)+ (Math.random()-.5)*.5;
    spawnAt(g,kind,P.x+Math.cos(a)*R,P.y+Math.sin(a)*R);
  }
}
function doSpawns(g,dt){
  const h=hourOf(g.t), s=schedFor(h);
  g.spawnAcc+=dt;
  const CAP=420;                       // 폭주 방지 상한 (성능·가독성 둘 다)
  if(g.foes.length<CAP && g.spawnAcc>=s.rate){
    g.spawnAcc=0;
    const k=s.kinds[(Math.random()*s.kinds.length)|0];
    spawnRing(g,k,s.n);
  }
  while(g.bossIdx<BOSSES.length && h>=BOSSES[g.bossIdx].h){
    const b=BOSSES[g.bossIdx++];
    spawnRing(g,b.kind,1);
    flash(g,b.msg); S("bossIn");
    kick(g,0,-1,16); g.hitstop=Math.max(g.hitstop,.22);   // 등장 순간 화면이 멎는다
    g.flash=Math.max(g.flash,.9);
  }
}

/* ── 보스 ──────────────────────────────────────────────────────
   보스가 그냥 체력 많은 적이면 보스가 아니다. 패턴과 격노 단계를 준다. */
function bossStep(g,f,dt){
  const D=E[f.kind];
  // 격노 — 체력 절반에서 한 번, 눈에 띄게 바뀐다
  if(!f.rage && f.hp < f.maxhp*0.5){
    f.rage=1; f.spd*=1.35;
    flash(g, D.name+" — 표정이 바뀝니다");
    S("bossIn"); kick(g,0,-1,10); g.flash=Math.max(g.flash,.6);
  }
  const rk = f.rage ? 0.6 : 1;
  // 수행 인원 소환
  if(D.summon){
    f.sumT-=dt;
    if(f.sumT<=0){
      f.sumT=D.summonCd*rk;
      for(let i=0;i<D.summonN;i++){
        const a=Math.random()*6.283, r=80+Math.random()*70;
        spawnAt(g,D.summon,f.x+Math.cos(a)*r,f.y+Math.sin(a)*r);
      }
      g.fx.push({type:"ring",x:f.x,y:f.y,t:0,r0:20,r1:150,c:"#9ec8ff"});
      S("deny");
    }
  }
  if(!D.atk || f.wind>0 || f.dash>0) return;
  f.atkT-=dt;
  if(f.atkT>0) return;
  f.wind = D.atk==="shock" ? 0.45 : 0.55;
  f.pending = D.atk;
  f.atkT = D.atkCd*rk;
}
/* 예비동작이 끝나는 순간 실제 공격이 나간다 */
function bossFire(g,f){
  const D=E[f.kind], P=g.P;
  if(f.pending==="shock"){
    // 「지적」 — 클립보드를 내리치고 충격파가 퍼진다
    g.shocks.push({x:f.x,y:f.y,r:26,max:230*(f.rage?1.25:1),dmg:D.dmg,t:0,done:false});
    S("nuke"); kick(g, f.x-P.x, f.y-P.y, 8);
  } else if(f.pending==="charge"){
    // 「호출」 — 조준하고 멈췄다가 돌진한다
    const dx=P.x-f.x, dy=P.y-f.y, d=Math.hypot(dx,dy)||1;
    const sp=520*(f.rage?1.25:1);
    f.dvx=dx/d*sp; f.dvy=dy/d*sp; f.dash=0.45;
    S("bossIn"); g.shake=Math.max(g.shake,6);
  }
  f.pending=null;
}

/* ── 무기 발사 ───────────────────────────────────────────────── */
function nearest(g,x,y,maxd){
  let best=null,bd=maxd*maxd;
  for(const f of g.foes){ const dx=f.x-x,dy=f.y-y,d=dx*dx+dy*dy; if(d<bd){bd=d;best=f;} }
  return best;
}
function fireWeapons(g,dt){
  const P=g.P;
  for(const id in g.weapons){
    const W=WEAPONS[id], L=W.lv(g.weapons[id]);
    if(id==="clock"||id==="ontime"||id==="overtime") continue;   // 지속형
    g.cds[id]=(g.cds[id]||0)-dt;
    if(g.cds[id]>0) continue;

    if(id==="stamp"){
      const R=L.range*P.range;
      let fired=0;
      const used=new Set();
      for(let i=0;i<L.count;i++){
        let tgt=null,bd=R*R;
        for(const f of g.foes){ if(used.has(f)) continue;
          const dx=f.x-P.x,dy=f.y-P.y,d=dx*dx+dy*dy; if(d<bd){bd=d;tgt=f;} }
        if(!tgt) break;
        used.add(tgt); fired++;
        damage(g,tgt,L.dmg,P.x,P.y,10);
        g.fx.push({type:"stamp",x:tgt.x,y:tgt.y,t:0});
      }
      if(fired){ S("hit"); P.atk=.25; g.cds[id]=L.cd*P.haste; } else g.cds[id]=.12;
      continue;
    }
    if(id==="copy"){
      for(let i=0;i<L.n;i++){
        const a=(i/L.n)*Math.PI*2 + g.t*.7;
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*L.spd,vy:Math.sin(a)*L.spd,
                      dmg:L.dmg,life:1.6*P.range,kind:"paper",r:7});
      }
      S("shoot","copy"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="mail"){
      for(let i=0;i<L.n;i++){
        const tgt=nearest(g,P.x,P.y,900);
        const a=tgt?Math.atan2(tgt.y-P.y,tgt.x-P.x):(Math.random()*7);
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,
                      dmg:L.dmg,life:3.2,kind:"mail",r:8,turn:L.turn});
      }
      S("shoot","stap"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="coffee"){
      g.pools.push({x:P.x,y:P.y,r:L.r*P.range,dps:L.dps,life:L.life,t:0});
      S("place","water"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="meeting"){
      // 회의 소집 — 한 점으로 끌어모으고 그 안을 계속 깎는다
      const tgt=nearest(g,P.x,P.y,520) || {x:P.x+120,y:P.y};
      g.vortex.push({x:tgt.x,y:tgt.y,r:L.r*P.range,pull:L.pull,dps:L.dps,life:L.life,t:0});
      S("bossIn"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="msg"){
      // 사내 메신저 — 적에서 적으로 옮겨 붙는다
      let cur=nearest(g,P.x,P.y,L.range*P.range);
      if(!cur){ g.cds[id]=.2; continue; }
      const seen=new Set(); let from={x:P.x,y:P.y};
      for(let j=0;j<=L.jumps && cur;j++){
        seen.add(cur);
        damage(g,cur,L.dmg,from.x,from.y,6);
        g.fx.push({type:"bolt",x1:from.x,y1:from.y,x2:cur.x,y2:cur.y,t:0});
        from={x:cur.x,y:cur.y};
        let nx=null,bd=(L.range*0.8)**2;
        for(const f2 of g.foes){ if(seen.has(f2)) continue;
          const dx=f2.x-cur.x,dy=f2.y-cur.y,d2=dx*dx+dy*dy; if(d2<bd){bd=d2;nx=f2;} }
        cur=nx;
      }
      S("hit"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="card"){
      for(let i=0;i<L.n;i++){
        const tgt=nearest(g,P.x,P.y,900);
        const a=(tgt?Math.atan2(tgt.y-P.y,tgt.x-P.x):Math.random()*7)+(i-(L.n-1)/2)*0.4;
        g.cards.push({x:P.x,y:P.y,a:a,t:0,reach:L.reach*P.range,dmg:L.dmg,hitSet:new Set()});
      }
      S("shoot","stap"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="attend"){
      for(let i=0;i<L.n;i++){
        const tgt=nearest(g,P.x,P.y,900);
        const a=(tgt?Math.atan2(tgt.y-P.y,tgt.x-P.x):Math.random()*7)+(i-(L.n-1)/2)*0.22;
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*L.spd,vy:Math.sin(a)*L.spd,
                      dmg:L.dmg,life:1.9*P.range,kind:"pierce",r:9,pierce:true,hitSet:new Set()});
      }
      S("shoot","copy"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="elev"){
      const R=L.r*P.range; let n=0;
      for(const f of g.foes){
        const dx=f.x-P.x, dy=f.y-P.y, d=Math.hypot(dx,dy)||1;
        if(d>R) continue;
        damage(g,f,L.dmg,P.x,P.y,L.push/9); n++;
      }
      g.fx.push({type:"ring",x:P.x,y:P.y,t:0,r0:20,r1:R,c:"#9ec8ff"});
      if(n){ S("nuke"); kick(g,0,1,5); }
      g.cds[id]=L.cd*P.haste; continue;
    }
    /* ── 진화형 ── */
    if(id==="jeongyeol"){
      const R=L.range*P.range; let n=0;
      for(const f of g.foes){
        if(Math.hypot(f.x-P.x,f.y-P.y)>R) continue;
        damage(g,f,L.dmg,P.x,P.y,9); n++;
        g.fx.push({type:"stamp",x:f.x,y:f.y,t:0});
      }
      if(n){ S("hit"); P.atk=.25; }
      g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="notice"){
      for(let i=0;i<L.n;i++){
        const a=(i/L.n)*Math.PI*2 + g.t*.5;
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*L.spd,vy:Math.sin(a)*L.spd,
                      dmg:L.dmg,life:2.2*P.range,kind:"pierce",r:8,pierce:true,hitSet:new Set()});
      }
      S("shoot","copy"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="replyall"){
      for(let i=0;i<L.n;i++){
        const a=Math.random()*7;
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*320,vy:Math.sin(a)*320,
                      dmg:L.dmg,life:4.5,kind:"mail",r:9,turn:L.turn});
      }
      S("shoot","stap"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="caffeine"){
      g.pools.push({x:P.x,y:P.y,r:L.r*P.range,dps:L.dps,life:L.life,t:0});
      g.cds[id]=L.cd; continue;                 // 지나간 자리마다 남는다
    }
    if(id==="resign"){
      let n=0;
      for(const f of g.foes){ damage(g,f,L.dmg,P.x,P.y,L.push/9); n++; }
      g.fx.push({type:"quit",t:0});
      g.fx.push({type:"ring",x:P.x,y:P.y,t:0,r0:30,r1:520,c:"#f5c451"});
      g.shake=Math.max(g.shake,20); g.hitstop=Math.max(g.hitstop,.14);
      S("nuke"); flash(g,"퇴사 — "+n+"명 정리");
      g.cds[id]=L.cd; continue;
    }
    if(id==="quit"){
      let n=0;
      for(const f of g.foes){ damage(g,f,L.dmg,P.x,P.y,26); n++; }
      g.fx.push({type:"quit",t:0});
      g.shake=Math.max(g.shake,16); g.hitstop=Math.max(g.hitstop,.10);
      S("nuke"); flash(g,"사직서 — "+n+"명 정리");
      g.cds[id]=L.cd; continue;
    }
  }
}

/* ── 피해 / 처치 ─────────────────────────────────────────────── */
/* 타격 방향으로 카메라를 민다 — 무작위 진동보다 "어디서 맞았는지"가 읽힌다 */
function kick(g,dx,dy,power){
  const d=Math.hypot(dx,dy)||1;
  g.shakeX+=dx/d*power; g.shakeY+=dy/d*power;
  g.shake=Math.max(g.shake,power*0.55);
}
function damage(g,f,dmg,sx,sy,kb){
  f.hp-=dmg; g.dmgDealt+=dmg; f.hit=.12;
  if(kb){ const dx=f.x-sx, dy=f.y-sy, d=Math.hypot(dx,dy)||1;
          f.kbx=dx/d*kb; f.kby=dy/d*kb; f.kb=.14; }
  // 숫자가 수십 개 뜨면 화면이 안 읽힌다. 큰 타격만, 최대 14개.
  if(dmg>=25 && g.floats.length<14)
    g.floats.push({x:f.x,y:f.y-f.r-4,v:Math.round(dmg),t:0,big:dmg>=120});
}
/* 드롭 — 처치 말고도 주울 게 있어야 계속 돌아다니게 된다 */
const DROPS={
  heal  :{id:"heal",  name:"믹스커피", color:"#57d98a"},
  magnet:{id:"magnet",name:"텀블러",   color:"#9ec8ff"},
  bomb  :{id:"bomb",  name:"사직서",   color:"#f5c451"},
};
function dropFrom(g,f){
  let kind=null;
  if(f.boss) kind = Math.random()<.5 ? "bomb" : "heal";
  else {
    const r=Math.random();
    if(r<0.012) kind="heal";
    else if(r<0.020) kind="magnet";
    else if(r<0.025) kind="bomb";
  }
  if(kind) g.drops.push({kind, x:f.x, y:f.y, t:0});
}
function takeDrop(g,d){
  const P=g.P;
  if(d.kind==="heal"){
    P.hp=Math.min(P.maxhp, P.hp+Math.round(P.maxhp*0.3));
    flash(g,"믹스커피 — 체력 회복"); S("coin");
  } else if(d.kind==="magnet"){
    g.orbs.forEach(o=>{ o.x=P.x+(o.x-P.x)*0.06; o.y=P.y+(o.y-P.y)*0.06; });
    flash(g,"텀블러 — 경험치 전부 수집"); S("coin");
  } else {
    let n=0; for(const f of g.foes){ damage(g,f,240,P.x,P.y,24); n++; }
    g.fx.push({type:"quit",t:0});
    kick(g,0,-1,14); g.hitstop=Math.max(g.hitstop,.12);
    S("nuke"); flash(g,"사직서 — "+n+"명 정리");
  }
}
function killFoe(g,f,i){
  g.foes.splice(i,1); g.kills++;
  if(f.boss){                            // 보스 처치 — 경험치가 쏟아진다
    for(let k=0;k<14;k++){
      const a=Math.random()*6.283, r=30+Math.random()*90;
      g.orbs.push({x:f.x+Math.cos(a)*r,y:f.y+Math.sin(a)*r,xp:Math.ceil(f.xp/14),t:0,boss:true});
    }
    g.fx.push({type:"ring",x:f.x,y:f.y,t:0,r0:30,r1:280,c:"#f5c451"});
    g.flash=Math.max(g.flash,1);
  } else {
    g.orbs.push({x:f.x,y:f.y,xp:f.xp,t:0,boss:false});
  }
  // 시체 — 쓰러지는 동작을 재생하고 바닥에 잠시 남는다.
  // 죽은 게 그냥 사라지면 "갈아버렸다"는 감각이 남지 않는다.
  g.bodies.push({kind:f.kind, x:f.x, y:f.y, face:f.face, boss:f.boss, t:0,
                 fall:f.boss?.55:.4, life:f.boss?5:3.5});
  if(g.bodies.length>48) g.bodies.splice(0, g.bodies.length-48);
  const bits=[];
  const bn=f.boss?18:8;
  // 타격이 온 방향(플레이어 → 적)으로 치우쳐 흩어진다. 방향이 읽히면 충격이 커진다.
  const away=Math.atan2(f.y-g.P.y, f.x-g.P.x);
  for(let k=0;k<bn;k++){
    bits.push({a:away+(Math.random()-.5)*2.4, d:(f.boss?70:34)*(.55+Math.random()*.95),
               sp:Math.random()*10-5, w:3+Math.random()*4, h:2+Math.random()*4,
               c:Math.random()<.3?"#6f9fd8":(Math.random()<.5?"#dfe6f2":"#f2f5fa")});
  }
  g.fx.push({type:"burst",x:f.x,y:f.y,t:0,boss:f.boss,r:f.r,bits});
  // 히트스톱 3~5프레임이 정석 — 그 사이 뇌가 타격을 등록한다
  g.hitstop=Math.max(g.hitstop, f.boss?.16:.05);
  kick(g, f.x-g.P.x, f.y-g.P.y, f.boss?9:2.2);
  // 콤보 — 연속 처치가 쌓이는 게 눈에 보여야 계속 몰아치게 된다
  dropFrom(g,f);
  g.combo++; g.comboT=1.6; g.comboPop=1;
  if(g.combo>g.comboBest) g.comboBest=g.combo;
  if(g.combo%10===0){ g.flash=Math.max(g.flash,.5); S("coin"); }
  S("kill",!!f.boss,g.combo);
}

/* ── 갱신 ────────────────────────────────────────────────────── */
function step(g,dt){
  const P=g.P;
  g.t+=dt;
  if(g.t>=DAY){ finish(g,"win"); return; }
  if(g.toastT>0){ g.toastT-=dt; if(g.toastT<=0) g.toast=""; }
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*34);
  g.shakeX*=Math.max(0,1-dt*11); g.shakeY*=Math.max(0,1-dt*11);
  if(g.comboT>0){ g.comboT-=dt; if(g.comboT<=0) g.combo=0; }
  if(g.comboPop>0) g.comboPop=Math.max(0,g.comboPop-dt*4.5);
  if(g.flash>0) g.flash=Math.max(0,g.flash-dt*2.2);

  // 이동
  let ix=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);
  let iy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
  const m=Math.hypot(ix,iy)||1; ix/=m; iy/=m;
  if(TOUCH.on){ ix=TOUCH.dx; iy=TOUCH.dy; }      // 터치가 있으면 터치 우선
  P.x+=ix*P.spd*dt; P.y+=iy*P.spd*dt;
  if(ix) P.face=ix<0?-1:1;
  P.moving = !!(ix||iy);
  if(P.moving) P.walk += dt*7.5;
  if(P.inv>0) P.inv-=dt;
  if(P.hurt>0) P.hurt-=dt;
  if(P.atk>0) P.atk-=dt;

  doSpawns(g,dt);
  fireWeapons(g,dt);

  // 퇴근 시계(지속형 감속)
  const CK = g.weapons.ontime ? WEAPONS.ontime.lv(1)
           : g.weapons.clock ? WEAPONS.clock.lv(g.weapons.clock) : null;
  const ckR=CK?CK.r*P.range:0;

  // 적
  for(let i=g.foes.length-1;i>=0;i--){
    const f=g.foes[i];
    if(f.hp<=0){ killFoe(g,f,i); continue; }
    if(f.hit>0) f.hit-=dt;
    const dx=P.x-f.x, dy=P.y-f.y, d=Math.hypot(dx,dy)||1;
    f.slow = (CK && d<ckR) ? CK.slow : 1;
    f.face = dx<0 ? -1 : 1;
    if(E[f.kind].eatXp){                     // 인사팀 — 경험치를 가로챈다
      for(let k=g.orbs.length-1;k>=0;k--){
        const o=g.orbs[k];
        if(Math.hypot(o.x-f.x,o.y-f.y) < f.r+9){
          g.orbs.splice(k,1); f.hp+=14;
          g.fx.push({type:"spark",x:o.x,y:o.y,t:0});
        }
      }
    }
    if(f.boss) bossStep(g,f,dt);
    if(f.dash>0){                          // 돌진 중 — 조준은 이미 끝났다
      f.dash-=dt; f.x+=f.dvx*dt; f.y+=f.dvy*dt;
      if(d < f.r+P.r && P.inv<=0){
        P.hp-=f.dmg; P.inv=.62; P.hurt=.30;
        kick(g,P.x-f.x,P.y-f.y,11); S("chew");
        if(P.hp<=0 && !revive(g)){ finish(g,"lose"); return; }
      }
      continue;
    }
    if(f.wind>0){                          // 예비동작 — 멈춰서 힘을 모은다
      f.wind-=dt; if(f.wind<=0 && f.pending) bossFire(g,f);
      continue;
    }
    if(f.kb>0){ f.kb-=dt; f.x+=f.kbx*dt*9; f.y+=f.kby*dt*9; }
    else { f.x+=dx/d*f.spd*f.slow*dt; f.y+=dy/d*f.spd*f.slow*dt;
           f.walk += dt*f.spd*f.slow/44; }
    // 접촉
    if(d < f.r+P.r && P.inv<=0){
      P.hp-=f.dmg; P.inv=.62; P.hurt=.30;
      kick(g, P.x-f.x, P.y-f.y, 7); S("chew");
      if(P.hp<=0 && !revive(g)){ finish(g,"lose"); return; }
    }
  }
  // 적끼리 겹침 완화 — 뭉쳐서 한 덩어리로 보이는 걸 막는다
  for(let a=0;a<g.foes.length;a++){
    const f=g.foes[a];
    for(let b=a+1;b<Math.min(g.foes.length,a+9);b++){
      const o=g.foes[b], dx=o.x-f.x, dy=o.y-f.y, dd=dx*dx+dy*dy, mr=f.r+o.r;
      if(dd>0.01 && dd<mr*mr){ const d=Math.sqrt(dd), push=(mr-d)*.34/d;
        f.x-=dx*push; f.y-=dy*push; o.x+=dx*push; o.y+=dy*push; }
    }
  }

  // 탄
  for(let i=g.shots.length-1;i>=0;i--){
    const s=g.shots[i];
    s.life-=dt; if(s.life<=0){ g.shots.splice(i,1); continue; }
    if(s.kind==="mail"){
      const tgt=nearest(g,s.x,s.y,420);
      if(tgt){ const want=Math.atan2(tgt.y-s.y,tgt.x-s.x);
        const cur=Math.atan2(s.vy,s.vx), sp=Math.hypot(s.vx,s.vy);
        let dA=((want-cur+Math.PI*3)%(Math.PI*2))-Math.PI;
        const na=cur+clamp(dA,-s.turn*dt,s.turn*dt);
        s.vx=Math.cos(na)*sp; s.vy=Math.sin(na)*sp; }
    }
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    for(const f of g.foes){
      const dx=f.x-s.x, dy=f.y-s.y;
      if(dx*dx+dy*dy < (f.r+s.r)*(f.r+s.r)){
        if(s.pierce){                        // 근태기록·전사 공지 — 막히지 않는다
          if(s.hitSet.has(f)) continue;
          s.hitSet.add(f);
          damage(g,f,s.dmg,s.x,s.y,4); S("hit");
          g.fx.push({type:"spark",x:s.x,y:s.y,t:0});
          continue;
        }
        damage(g,f,s.dmg,s.x,s.y,8); S("hit");
        g.fx.push({type:"spark",x:s.x,y:s.y,t:0});
        g.shots.splice(i,1); break;
      }
    }
  }
  // 커피 장판
  for(let i=g.pools.length-1;i>=0;i--){
    const p=g.pools[i]; p.life-=dt; p.t+=dt;
    if(p.life<=0){ g.pools.splice(i,1); continue; }
    for(const f of g.foes){
      const dx=f.x-p.x, dy=f.y-p.y;
      if(dx*dx+dy*dy < p.r*p.r) damage(g,f,p.dps*dt,0,0,0);
    }
  }
  // 경험치 구슬 — 자석 범위는 무기 사거리보다 넓어야 한다.
  // 그렇지 않으면 멀리서 죽인 경험치가 영영 바닥에 남는다.
  const mag=140*P.magnet;
  if(g.orbs.length>70){                 // 구슬이 너무 많으면 합친다
    const keep=g.orbs.slice(0,40);
    let rest=0; for(let i=40;i<g.orbs.length;i++) rest+=g.orbs[i].xp;
    if(rest>0) keep.push({x:P.x+(Math.random()-.5)*90, y:P.y+(Math.random()-.5)*90,
                          xp:rest, t:0, boss:true});
    g.orbs=keep;
  }
  for(let i=g.orbs.length-1;i>=0;i--){
    const o=g.orbs[i]; o.t+=dt;
    const dx=P.x-o.x, dy=P.y-o.y, d=Math.hypot(dx,dy)||1;
    const pull = d<mag ? Math.min(620,150+(mag-d)*6.5)
                       : 26;                       // 범위 밖에서도 천천히 따라온다
    o.x+=dx/d*pull*dt; o.y+=dy/d*pull*dt;
    if(d<P.r+10){ g.orbs.splice(i,1); gainXp(g,o.xp); }
  }
  // 야근 / 카페인 — 내 주변 지속 피해
  if(g.weapons.overtime){
    const L=WEAPONS.overtime.lv(g.weapons.overtime), R=L.r*P.range;
    for(const f of g.foes){
      if(Math.hypot(f.x-P.x,f.y-P.y)<R) damage(g,f,L.dps*dt,0,0,0);
    }
  }
  // 회의 소집 — 한 점으로 끌어당기고 그 안을 깎는다
  for(let i=g.vortex.length-1;i>=0;i--){
    const v=g.vortex[i]; v.life-=dt; v.t+=dt;
    if(v.life<=0){ g.vortex.splice(i,1); continue; }
    for(const f of g.foes){
      if(f.boss) continue;                   // 보스는 끌려오지 않는다
      const dx=v.x-f.x, dy=v.y-f.y, d=Math.hypot(dx,dy)||1;
      if(d>v.r*1.6) continue;
      f.x+=dx/d*v.pull*dt; f.y+=dy/d*v.pull*dt;
      if(d<v.r) damage(g,f,v.dps*dt,0,0,0);
    }
  }
  // 법인카드 — 날아갔다 돌아온다
  for(let i=g.cards.length-1;i>=0;i--){
    const c=g.cards[i]; c.t+=dt;
    const T=1.05;
    if(c.t>=T){ g.cards.splice(i,1); continue; }
    const k=Math.sin(c.t/T*Math.PI);          // 0→1→0, 갔다가 돌아온다
    c.px=P.x+Math.cos(c.a)*c.reach*k;
    c.py=P.y+Math.sin(c.a)*c.reach*k;
    for(const f of g.foes){
      if(c.hitSet.has(f)) continue;
      if(Math.hypot(f.x-c.px,f.y-c.py) < f.r+11){
        c.hitSet.add(f); damage(g,f,c.dmg,c.px,c.py,7); S("hit");
        setTimeout(()=>c.hitSet.delete(f), 260);   // 돌아올 때 한 번 더
      }
    }
  }
  // 보스 충격파 — 퍼지는 링에 닿으면 맞는다
  for(let i=g.shocks.length-1;i>=0;i--){
    const w=g.shocks[i]; w.t+=dt;
    w.r += (w.max-26)/0.55*dt;
    if(w.r>=w.max){ g.shocks.splice(i,1); continue; }
    if(!w.done && P.inv<=0){
      const dd=Math.hypot(P.x-w.x,P.y-w.y);
      if(Math.abs(dd-w.r) < P.r+14){
        w.done=true;
        P.hp-=w.dmg; P.inv=.62; P.hurt=.30;
        kick(g,P.x-w.x,P.y-w.y,12); S("chew");
        if(P.hp<=0 && !revive(g)){ finish(g,"lose"); return; }
      }
    }
  }
  // 드롭 아이템
  for(let i=g.drops.length-1;i>=0;i--){
    const d=g.drops[i]; d.t+=dt;
    const dx=P.x-d.x, dy=P.y-d.y, dd=Math.hypot(dx,dy)||1;
    if(dd<mag*0.8){ const pull=Math.min(500,140+(mag-dd)*5);
      d.x+=dx/dd*pull*dt; d.y+=dy/dd*pull*dt; }
    if(dd<P.r+14){ g.drops.splice(i,1); takeDrop(g,d); }
  }
  // 시체 — 쓰러지는 동작이 끝나면 서서히 사라진다
  for(let i=g.bodies.length-1;i>=0;i--){
    const bd=g.bodies[i]; bd.t+=dt;
    if(bd.t>bd.life) g.bodies.splice(i,1);
  }
  // 이펙트
  for(let i=g.fx.length-1;i>=0;i--){ g.fx[i].t+=dt; if(g.fx[i].t>.55) g.fx.splice(i,1); }
  for(let i=g.floats.length-1;i>=0;i--){ g.floats[i].t+=dt; if(g.floats[i].t>.45) g.floats.splice(i,1); }
}

function gainXp(g,n){
  g.xp += n*g.P.xpMul; S("coin");
  if(g.xp>=g.next && !g.paused){    // 오버레이는 한 번에 하나만
    g.xp-=g.next; g.lv++;
    g.next=Math.round(g.next*1.34+3);
    levelUp(g);
  }
}
/* 비상금 — 한 번은 다시 일어난다 */
function revive(g){
  if(g.revives<=0) return false;
  g.revives--;
  g.P.hp=g.P.maxhp; g.P.inv=2.2;
  for(const f of g.foes) damage(g,f,400,g.P.x,g.P.y,26);
  g.fx.push({type:"quit",t:0});
  g.fx.push({type:"ring",x:g.P.x,y:g.P.y,t:0,r0:20,r1:340,c:"#57d98a"});
  kick(g,0,-1,16); g.hitstop=Math.max(g.hitstop,.2); g.flash=Math.max(g.flash,1);
  S("nuke"); flash(g,"비상금 — 다시 일어납니다");
  return true;
}
function flash(g,msg){ g.toast=msg; g.toastT=2.6; }
function finish(g,how){
  if(g.over) return;
  g.over=how; if(raf) cancelAnimationFrame(raf); raf=null;
  S(how==="win"?"win":"lose");
  renderEnd(g);
}

/* ── 그리기 ──────────────────────────────────────────────────── */
function drawFloor(g,camX,camY,VW,VH){
  const B=window.BACKDROP;
  if(B && B.office){ try{ B.office(ctx,VW,VH,camX,camY,g.t); return; }catch(e){} }
  // 폴백 — 배경 모듈이 없어도 게임은 돈다
  ctx.fillStyle="#0b0e14"; ctx.fillRect(0,0,VW,VH);
  const T=96, ox=-((camX%T)+T)%T, oy=-((camY%T)+T)%T;
  ctx.strokeStyle="rgba(158,200,255,.055)"; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=ox;x<VW+T;x+=T){ ctx.moveTo(x|0,0); ctx.lineTo(x|0,VH); }
  for(let y=oy;y<VH+T;y+=T){ ctx.moveTo(0,y|0); ctx.lineTo(VW,y|0); }
  ctx.stroke();
}

/* 적의 현재 동작을 고른다 — 맞는 중이면 피격, 아니면 걷기 */
/* ══════════════ 스프라이트 캐시 ══════════════
   캐릭터는 Canvas2D 패스 수십 개로 그린다. 적이 수백 명이면 프레임마다
   수천 번의 패스 연산이 된다(측정: 200명 25 FPS, 450명 13 FPS).
   동작을 프레임 단위로 미리 구워두고 drawImage로 찍는다. */
const FRAMES={ walk:8, hit:4, die:8, attack:4, idle:1 };
const BAKE=2;
const _cache=new Map();
function baked(kind,size,action,fi){
  const key=kind+"|"+size+"|"+action+"|"+fi;
  if(_cache.has(key)) return _cache.get(key);
  const R=window.SPRITES_RANK, SP=window.SPRITES;
  const fn=(R&&R[kind])||(SP&&SP.foes&&SP.foes[kind]);
  if(!fn){ _cache.set(key,null); return null; }
  const pad=Math.ceil(size*0.62);
  const c=document.createElement("canvas");
  c.width=c.height=Math.ceil(pad*2*BAKE);
  const x=c.getContext("2d");
  x.scale(BAKE,BAKE);
  const n=FRAMES[action]||1;
  try{ fn(x,pad,pad,size,{a:action,p:n>1?fi/n:0,t:0}); }
  catch(e){ _cache.set(key,null); return null; }
  c._pad=pad;
  _cache.set(key,c);
  return c;
}
function blit(g2,kind,size,action,p,x,y){
  const n=FRAMES[action]||1;
  const fi=n>1 ? clamp(Math.floor(p*n),0,n-1) : 0;
  const c=baked(kind,size,action,fi);
  if(!c) return false;
  g2.drawImage(c, x-c._pad, y-c._pad, c._pad*2, c._pad*2);
  return true;
}

function poseOf(f,g){
  if(f.hit>0) return {a:"hit", p:clamp(1-f.hit/.15,0,1), t:g.t};
  return {a:"walk", p:(f.walk||0)%1, t:g.t};
}
function drawFoe(g,f,sx,sy){
  const SP=window.SPRITES, R=window.SPRITES_RANK;
  const fn=(R&&R[f.kind])||(SP&&SP.foes&&SP.foes[f.kind]);
  const size=f.boss?76:52;
  // 바닥 그림자 — 이게 없으면 캐릭터가 공중에 떠 보인다
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.42)";
  ctx.beginPath(); ctx.ellipse(sx,sy+f.r*0.82,f.r*0.92,f.r*0.34,0,0,7); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(sx,sy);
  // 스프라이트는 왼쪽을 본다. 오른쪽으로 갈 때만 뒤집는다.
  if(f.face>0) ctx.scale(-1,1);
  const ps=poseOf(f,g);
  if(!blit(ctx,f.kind,size,ps.a,ps.p,0,0) && fn) fn(ctx,0,0,size,ps);
  ctx.restore();
  if(f.hit>0){                           // 얇은 링만 — 흰 덩어리로 얼굴을 지우지 않는다
    const a=clamp(f.hit/.12,0,1);
    ctx.save();
    ctx.strokeStyle="rgba(255,255,255,"+(a*.75)+")"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(sx,sy,f.r*0.9+(1-a)*10,0,7); ctx.stroke();
    ctx.restore();
  }
  // 체력바 — 보스와 다친 적만
  if(f.wind>0){                          // 예비동작 — 무엇이 올지 보여준다
    const w0=f.pending==="shock"?0.45:0.55;
    const a=clamp(1-f.wind/w0,0,1);
    ctx.save();
    ctx.strokeStyle="rgba(245,196,81,.85)"; ctx.lineWidth=3;
    ctx.setLineDash([6,5]); ctx.lineDashOffset=-g.t*40;
    if(f.pending==="shock"){
      ctx.beginPath(); ctx.arc(sx,sy,30+a*200,0,7); ctx.stroke();
    } else {
      const dx=g.P.x-f.x, dy=g.P.y-f.y, dd=Math.hypot(dx,dy)||1;
      ctx.beginPath(); ctx.moveTo(sx,sy);
      ctx.lineTo(sx+dx/dd*260*a, sy+dy/dd*260*a); ctx.stroke();
    }
    ctx.restore();
    ctx.save(); ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=a*.5; ctx.fillStyle="#f5c451";
    ctx.beginPath(); ctx.arc(sx,sy,f.r+8,0,7); ctx.fill(); ctx.restore();
  }
  if(f.rage){                            // 격노 — 붉은 아지랑이
    ctx.save(); ctx.globalAlpha=.22+Math.sin(g.t*9)*.08;
    ctx.fillStyle="#ff6b6b";
    ctx.beginPath(); ctx.arc(sx,sy,f.r+11,0,7); ctx.fill(); ctx.restore();
  }
  if(f.boss || f.hp<f.maxhp){
    const w=f.boss?70:30, rt=clamp(f.hp/f.maxhp,0,1);
    ctx.fillStyle="rgba(11,14,20,.85)"; ctx.fillRect(sx-w/2,sy+f.r+6,w,4);
    ctx.fillStyle=f.boss?"#ff6b6b":"#c3cbe0"; ctx.fillRect(sx-w/2,sy+f.r+6,w*rt,4);
  }
}

function drawPlayer(g,sx,sy){
  const P=g.P;
  // 바닥 그림자 — 회전/반전 밖에서 그린다
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.beginPath(); ctx.ellipse(sx,sy+19,14,5,0,0,7); ctx.fill();
  ctx.restore();
  const R=window.SPRITES_RANK;
  if(R && R.hero){
    // 동작 선택: 공격 > 피격 > 걷기 > 대기
    let a="idle", pr=0;
    if(P.atk>0){ a="attack"; pr=clamp(1-P.atk/.25,0,1); }
    else if(P.hurt>0){ a="hit"; pr=clamp(1-P.hurt/.3,0,1); }
    else if(P.moving){ a="walk"; pr=(P.walk/6.283)%1; }
    ctx.save(); ctx.translate(sx,sy);
    if(P.face>0) ctx.scale(-1,1);
    if(!blit(ctx,"hero",56,a,pr,0,0)) R.hero(ctx,0,0,56,{a:a,p:pr,t:g.t});
    ctx.restore();
    if(P.hurt>0){                       // 피격 플래시
      ctx.save(); ctx.globalCompositeOperation="lighter";
      ctx.globalAlpha=clamp(P.hurt/.3,0,1)*.6; ctx.fillStyle="#ff6b6b";
      ctx.beginPath(); ctx.arc(sx,sy,P.r+9,0,7); ctx.fill(); ctx.restore();
    }
    if(P.inv>0 && ((g.t*18)|0)%2===0){
      ctx.save(); ctx.globalAlpha=.28; ctx.fillStyle="#ff6b6b";
      ctx.beginPath(); ctx.arc(sx,sy,P.r+8,0,7); ctx.fill(); ctx.restore();
    }
    return;
  }
  ctx.save(); ctx.translate(sx,sy);
  ctx.translate(0,Math.sin(P.walk)*2.0);
  if(P.face>0) ctx.scale(-1,1);
  const hurt=P.hurt>0;
  // 다리
  const sw=Math.sin(P.walk)*4;
  ctx.fillStyle="#2f3542";
  ctx.fillRect(-7, 6, 5, 12+sw); ctx.fillRect( 2, 6, 5, 12-sw);
  // 몸통 (셔츠)
  ctx.fillStyle=hurt?"#ff9f9f":"#dfe6f2";
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(-10,-8,20,16,4):ctx.rect(-10,-8,20,16); ctx.fill();
  // 넥타이
  ctx.fillStyle="#6f9fd8";
  ctx.beginPath(); ctx.moveTo(-2,-8); ctx.lineTo(2,-8); ctx.lineTo(1.5,4); ctx.lineTo(-1.5,4); ctx.closePath(); ctx.fill();
  // 머리
  ctx.fillStyle=hurt?"#ffd0d0":"#e8d3bd";
  ctx.beginPath(); ctx.arc(0,-15,8,0,7); ctx.fill();
  ctx.fillStyle="#2f3542";                       // 머리카락
  ctx.beginPath(); ctx.arc(0,-17,8,Math.PI,0); ctx.fill();
  ctx.fillStyle="#2f3542";                       // 눈 (왼쪽 보는 얼굴)
  ctx.fillRect(-5,-16,2,2); ctx.fillRect(-1,-16,2,2);
  ctx.restore();
  // 무적 깜빡임
  if(P.inv>0 && ((g.t*18)|0)%2===0){
    ctx.save(); ctx.globalAlpha=.35; ctx.fillStyle="#ff6b6b";
    ctx.beginPath(); ctx.arc(sx,sy,P.r+8,0,7); ctx.fill(); ctx.restore();
  }
}

function draw(g){
  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,0,0);
  try{ drawWorld(g); } finally { ctx.setTransform(DPR,0,0,DPR,0,0); }
  drawBossBar(g);
  drawCombo(g);
  drawStick();
}
/* 콤보 — 10단위마다 화면이 번쩍인다 */
/* 상단 보스 체력바 — 얼마나 남았는지 모르면 보스전이 아니다 */
function drawBossBar(g){
  const bs=g.foes.filter(f=>f.boss);
  if(!bs.length) return;
  const b=bs.reduce((a,c)=>c.hp>a.hp?c:a,bs[0]);
  const w=Math.min(560,VW-80), x=(VW-w)/2, y=64;
  const rt=clamp(b.hp/b.maxhp,0,1);
  ctx.save();
  ctx.fillStyle="rgba(11,14,20,.82)"; ctx.fillRect(x-2,y-2,w+4,16);
  ctx.strokeStyle=b.rage?"#ff6b6b":"#5a2b2f"; ctx.lineWidth=1;
  ctx.strokeRect(x-2.5,y-2.5,w+5,17);
  ctx.fillStyle="#241016"; ctx.fillRect(x,y,w,12);
  const gr=ctx.createLinearGradient(x,0,x+w,0);
  gr.addColorStop(0,b.rage?"#b93b3b":"#6f9fd8");
  gr.addColorStop(1,b.rage?"#ff6b6b":"#9ec8ff");
  ctx.fillStyle=gr; ctx.fillRect(x,y,w*rt,12);
  ctx.font="800 12px 'Gothic A1','Malgun Gothic',sans-serif";
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=b.rage?"#ff6b6b":"#9ec8ff";
  ctx.fillText(E[b.kind].name + (b.rage?" · 격노":"") + (bs.length>1?"  ×"+bs.length:""), x, y-6);
  ctx.textAlign="right";
  ctx.fillStyle="#7d8699";
  ctx.fillText(Math.ceil(b.hp)+" / "+b.maxhp, x+w, y-6);
  ctx.restore();
}
function drawCombo(g){
  if(g.flash>0){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="rgba(245,196,81,"+(g.flash*.13)+")";
    ctx.fillRect(0,0,VW,VH); ctx.restore();
  }
  if(g.combo<3) return;
  const a=clamp(g.comboT/1.6,0,1);
  const pop=1+g.comboPop*0.30;
  const tier=g.combo>=40?"#ff6b6b":g.combo>=20?"#f5c451":"#9ec8ff";
  ctx.save();
  ctx.translate(VW*0.5, VH*0.30);
  ctx.scale(pop,pop);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font="400 "+(38+Math.min(26,g.combo*0.5))+"px 'Black Han Sans','Malgun Gothic',sans-serif";
  ctx.fillStyle="rgba(11,14,20,"+(a*.8)+")";
  ctx.fillText(g.combo,2,3);
  ctx.globalAlpha=a; ctx.fillStyle=tier;
  ctx.fillText(g.combo,0,0);
  ctx.font="800 14px 'Gothic A1','Malgun Gothic',sans-serif";
  ctx.fillStyle="rgba(232,236,244,"+(a*.75)+")";
  ctx.fillText("연속 처리",0,34);
  ctx.restore();
}
function drawWorld(g){
  const P=g.P;
  const VWz=VW/ZOOM, VHz=VH/ZOOM;
  let camX=P.x-VWz/2, camY=P.y-VHz/2;
  camX+=g.shakeX; camY+=g.shakeY;
  if(g.shake>0){ camX+=(Math.random()-.5)*g.shake*.7; camY+=(Math.random()-.5)*g.shake*.7; }
  const X=v=>v-camX, Y=v=>v-camY;

  drawFloor(g,camX,camY,VWz,VHz);

  // 커피 장판
  for(const p of g.pools){
    const a=clamp(p.life/1.2,0,1)*.5;
    const gr=ctx.createRadialGradient(X(p.x),Y(p.y),4,X(p.x),Y(p.y),p.r);
    gr.addColorStop(0,"rgba(245,196,81,"+(a*.7)+")");
    gr.addColorStop(1,"rgba(217,169,78,0)");
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(X(p.x),Y(p.y),p.r,0,7); ctx.fill();
  }
  // 퇴근 시계 범위
  if(g.weapons.clock){
    const L=WEAPONS.clock.lv(g.weapons.clock), r=L.r*P.range;
    ctx.save(); ctx.globalAlpha=.16; ctx.strokeStyle="#9ec8ff"; ctx.lineWidth=2;
    ctx.setLineDash([6,6]); ctx.lineDashOffset=-g.t*20;
    ctx.beginPath(); ctx.arc(X(P.x),Y(P.y),r,0,7); ctx.stroke(); ctx.restore();
  }
  // 드롭 아이템 — 눈에 확 띄어야 주우러 간다
  for(const d of g.drops){
    const C=DROPS[d.kind], sx=X(d.x), sy=Y(d.y);
    const bob=Math.sin(g.t*4+d.x*.05)*3;
    ctx.save(); ctx.globalAlpha=.22; ctx.fillStyle=C.color;
    ctx.beginPath(); ctx.arc(sx,sy+bob,17+Math.sin(g.t*5)*3,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.ellipse(sx,sy+13,9,3,0,0,7); ctx.fill();
    ctx.save(); ctx.translate(sx,sy+bob);
    ctx.fillStyle="#0b0e14"; ctx.strokeStyle=C.color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(0,0,10,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle=C.color;
    if(d.kind==="heal"){ ctx.fillRect(-5,-1.6,10,3.2); ctx.fillRect(-1.6,-5,3.2,10); }
    else if(d.kind==="magnet"){ ctx.beginPath(); ctx.arc(0,0,4.5,0,7); ctx.fill(); }
    else { ctx.fillRect(-4,-5,8,10); ctx.fillStyle="#0b0e14";
           ctx.fillRect(-2.5,-3,5,1.4); ctx.fillRect(-2.5,-.5,5,1.4); ctx.fillRect(-2.5,2,3,1.4); }
    ctx.restore();
  }

  // 경험치 구슬
  for(const o of g.orbs){
    const s=o.boss?5:3, pul=1+Math.sin(g.t*8+o.x)*0.18;
    ctx.fillStyle=o.boss?"#57d98a":"#f5c451";
    ctx.beginPath(); ctx.arc(X(o.x),Y(o.y),s*pul,0,7); ctx.fill();
    if(o.boss){ ctx.save(); ctx.globalAlpha=.22;
      ctx.beginPath(); ctx.arc(X(o.x),Y(o.y),s*2.6*pul,0,7); ctx.fill(); ctx.restore(); }
  }
  // 시체 — 바닥에 쌓인다. 갈아버린 게 사라지면 갈아버린 감각이 안 남는다.
  for(const bd of g.bodies){
    const sx=X(bd.x), sy=Y(bd.y);
    if(sx<-90||sx>VWz+90||sy<-90||sy>VHz+90) continue;
    const pr=clamp(bd.t/bd.fall,0,1);
    const fade=clamp((bd.life-bd.t)/1.2,0,1);
    ctx.save();
    ctx.globalAlpha=fade*0.85;
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.beginPath();
    ctx.ellipse(sx,sy+(bd.boss?24:16),(bd.boss?26:19)*(.6+pr*.7),(bd.boss?7:5),0,0,7);
    ctx.fill();
    ctx.translate(sx,sy);
    if(bd.face>0) ctx.scale(-1,1);
    const sz=bd.boss?76:52;
    if(!blit(ctx,bd.kind,sz,"die",pr,0,0)){
      ctx.rotate(pr*1.35); ctx.globalAlpha*=0.75;
      blit(ctx,bd.kind,sz,"idle",0,0,0);
    }
    ctx.restore();
  }

  // 적 (아래쪽이 앞)
  const sorted=g.foes.slice().sort((a,b)=>a.y-b.y);
  for(const f of sorted){
    const sx=X(f.x), sy=Y(f.y);
    if(sx<-90||sx>VWz+90||sy<-90||sy>VHz+90) continue;
    drawFoe(g,f,sx,sy);
  }
  drawPlayer(g,X(P.x),Y(P.y));

  // 탄
  for(const s of g.shots){
    ctx.save(); ctx.translate(X(s.x),Y(s.y));
    ctx.rotate(Math.atan2(s.vy,s.vx));
    if(s.kind==="pierce"){ ctx.fillStyle="#9ec8ff"; ctx.fillRect(-12,-2.5,24,5);
      ctx.fillStyle="#cfe4ff"; ctx.fillRect(6,-2.5,6,5); }
    else if(s.kind==="paper"){ ctx.fillStyle="#f2f5fa"; ctx.fillRect(-6,-4,12,8);
      ctx.fillStyle="#c3ccdb"; ctx.fillRect(-6,-4,12,2); }
    else { ctx.fillStyle="#dfe6f2"; ctx.fillRect(-7,-5,14,10);
      ctx.strokeStyle="#7d8699"; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(-7,-5); ctx.lineTo(0,1); ctx.lineTo(7,-5); ctx.stroke(); }
    ctx.restore();
  }
  // 이펙트
  for(const e of g.fx){
    const a=1-e.t/.55;
    const busy=g.fx.length>14;
    if(busy && (e.type==="spark"||e.type==="stamp")) continue;
    if(e.type==="spark"){ ctx.fillStyle="rgba(255,255,255,"+a+")";
      ctx.beginPath(); ctx.arc(X(e.x),Y(e.y),3+(1-a)*7,0,7); ctx.fill(); }
    else if(e.type==="stamp"){
      ctx.save(); ctx.translate(X(e.x),Y(e.y)); ctx.rotate(-.2);
      ctx.globalAlpha=a*.85; ctx.strokeStyle="#ff6b6b"; ctx.lineWidth=2.2;
      const r=6+(1-a)*13; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke();
      ctx.restore(); }
    else if(e.type==="burst"){
      // 처치 — 서류가 흩날린다. 개체마다 방향·거리·회전이 다르다.
      const p=1-a;                       // 진행도
      for(const b of (e.bits||[])){
        const dist=b.d*(1-(1-p)*(1-p));  // 처음에 빠르게 튀고 감속
        ctx.save();
        ctx.translate(X(e.x)+Math.cos(b.a)*dist,
                      Y(e.y)+Math.sin(b.a)*dist + p*p*14);   // 살짝 떨어진다
        ctx.rotate(b.a+e.t*b.sp); ctx.globalAlpha=a;
        ctx.fillStyle=b.c;
        ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
        ctx.restore();
      }
      if(!busy){                       // 링이 수십 개 겹치면 화면이 안 읽힌다
        ctx.globalAlpha=a*.38; ctx.strokeStyle="#ff6b6b"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(X(e.x),Y(e.y),(e.r||16)*(.7+(1-a)*1.2),0,7); ctx.stroke();
      }
      ctx.globalAlpha=1; }
    else if(e.type==="quit"){
      ctx.fillStyle="rgba(245,196,81,"+(a*.5)+")"; ctx.fillRect(0,0,VWz,VHz); }
  }
  // 데미지 숫자
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const t of g.floats){
    const a=1-t.t/.45;
    ctx.font=(t.big?"800 17px":"800 12px")+" 'Gothic A1','Malgun Gothic',sans-serif";
    ctx.fillStyle="rgba(11,14,20,"+a+")";
    ctx.fillText(t.v,X(t.x)+1,Y(t.y)-t.t*34+1);
    ctx.fillStyle=t.big?"rgba(245,196,81,"+a+")":"rgba(255,255,255,"+a+")";
    ctx.fillText(t.v,X(t.x),Y(t.y)-t.t*34);
  }
  // 화면 밖 보스 표시
  for(const f of g.foes){ if(!f.boss) continue;
    const sx=X(f.x), sy=Y(f.y);
    if(sx>=0&&sx<=VWz&&sy>=0&&sy<=VHz) continue;
    const cx=VWz/2, cy=VHz/2, ang=Math.atan2(sy-cy,sx-cx);
    const px=cx+Math.cos(ang)*(Math.min(VWz,VHz)/2-26), py=cy+Math.sin(ang)*(Math.min(VWz,VHz)/2-26);
    ctx.save(); ctx.translate(px,py); ctx.rotate(ang);
    ctx.fillStyle="#ff6b6b"; ctx.beginPath();
    ctx.moveTo(12,0); ctx.lineTo(-8,-7); ctx.lineTo(-8,7); ctx.closePath(); ctx.fill();
    ctx.restore(); }
}

/* ── 아이콘 (무기/강화 카드용) ────────────────────────────────── */
function icon(id,size){
  const c=document.createElement("canvas"); c.width=c.height=72;
  const x=c.getContext("2d"); const SP=window.SPRITES;
  const map={stamp:"quit",copy:"copy",mail:"stap",coffee:"water",clock:"wall",quit:"quit",
             shoes:"wall",laptop:"copy",card:"stap",leave:"quit",cup:"water",suit:"wall",
             meeting:"wall",overtime:"water",msg:"stap",attend:"copy",elev:"wall",
             jeongyeol:"quit",notice:"copy",replyall:"stap",caffeine:"water",
             ontime:"wall",resign:"quit"};
  const f=SP&&SP.units&&SP.units[map[id]];
  if(f) f(x,36,36,64);
  else { x.fillStyle="#6f9fd8"; x.fillRect(18,18,36,36); }
  c.style.width=c.style.height=size+"px";
  return c;
}

/* ── 레벨업 선택 ─────────────────────────────────────────────── */
function evoReady(g){
  const out=[];
  for(const base in EVO){
    const e=EVO[base];
    if(!g.weapons[base] || g.weapons[base]<WEAPONS[base].max) continue;
    if((g.perks[e.perk]|0) < PERKS[e.perk].max) continue;
    if(g.weapons[e.to]) continue;
    out.push({kind:"e", id:e.to, base:base, lv:0});
  }
  return out;
}
function offers(g){
  const ev=evoReady(g);
  if(ev.length) return [ev[0]];            // 진화가 가능하면 그것만 보여준다
  const out=[];
  for(const id in WEAPONS){ const lv=g.weapons[id]||0;
    if(lv>=WEAPONS[id].max) continue;
    if(!lv && Object.keys(g.weapons).length>=5) continue;      // 무기는 최대 5종
    out.push({kind:"w",id,lv}); }
  for(const id in PERKS){ const lv=g.perks[id]||0;
    if(lv>=PERKS[id].max) continue;
    out.push({kind:"p",id,lv}); }
  // 셋 뽑기 — 이미 가진 걸 조금 더 자주 준다(빌드가 완성되게)
  const pool=[];
  for(const o of out){ pool.push(o); if(o.lv>0) pool.push(o); }
  const pick=[],seen=new Set();
  while(pick.length<3 && pool.length){
    const i=(Math.random()*pool.length)|0, o=pool[i];
    pool.splice(i,1);
    const key=o.kind+o.id; if(seen.has(key)) continue;
    seen.add(key); pick.push(o);
  }
  return pick;
}
/* 지금 들고 있는 무기 — 뭘 키울지 판단하려면 보여야 한다 */
function loadoutHTML(g,label){
  const ids=Object.keys(g.weapons);
  if(!ids.length) return "";
  const chips=ids.map(id=>{
    const W=WEAPONS[id], lv=g.weapons[id];
    return W.evo
      ? `<span class="wchip evo">${esc(W.name)}</span>`
      : `<span class="wchip">${esc(W.name)} <b class="num">${lv}</b></span>`;
  }).join("");
  const free=Math.max(0,5-ids.length);
  return `<div class="wrow">${label?'<span class="k">'+esc(label)+'</span>':""}${chips}`
    + (free?`<span class="wchip empty">빈 칸 ${free}</span>`:"") + `</div>`;
}

function levelUp(g){
  g.paused=true; S("levelup");
  const list=offers(g);
  if(!list.length){ g.paused=false; return; }
  const card=$("#card");
  const isEvo = list.length===1 && list[0].kind==="e";
  card.innerHTML='<div class="title" style="align-items:baseline;gap:10px">'
    +'<h1 class="ttl" style="font-size:30px">'+(isEvo?"진화":"레벨 "+g.lv)+'</h1>'
    +'<span style="font-size:13px;color:'+(isEvo?"var(--good)":"var(--dim)")+'">'
    +(isEvo?"조건이 맞았습니다":"하나를 고르세요")+'</span></div>'
    + (isEvo?"":loadoutHTML(g))
    +'<div class="picks" style="margin-top:16px"></div>';
  const box=card.querySelector(".picks");
  list.forEach(o=>{
    const D = o.kind==="p"?PERKS[o.id]:WEAPONS[o.id];
    const b=document.createElement("button");
    b.className = o.kind==="e" ? "pick evo" : "pick";
    b.appendChild(icon(o.kind==="e"?o.base:o.id,40));
    const txt=document.createElement("div");
    const lvl = o.kind==="e" ? ("진화 — "+WEAPONS[o.base].name+"을 대체합니다")
              : o.lv===0 ? "신규" : ("Lv "+o.lv+" → "+(o.lv+1));
    const desc = o.kind==="p" ? D.desc : (o.lv===0?D.desc:D.up(o.lv+1));
    txt.innerHTML='<span class="n">'+esc(D.name)+'</span>'
      +'<span class="lvl">'+lvl+'</span><span class="d">'+esc(desc)+'</span>';
    b.appendChild(txt);
    b.onclick=()=>{
        if(o.kind==="e"){
        delete g.weapons[o.base]; delete g.cds[o.base];
        g.weapons[o.id]=1;
        flash(g,WEAPONS[o.id].name+" — 진화");
        S("nuke"); g.flash=Math.max(g.flash,1); kick(g,0,-1,12);
      }
      else if(o.kind==="w") g.weapons[o.id]=(g.weapons[o.id]||0)+1;
      else { g.perks[o.id]=(g.perks[o.id]||0)+1; applyPerks(g); }
      S("place"); closeOverlay(); g.paused=false; syncSlots(g);
    };
    box.appendChild(b);
  });
  openOverlay();
}
function openOverlay(){ $("#ov").classList.add("on"); }
function closeOverlay(){ $("#ov").classList.remove("on"); }

/* ── HUD ─────────────────────────────────────────────────────── */
function syncSlots(g){
  const el=$("#slots"); el.innerHTML="";
  for(const id in g.weapons){
    const W=WEAPONS[id];
    const d=document.createElement("div");
    d.className = W.evo ? "slot evo" : "slot";      // 진화한 무기는 눈에 띄어야 한다
    d.appendChild(icon(W.evo && EVO_BASE[id] ? EVO_BASE[id] : id, 34));
    const b=document.createElement("b");
    b.textContent = W.evo ? "★" : g.weapons[id];
    d.appendChild(b);
    d.title=W.name+(W.evo?" (진화)":" Lv"+g.weapons[id]);
    el.appendChild(d);
  }
}
/* 보스가 오는 시각을 시간 막대에 눈금으로 — 언제 큰 게 오는지 보여야 한다 */
function markBossTicks(){
  const bar=$("#daybar"); if(!bar) return;
  bar.querySelectorAll("u").forEach(u=>u.remove());
  BOSSES.forEach(b=>{
    const p=((b.h-H0)/(H1-H0))*100;
    if(p<0||p>100) return;
    const u=document.createElement("u");
    u.style.left=p.toFixed(1)+"%";
    u.title=b.msg;
    bar.appendChild(u);
  });
}
function syncHud(g){
  const P=g.P;
  $("#clock").innerHTML=clockStr(g.t)+"<small>"+(hourOf(g.t)>=17?"곧 퇴근":"근무 중")+"</small>";
  $("#daybar i").style.width=(g.t/DAY*100).toFixed(1)+"%";
  $("#lv b").textContent=g.lv;
  $("#kills b").textContent=g.kills;
  $("#hpn").textContent=Math.max(0,Math.ceil(P.hp))+" / "+P.maxhp;
  $("#hpb i").style.width=clamp(P.hp/P.maxhp,0,1)*100+"%";
  $("#xpb i").style.width=clamp(g.xp/g.next,0,1)*100+"%";
  $("#toast").textContent=g.toast;
}

/* ══════════════ 메타 성장 ══════════════
   판이 끝나면 아무것도 안 남으면 세 판 하고 그만둔다.
   하루를 버틸 때마다 「경력」이 쌓이고, 경력으로 영구 능력을 산다. */
const SAVE_KEY="jeongsi.save.v1";
const CAREER={
  hp    :{name:"체력 관리", max:6, cost:l=>40+l*45,  desc:l=>"최대 체력 +"+(l*15),      f:(M,l)=>M.hp+=l*15},
  spd   :{name:"편한 신발", max:5, cost:l=>55+l*60,  desc:l=>"이동 속도 +"+(l*6)+"%",   f:(M,l)=>M.spd+=l*.06},
  haste :{name:"손이 빠름", max:5, cost:l=>70+l*75,  desc:l=>"공격 속도 +"+(l*5)+"%",   f:(M,l)=>M.haste+=l*.05},
  xp    :{name:"눈치",      max:5, cost:l=>50+l*55,  desc:l=>"경험치 획득 +"+(l*8)+"%", f:(M,l)=>M.xp+=l*.08},
  magnet:{name:"긴 팔",     max:4, cost:l=>45+l*50,  desc:l=>"수집 범위 +"+(l*15)+"%",  f:(M,l)=>M.magnet+=l*.15},
  start :{name:"짬",        max:3, cost:l=>120+l*160,desc:l=>"시작 레벨 +"+l,           f:(M,l)=>M.startLv+=l},
  stamp :{name:"요령",      max:3, cost:l=>110+l*150,desc:l=>"반려 도장 시작 Lv +"+l,   f:(M,l)=>M.stampLv+=l},
  revive:{name:"비상금",    max:1, cost:l=>600,      desc:l=>"쓰러져도 한 번 일어난다", f:(M,l)=>M.revive+=l},
};
function loadSave(){
  try{ const j=JSON.parse(localStorage.getItem(SAVE_KEY)||"{}");
       return {career:+j.career||0, lv:j.lv&&typeof j.lv==="object"?j.lv:{},
               best:+j.best||0, days:+j.days||0, cleared:!!j.cleared}; }
  catch(e){ return {career:0, lv:{}, best:0, days:0, cleared:false}; }
}
function writeSave(sv){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(sv)); }catch(e){} }
let SAVE=loadSave();
/* 저장된 등급을 실제 보너스로 */
function metaBonus(){
  const M={hp:0, spd:0, haste:0, xp:0, magnet:0, startLv:0, stampLv:0, revive:0};
  for(const k in CAREER){ const l=SAVE.lv[k]|0; if(l>0) CAREER[k].f(M,l); }
  return M;
}
/* 하루 결과 → 경력. 오래 버틸수록, 많이 처리할수록. */
function careerEarned(g){
  const hours=(g.t/DAY)*(H1-H0);
  return Math.round(hours*12 + g.kills*0.22 + (g.over==="win"?150:0));
}

/* ── 화면 ────────────────────────────────────────────────────── */
function renderStart(){
  const M=metaBonus();
  const bon=[
    M.hp?"체력 +"+M.hp:"", M.spd?"속도 +"+Math.round(M.spd*100)+"%":"",
    M.haste?"공속 +"+Math.round(M.haste*100)+"%":"", M.xp?"경험치 +"+Math.round(M.xp*100)+"%":"",
    M.magnet?"수집 +"+Math.round(M.magnet*100)+"%":"", M.startLv?"시작 Lv+"+M.startLv:"",
    M.stampLv?"도장 Lv+"+M.stampLv:"",
  ].filter(Boolean).map(t=>'<span class="chip">'+esc(t)+'</span>').join("")
    + (M.revive?'<span class="chip gold">비상금</span>':"");
  $("#card").innerHTML=`
    <div class="title">
      <h1 class="ttl">정시 퇴근</h1>
      <span class="when">09:00 — 18:00</span>
    </div>
    <div class="sub" style="margin:8px 0 0">
      오늘도 6시에 나간다. 사방에서 몰려오는 것들을 갈아버리면서.
    </div>
    <div class="crow">
      <div class="cstat"><b class="num" style="color:var(--accent)">${SAVE.career.toLocaleString()}</b><span>보유 경력</span></div>
      <div class="cstat"><b class="num">${SAVE.days}</b><span>출근 일수</span></div>
      <div class="cstat"><b class="num">${SAVE.best.toLocaleString()}</b><span>최다 처리</span></div>
      <div class="cstat"><b class="ttl" style="color:${SAVE.cleared?"var(--good)":"var(--dim)"}">${SAVE.cleared?"있음":"없음"}</b><span>정시 퇴근</span></div>
    </div>
    ${bon?`<div class="mbon"><span class="k">적용 중</span><div class="chips">${bon}</div></div>`:""}
    <label>오늘 누구 때문에 힘드셨나요? <span style="color:#59627a">적 대사가 됩니다</span></label>
    <input id="grudge" maxlength="40" placeholder="이거 오늘 안에 되죠?" autocomplete="off">
    <button class="primary" id="go">출근</button>
    <button class="ghost" id="shop" style="color:var(--ink);font-size:14px;padding:13px;
      display:flex;align-items:center;justify-content:center;gap:8px">
      <span>자기계발</span><span style="color:var(--accent);font-weight:800">경력 ${SAVE.career.toLocaleString()}</span>
    </button>
    <div class="hintrow">
      <span>이동 <b>${isTouch?"화면 드래그":"WASD"}</b></span>
      <span>공격 <b>자동</b></span>
      <span>음소거 <b>M</b></span>
    </div>`;
  $("#go").onclick=()=>{
    S("resume");
    start(($("#grudge").value||"").trim()||"이거 오늘 안에 되죠?");
  };
  $("#shop").onclick=()=>{ S("resume"); S("select"); renderShop(); };
  openOverlay();
}

/* 자기계발 — 경력으로 영구 능력을 산다 */
function renderShop(){
  const card=$("#card");
  const rows=Object.keys(CAREER).map(k=>{
    const C=CAREER[k], l=SAVE.lv[k]|0, maxed=l>=C.max, cost=C.cost(l+1);
    const can=!maxed && SAVE.career>=cost;
    const once=C.max===1;
    const cls=["buy", maxed?"maxed":"", (!maxed&&!can)?"poor":"", (once&&!maxed)?"once":""].filter(Boolean).join(" ");
    return `<button class="${cls}" data-k="${k}" ${maxed||!can?"disabled":""}>
      <span class="bn">${esc(C.name)}</span>
      ${once&&!maxed?'<span class="tag">단 1회</span>'
                   :`<span class="bl num">${l} / ${C.max}</span>`}
      <span class="bd">${esc(maxed?C.desc(l):C.desc(l+1))}</span>
      <span class="bc">${maxed?"완료":"경력 "+cost}</span>
      <span class="bar"><i style="width:${(l/C.max*100).toFixed(0)}%"></i></span>
    </button>`;
  }).join("");
  card.innerHTML=`
    <div class="shead">
      <div>
        <h1 class="ttl">자기계발</h1>
        <div class="sub" style="margin:6px 0 0">하루를 버틸 때마다 경력이 쌓입니다. 경력은 영구히 남습니다.</div>
      </div>
      <div class="bal"><b class="num">${SAVE.career.toLocaleString()}</b><span>보유 경력</span></div>
    </div>
    <div class="rule"></div>
    <div class="shop">${rows}</div>
    <button class="primary" id="back">← 돌아가기</button>
    <button class="ghost" id="reset">기록 초기화</button>`;
  card.querySelectorAll("[data-k]").forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.k, C=CAREER[k], l=SAVE.lv[k]|0;
      if(l>=C.max) return;
      const cost=C.cost(l+1);
      if(SAVE.career<cost) return;
      SAVE.career-=cost; SAVE.lv[k]=l+1; writeSave(SAVE);
      S("levelup"); renderShop();
    };
  });
  $("#back").onclick=()=>{ S("select"); renderStart(); };
  $("#reset").onclick=()=>{
    if(!confirm("경력과 기록을 전부 지웁니다. 되돌릴 수 없습니다.")) return;
    SAVE={career:0, lv:{}, best:0, days:0, cleared:false}; writeSave(SAVE);
    S("deny"); renderShop();
  };
  openOverlay();
}

function renderEnd(g){
  const win=g.over==="win";
  const acc=win?"var(--good)":"var(--bad)";
  // 경력 정산 — 이 판이 남긴 것
  const earn=careerEarned(g);
  SAVE.career+=earn; SAVE.days++;
  if(g.kills>SAVE.best) SAVE.best=g.kills;
  if(win) SAVE.cleared=true;
  writeSave(SAVE);
  $("#card").innerHTML=`
    <div class="rhead">
      <span class="rbar" style="background:${acc}"></span>
      <div>
        <h1 class="ttl" style="color:${acc};font-size:38px;margin:0;line-height:1">${win?"정시 퇴근":"야근 확정"}</h1>
        <div class="sub" style="margin:6px 0 0">${win?"18:00. 가방 들고 나왔습니다."
          :clockStr(g.t)+" — 자리에서 쓰러졌습니다."}</div>
      </div>
    </div>
    <div class="crow">
      <div class="cstat"><b class="num">${g.kills.toLocaleString()}</b><span>처리</span></div>
      <div class="cstat"><b class="num" style="color:var(--bad)">${g.comboBest.toLocaleString()}</b><span>최고 연속</span></div>
      <div class="cstat"><b class="num">${g.lv}</b><span>레벨</span></div>
      <div class="cstat"><b class="num">${Math.round(g.dmgDealt).toLocaleString()}</b><span>누적 피해</span></div>
    </div>
    ${loadoutHTML(g,"마지막 구성")}
    <div class="quote">
      <div class="q">“${esc(g.grudge)}”</div>
      <div class="a">— ${win?"이제 안 들립니다.":"내일 또 듣습니다."}</div>
    </div>
    <div class="earnrow">
      <span class="k">오늘의 경력</span>
      <div><b class="num">+${earn.toLocaleString()}</b><span class="num">보유 ${SAVE.career.toLocaleString()}</span></div>
    </div>
    <button class="primary" id="again" style="background:${acc};color:#17191f">다시 출근</button>
    <button class="ghost" id="toShop" style="color:var(--ink);font-size:14px;padding:13px;
      display:flex;align-items:center;justify-content:center;gap:8px">
      <span>자기계발</span><span style="color:var(--accent);font-weight:800">경력 ${SAVE.career.toLocaleString()}</span>
    </button>`;
  $("#again").onclick=()=>{ S("select"); start(g.grudge); };
  $("#toShop").onclick=()=>{ S("select"); renderShop(); };
  openOverlay();
}

/* ── 루프 ────────────────────────────────────────────────────── */
function resize(){
  /* 렌더 배율 상한. 바닥 패턴을 매 프레임 화면 전체에 채우기 때문에
     DPR 2에서는 픽셀 수가 4배가 되어 프레임이 무너진다(측정: 61 → 23 FPS).
     어두운 플랫 벡터라 1배로 그려도 육안 차이가 거의 없다. */
  DPR=Math.min(1.35,window.devicePixelRatio||1);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ZOOM=calcZoom();
}
function start(grudge){
  closeOverlay();
  G=newGame(grudge); applyPerks(G); syncSlots(G); markBossTicks();
  if(G.pendingLv>0){ G.pendingLv--; levelUp(G); }   // 「짬」 — 시작부터 고를 게 있다
  let last=performance.now();
  const loop=now=>{
    const g=G; if(!g||g.over) return;
    let dt=(now-last)/1000; last=now;
    dt=Math.min(dt,0.05)*(window.__fast||1);
    if(g.hitstop>0){ g.hitstop-=dt; dt*=0.12; }   // 히트스톱
    if(!g.paused) step(g,dt);
    if(!G||G.over) return;
    draw(g); syncHud(g);
    raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop);
}

/* ══════════════ 터치 조이스틱 ══════════════
   화면 아무 데나 누르면 그 자리에 조이스틱이 생긴다(플로팅 방식).
   고정식은 엄지로 위치를 더듬어야 해서 작은 화면에서 불리하다. */
const TOUCH={ on:false, id:null, ox:0, oy:0, x:0, y:0, dx:0, dy:0, R:62 };
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints>0;

function touchStart(e){
  if(!G || G.over || G.paused) return;
  for(const t of e.changedTouches){
    if(TOUCH.id!==null) break;
    TOUCH.id=t.identifier; TOUCH.on=true;
    TOUCH.ox=TOUCH.x=t.clientX; TOUCH.oy=TOUCH.y=t.clientY;
    TOUCH.dx=TOUCH.dy=0;
  }
  e.preventDefault();
}
function touchMove(e){
  if(!TOUCH.on) return;
  for(const t of e.changedTouches){
    if(t.identifier!==TOUCH.id) continue;
    TOUCH.x=t.clientX; TOUCH.y=t.clientY;
    let dx=TOUCH.x-TOUCH.ox, dy=TOUCH.y-TOUCH.oy;
    const d=Math.hypot(dx,dy);
    if(d>TOUCH.R){                       // 손가락이 멀어지면 원점을 끌고 간다
      TOUCH.ox+=dx*(1-TOUCH.R/d); TOUCH.oy+=dy*(1-TOUCH.R/d);
      dx=TOUCH.x-TOUCH.ox; dy=TOUCH.y-TOUCH.oy;
    }
    const m=Math.hypot(dx,dy)||1;
    const f=Math.min(1, m/(TOUCH.R*0.72));   // 가운데는 둔감, 바깥은 최대속도
    TOUCH.dx=dx/m*f; TOUCH.dy=dy/m*f;
  }
  e.preventDefault();
}
function touchEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier!==TOUCH.id) continue;
    TOUCH.on=false; TOUCH.id=null; TOUCH.dx=TOUCH.dy=0;
  }
}
function bindTouch(){
  const el=$("#wrap");
  el.addEventListener("touchstart",touchStart,{passive:false});
  el.addEventListener("touchmove", touchMove, {passive:false});
  el.addEventListener("touchend",  touchEnd,  {passive:false});
  el.addEventListener("touchcancel",touchEnd,{passive:false});
}
/* 조이스틱 그리기 — 화면 좌표계(배율 밖) */
function drawStick(){
  if(!TOUCH.on) return;
  const ox=TOUCH.ox, oy=TOUCH.oy;
  ctx.save();
  ctx.globalAlpha=.30;
  ctx.strokeStyle="#9ec8ff"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(ox,oy,TOUCH.R,0,7); ctx.stroke();
  ctx.fillStyle="#0b0e14"; ctx.globalAlpha=.28;
  ctx.beginPath(); ctx.arc(ox,oy,TOUCH.R,0,7); ctx.fill();
  ctx.globalAlpha=.62;
  ctx.fillStyle="#9ec8ff";
  ctx.beginPath();
  ctx.arc(ox+TOUCH.dx*TOUCH.R*0.72, oy+TOUCH.dy*TOUCH.R*0.72, 22, 0, 7);
  ctx.fill();
  ctx.restore();
}

/* ── 입력 ────────────────────────────────────────────────────── */
addEventListener("keydown",e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  keys[k]=true;
  if(k==="m" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); toggleMute();
  }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
});
addEventListener("keyup",e=>{ keys[e.key.length===1?e.key.toLowerCase():e.key]=false; });
addEventListener("blur",()=>{ for(const k in keys) keys[k]=false; });

function toggleMute(){
  if(!window.SFX) return;
  S("resume"); window.SFX.setMuted(!window.SFX.muted);
  const b=$("#mute"), m=!!window.SFX.muted;
  b.setAttribute("aria-pressed",m?"true":"false");
  b.setAttribute("aria-label",m?"소리 켜기":"소리 끄기");
  if(!m) S("select");
}

/* ── 부팅 ────────────────────────────────────────────────────── */
cv=$("#cv"); ctx=cv.getContext("2d");
resize(); addEventListener("resize",resize);
$("#mute").onclick=toggleMute;
bindTouch();
(function(){ const m=!!(window.SFX&&window.SFX.muted);
  $("#mute").setAttribute("aria-pressed",m?"true":"false"); })();
window.__g=()=>G;                       // 테스트 훅
window.__api={WEAPONS,PERKS,E,SCHED,BOSSES,DAY,hourOf,clockStr,spawnRing,start};
renderStart();

</script>
