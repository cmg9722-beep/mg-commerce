<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>정시 퇴근 — 오늘도 6시에 나간다</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
:root{--bg:#0b0e14;--panel:#141922;--line:#232a36;--ink:#e8ecf4;--dim:#7d8699;
      --accent:#f5c451;--good:#57d98a;--bad:#ff6b6b;--blue:#9ec8ff;--deep:#6f9fd8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:'Gothic A1',"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.ttl{font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400}
.num{font-variant-numeric:tabular-nums}
#wrap{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

/* ── 상단 HUD ── */
#hud{position:absolute;top:0;left:0;right:0;padding:10px 58px 10px 14px;z-index:5;pointer-events:none;
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(11,14,20,.92),rgba(11,14,20,0))}
#clock{font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-size:30px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.5px}
#clock small{font-size:12px;color:var(--dim);font-family:inherit;margin-left:6px}
#daybar{flex:1;height:8px;background:#0b0d12;border-radius:5px;overflow:hidden;
  border:1px solid var(--line);position:relative}
#daybar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6f9fd8,#9ec8ff);
  border-radius:5px}
#daybar u{position:absolute;top:-3px;width:2px;height:14px;background:#3b4658}
#lv{font-size:13px;color:var(--dim)}
#lv b{color:var(--accent);font-size:17px}
#kills{font-size:13px;color:var(--dim)}
#kills b{color:var(--ink);font-size:17px}

/* 체력 + 경험치 */
#bars{position:absolute;left:14px;right:14px;bottom:12px;z-index:5;pointer-events:none}
.bar{height:12px;background:#0b0d12;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:100%;border-radius:6px;transition:width .08s linear}
#hpb i{background:linear-gradient(90deg,#b93b3b,#ff6b6b)}
#xpb i{background:linear-gradient(90deg,#d9a94e,#f5c451);width:0}
#hplab{font-size:11px;color:var(--dim);display:flex;justify-content:space-between}

/* 무기 슬롯 */
#slots{position:absolute;top:56px;left:14px;z-index:5;display:flex;gap:6px;pointer-events:none}
.slot{width:42px;height:42px;background:rgba(20,25,34,.9);border:1px solid var(--line);
  border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}
.slot canvas{position:static;width:34px;height:34px}
.slot b{position:absolute;right:2px;bottom:0;font-size:10px;color:var(--accent)}

/* ── 오버레이(레벨업/시작/결과) ── */
#ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,15,.82);padding:20px}
#ov.on{display:flex}
#card{width:100%;max-width:760px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:24px}
#card h1{font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400;
  font-size:30px;margin:0 0 6px}
#card .sub{color:var(--dim);font-size:14px;margin-bottom:18px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pick{background:#232936;border:1px solid var(--line);border-radius:10px;padding:14px;
  cursor:pointer;text-align:left;color:var(--ink);font-family:inherit;display:flex;gap:12px;align-items:flex-start}
.pick:hover{border-color:var(--accent);background:#2c3342}
.pick canvas{position:static;width:40px;height:40px;flex:none}
.pick .n{font-weight:800;font-size:14px;display:block}
.pick .lvl{font-size:11px;color:var(--accent);display:block;margin:1px 0 4px}
.pick .d{font-size:12px;color:var(--dim);line-height:1.45}
.primary{background:var(--accent);color:#17191f;border:0;border-radius:8px;font-weight:800;
  padding:13px;width:100%;margin-top:16px;font-size:15px;font-family:inherit;cursor:pointer}
.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:8px;
  padding:11px;width:100%;margin-top:8px;font-family:inherit;cursor:pointer}
input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);
  background:#0b0d12;color:var(--ink);font-size:14px;font-family:inherit}
label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
.tally{display:flex;gap:26px;margin:18px 0 4px;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.tally b{font-size:26px;font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400}
.tally span{font-size:11px;color:var(--dim)}
.hint{color:var(--dim);font-size:12px;margin-top:14px;line-height:1.6}
#mute{position:absolute;top:10px;right:14px;z-index:30;width:34px;height:34px;padding:0;
  display:flex;align-items:center;justify-content:center;background:rgba(20,25,34,.86);
  border:1px solid var(--line);color:var(--dim);border-radius:8px;cursor:pointer}
#mute:hover{border-color:var(--accent);color:var(--ink)}
#mute .x{display:none}
#mute[aria-pressed="true"]{color:var(--bad)}
#mute[aria-pressed="true"] .wave{display:none}
#mute[aria-pressed="true"] .x{display:block}
#toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);z-index:6;
  font-weight:800;font-size:15px;color:var(--accent);text-shadow:0 2px 10px #000;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="clock" class="num">09:00<small>출근</small></div>
    <div id="daybar"><i></i></div>
    <div id="lv">Lv <b class="num">1</b></div>
    <div id="kills">처리 <b class="num">0</b></div>
  </div>
  <div id="slots"></div>
  <div id="bars">
    <div id="hplab"><span>체력</span><span id="hpn" class="num">100 / 100</span></div>
    <div class="bar" id="hpb"><i></i></div>
    <div class="bar" id="xpb"><i></i></div>
  </div>
  <div id="toast"></div>
  <button id="mute" type="button" aria-pressed="false" title="소리 켜기/끄기 (M)" aria-label="소리 끄기">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9h3l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
      <g class="wave"><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.7 6.5a8 8 0 0 1 0 11"/></g>
      <g class="x"><path d="M16.5 9.5l5 5"/><path d="M21.5 9.5l-5 5"/></g>
    </svg>
  </button>
  <div id="ov"><div id="card"></div></div>
</div>

<script>
/* _audio.js — 「출근 저지」 사운드 엔진
   Web Audio 런타임 합성 전용: 오실레이터 + 자체 생성 노이즈 버퍼만 사용.
   오디오 파일·네트워크·base64 샘플 없음 (file:// 더블클릭 오프라인 동작).
   전역은 window.SFX 하나만 노출한다.
   사운드 방향: 「형광등 꺼진 사무실」 — 건조하고 작고 종이 같은 소리. */
(function () {
  "use strict";

  var LS_KEY = "chulgeun.muted";
  var MAX_VOICES = 16;      // 동시 보이스 상한 — 넘치면 새 소리를 그냥 버린다
  var MASTER_LEVEL = 0.32;  // 마스터 헤드룸 (다중 동시 발음 시 클리핑 방지)

  var ctx = null, master = null, noiseBuf = null;
  var masterNow = 0;              // master.gain 목표값의 JS 그림자 (.value 게터는 입력이 끊기면 stale)
  var live = 0, created = 0, dropped = 0;   // 보이스 수명 계측
  var muted = readMuted();

  function readMuted() {
    try { return localStorage.getItem(LS_KEY) === "1"; } catch (e) { return false; }
  }
  function writeMuted(b) {
    try { localStorage.setItem(LS_KEY, b ? "1" : "0"); } catch (e) {}
  }

  /* ── 고빈도 사운드 스로틀 (ms) ── */
  var THROTTLE = { shoot: 30, hit: 25, chew: 200, select: 40 };
  var lastAt = { shoot: -1e9, hit: -1e9, chew: -1e9, select: -1e9 };
  function gate(name) {
    var t = Date.now();
    if (t - lastAt[name] < THROTTLE[name]) return false;
    lastAt[name] = t;
    return true;
  }

  /* ── 컨텍스트 지연 생성 (로드 시점엔 절대 만들지 않는다) ── */
  function ensure() {
    var A = window.AudioContext || window.webkitAudioContext;
    if (!A) return null;
    if (!ctx) {
      try { ctx = new A(); } catch (e) { ctx = null; return null; }
      master = ctx.createGain();
      masterNow = muted ? 0 : MASTER_LEVEL;
      master.gain.value = masterNow;
      var tail = master;
      try {                                  // 안전망 컴프레서
        var comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.knee.value = 20; comp.ratio.value = 12;
        comp.attack.value = 0.002; comp.release.value = 0.15;
        master.connect(comp); tail = comp;
      } catch (e) {}
      tail.connect(ctx.destination);
      // 화이트 노이즈 버퍼 — 1초, 1회만 생성해서 전 사운드가 공유
      var n = Math.max(1, Math.floor(ctx.sampleRate));
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") {
      try { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    return ctx;
  }

  /* 사운드 공통 진입: 컨텍스트 확보 + 보이스 상한. 음수면 재생 불가 */
  function ready() {
    if (muted) return -1;                    // 음소거면 스케줄 자체를 생략
    var c = ensure();
    if (!c) return -1;
    if (live >= MAX_VOICES) { dropped++; return -1; }
    return c.currentTime;
  }

  /* ── 보이스: 소스 → (필터) → 게인 → 마스터. 끝나면 반드시 해제 ──
     o: { a:어택초, flat:유지형 엔벌로프, filter:[type,f0,f1,Q], rate:재생속도 } */
  function voice(src, t0, dur, peak, o) {
    var nodes = [src], head = src;
    if (o && o.filter) {
      var f = ctx.createBiquadFilter();
      f.type = o.filter[0];
      f.frequency.setValueAtTime(o.filter[1], t0);
      if (o.filter[2]) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.filter[2]), t0 + dur);
      if (o.filter[3]) f.Q.value = o.filter[3];
      head.connect(f); head = f; nodes.push(f);
    }
    var g = ctx.createGain(), a = (o && o.a) || 0.004;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + a);
    if (o && o.flat) {                        // 버즈용: 어택-유지-릴리즈
      g.gain.setValueAtTime(peak, t0 + Math.max(a, dur - 0.02));
      g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    } else {                                  // 기본: 즉시 감쇠 (건조한 소리)
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    }
    head.connect(g); g.connect(master); nodes.push(g);
    live++; created++;
    src.onended = function () {               // 누수 방지: 전 노드 disconnect
      live--; src.onended = null;
      for (var i = 0; i < nodes.length; i++) { try { nodes[i].disconnect(); } catch (e) {} }
    };
    src.start(t0);
    src.stop(t0 + dur + 0.03);
  }

  function tone(t0, dur, peak, type, f0, f1, o) {
    var osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    voice(osc, t0, dur, peak, o);
  }

  function noise(t0, dur, peak, o) {
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    if (o && o.rate) src.playbackRate.value = o.rate;
    voice(src, t0, dur, peak, o);
  }

  /* ══════════ 사운드 정의 ══════════ */

  /* 설치 — 책상에 사물을 내려놓는 "턱" 소리. 유닛별 재질 차이 */
  var PLACE = {
    water:  { f: 150, f1: 48,  dur: 0.20, tp: "sine",     tv: 0.20, bp: 240,  np: 0.09, q: 6 },   // 물통 — 공명하는 빈 통
    wall:   { f: 100, f1: 40,  dur: 0.16, tp: "triangle", tv: 0.24, bp: 170,  np: 0.11, q: 1.5 }, // 파티션 — 묵직한 판
    copy:   { f: 185, f1: 72,  dur: 0.12, tp: "triangle", tv: 0.20, bp: 850,  np: 0.09, q: 1 },   // 복사기 — 기계 몸통
    stap:   { f: 330, f1: 140, dur: 0.06, tp: "square",   tv: 0.10, bp: 2600, np: 0.09, q: 2 },   // 스테이플러 — 금속 딸깍
    quit:   { f: 520, f1: 300, dur: 0.05, tp: "triangle", tv: 0.05, bp: 3600, np: 0.13, q: 0.8, paper: true } // 사직서 — 종이 놓기
  };
  // 학생 팩은 같은 역할의 재질로 매핑
  PLACE.vend = PLACE.water; PLACE.locker = PLACE.wall; PLACE.book = PLACE.copy;
  PLACE.pencil = PLACE.stap; PLACE.leave = PLACE.quit;

  function hashId(s) {
    s = String(s); var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function place(unitId) {
    var t0 = ready(); if (t0 < 0) return;
    var p = PLACE[unitId];
    if (!p) {                                 // 모르는 id — 해시로 재질을 변주
      var h = hashId(unitId);
      p = { f: 120 + h % 140, f1: 45 + h % 40, dur: 0.13, tp: "triangle",
            tv: 0.18, bp: 300 + h % 900, np: 0.10, q: 1.2 };
    }
    tone(t0, p.dur, p.tv, p.tp, p.f, p.f1);
    noise(t0, p.paper ? 0.09 : 0.05, p.np, { filter: ["bandpass", p.bp, p.bp * 0.6, p.q], a: 0.002 });
  }

  /* 발사 — 트레이에서 종이가 빠지는 "특". 초당 10회에도 거슬리지 않게 아주 짧고 작게 */
  function shoot(unitId) {
    if (!gate("shoot")) return;
    var t0 = ready(); if (t0 < 0) return;
    var hi = unitId === "stap" || unitId === "pencil";     // 스테이플러 계열은 더 딱딱하게
    var f = (hi ? 5200 : 3000) * (0.92 + Math.random() * 0.16);
    noise(t0, hi ? 0.028 : 0.042, hi ? 0.16 : 0.14,
          { filter: ["bandpass", f, f * 0.45, hi ? 1.6 : 1.1], a: 0.002 });
  }

  /* 명중 — 아주 작은 틱 */
  function hit() {
    if (!gate("hit")) return;
    var t0 = ready(); if (t0 < 0) return;
    tone(t0, 0.03, 0.10, "sine", 1850, 1300, { a: 0.002 });
  }

  /* 처치 — 종이 구겨져 떨어지는 소리. 보스는 더 낮고 길게 */
  function kill(boss) {
    var t0 = ready(); if (t0 < 0) return;
    if (boss) {
      noise(t0, 0.30, 0.20, { filter: ["bandpass", 1500, 380, 0.9], a: 0.004, rate: 0.85 });
      tone(t0 + 0.03, 0.34, 0.28, "sine", 120, 42, { a: 0.006 });
    } else {
      noise(t0, 0.15, 0.14, { filter: ["bandpass", 1700, 500, 0.9], a: 0.003 });
      tone(t0 + 0.02, 0.10, 0.12, "sine", 210, 90, { a: 0.004 });
    }
  }

  /* 갉아먹기 — 둔한 반복음. 아무리 많이 물어뜯어도 초당 5회 이하 */
  function chew() {
    if (!gate("chew")) return;
    var t0 = ready(); if (t0 < 0) return;
    noise(t0, 0.08, 0.12, { filter: ["lowpass", 420, 250, 1], a: 0.003, rate: 0.7 });
    tone(t0, 0.07, 0.08, "triangle", 88, 60, { a: 0.003 });
  }

  /* 자원 획득 — 게임에서 유일하게 밝은 소리. 작은 보상 */
  function coin() {
    var t0 = ready(); if (t0 < 0) return;
    tone(t0, 0.22, 0.14, "sine", 1245, 1245, { a: 0.002 });
    tone(t0, 0.09, 0.05, "sine", 2530, 2530, { a: 0.002 });
  }

  /* 사직서/조퇴증 — 종이 찢기 → 낮은 둔중음. 게임에서 제일 큰 소리지만 여전히 건조하게 */
  function nuke() {
    var t0 = ready(); if (t0 < 0) return;
    noise(t0, 0.32, 0.26, { filter: ["bandpass", 3400, 320, 0.8], a: 0.010 });          // 찢기
    noise(t0 + 0.16, 0.50, 0.16, { filter: ["lowpass", 200, 90, 0.7], a: 0.010, rate: 0.6 }); // 저역 럼블
    tone(t0 + 0.17, 0.55, 0.34, "sine", 92, 36, { a: 0.008 });                          // 둔중음
  }

  /* 보스 등장 — 낮은 드론이 부풀었다 멎는다 (~1.2초). 놀래키지 않는다 */
  function bossIn() {
    var t0 = ready(); if (t0 < 0) return;
    tone(t0, 1.2, 0.15, "sawtooth", 52, 47, { a: 0.75, filter: ["lowpass", 270, 130, 4] });
    tone(t0, 1.2, 0.15, "sawtooth", 55.5, 50, { a: 0.75, filter: ["lowpass", 270, 130, 4] });
    tone(t0, 1.1, 0.03, "sine", 208, 197, { a: 0.7 });   // 형광등 험 같은 잔음
  }

  /* UI 클릭 — 아주 작은 클릭 */
  function select() {
    if (!gate("select")) return;
    var t0 = ready(); if (t0 < 0) return;
    noise(t0, 0.02, 0.10, { filter: ["highpass", 2500, 0, 0.7], a: 0.001 });
  }

  /* 설치 불가 / 자원 부족 — 짧고 밋밋한 버즈 */
  function deny() {
    var t0 = ready(); if (t0 < 0) return;
    tone(t0, 0.14, 0.07, "square", 110, 106, { a: 0.005, flat: true, filter: ["lowpass", 900, 0, 0.8] });
  }

  /* 승리 — 짧게 올라가며 매듭. 팡파르 아님 */
  function win() {
    var t0 = ready(); if (t0 < 0) return;
    var notes = [349.2, 440, 523.3, 698.5];
    for (var i = 0; i < notes.length; i++) {
      var last = i === notes.length - 1;
      tone(t0 + i * 0.13, last ? 0.5 : 0.28, last ? 0.13 : 0.10, "triangle", notes[i], notes[i], { a: 0.006 });
    }
  }

  /* 패배 — 미끄러지듯 내려가는 하강 */
  function lose() {
    var t0 = ready(); if (t0 < 0) return;
    var notes = [392, 311.1, 261.6, 196];
    for (var i = 0; i < notes.length; i++) {
      tone(t0 + i * 0.18, 0.35, 0.10, "sine", notes[i], notes[i] * 0.93, { a: 0.008 });
    }
  }

  /* ══════════ 제어 ══════════ */

  function setMuted(b) {
    b = !!b;
    muted = b; api.muted = b;
    writeMuted(b);
    if (ctx && master) {                      // 즉시·완전 소거: 게인 자체를 램프
      try {
        var t = ctx.currentTime, g = master.gain;
        var target = b ? 0 : MASTER_LEVEL;
        g.cancelScheduledValues(t);
        g.setValueAtTime(masterNow, t);       // .value 게터는 믿지 않는다 (stale 가능)
        g.linearRampToValueAtTime(target, t + 0.03);
        masterNow = target;
      } catch (e) {}
    }
  }

  function resume() { ensure(); }

  /* 어떤 상황에서도 게임 루프에 예외를 던지지 않는다 */
  function safe(fn) {
    return function () { try { return fn.apply(null, arguments); } catch (e) {} };
  }

  var api = {
    place: safe(place),
    shoot: safe(shoot),
    hit: safe(hit),
    kill: safe(kill),
    chew: safe(chew),
    coin: safe(coin),
    nuke: safe(nuke),
    bossIn: safe(bossIn),
    select: safe(select),
    deny: safe(deny),
    win: safe(win),
    lose: safe(lose),
    setMuted: safe(setMuted),
    muted: muted,
    resume: safe(resume),
    /* 테스트/디버그 계측 — 게임 코드는 사용하지 않음 */
    _debug: function () {
      return { live: live, created: created, dropped: dropped,
               masterGain: master ? master.gain.value : null, masterTarget: master ? masterNow : null,
               state: ctx ? ctx.state : null };
    }
  };
  window.SFX = api;
})();
</script>

<script>
/* ═══ 스프라이트 (design/ 아트 디렉션 기반) ═══ */
/* _sprites.js — 출근 저지 벡터 스프라이트
   아트 디렉션: design/Units.dc.html, design/Foes.dc.html (「형광등 꺼진 사무실」)
   전 함수 시그니처: (ctx, cx, cy, s) — cx,cy 중심, s = 정사각 박스 한 변(px).
   순수 Canvas2D 패스만 사용. 이모지/텍스트/이미지 없음. */
(function () {
  "use strict";

  /* ── 팔레트 ── */
  var PAPER = "#f2f5fa", PAPER2 = "#dfe6f2", PAPER3 = "#c3ccdb";
  var G1 = "#98a4b8", G2 = "#74829a", G3 = "#5d6a7f", G4 = "#4c5769", INK = "#2f3542";
  var BLUE = "#9ec8ff", BLUE2 = "#6f9fd8";
  var YEL = "#f5c451", YEL2 = "#d9a94e";
  var RED = "#ff6b6b", DRED = "#b93b3b";
  var SKIN = "#e8d3bd", HAIR = "#2f3542";

  /* 둥근 사각형 패스 (roundRect 폴리필 불요) */
  function rr(ctx, x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function frr(ctx, x, y, w, h, r, fill) {
    ctx.fillStyle = fill;
    rr(ctx, x, y, w, h, r);
    ctx.fill();
  }

  /* 72×72 디자인 좌표계로 진입 (Units.dc.html의 viewBox와 동일) */
  function in72(ctx, cx, cy, s) {
    ctx.save();
    ctx.translate(cx, cy);
    var k = s / 72;
    ctx.scale(k, k);
    ctx.translate(-36, -36);
  }

  /* ══════════ 설치 사물 (오른쪽을 향함) ══════════ */

  /* 정수기 — 흰 본체, 파란 물통, 파란 꼭지(오른쪽) */
  function water(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    frr(ctx, 20, 30, 32, 34, 3, PAPER2);          // 본체
    frr(ctx, 20, 30, 32, 8, 2, G1);               // 상단 밴드
    ctx.fillStyle = BLUE;                          // 거꾸로 꽂힌 물통
    ctx.beginPath();
    ctx.moveTo(28, 8); ctx.lineTo(44, 8);
    ctx.lineTo(41, 28); ctx.lineTo(31, 28);
    ctx.closePath(); ctx.fill();
    frr(ctx, 27, 4, 18, 6, 2, BLUE2);             // 물통 목
    frr(ctx, 38, 44, 8, 9, 2, BLUE2);             // 꼭지 — 진행 방향(오른쪽)
    ctx.restore();
  }

  /* 파티션 — 3단 접이식, 가운데가 가장 큼 */
  function wall(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    frr(ctx, 6, 18, 20, 42, 2, G3);
    frr(ctx, 46, 22, 18, 38, 2, G4);
    frr(ctx, 26, 12, 20, 48, 2, G2);
    ctx.restore();
  }

  /* 복사기 — 회색 몸통, 세워진 원고, 노란 배출 트레이(오른쪽) */
  function copy(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    frr(ctx, 10, 26, 48, 30, 4, PAPER3);          // 몸통
    frr(ctx, 10, 26, 48, 9, 3, G1);               // 상단 패널
    frr(ctx, 20, 8, 28, 18, 2, PAPER);            // 원고
    frr(ctx, 24, 13, 20, 2.5, 1, G1);
    frr(ctx, 24, 18, 14, 2.5, 1, G1);
    frr(ctx, 30, 44, 26, 14, 2, YEL);             // 배출 트레이 — 오른쪽
    ctx.restore();
  }

  /* 스테이플러 — 비스듬한 2단 몸체 + 파란 윗팔 */
  function stap(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    ctx.fillStyle = G4;                            // 받침
    ctx.beginPath();
    ctx.moveTo(8, 44); ctx.lineTo(56, 44);
    ctx.arcTo(61, 44, 61, 49, 5);
    ctx.lineTo(61, 55); ctx.lineTo(8, 55);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = G2;                            // 중간 몸체
    ctx.beginPath();
    ctx.moveTo(12, 26); ctx.lineTo(52, 26);
    ctx.arcTo(58, 26, 58, 32, 6);
    ctx.lineTo(58, 42); ctx.lineTo(12, 42);
    ctx.closePath(); ctx.fill();
    frr(ctx, 14, 18, 36, 8, 3, BLUE);             // 윗팔
    frr(ctx, 20, 46, 22, 4, 1, PAPER2);           // 심 배출구
    ctx.restore();
  }

  /* 사직서 — 흰 종이, 3줄 텍스트, 우하단 빨간 도장 */
  function quit(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    frr(ctx, 14, 6, 38, 52, 3, PAPER);
    frr(ctx, 21, 16, 24, 3, 1.5, G1);
    frr(ctx, 21, 24, 24, 3, 1.5, G1);
    frr(ctx, 21, 32, 16, 3, 1.5, G1);
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.arc(44, 46, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.4;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(40, 46); ctx.lineTo(43, 49); ctx.lineTo(49, 43);
    ctx.stroke();
    ctx.restore();
  }

  /* ══════════ 적 (왼쪽을 향해 걸어옴) ══════════ */
  /* 공통 몸: 발밑 그림자 + 몸통 라운드렉트 + 살색 머리 + 반원 머리카락.
     시선(눈 두 점)을 왼쪽으로 몰아 진행 방향을 표시. 소품도 왼쪽 손에. */

  function foeBase(ctx, torso, wide) {
    var tx = wide ? 18 : 22, tw = wide ? 40 : 32;   // 보스는 어깨가 넓다
    ctx.fillStyle = "rgba(0,0,0,.35)";               // 그림자
    ctx.beginPath();
    ctx.ellipse(38, 90, wide ? 24 : 21, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    frr(ctx, tx, 36, tw, 44, 9, torso);              // 몸통
    ctx.fillStyle = SKIN;                            // 머리
    ctx.beginPath(); ctx.arc(38, 22, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = HAIR;                            // 머리카락(윗 반원)
    ctx.beginPath(); ctx.arc(38, 20, 14, Math.PI, 0, false); ctx.closePath(); ctx.fill();
    ctx.fillStyle = INK;                             // 눈 — 왼쪽을 본다
    ctx.beginPath(); ctx.arc(29, 25, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(36, 25, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  /* 76×96 디자인 좌표계로 진입 (Foes.dc.html의 viewBox와 동일) */
  function makeFoe(torso, wide, prop) {
    return function (ctx, cx, cy, s) {
      ctx.save();
      ctx.translate(cx, cy);
      var k = s / 96;
      ctx.scale(k, k);
      ctx.translate(-38, -48);
      foeBase(ctx, torso, wide);
      if (prop) prop(ctx);
      ctx.restore();
    };
  }

  var foes = {
    /* 인턴 — 목걸이 사원증 */
    intern: makeFoe("#8b97ab", false, function (ctx) {
      frr(ctx, 30, 40, 16, 5, 2, G4);               // 스트랩 클립
      frr(ctx, 34, 44, 8, 14, 2, BLUE);             // 카드
    }),
    /* 사원 — 빨간 넥타이 */
    staff: makeFoe("#6d7d96", false, function (ctx) {
      ctx.fillStyle = RED;
      ctx.beginPath();
      ctx.moveTo(38, 40); ctx.lineTo(43, 45); ctx.lineTo(38, 63); ctx.lineTo(33, 45);
      ctx.closePath(); ctx.fill();
    }),
    /* 대리 — 옆구리의 노란 서류철 (진행 방향 손) */
    senior: makeFoe("#5b7bab", false, function (ctx) {
      frr(ctx, 12, 50, 20, 16, 2, YEL);
      frr(ctx, 12, 50, 20, 4, 2, YEL2);
    }),
    /* 과장 — 앞에 든 운전대 */
    manager: makeFoe("#a8703f", false, function (ctx) {
      ctx.strokeStyle = INK; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(38, 56, 11, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(38, 56, 3, 0, Math.PI * 2); ctx.fill();
    }),
    /* 부장 — 어두운 서류가방 (진행 방향 손) */
    gm: makeFoe("#a04a4a", false, function (ctx) {
      frr(ctx, 15, 48, 8, 5, 2, INK);               // 손잡이
      frr(ctx, 8, 52, 22, 18, 3, INK);              // 가방
      ctx.fillStyle = "#1f232c";                    // 가방 이음선
      ctx.fillRect(8, 59, 22, 3);
    }),
    /* 회식조 — 치켜든 맥주잔 + 발그레한 볼 */
    drunk: makeFoe("#c99a3f", false, function (ctx) {
      frr(ctx, 16, 44, 14, 18, 2, YEL);             // 잔
      frr(ctx, 16, 44, 14, 5, 2, PAPER);            // 거품
      ctx.save();
      ctx.globalAlpha = 0.7; ctx.fillStyle = RED;    // 볼터치
      ctx.beginPath(); ctx.arc(30, 27, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(46, 27, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }),
    /* 점검단(보스) — 줄 그어진 흰 클립보드, 어깨 넓음 */
    audit: makeFoe(DRED, true, function (ctx) {
      frr(ctx, 6, 44, 24, 30, 2, PAPER);            // 보드
      frr(ctx, 6, 44, 24, 6, 2, G1);                // 클립
      ctx.fillStyle = G1;
      ctx.fillRect(11, 55, 14, 2.5);
      ctx.fillRect(11, 61, 14, 2.5);
      ctx.fillRect(11, 67, 9, 2.5);
    })
  };

  /* ══════════ 내 자리 — 옆에서 본 사무용 의자 (오른쪽을 향함) ══════════ */
  function seat(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    frr(ctx, 16, 8, 11, 34, 5, BLUE2);              // 등받이 (왼쪽 = 뒤)
    frr(ctx, 16, 36, 36, 11, 5, BLUE2);             // 좌판 — 오른쪽으로 열림
    frr(ctx, 30, 47, 7, 12, 2, G4);                 // 기둥
    frr(ctx, 16, 58, 36, 5, 2.5, G4);               // 다리
    ctx.fillStyle = INK;                            // 바퀴
    ctx.beginPath(); ctx.arc(20, 65, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(48, 65, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  window.SPRITES = {
    units: { water: water, wall: wall, copy: copy, stap: stap, quit: quit },
    foes: foes,
    seat: seat
  };
})();
</script>

<script>
/* _rank_chars.js — 「정시 퇴근」 직급 캐릭터 v2 (실루엣 개편판)
   ────────────────────────────────────────────────────────────────
   기존 판의 문제: 다섯 직급이 전부 같은 체형에 몸통 색만 달랐다.
   이 판의 원칙: **직급은 몸으로 구분한다.** 색은 보조 신호일 뿐.

   전 함수 시그니처: (ctx, cx, cy, s)
   · cx,cy = 도형 중심, s = 정사각 박스 한 변(px). 적 52px, 보스 76px.
   · 순수 Canvas2D 패스만. 이모지/fillText/이미지 없음.
   · save/restore 짝 맞춤 — 캔버스 상태 누수 0.
   · 뱀서식 옆모습(전방 3/4), 전원 **왼쪽**을 본다. 엔진이 좌우 반전.
   · 발은 지면선 **cy + 0.34*s** 에 닿는다 (엔진이 거기에 타원 그림자를 깖).
   · 모든 부위는 cy ± 0.5*s 박스 안.

   설계 좌표계: 100×100 유닛, 중심 (0,0), 지면 y=+34, 상한 y=-50.
   1유닛 = s/100 px (52px 렌더에서 0.52px).

   실루엣 지도 (검은 그림자만 보고도 구분되게):
   · intern  작다 + 웅크림 + 큰 머리, 박스를 확연히 덜 채움
   · staff   기준 체형, 꼿꼿한 보통 몸 — 아무 돌출 없음
   · senior  앞으로 기울음 + 가슴 앞 서류 더미 + 보폭 큰 다리
   · manager 어깨 넓고 가슴 폄 + 앞으로 뻗은 손가락 하나
   · gm      압도적 부피 — 넓은 어깨·배·벌린 발, 박스를 가득 채움
   · drunk   축이 통째로 기울음 + 머리 위로 치켜든 술잔 + 머리띠 넥타이
   · audit   (보스) 곧고 좁은 기둥 + 앞으로 든 흰 클립보드
   · hero    (플레이어) 셔츠 차림 보통 체형 + 파란 타이 + 사원증 끈 */
(function () {
  "use strict";

  /* ── 팔레트 — design/README.md 의 시스템을 계승 ── */
  var SKIN  = "#e8d3bd", SKIN2 = "#d9bfa3";
  var HAIR  = "#262b38";
  var INKD  = "#1d2129";                 // 얼굴 표식·구두
  var PAPER = "#f2f5fa", PAPER2 = "#dfe6f2";
  var OUT   = "rgba(6,8,13,0.85)";       // 어두운 바닥 위 분리용 림 라인
  var YEL   = "#f5c451", YEL2 = "#d9a94e";  // 토너(서류·명찰)
  var RED   = "#ff6b6b";                 // 볼터치·경고
  var BLUE  = "#6f9fd8";                 // 히어로 타이 (기존 플레이어 계승)

  /* 직급 수트색 — 명도는 #0b0e14 바닥에서 뜨도록 반 단계씩 올림 */
  var C_INTERN = "#aeb7c6", C_INTERN2 = "#909aab";   // 인턴: 창백한 회색
  var C_STAFF  = "#4e5a76", C_STAFF2  = "#3d4860";   // 사원: 짙은 남색
  var C_SENIOR = "#5e80b2", C_SENIOR2 = "#4c6a97";   // 대리: 청회색
  var C_MGR    = "#948b7c", C_MGR2    = "#7a7264";   // 과장: 따뜻한 회색
  var TIE_MGR  = "#e08a3c";                          // 과장의 주황 타이
  var C_GM     = "#a34d4d", C_GM2     = "#833b3b";   // 부장: 적갈색
  var C_AUDIT  = "#3a4254", C_AUDIT2  = "#2d3444";   // 점검단: 근흑색
  var C_DRUNK  = "#6d7d96", C_DRUNK2  = "#59687f";   // 회식조
  var AMBER    = "#e0aa4b";                          // 회식조 앰버 포인트
  var TROUS    = "#2b3140";                          // 공용 정장 바지

  /* ── 공용 도형 ── */
  function rrPath(ctx, x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  /* 채움 + 어두운 림 — 크라우드에서 몸끼리 분리되는 핵심 */
  function box(ctx, x, y, w, h, r, fill) {
    rrPath(ctx, x, y, w, h, r);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.7; ctx.stroke();
  }
  function disc(ctx, x, y, r, fill) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.7; ctx.stroke();
  }
  /* 팔·다리 — 어두운 심 위에 색을 얹어 자체 림을 만든다 */
  function limb(ctx, x1, y1, x2, y2, w, color) {
    ctx.lineCap = "round";
    ctx.strokeStyle = OUT; ctx.lineWidth = w + 2.2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  /* 구두 — 발끝은 앞(-x), 밑창은 정확히 y=34 지면선 */
  function shoe(ctx, x, w) {
    rrPath(ctx, x, 30.4, w, 3.6, 1.8);
    ctx.fillStyle = INKD; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.2; ctx.stroke();
  }
  /* 얼굴 표식용 선 */
  function stroke(ctx, color, w, fn) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.beginPath(); fn(ctx); ctx.stroke();
  }
  function dot(ctx, x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  /* 머리카락 — 머리원(hx,hy,hr) 위 반구 + 이마에서 끝나는 앞머리.
     앞머리 밑선은 hy - hr*0.3 근처 — 절대 눈을 덮지 않는다 */
  function hairCap(ctx, hx, hy, hr, drop) {
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.arc(hx, hy, hr, Math.PI, 0, false);
    ctx.lineTo(hx + hr, hy + 1.5);                    // 뒷머리(+x)는 귀선까지
    ctx.quadraticCurveTo(hx + hr * 0.4, hy - hr * 0.15 + drop,
                         hx, hy - hr * 0.3 + drop);   // 이마 중앙
    ctx.quadraticCurveTo(hx - hr * 0.6, hy - hr * 0.45 + drop,
                         hx - hr, hy - hr * 0.25);    // 앞이마 — 높게 끝

  /* 100유닛 설계 공간 진입 */

  function hero(ctx, cx, cy, s) {

      limb(ctx, -14.5, -2.5, -19, -9.5, 3.8, SKIN);    // 앞 팔뚝 (올려침)
      dot(ctx, -20, -10.8, 2.4, SKIN);                 // 주먹
      limb(ctx, 10.5, -9, 14, -1, 5, PAPER2);          // 뒤 위팔
      limb(ctx, 14, -1, 18.5, 4.5, 3.8, SKIN);         // 뒤 팔뚝 (뒤로 젓기)

      ctx.fillStyle = BLUE;

      ctx.lineTo(-1.2, 3); ctx.lineTo(-3.2, 3); ctx.closePath(); ctx.fill();

        c.moveTo(6, -13.5); c.lineTo(3.8, -3);

      box(ctx, 1.2, -3.5, 5.5, 8, 1.5, PAPER2);
      ctx.fillStyle = YEL; ctx.fillRect(1.2, -3.5, 5.5, 2.6);
      /* 머리 — 살짝 뻗친 앞머리 (약간 너덜너덜한 하루) */
      disc(ctx, 0, -25, 11, SKIN);
      hairCap(ctx, 0, -26, 11, 2.5);
      ctx.fillStyle = HAIR;                            // 삐친 머리 두 가닥
      ctx.beginPath(); ctx.moveTo(-3, -36.5); ctx.lineTo(-1, -41.5); ctx.lineTo(0.6, -36.8);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(3.5, -36.2); ctx.lineTo(6.5, -40); ctx.lineTo(6.6, -35.4);
      ctx.closePath(); ctx.fill();
      /* 결연한 얼굴: 또렷한 눈 + 내려 모은 눈썹 + 앙다문 입 */
      dot(ctx, -6, -24, 1.8, INKD); dot(ctx, 0.2, -24, 1.8, INKD);
      stroke(ctx, INKD, 1.5, function (c) {            // 결의의 눈썹

      });

        c.moveTo(-5.8, -17.6); c.lineTo(-2, -17.2);

  window.SPRITES_RANK = {
    intern: intern, staff: staff, senior: senior, manager: manager,
    gm: gm, audit: audit, drunk: drunk, hero: hero

<script>
/* _backdrop.js — 「정시 퇴근」 필드 배경: 형광등 꺼진 심야 사무실 바닥
   아트 디렉션: design/README.md 「형광등 꺼진 사무실」(Fluorescent Night)

   위에서 수직으로 내려다본 오픈플랜 사무실. 카펫타일 바닥 위에 파티션으로
   둘러싼 책상 섬(4~6석)이 놓이고, 그 사이가 통로다. 천장 형광등은 대부분
   꺼져 있고 몇 개만 켜져 바닥에 푸른 빛 웅덩이를 남긴다. 무드는 전부
   빛 웅덩이가 담당하고, 가구는 스프라이트와 싸우지 않도록 저대비 실루엣.

   계약:
     window.BACKDROP = { office: fn }
     fn(ctx, W, H, camX, camY, t)
       ctx        게임 컨텍스트. 균등 스케일 변환 하에서도 동작(논리 px로만 그림)
       W, H       뷰포트 논리 픽셀 크기 (리사이즈 가능)
       camX, camY 뷰포트 좌상단의 월드 좌표 (screen = world - cam)
       t          경과 초 — 형광등 하나의 간헐적 깜빡임에만 사용

   규칙:
     · 대비 상한 #2a3444 (r42 g52 b68). 예외는 켜진 형광등 관과 직근 글로우뿐,
       화면의 몇 % 이하.
     · 구조 주기 528px(책상·카펫), 조명 변주 주기 1056px(2×2 블록 매크로 타일).

(function () {
  "use strict";

  var TS = BLOCK * 2;              // 매크로 타일 주기 = 1056 (조명 변주)
  var Q = 264;                     // 쿼드런트(등기구 그리드) 간격
  var CARPET = 66;                 // 카펫타일 한 변 (1056/66 = 16, 정확히 나눠떨어짐)

  /* 팔레트 — 전부 상한 #2a3444 이하 */
  var FLOOR = "#0b0e14";
  var FLOOR2 = "#0d1119";          // 카펫 체커 밝은 쪽
  var PART = "#1b2331";            // 파티션
  var DESK = "#151b26";
  var DESKEDGE = "#1d2534";
  var DARKOBJ = "#10141c";         // 모니터·의자 등 짙은 사물

    if (r > w / 2) r = w / 2; if (r > h / 2) r = h / 2;
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);

  /* ── 가구 ──────────────────────────────────────────────────── */

  /* 책상 섬 — 중앙 스파인을 사이에 두고 2열이 마주 봄. rows=2(4석) 또는 3(6석) */
  function cluster(c, cx, cy, rot, rows, rnd) {
    var DW = 80, DH = 62;                       // 책상 하나
    var ih = rows * DH;                         // 섬 높이
    c.save();
    c.translate(cx, cy);
    if (rot) c.rotate(Math.PI / 2);

    /* 파티션 — 어두운 외곽 헤일로 + 본체. 밝은 에지는 만들지 않는다 */

    c.lineWidth = 5; c.strokeStyle = PART;
    rr(c, -88, -ih / 2 - 8, 176, ih + 16, 10); c.stroke();

    /* 섬 내부 바닥을 아주 살짝 눌러 깊이 */
    c.fillStyle = "rgba(0,0,0,.14)";
    rr(c, -85, -ih / 2 - 5, 170, ih + 10, 8); c.fill();

    /* 중앙 케이블 스파인 */
    c.fillStyle = "#0f131c";
    c.fillRect(-3, -ih / 2, 6, ih);

    for (var col = 0; col < 2; col++) {
      var sgn = col === 0 ? -1 : 1;
      for (var row = 0; row < rows; row++) {
        var x0 = sgn < 0 ? -DW : 0;
        var y0 = -ih / 2 + row * DH;
        var yc = y0 + DH / 2;
        /* 상판 */
        frr(c, x0 + 3, y0 + 3, DW - 6, DH - 6, 4, DESK);
        c.lineWidth = 1; c.strokeStyle = DESKEDGE;
        rr(c, x0 + 3, y0 + 3, DW - 6, DH - 6, 4); c.stroke();

        c.fillStyle = "#0c0f16";
        c.fillRect(sgn < 0 ? mx + 6 : mx - 5, yc - 3, 5, 6);
        /* 키보드 */
        frr(c, sgn < 0 ? -48 : 34, yc - 12, 14, 24, 2, "#10161f");
        /* 잡동사니 — 자리마다 조금씩 다르게 */
        var d = rnd();
        if (d < 0.38) {                          // 서류 더미
          c.save();
          c.translate(sgn < 0 ? -66 : 62, yc + (rnd() - 0.5) * 20);
          c.rotate((rnd() - 0.5) * 0.5);
          frr(c, -6, -8, 12, 16, 1, "#212938");
          c.fillStyle = "#1a2130"; c.fillRect(-6, -8, 12, 3);
          c.restore();
        } else if (d < 0.62) {                   // 머그컵
          c.fillStyle = "#1d2431";
          c.beginPath();
          c.arc(sgn < 0 ? -62 : 62, yc + (rnd() - 0.5) * 26, 3.5, 0, Math.PI * 2);
          c.fill();
        }
        /* 의자 — 책상 바깥쪽에 반쯤 밀어 넣음 */
        var chx = sgn * (72 + rnd() * 8), chy = yc + (rnd() - 0.5) * 12;
        c.fillStyle = DARKOBJ;
        c.beginPath(); c.arc(chx, chy, 10, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#151a24";                 // 등받이 호
        c.beginPath();
        c.arc(chx, chy, 10, sgn < 0 ? -2.2 : 0.94, sgn < 0 ? 2.2 : 5.34);
        c.arc(chx, chy, 6.2, sgn < 0 ? 2.2 : 5.34, sgn < 0 ? -2.2 : 0.94, true);

  /* ── 소품 (전부 위에서 본 모습, 저대비) ─────────────────────── */

  function printer(c, x, y, rot) {
    c.save(); c.translate(x, y); c.rotate(rot);
    frr(c, -24, -17, 48, 34, 5, "#1a212e");
    frr(c, -18, -11, 36, 10, 2, "#10151e");     // 급지 트레이
    frr(c, -14, 3, 28, 9, 2, "#232b3a");        // 배지 용지
    c.restore();
  }
  function cooler(c, x, y) {
    c.save(); c.translate(x, y);
    frr(c, -12, -12, 24, 24, 6, "#141a24");     // 본체
    c.fillStyle = "#1d2836";                    // 물통
    c.beginPath(); c.arc(0, 0, 9, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#141c28";
    c.beginPath(); c.arc(0, 0, 4, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  function plant(c, x, y, rnd) {
    c.save(); c.translate(x, y);
    c.fillStyle = "#1f1a15";                    // 화분
    c.beginPath(); c.arc(0, 0, 11, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#14211b";                    // 잎 — 위에서 본 로제트
    for (var i = 0; i < 7; i++) {
      var a = (i / 7) * Math.PI * 2 + rnd() * 0.5;
      c.save(); c.rotate(a);
      c.beginPath(); c.ellipse(8, 0, 8, 3.4, 0, 0, Math.PI * 2); c.fill();
      c.restore();
    }
    c.fillStyle = "#182a20";
    c.beginPath(); c.arc(0, 0, 4.5, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  function pillar(c, x, y) {                    // 기둥 + 화이트보드
    c.save(); c.translate(x, y);
    c.fillStyle = "rgba(0,0,0,.28)";
    c.fillRect(-17, -17, 34, 34);
    c.fillStyle = "#161b25";
    c.fillRect(-14, -14, 28, 28);
    frr(c, -11, 12, 22, 6, 2, "#262e3c");       // 보드 (위에서 본 두께)
    c.restore();
  }
  function boxes(c, x, y, rnd) {                // 박스 더미
    c.save(); c.translate(x, y);
    for (var i = 0; i < 3; i++) {
      c.save();
      c.translate((rnd() - 0.5) * 22, (rnd() - 0.5) * 22);
      c.rotate((rnd() - 0.5) * 0.9);
      var s = 15 + rnd() * 8;
      frr(c, -s / 2, -s / 2, s, s, 2, "#1f1a13");
      c.fillStyle = "#2a2419";                  // 테이프

  /* ── 형광등 ────────────────────────────────────────────────── */

  /* 꺼진 등기구 — 거의 안 보이는 하우징 */
  function darkFixture(c, x, y, horiz) {
    c.save(); c.translate(x, y);
    if (!horiz) c.rotate(Math.PI / 2);
    frr(c, -62, -10, 124, 20, 3, "#10141b");
    c.fillStyle = "#151b26";                    // 꺼진 관 2개
    c.fillRect(-56, -6, 112, 4);
    c.fillRect(-56, 2, 112, 4);
    c.restore();

  /* 켜진 등 스프라이트 — 264×264 캔버스 1장에 구워 재사용 (베이크·깜빡이 공용) */
  var litSprite = null;
  function getLitSprite(horiz) {
    if (litSprite) return litSprite;
    var cv = document.createElement("canvas");
    cv.width = 264; cv.height = 264;
    var c = cv.getContext("2d");
    c.save(); c.translate(132, 132);

    var g = c.createRadialGradient(0, 0, 6, 0, 0, 126);
    g.addColorStop(0, la(0.10));
    g.addColorStop(0.55, la(0.05));
    g.addColorStop(1, la(0));
    c.fillStyle = g;
    c.save(); c.scale(1, 0.76);
    c.beginPath(); c.arc(0, 0, 126, 0, Math.PI * 2); c.fill();
    c.restore();
    /* 직근 글로우 (허용 예외, 소면적) */
    var g2 = c.createRadialGradient(0, 0, 2, 0, 0, 46);
    g2.addColorStop(0, la(0.34));
    g2.addColorStop(1, la(0));
    c.fillStyle = g2;
    c.save(); c.scale(1.6, 0.62);
    c.beginPath(); c.arc(0, 0, 46, 0, Math.PI * 2); c.fill();
    c.restore();
    /* 하우징 + 켜진 관 */
    frr(c, -62, -10, 124, 20, 3, "#151b28");
    c.fillStyle = "#8fb4e0";
    c.fillRect(-56, -6, 112, 4);
    c.fillRect(-56, 2, 112, 4);
    c.fillStyle = "#cfe4ff";                    // 코어
    c.fillRect(-52, -5, 104, 2);
    c.fillRect(-52, 3, 104, 2);
    c.restore();
    litSprite = cv;
    return litSprite;
  }

  /* 켜진 등 위치 — 매크로(4×4 쿼드런트) 안에서 3개, 그중 1개가 깜빡이 담당.
     쿼드런트 중심에서 반사거리 132 ≥ 스프라이트 반폭 132 → 매크로 밖으로
     삐져나가지 않아 랩 패스 없이도 이음새가 없다. */
  var LIT_Q = [[1, 1], [3, 2]];                 // 상시 점등 (베이크)
  var FLICK_Q = [0, 3];                         // 깜빡이 (라이브)
  var FLICK_X = FLICK_Q[0] * Q + 132;
  var FLICK_Y = FLICK_Q[1] * Q + 132;

  /* 깜빡임 — 125ms 슬롯 해시. 거의 항상 1(정지 화면과 동일),
     3~4초에 한 번 짧게 주저앉았다가 돌아온다. */
  function flickLevel(t) {
    var q = Math.floor(t * 8);
    var r = Math.sin(q * 127.1) * 43758.5453;
    r -= Math.floor(r);
    if (r > 0.972) return 0.22 + 0.4 * ((r * 57.31) % 1);
    if (r > 0.952) return 0.75;
    return 1;

  /* ── 매크로 타일 베이크 (1056×1056, 최초 1회) ───────────────── */

  var baked = null;                             // { cv, pattern }
  function getTile() {
    if (baked) return baked;
    var cv = document.createElement("canvas");
    cv.width = TS; cv.height = TS;
    var c = cv.getContext("2d");
    var i, j, x, y;

    /* 1. 바닥 + 카펫타일 체커 */
    c.fillStyle = FLOOR; c.fillRect(0, 0, TS, TS);
    c.fillStyle = FLOOR2;
    for (j = 0; j < TS / CARPET; j++)
      for (i = 0; i < TS / CARPET; i++)
        if ((i + j) & 1) c.fillRect(i * CARPET, j * CARPET, CARPET, CARPET);
