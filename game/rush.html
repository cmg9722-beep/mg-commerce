    c.beginPath();
    for (i = 0; i <= TS / CARPET; i++) {
      c.moveTo(i * CARPET + 0.5, 0); c.lineTo(i * CARPET + 0.5, TS);
      c.moveTo(0, i * CARPET + 0.5); c.lineTo(TS, i * CARPET + 0.5);
    }
    c.stroke();

    /* 2. 카펫 얼룩 — 결정적 배치, 반경 ≤ 안쪽 여백이라 랩 불필요 */
    var rd = rng(0x5eed);
    for (i = 0; i < 26; i++) {
      x = 130 + rd() * (TS - 260); y = 130 + rd() * (TS - 260);
      var rad = 40 + rd() * 80;
      var dark = rd() < 0.68;
      var gg = c.createRadialGradient(x, y, 0, x, y, rad);
      gg.addColorStop(0, dark ? "rgba(0,0,0,.05)" : la(0.018));
      gg.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = gg;
      c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill();
    }

    /* 3. 통로 — 쿼드런트 경계선을 따라 살짝 닳은 카펫 (그리드에 정렬 → 이음새 없음) */
    c.fillStyle = "rgba(0,0,0,.055)";
    for (i = 0; i < 4; i++) {
      c.fillRect(m(i * Q - 20, TS), 0, 40, TS);
      c.fillRect(0, m(i * Q - 20, TS), TS, 40);
    }

    /* 4. 블록 4개 — 같은 문법, 다른 배치의 가구 */
    for (var bj = 0; bj < 2; bj++)
      for (var bi = 0; bi < 2; bi++) {
        var rb = rng(0xA11CE + bi * 7 + bj * 131);
        c.save();
        c.translate(bi * BLOCK, bj * BLOCK);
        /* 쿼드런트 4곳 중 2~3곳에 책상 섬, 나머지에 소품/공터 */
        var order = [0, 1, 2, 3];
        for (i = 3; i > 0; i--) { j = (rb() * (i + 1)) | 0; var tmp = order[i]; order[i] = order[j]; order[j] = tmp; }
        var nClu = 2 + (rb() < 0.5 ? 1 : 0);
        for (var qi = 0; qi < 4; qi++) {
          var qq = order[qi];
          var qx = (qq & 1) * Q + 132, qy = (qq >> 1) * Q + 132;
          if (qi < nClu) {
            cluster(c, qx, qy, rb() < 0.5, rb() < 0.45 ? 2 : 3, rb);
          } else if (rb() < 0.8) {
            var p = PROPS[(rb() * PROPS.length) | 0];
            p(c, qx + (rb() - 0.5) * 90, qy + (rb() - 0.5) * 90, rb);
            if (rb() < 0.35) {
              p = PROPS[(rb() * PROPS.length) | 0];
              p(c, qx + (rb() - 0.5) * 130, qy + (rb() - 0.5) * 130, rb);
            }
          }
        }
        c.restore();
      }

    /* 5. 천장 등기구 — 16개 전부 하우징, 그중 LIT_Q 2개만 점등 베이크.
       깜빡이 자리는 하우징만 굽고 점등은 매 프레임 라이브로 얹는다. */
    var lit = getLitSprite();
    for (j = 0; j < 4; j++)
      for (i = 0; i < 4; i++) {
        x = i * Q + 132; y = j * Q + 132;
        darkFixture(c, x, y, ((i + j) & 1) === 0);
        for (var k = 0; k < LIT_Q.length; k++)
          if (LIT_Q[k][0] === i && LIT_Q[k][1] === j)
            c.drawImage(lit, x - 132, y - 132);
      }

    var pat = c.createPattern(cv, "repeat");
    baked = { cv: cv, pattern: pat };
    return baked;
  }

  /* ── 비네트 (뷰포트 크기별 캐시, 최대 4개) ───────────────────── */
  var vigCache = {}, vigKeys = [];
  function getVig(W, H) {
    var key = W + "x" + H;
    if (vigCache[key]) return vigCache[key];
    var cv = document.createElement("canvas");
    cv.width = Math.max(1, W); cv.height = Math.max(1, H);
    var c = cv.getContext("2d");
    var R = Math.hypot(W, H) / 2;
    var g = c.createRadialGradient(W / 2, H / 2, R * 0.42, W / 2, H / 2, R * 1.02);
    g.addColorStop(0, "rgba(4,7,12,0)");
    g.addColorStop(1, "rgba(4,7,12,.42)");
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    vigCache[key] = cv; vigKeys.push(key);
    if (vigKeys.length > 4) delete vigCache[vigKeys.shift()];
    return cv;
  }

  /* ── 매 프레임 ─────────────────────────────────────────────── */
  function office(ctx, W, H, camX, camY, t) {
    var tile = getTile();

    /* rush.html은 ZOOM(≥1.15) 스케일 변환 아래에서 줌 미적용 VW/VH를 넘긴다.
       채우기는 W×H로 해도 안전하게 넘치지만(잘림), 화면 고정인 비네트는
       실제 보이는 논리 영역에 맞춰야 중심이 플레이어에 온다. */
    var effW = W, effH = H;
    try {
      var tr = ctx.getTransform();
      if (tr && tr.a > 0 && tr.d > 0 && ctx.canvas) {
        effW = Math.min(W, ctx.canvas.width / tr.a);
        effH = Math.min(H, ctx.canvas.height / tr.d);
      }
    } catch (e) { /* getTransform 미지원 환경 — W/H 그대로 */ }

    ctx.save();
    /* 베이스 레이어의 책임 — 이전 프레임이 남긴 합성 상태에 흔들리지 않는다.
       restore가 호출자 상태를 그대로 되돌린다. */
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    /* 바닥 — 패턴 원점을 월드 그리드에 맞춰 뷰포트 전체를 1회 채움 */
    var ox = -m(camX, TS), oy = -m(camY, TS);
    ctx.translate(ox, oy);
    ctx.fillStyle = tile.pattern;
    ctx.fillRect(-ox, -oy, W, H);
    ctx.translate(-ox, -oy);

    /* 깜빡이 형광등 — 보이는 매크로 인스턴스마다 라이브로 */
    var lv = flickLevel(t);
    if (lv > 0.004) {
      var spr = getLitSprite();
      var i0 = Math.floor((camX + FLICK_X - 132) / TS) - 1;
      var i1 = Math.floor((camX + W - FLICK_X + 132) / TS) + 1;
      var j0 = Math.floor((camY + FLICK_Y - 132) / TS) - 1;
      var j1 = Math.floor((camY + H - FLICK_Y + 132) / TS) + 1;
      ctx.globalAlpha = lv;
      for (var j = j0; j <= j1; j++)
        for (var i = i0; i <= i1; i++) {
          var sx = i * TS + FLICK_X - 132 - camX;
          var sy = j * TS + FLICK_Y - 132 - camY;
          if (sx > W || sy > H || sx + 264 < 0 || sy + 264 < 0) continue;
          ctx.drawImage(spr, sx, sy);
        }
      ctx.globalAlpha = 1;
    }

    /* 비네트 — 시선을 중앙(플레이어)으로. 실제 가시 영역 크기로 */
    ctx.drawImage(getVig(Math.round(effW), Math.round(effH)), 0, 0);

    ctx.restore();
  }

  window.BACKDROP = { office: office };
})();
</script>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   정시 퇴근 — 오늘도 6시에 나간다
   생존형 액션(뱀서라이크). 09:00에 출근해서 18:00까지 버티면 정시 퇴근.
   사방에서 몰려오는 상사들을 갈아버리며 레벨을 올린다.
   ════════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const S = (m,...a) => { try{ const x=window.SFX; if(x&&typeof x[m]==="function") x[m](...a); }catch(e){} };

/* 하루 = 09:00 → 18:00, 9시간을 DAY초에 압축 */
const DAY = 420;                 // 한 판 길이(초)
const H0 = 9, H1 = 18;
const hourOf = t => H0 + (t/DAY)*(H1-H0);
function clockStr(t){
  const h=hourOf(t), hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  return String(hh).padStart(2,"0")+":"+String(Math.floor(mm/5)*5).padStart(2,"0");
}

/* ── 무기 ─────────────────────────────────────────────────────── */
const WEAPONS = {
  stamp:{ id:"stamp", name:"반려 도장", max:8, base:"start",
    desc:"가장 가까운 적을 찍는다",
    lv:l=>({cd:.60-l*.05, dmg:26+l*10, count:2+Math.floor(l/2), range:170+l*14}),
    up:l=>l%2===0?("동시에 "+(2+Math.floor(l/2))+"명"):"피해 +10, 간격 −0.05초" },
  copy:{ id:"copy", name:"복사기", max:8,
    desc:"사방으로 서류를 뿌린다",
    lv:l=>({cd:2.1-l*.13, dmg:13+l*5, n:6+l*2, spd:260}),
    up:l=>"장수 +1, 피해 +4" },
  mail:{ id:"mail", name:"참조 메일", max:8,
    desc:"적을 쫓아가는 유도 메일",
    lv:l=>({cd:1.45-l*.10, dmg:22+l*10, n:1+Math.floor(l/1.6), turn:3.6}),
    up:l=>l%2===0?"동시 발송 +1":"피해 +8" },
  coffee:{ id:"coffee", name:"쏟은 커피", max:8,
    desc:"발밑에 장판. 밟는 적이 계속 닳는다",
    lv:l=>({cd:3.2-l*.18, dps:16+l*8, r:62+l*9, life:3.6}),
    up:l=>"범위 +7, 초당 피해 +6" },
  clock:{ id:"clock", name:"퇴근 시계", max:6,
    desc:"주변 적을 느리게 만든다",
    lv:l=>({r:96+l*14, slow:.62-l*.05}),
    up:l=>"범위 +14, 감속 강화" },
  quit:{ id:"quit", name:"사직서", max:5,
    desc:"화면 전체를 쓸어버린다",
    lv:l=>({cd:25-l*2.8, dmg:180+l*120}),
    up:l=>"피해 +90, 재사용 −2.6초" },
};
/* ── 강화(패시브) ─────────────────────────────────────────────── */
const PERKS = {
  shoes :{ id:"shoes", name:"편한 구두",   max:5, desc:"이동 속도 +12%",        f:(P,l)=>P.spd*=1.12 },
  laptop:{ id:"laptop",name:"노트북",      max:5, desc:"공격 속도 +10%",        f:(P,l)=>P.haste*=.90 },
  card  :{ id:"card",  name:"명함",        max:5, desc:"공격 범위 +14%",        f:(P,l)=>P.range*=1.14 },
  leave :{ id:"leave", name:"연차",        max:5, desc:"경험치 획득 +18%",      f:(P,l)=>P.xpMul*=1.18 },
  cup   :{ id:"cup",   name:"텀블러",      max:5, desc:"경험치 수집 범위 +30%", f:(P,l)=>P.magnet*=1.30 },
  suit  :{ id:"suit",  name:"정장",        max:5, desc:"최대 체력 +25",         f:(P,l)=>{P.maxhp+=25; P.hp+=25;} },
};

/* ── 적 ──────────────────────────────────────────────────────── */
const E = {
  intern :{name:"인턴", hp:22,  spd:78, dmg:5,  xp:1, r:15},
  staff  :{name:"사원", hp:44,  spd:62, dmg:8,  xp:2, r:16},
  senior :{name:"대리", hp:96,  spd:55, dmg:11, xp:3, r:17},
  manager:{name:"과장", hp:130, spd:70, dmg:14, xp:5, r:18},
  drunk  :{name:"회식조",hp:74, spd:92, dmg:11, xp:4, r:17},
  gm     :{name:"부장", hp:340, spd:44, dmg:22, xp:12,r:22},
  audit  :{name:"점검단",hp:2600,spd:38, dmg:34, xp:120,r:30, boss:true},
};
/* 시간대별 스폰 구성 — 시(hour) 기준 */
const SCHED = [
  {h:9,  kinds:["intern"],                       rate:1.40, n:1},
  {h:10, kinds:["intern","staff"],               rate:1.15, n:2},
  {h:11, kinds:["staff","senior"],               rate:1.00, n:3},
  {h:12, kinds:["staff","drunk"],                rate:0.85, n:4},
  {h:13, kinds:["senior","manager"],             rate:0.72, n:6},
  {h:14, kinds:["staff","senior","manager"],     rate:0.60, n:8},
  {h:15, kinds:["manager","gm","staff"],         rate:0.50, n:10},
  {h:16, kinds:["senior","manager","drunk"],     rate:0.42, n:13},
  {h:17, kinds:["manager","gm","drunk","staff"], rate:0.34, n:16},
];
/* 정각 보스 */
const BOSSES = [
  {h:12,   kind:"gm",    msg:"12:00 — 점심 회의 소집"},
  {h:15,   kind:"gm",    msg:"15:00 — 갑작스러운 보고 요청"},
  {h:17,   kind:"audit", msg:"17:00 — 고객사 점검단 도착"},
  {h:17.7, kind:"audit", msg:"17:42 — 부장님이 퇴근 전에 부릅니다"},
];

/* ── 상태 ────────────────────────────────────────────────────── */
let cv, ctx, G=null, raf=null, VW=960, VH=600, DPR=1, ZOOM=1;
/* 화면이 클수록 배율을 올려 캐릭터가 작아 보이지 않게 한다 (기준 1000px 폭) */
function calcZoom(){ return clamp(Math.min(VW,VH*1.6)/760, 1.15, 2.0); }
const keys = Object.create(null);

function newGame(grudge){
  return {
    t:0, over:null, grudge,
    P:{ x:0, y:0, vx:0, vy:0, r:14, face:-1, walk:0,
        hp:100, maxhp:100, spd:168, haste:1, range:1, xpMul:1, magnet:1,
        inv:0, hurt:0 },
    lv:1, xp:0, next:6, kills:0, dmgDealt:0,
    weapons:{ stamp:1 }, perks:{},
    cds:{}, foes:[], shots:[], orbs:[], pools:[], fx:[], floats:[], bodies:[], drops:[],
    spawnAcc:0, bossIdx:0, shake:0, shakeX:0, shakeY:0, hitstop:0,
    combo:0, comboT:0, comboBest:0, comboPop:0, flash:0,
    toast:"", toastT:0, paused:false, best:0,
  };
}

/* ── 파생 스탯 ───────────────────────────────────────────────── */
function stats(g){
  const P={ spd:168, haste:1, range:1, xpMul:1, magnet:1, maxhp:100 };
  for(const k in g.perks){ const p=PERKS[k]; for(let i=0;i<g.perks[k];i++) p.f(P,i+1); }
  return P;
}
function applyPerks(g){
  const P=stats(g), p=g.P;
  const dh = P.maxhp - p.maxhp;
  p.spd=P.spd; p.haste=P.haste; p.range=P.range; p.xpMul=P.xpMul; p.magnet=P.magnet;
  p.maxhp=P.maxhp; if(dh>0) p.hp=Math.min(p.maxhp,p.hp+dh);
  p.hp=Math.min(p.hp,p.maxhp);
}

/* ── 스폰 ────────────────────────────────────────────────────── */
function schedFor(h){
  let s=SCHED[0];
  for(const e of SCHED) if(h>=e.h) s=e;
  return s;
}
function spawnAt(g,kind,x,y){
  const d=E[kind];
  g.foes.push({kind, x, y, hp:d.hp, maxhp:d.hp, spd:d.spd, dmg:d.dmg,
               r:d.r, xp:d.xp, boss:!!d.boss, hit:0, slow:1, kb:0, kbx:0, kby:0,
               walk:Math.random(), face:-1});
}
function spawnRing(g,kind,n){
  const P=g.P, R=Math.max(VW,VH)/ZOOM*0.62+90;
  const a0=Math.random()*Math.PI*2;
  for(let i=0;i<n;i++){
    const a=a0+i*(Math.PI*2/n)+ (Math.random()-.5)*.5;
    spawnAt(g,kind,P.x+Math.cos(a)*R,P.y+Math.sin(a)*R);
  }
}
function doSpawns(g,dt){
  const h=hourOf(g.t), s=schedFor(h);
  g.spawnAcc+=dt;
  const CAP=420;                       // 폭주 방지 상한 (성능·가독성 둘 다)
  if(g.foes.length<CAP && g.spawnAcc>=s.rate){
    g.spawnAcc=0;
    const k=s.kinds[(Math.random()*s.kinds.length)|0];
    spawnRing(g,k,s.n);
  }
  while(g.bossIdx<BOSSES.length && h>=BOSSES[g.bossIdx].h){
    const b=BOSSES[g.bossIdx++];
    spawnRing(g,b.kind,1);
    flash(g,b.msg); S("bossIn"); g.shake=Math.max(g.shake,9);
  }
}

/* ── 무기 발사 ───────────────────────────────────────────────── */
function nearest(g,x,y,maxd){
  let best=null,bd=maxd*maxd;
  for(const f of g.foes){ const dx=f.x-x,dy=f.y-y,d=dx*dx+dy*dy; if(d<bd){bd=d;best=f;} }
  return best;
}
function fireWeapons(g,dt){
  const P=g.P;
  for(const id in g.weapons){
    const W=WEAPONS[id], L=W.lv(g.weapons[id]);
    if(id==="clock") continue;                    // 지속형
    g.cds[id]=(g.cds[id]||0)-dt;
    if(g.cds[id]>0) continue;

    if(id==="stamp"){
      const R=L.range*P.range;
      let fired=0;
      const used=new Set();
      for(let i=0;i<L.count;i++){
        let tgt=null,bd=R*R;
        for(const f of g.foes){ if(used.has(f)) continue;
          const dx=f.x-P.x,dy=f.y-P.y,d=dx*dx+dy*dy; if(d<bd){bd=d;tgt=f;} }
        if(!tgt) break;
        used.add(tgt); fired++;
        damage(g,tgt,L.dmg,P.x,P.y,10);
        g.fx.push({type:"stamp",x:tgt.x,y:tgt.y,t:0});
      }
      if(fired){ S("hit"); g.cds[id]=L.cd*P.haste; } else g.cds[id]=.12;
      continue;
    }
    if(id==="copy"){
      for(let i=0;i<L.n;i++){
        const a=(i/L.n)*Math.PI*2 + g.t*.7;
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*L.spd,vy:Math.sin(a)*L.spd,
                      dmg:L.dmg,life:1.6*P.range,kind:"paper",r:7});
      }
      S("shoot","copy"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="mail"){
      for(let i=0;i<L.n;i++){
        const tgt=nearest(g,P.x,P.y,900);
        const a=tgt?Math.atan2(tgt.y-P.y,tgt.x-P.x):(Math.random()*7);
        g.shots.push({x:P.x,y:P.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,
                      dmg:L.dmg,life:3.2,kind:"mail",r:8,turn:L.turn});
      }
      S("shoot","stap"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="coffee"){
      g.pools.push({x:P.x,y:P.y,r:L.r*P.range,dps:L.dps,life:L.life,t:0});
      S("place","water"); g.cds[id]=L.cd*P.haste; continue;
    }
    if(id==="quit"){
      let n=0;
      for(const f of g.foes){ damage(g,f,L.dmg,P.x,P.y,26); n++; }
      g.fx.push({type:"quit",t:0});
      g.shake=Math.max(g.shake,16); g.hitstop=Math.max(g.hitstop,.10);
      S("nuke"); flash(g,"사직서 — "+n+"명 정리");
      g.cds[id]=L.cd; continue;
    }
  }
}

/* ── 피해 / 처치 ─────────────────────────────────────────────── */
/* 타격 방향으로 카메라를 민다 — 무작위 진동보다 "어디서 맞았는지"가 읽힌다 */
function kick(g,dx,dy,power){
  const d=Math.hypot(dx,dy)||1;
  g.shakeX+=dx/d*power; g.shakeY+=dy/d*power;
  g.shake=Math.max(g.shake,power*0.55);
}
function damage(g,f,dmg,sx,sy,kb){
  f.hp-=dmg; g.dmgDealt+=dmg; f.hit=.12;
  if(kb){ const dx=f.x-sx, dy=f.y-sy, d=Math.hypot(dx,dy)||1;
          f.kbx=dx/d*kb; f.kby=dy/d*kb; f.kb=.14; }
  // 숫자가 수십 개 뜨면 화면이 안 읽힌다. 큰 타격만, 최대 14개.
  if(dmg>=25 && g.floats.length<14)
    g.floats.push({x:f.x,y:f.y-f.r-4,v:Math.round(dmg),t:0,big:dmg>=120});
}
/* 드롭 — 처치 말고도 주울 게 있어야 계속 돌아다니게 된다 */
const DROPS={
  heal  :{id:"heal",  name:"믹스커피", color:"#57d98a"},
  magnet:{id:"magnet",name:"텀블러",   color:"#9ec8ff"},
  bomb  :{id:"bomb",  name:"사직서",   color:"#f5c451"},
};
function dropFrom(g,f){
  let kind=null;
  if(f.boss) kind = Math.random()<.5 ? "bomb" : "heal";
  else {
    const r=Math.random();
    if(r<0.012) kind="heal";
    else if(r<0.020) kind="magnet";
    else if(r<0.025) kind="bomb";
  }
  if(kind) g.drops.push({kind, x:f.x, y:f.y, t:0});
}
function takeDrop(g,d){
  const P=g.P;
  if(d.kind==="heal"){
    P.hp=Math.min(P.maxhp, P.hp+Math.round(P.maxhp*0.3));
    flash(g,"믹스커피 — 체력 회복"); S("coin");
  } else if(d.kind==="magnet"){
    g.orbs.forEach(o=>{ o.x=P.x+(o.x-P.x)*0.06; o.y=P.y+(o.y-P.y)*0.06; });
    flash(g,"텀블러 — 경험치 전부 수집"); S("coin");
  } else {
    let n=0; for(const f of g.foes){ damage(g,f,240,P.x,P.y,24); n++; }
    g.fx.push({type:"quit",t:0});
    kick(g,0,-1,14); g.hitstop=Math.max(g.hitstop,.12);
    S("nuke"); flash(g,"사직서 — "+n+"명 정리");
  }
}
function killFoe(g,f,i){
  g.foes.splice(i,1); g.kills++;
  g.orbs.push({x:f.x,y:f.y,xp:f.xp,t:0,boss:f.boss});
  // 시체 — 쓰러지는 동작을 재생하고 바닥에 잠시 남는다.
  // 죽은 게 그냥 사라지면 "갈아버렸다"는 감각이 남지 않는다.
  g.bodies.push({kind:f.kind, x:f.x, y:f.y, face:f.face, boss:f.boss, t:0,
                 fall:f.boss?.55:.4, life:f.boss?5:3.5});
  if(g.bodies.length>48) g.bodies.splice(0, g.bodies.length-48);
  const bits=[];
  const bn=f.boss?18:8;
  // 타격이 온 방향(플레이어 → 적)으로 치우쳐 흩어진다. 방향이 읽히면 충격이 커진다.
  const away=Math.atan2(f.y-g.P.y, f.x-g.P.x);
  for(let k=0;k<bn;k++){
    bits.push({a:away+(Math.random()-.5)*2.4, d:(f.boss?70:34)*(.55+Math.random()*.95),
               sp:Math.random()*10-5, w:3+Math.random()*4, h:2+Math.random()*4,
               c:Math.random()<.3?"#6f9fd8":(Math.random()<.5?"#dfe6f2":"#f2f5fa")});
  }
  g.fx.push({type:"burst",x:f.x,y:f.y,t:0,boss:f.boss,r:f.r,bits});
  // 히트스톱 3~5프레임이 정석 — 그 사이 뇌가 타격을 등록한다
  g.hitstop=Math.max(g.hitstop, f.boss?.16:.05);
  kick(g, f.x-g.P.x, f.y-g.P.y, f.boss?9:2.2);
  // 콤보 — 연속 처치가 쌓이는 게 눈에 보여야 계속 몰아치게 된다
  dropFrom(g,f);
  g.combo++; g.comboT=1.6; g.comboPop=1;
  if(g.combo>g.comboBest) g.comboBest=g.combo;
  if(g.combo%10===0){ g.flash=Math.max(g.flash,.5); S("coin"); }
  S("kill",!!f.boss);
}

/* ── 갱신 ────────────────────────────────────────────────────── */
function step(g,dt){
  const P=g.P;
  g.t+=dt;
  if(g.t>=DAY){ finish(g,"win"); return; }
  if(g.toastT>0){ g.toastT-=dt; if(g.toastT<=0) g.toast=""; }
  if(g.shake>0) g.shake=Math.max(0,g.shake-dt*34);
  g.shakeX*=Math.max(0,1-dt*11); g.shakeY*=Math.max(0,1-dt*11);
  if(g.comboT>0){ g.comboT-=dt; if(g.comboT<=0) g.combo=0; }
  if(g.comboPop>0) g.comboPop=Math.max(0,g.comboPop-dt*4.5);
  if(g.flash>0) g.flash=Math.max(0,g.flash-dt*2.2);

  // 이동
  let ix=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);
  let iy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
  const m=Math.hypot(ix,iy)||1; ix/=m; iy/=m;
  P.x+=ix*P.spd*dt; P.y+=iy*P.spd*dt;
  if(ix) P.face=ix<0?-1:1;
  P.walk += (ix||iy) ? dt*9 : -P.walk*Math.min(1,dt*12);
  if(P.inv>0) P.inv-=dt;
  if(P.hurt>0) P.hurt-=dt;

  doSpawns(g,dt);
  fireWeapons(g,dt);

  // 퇴근 시계(지속형 감속)
  const CK=g.weapons.clock?WEAPONS.clock.lv(g.weapons.clock):null;
  const ckR=CK?CK.r*P.range:0;

  // 적
  for(let i=g.foes.length-1;i>=0;i--){
    const f=g.foes[i];
    if(f.hp<=0){ killFoe(g,f,i); continue; }
    if(f.hit>0) f.hit-=dt;
    const dx=P.x-f.x, dy=P.y-f.y, d=Math.hypot(dx,dy)||1;
    f.slow = (CK && d<ckR) ? CK.slow : 1;
    if(f.kb>0){ f.kb-=dt; f.x+=f.kbx*dt*9; f.y+=f.kby*dt*9; }
    else { f.x+=dx/d*f.spd*f.slow*dt; f.y+=dy/d*f.spd*f.slow*dt; }
    // 접촉
    if(d < f.r+P.r && P.inv<=0){
      P.hp-=f.dmg; P.inv=.62; P.hurt=.3;
      kick(g, P.x-f.x, P.y-f.y, 7); S("chew");
      if(P.hp<=0){ finish(g,"lose"); return; }
    }
  }
  // 적끼리 겹침 완화 — 뭉쳐서 한 덩어리로 보이는 걸 막는다
  for(let a=0;a<g.foes.length;a++){
    const f=g.foes[a];
    for(let b=a+1;b<Math.min(g.foes.length,a+9);b++){
      const o=g.foes[b], dx=o.x-f.x, dy=o.y-f.y, dd=dx*dx+dy*dy, mr=f.r+o.r;
      if(dd>0.01 && dd<mr*mr){ const d=Math.sqrt(dd), push=(mr-d)*.34/d;
        f.x-=dx*push; f.y-=dy*push; o.x+=dx*push; o.y+=dy*push; }
    }
  }

  // 탄
  for(let i=g.shots.length-1;i>=0;i--){
    const s=g.shots[i];
    s.life-=dt; if(s.life<=0){ g.shots.splice(i,1); continue; }
    if(s.kind==="mail"){
      const tgt=nearest(g,s.x,s.y,420);
      if(tgt){ const want=Math.atan2(tgt.y-s.y,tgt.x-s.x);
        const cur=Math.atan2(s.vy,s.vx), sp=Math.hypot(s.vx,s.vy);
        let dA=((want-cur+Math.PI*3)%(Math.PI*2))-Math.PI;
        const na=cur+clamp(dA,-s.turn*dt,s.turn*dt);
        s.vx=Math.cos(na)*sp; s.vy=Math.sin(na)*sp; }
    }
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    for(const f of g.foes){
      const dx=f.x-s.x, dy=f.y-s.y;
      if(dx*dx+dy*dy < (f.r+s.r)*(f.r+s.r)){
        damage(g,f,s.dmg,s.x,s.y,8); S("hit");
        g.fx.push({type:"spark",x:s.x,y:s.y,t:0});
        g.shots.splice(i,1); break;
      }
    }
  }
  // 커피 장판
  for(let i=g.pools.length-1;i>=0;i--){
    const p=g.pools[i]; p.life-=dt; p.t+=dt;
    if(p.life<=0){ g.pools.splice(i,1); continue; }
    for(const f of g.foes){
      const dx=f.x-p.x, dy=f.y-p.y;
      if(dx*dx+dy*dy < p.r*p.r) damage(g,f,p.dps*dt,0,0,0);
    }
  }
  // 경험치 구슬 — 자석 범위는 무기 사거리보다 넓어야 한다.
  // 그렇지 않으면 멀리서 죽인 경험치가 영영 바닥에 남는다.
  const mag=140*P.magnet;
  if(g.orbs.length>70){                 // 구슬이 너무 많으면 합친다
    const keep=g.orbs.slice(0,40);
    let rest=0; for(let i=40;i<g.orbs.length;i++) rest+=g.orbs[i].xp;
    if(rest>0) keep.push({x:P.x+(Math.random()-.5)*90, y:P.y+(Math.random()-.5)*90,
                          xp:rest, t:0, boss:true});
    g.orbs=keep;
  }
  for(let i=g.orbs.length-1;i>=0;i--){
    const o=g.orbs[i]; o.t+=dt;
    const dx=P.x-o.x, dy=P.y-o.y, d=Math.hypot(dx,dy)||1;
    const pull = d<mag ? Math.min(620,150+(mag-d)*6.5)
                       : 26;                       // 범위 밖에서도 천천히 따라온다
    o.x+=dx/d*pull*dt; o.y+=dy/d*pull*dt;
    if(d<P.r+10){ g.orbs.splice(i,1); gainXp(g,o.xp); }
  }
  // 드롭 아이템
  for(let i=g.drops.length-1;i>=0;i--){
    const d=g.drops[i]; d.t+=dt;
    const dx=P.x-d.x, dy=P.y-d.y, dd=Math.hypot(dx,dy)||1;
    if(dd<mag*0.8){ const pull=Math.min(500,140+(mag-dd)*5);
      d.x+=dx/dd*pull*dt; d.y+=dy/dd*pull*dt; }
    if(dd<P.r+14){ g.drops.splice(i,1); takeDrop(g,d); }
  }
  // 시체 — 쓰러지는 동작이 끝나면 서서히 사라진다
  for(let i=g.bodies.length-1;i>=0;i--){
    const bd=g.bodies[i]; bd.t+=dt;
    if(bd.t>bd.life) g.bodies.splice(i,1);
  }
  // 이펙트
  for(let i=g.fx.length-1;i>=0;i--){ g.fx[i].t+=dt; if(g.fx[i].t>.55) g.fx.splice(i,1); }
  for(let i=g.floats.length-1;i>=0;i--){ g.floats[i].t+=dt; if(g.floats[i].t>.45) g.floats.splice(i,1); }
}

function gainXp(g,n){
  g.xp += n*g.P.xpMul; S("coin");
  if(g.xp>=g.next && !g.paused){    // 오버레이는 한 번에 하나만
    g.xp-=g.next; g.lv++;
    g.next=Math.round(g.next*1.34+3);
    levelUp(g);
  }
}
function flash(g,msg){ g.toast=msg; g.toastT=2.6; }
function finish(g,how){
  if(g.over) return;
  g.over=how; if(raf) cancelAnimationFrame(raf); raf=null;
  S(how==="win"?"win":"lose");
  renderEnd(g);
}

/* ── 그리기 ──────────────────────────────────────────────────── */
function drawFloor(g,camX,camY,VW,VH){
  const B=window.BACKDROP;
  if(B && B.office){ try{ B.office(ctx,VW,VH,camX,camY,g.t); return; }catch(e){} }
  // 폴백 — 배경 모듈이 없어도 게임은 돈다
  ctx.fillStyle="#0b0e14"; ctx.fillRect(0,0,VW,VH);
  const T=96, ox=-((camX%T)+T)%T, oy=-((camY%T)+T)%T;
  ctx.strokeStyle="rgba(158,200,255,.055)"; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=ox;x<VW+T;x+=T){ ctx.moveTo(x|0,0); ctx.lineTo(x|0,VH); }
  for(let y=oy;y<VH+T;y+=T){ ctx.moveTo(0,y|0); ctx.lineTo(VW,y|0); }
  ctx.stroke();
}

/* 적의 현재 동작을 고른다 — 맞는 중이면 피격, 아니면 걷기 */
/* ══════════════ 스프라이트 캐시 ══════════════
   캐릭터는 Canvas2D 패스 수십 개로 그린다. 적이 수백 명이면 프레임마다
   수천 번의 패스 연산이 된다(측정: 200명 25 FPS, 450명 13 FPS).
   동작을 프레임 단위로 미리 구워두고 drawImage로 찍는다. */
const FRAMES={ walk:8, hit:4, die:8, attack:4, idle:1 };
const BAKE=2;
const _cache=new Map();
function baked(kind,size,action,fi){
  const key=kind+"|"+size+"|"+action+"|"+fi;
  if(_cache.has(key)) return _cache.get(key);
  const R=window.SPRITES_RANK, SP=window.SPRITES;
  const fn=(R&&R[kind])||(SP&&SP.foes&&SP.foes[kind]);
  if(!fn){ _cache.set(key,null); return null; }
  const pad=Math.ceil(size*0.62);
  const c=document.createElement("canvas");
  c.width=c.height=Math.ceil(pad*2*BAKE);
  const x=c.getContext("2d");
  x.scale(BAKE,BAKE);
  const n=FRAMES[action]||1;
  try{ fn(x,pad,pad,size,{a:action,p:n>1?fi/n:0,t:0}); }
  catch(e){ _cache.set(key,null); return null; }
  c._pad=pad;
  _cache.set(key,c);
  return c;
}
function blit(g2,kind,size,action,p,x,y){
  const n=FRAMES[action]||1;
  const fi=n>1 ? clamp(Math.floor(p*n),0,n-1) : 0;
  const c=baked(kind,size,action,fi);
  if(!c) return false;
  g2.drawImage(c, x-c._pad, y-c._pad, c._pad*2, c._pad*2);
  return true;
}

function poseOf(f,g){
  if(f.hit>0) return {a:"hit", p:clamp(1-f.hit/.15,0,1), t:g.t};
  return {a:"walk", p:(f.walk||0)%1, t:g.t};
}
function drawFoe(g,f,sx,sy){
  const SP=window.SPRITES, R=window.SPRITES_RANK;
  const fn=(R&&R[f.kind])||(SP&&SP.foes&&SP.foes[f.kind]);
  const size=f.boss?76:52;
  // 바닥 그림자 — 이게 없으면 캐릭터가 공중에 떠 보인다
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.42)";
  ctx.beginPath(); ctx.ellipse(sx,sy+f.r*0.82,f.r*0.92,f.r*0.34,0,0,7); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(sx,sy);
  // 스프라이트는 왼쪽을 본다. 오른쪽으로 갈 때만 뒤집는다.
  if(f.face>0) ctx.scale(-1,1);
  const ps=poseOf(f,g);
  if(!blit(ctx,f.kind,size,ps.a,ps.p,0,0) && fn) fn(ctx,0,0,size,ps);
  ctx.restore();
  if(f.hit>0){                           // 얇은 링만 — 흰 덩어리로 얼굴을 지우지 않는다
    const a=clamp(f.hit/.12,0,1);
    ctx.save();
    ctx.strokeStyle="rgba(255,255,255,"+(a*.75)+")"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(sx,sy,f.r*0.9+(1-a)*10,0,7); ctx.stroke();
    ctx.restore();
  }
  // 체력바 — 보스와 다친 적만
  if(f.boss || f.hp<f.maxhp){
    const w=f.boss?70:30, rt=clamp(f.hp/f.maxhp,0,1);
    ctx.fillStyle="rgba(11,14,20,.85)"; ctx.fillRect(sx-w/2,sy+f.r+6,w,4);
    ctx.fillStyle=f.boss?"#ff6b6b":"#c3cbe0"; ctx.fillRect(sx-w/2,sy+f.r+6,w*rt,4);
  }
}

function drawPlayer(g,sx,sy){
  const P=g.P;
  // 바닥 그림자 — 회전/반전 밖에서 그린다
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.beginPath(); ctx.ellipse(sx,sy+19,14,5,0,0,7); ctx.fill();
  ctx.restore();
  const R=window.SPRITES_RANK;
  if(R && R.hero){
    ctx.save(); ctx.translate(sx,sy);
    ctx.rotate(Math.sin(P.walk)*0.05);
    if(P.face>0) ctx.scale(-1,1);
    R.hero(ctx,0,0,56);
    ctx.restore();
    if(P.hurt>0){                       // 피격 플래시
      ctx.save(); ctx.globalCompositeOperation="lighter";
      ctx.globalAlpha=clamp(P.hurt/.3,0,1)*.6; ctx.fillStyle="#ff6b6b";
      ctx.beginPath(); ctx.arc(sx,sy,P.r+9,0,7); ctx.fill(); ctx.restore();
    }
    if(P.inv>0 && ((g.t*18)|0)%2===0){
      ctx.save(); ctx.globalAlpha=.28; ctx.fillStyle="#ff6b6b";
      ctx.beginPath(); ctx.arc(sx,sy,P.r+8,0,7); ctx.fill(); ctx.restore();
    }
    return;
  }
  ctx.save(); ctx.translate(sx,sy);
  ctx.translate(0,Math.sin(P.walk)*2.0);
  if(P.face>0) ctx.scale(-1,1);
  const hurt=P.hurt>0;
  // 다리
  const sw=Math.sin(P.walk)*4;
  ctx.fillStyle="#2f3542";
  ctx.fillRect(-7, 6, 5, 12+sw); ctx.fillRect( 2, 6, 5, 12-sw);
  // 몸통 (셔츠)
  ctx.fillStyle=hurt?"#ff9f9f":"#dfe6f2";
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(-10,-8,20,16,4):ctx.rect(-10,-8,20,16); ctx.fill();
  // 넥타이
  ctx.fillStyle="#6f9fd8";
  ctx.beginPath(); ctx.moveTo(-2,-8); ctx.lineTo(2,-8); ctx.lineTo(1.5,4); ctx.lineTo(-1.5,4); ctx.closePath(); ctx.fill();
  // 머리
  ctx.fillStyle=hurt?"#ffd0d0":"#e8d3bd";
  ctx.beginPath(); ctx.arc(0,-15,8,0,7); ctx.fill();
  ctx.fillStyle="#2f3542";                       // 머리카락
  ctx.beginPath(); ctx.arc(0,-17,8,Math.PI,0); ctx.fill();
  ctx.fillStyle="#2f3542";                       // 눈 (왼쪽 보는 얼굴)
  ctx.fillRect(-5,-16,2,2); ctx.fillRect(-1,-16,2,2);
  ctx.restore();
  // 무적 깜빡임
  if(P.inv>0 && ((g.t*18)|0)%2===0){
    ctx.save(); ctx.globalAlpha=.35; ctx.fillStyle="#ff6b6b";
    ctx.beginPath(); ctx.arc(sx,sy,P.r+8,0,7); ctx.fill(); ctx.restore();
  }
}

function draw(g){
  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,0,0);
  try{ drawWorld(g); } finally { ctx.setTransform(DPR,0,0,DPR,0,0); }
  drawCombo(g);
}
/* 콤보 — 10단위마다 화면이 번쩍인다 */
function drawCombo(g){
  if(g.flash>0){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    ctx.fillStyle="rgba(245,196,81,"+(g.flash*.13)+")";
    ctx.fillRect(0,0,VW,VH); ctx.restore();
  }
  if(g.combo<3) return;
  const a=clamp(g.comboT/1.6,0,1);
  const pop=1+g.comboPop*0.30;
  const tier=g.combo>=40?"#ff6b6b":g.combo>=20?"#f5c451":"#9ec8ff";
  ctx.save();
  ctx.translate(VW*0.5, VH*0.30);
  ctx.scale(pop,pop);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font="400 "+(38+Math.min(26,g.combo*0.5))+"px 'Black Han Sans','Malgun Gothic',sans-serif";
  ctx.fillStyle="rgba(11,14,20,"+(a*.8)+")";
  ctx.fillText(g.combo,2,3);
  ctx.globalAlpha=a; ctx.fillStyle=tier;
  ctx.fillText(g.combo,0,0);
  ctx.font="800 14px 'Gothic A1','Malgun Gothic',sans-serif";
  ctx.fillStyle="rgba(232,236,244,"+(a*.75)+")";
  ctx.fillText("연속 처리",0,34);
  ctx.restore();
}
function drawWorld(g){
  const P=g.P;
  const VWz=VW/ZOOM, VHz=VH/ZOOM;
  let camX=P.x-VWz/2, camY=P.y-VHz/2;
  camX+=g.shakeX; camY+=g.shakeY;
  if(g.shake>0){ camX+=(Math.random()-.5)*g.shake*.7; camY+=(Math.random()-.5)*g.shake*.7; }
  const X=v=>v-camX, Y=v=>v-camY;

  drawFloor(g,camX,camY,VWz,VHz);

  // 커피 장판
  for(const p of g.pools){
    const a=clamp(p.life/1.2,0,1)*.5;
    const gr=ctx.createRadialGradient(X(p.x),Y(p.y),4,X(p.x),Y(p.y),p.r);
    gr.addColorStop(0,"rgba(245,196,81,"+(a*.7)+")");
    gr.addColorStop(1,"rgba(217,169,78,0)");
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(X(p.x),Y(p.y),p.r,0,7); ctx.fill();
  }
  // 퇴근 시계 범위
  if(g.weapons.clock){
    const L=WEAPONS.clock.lv(g.weapons.clock), r=L.r*P.range;
    ctx.save(); ctx.globalAlpha=.16; ctx.strokeStyle="#9ec8ff"; ctx.lineWidth=2;
    ctx.setLineDash([6,6]); ctx.lineDashOffset=-g.t*20;
    ctx.beginPath(); ctx.arc(X(P.x),Y(P.y),r,0,7); ctx.stroke(); ctx.restore();
  }
  // 드롭 아이템 — 눈에 확 띄어야 주우러 간다
  for(const d of g.drops){
    const C=DROPS[d.kind], sx=X(d.x), sy=Y(d.y);
    const bob=Math.sin(g.t*4+d.x*.05)*3;
    ctx.save(); ctx.globalAlpha=.22; ctx.fillStyle=C.color;
    ctx.beginPath(); ctx.arc(sx,sy+bob,17+Math.sin(g.t*5)*3,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.ellipse(sx,sy+13,9,3,0,0,7); ctx.fill();
    ctx.save(); ctx.translate(sx,sy+bob);
    ctx.fillStyle="#0b0e14"; ctx.strokeStyle=C.color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(0,0,10,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle=C.color;
    if(d.kind==="heal"){ ctx.fillRect(-5,-1.6,10,3.2); ctx.fillRect(-1.6,-5,3.2,10); }
    else if(d.kind==="magnet"){ ctx.beginPath(); ctx.arc(0,0,4.5,0,7); ctx.fill(); }
    else { ctx.fillRect(-4,-5,8,10); ctx.fillStyle="#0b0e14";
           ctx.fillRect(-2.5,-3,5,1.4); ctx.fillRect(-2.5,-.5,5,1.4); ctx.fillRect(-2.5,2,3,1.4); }
    ctx.restore();
  }

  // 경험치 구슬
  for(const o of g.orbs){
    const s=o.boss?5:3, pul=1+Math.sin(g.t*8+o.x)*0.18;
    ctx.fillStyle=o.boss?"#57d98a":"#f5c451";
    ctx.beginPath(); ctx.arc(X(o.x),Y(o.y),s*pul,0,7); ctx.fill();
    if(o.boss){ ctx.save(); ctx.globalAlpha=.22;
      ctx.beginPath(); ctx.arc(X(o.x),Y(o.y),s*2.6*pul,0,7); ctx.fill(); ctx.restore(); }
  }
  // 시체 — 바닥에 쌓인다. 갈아버린 게 사라지면 갈아버린 감각이 안 남는다.
  for(const bd of g.bodies){
    const sx=X(bd.x), sy=Y(bd.y);
    if(sx<-90||sx>VWz+90||sy<-90||sy>VHz+90) continue;
    const pr=clamp(bd.t/bd.fall,0,1);
    const fade=clamp((bd.life-bd.t)/1.2,0,1);
    ctx.save();
    ctx.globalAlpha=fade*0.85;
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.beginPath();
    ctx.ellipse(sx,sy+(bd.boss?24:16),(bd.boss?26:19)*(.6+pr*.7),(bd.boss?7:5),0,0,7);
    ctx.fill();
    ctx.translate(sx,sy);
    if(bd.face>0) ctx.scale(-1,1);
    const sz=bd.boss?76:52;
    if(!blit(ctx,bd.kind,sz,"die",pr,0,0)){
      ctx.rotate(pr*1.35); ctx.globalAlpha*=0.75;
      blit(ctx,bd.kind,sz,"idle",0,0,0);
    }
    ctx.restore();
  }

  // 적 (아래쪽이 앞)
  const sorted=g.foes.slice().sort((a,b)=>a.y-b.y);
  for(const f of sorted){
    const sx=X(f.x), sy=Y(f.y);
    if(sx<-90||sx>VWz+90||sy<-90||sy>VHz+90) continue;
    drawFoe(g,f,sx,sy);
  }
  drawPlayer(g,X(P.x),Y(P.y));

  // 탄
  for(const s of g.shots){
    ctx.save(); ctx.translate(X(s.x),Y(s.y));
    ctx.rotate(Math.atan2(s.vy,s.vx));
    if(s.kind==="paper"){ ctx.fillStyle="#f2f5fa"; ctx.fillRect(-6,-4,12,8);
      ctx.fillStyle="#c3ccdb"; ctx.fillRect(-6,-4,12,2); }
    else { ctx.fillStyle="#dfe6f2"; ctx.fillRect(-7,-5,14,10);
      ctx.strokeStyle="#7d8699"; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(-7,-5); ctx.lineTo(0,1); ctx.lineTo(7,-5); ctx.stroke(); }
    ctx.restore();
  }
  // 이펙트
  for(const e of g.fx){
    const a=1-e.t/.55;
    const busy=g.fx.length>26;
    if(busy && (e.type==="spark"||e.type==="stamp")) continue;
    if(e.type==="spark"){ ctx.fillStyle="rgba(255,255,255,"+a+")";
      ctx.beginPath(); ctx.arc(X(e.x),Y(e.y),3+(1-a)*7,0,7); ctx.fill(); }
    else if(e.type==="stamp"){
      ctx.save(); ctx.translate(X(e.x),Y(e.y)); ctx.rotate(-.2);
      ctx.globalAlpha=a*.85; ctx.strokeStyle="#ff6b6b"; ctx.lineWidth=2.2;
      const r=6+(1-a)*13; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke();
      ctx.restore(); }
    else if(e.type==="burst"){
      // 처치 — 서류가 흩날린다. 개체마다 방향·거리·회전이 다르다.
      const p=1-a;                       // 진행도
      for(const b of (e.bits||[])){
        const dist=b.d*(1-(1-p)*(1-p));  // 처음에 빠르게 튀고 감속
        ctx.save();
        ctx.translate(X(e.x)+Math.cos(b.a)*dist,
                      Y(e.y)+Math.sin(b.a)*dist + p*p*14);   // 살짝 떨어진다
        ctx.rotate(b.a+e.t*b.sp); ctx.globalAlpha=a;
        ctx.fillStyle=b.c;
        ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
        ctx.restore();
      }
      ctx.globalAlpha=a*.42; ctx.strokeStyle="#ff6b6b"; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(X(e.x),Y(e.y),(e.r||16)*(.7+(1-a)*1.5),0,7); ctx.stroke();
      ctx.globalAlpha=1; }
    else if(e.type==="quit"){
      ctx.fillStyle="rgba(245,196,81,"+(a*.5)+")"; ctx.fillRect(0,0,VWz,VHz); }
  }
  // 데미지 숫자
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const t of g.floats){
    const a=1-t.t/.45;
    ctx.font=(t.big?"800 17px":"800 12px")+" 'Gothic A1','Malgun Gothic',sans-serif";
    ctx.fillStyle="rgba(11,14,20,"+a+")";
    ctx.fillText(t.v,X(t.x)+1,Y(t.y)-t.t*34+1);
    ctx.fillStyle=t.big?"rgba(245,196,81,"+a+")":"rgba(255,255,255,"+a+")";
    ctx.fillText(t.v,X(t.x),Y(t.y)-t.t*34);
  }
  // 화면 밖 보스 표시
  for(const f of g.foes){ if(!f.boss) continue;
    const sx=X(f.x), sy=Y(f.y);
    if(sx>=0&&sx<=VWz&&sy>=0&&sy<=VHz) continue;
    const cx=VWz/2, cy=VHz/2, ang=Math.atan2(sy-cy,sx-cx);
    const px=cx+Math.cos(ang)*(Math.min(VWz,VHz)/2-26), py=cy+Math.sin(ang)*(Math.min(VWz,VHz)/2-26);
    ctx.save(); ctx.translate(px,py); ctx.rotate(ang);
    ctx.fillStyle="#ff6b6b"; ctx.beginPath();
    ctx.moveTo(12,0); ctx.lineTo(-8,-7); ctx.lineTo(-8,7); ctx.closePath(); ctx.fill();
    ctx.restore(); }
}

/* ── 아이콘 (무기/강화 카드용) ────────────────────────────────── */
function icon(id,size){
  const c=document.createElement("canvas"); c.width=c.height=72;
  const x=c.getContext("2d"); const SP=window.SPRITES;
  const map={stamp:"quit",copy:"copy",mail:"stap",coffee:"water",clock:"wall",quit:"quit",
             shoes:"wall",laptop:"copy",card:"stap",leave:"quit",cup:"water",suit:"wall"};
  const f=SP&&SP.units&&SP.units[map[id]];
  if(f) f(x,36,36,64);
  else { x.fillStyle="#6f9fd8"; x.fillRect(18,18,36,36); }
  c.style.width=c.style.height=size+"px";
  return c;
}

/* ── 레벨업 선택 ─────────────────────────────────────────────── */
function offers(g){
  const out=[];
  for(const id in WEAPONS){ const lv=g.weapons[id]||0;
    if(lv>=WEAPONS[id].max) continue;
    if(!lv && Object.keys(g.weapons).length>=5) continue;      // 무기는 최대 5종
    out.push({kind:"w",id,lv}); }
  for(const id in PERKS){ const lv=g.perks[id]||0;
    if(lv>=PERKS[id].max) continue;
    out.push({kind:"p",id,lv}); }
  // 셋 뽑기 — 이미 가진 걸 조금 더 자주 준다(빌드가 완성되게)
  const pool=[];
  for(const o of out){ pool.push(o); if(o.lv>0) pool.push(o); }
  const pick=[],seen=new Set();
  while(pick.length<3 && pool.length){
    const i=(Math.random()*pool.length)|0, o=pool[i];
    pool.splice(i,1);
    const key=o.kind+o.id; if(seen.has(key)) continue;
    seen.add(key); pick.push(o);
  }
  return pick;
}
function levelUp(g){
  g.paused=true; S("select");
  const list=offers(g);
  if(!list.length){ g.paused=false; return; }
  const card=$("#card");
  card.innerHTML='<h1 class="ttl">레벨 '+g.lv+'</h1>'
    +'<div class="sub">하나를 고르세요</div><div class="picks"></div>';
  const box=card.querySelector(".picks");
  list.forEach(o=>{
    const D = o.kind==="w"?WEAPONS[o.id]:PERKS[o.id];
    const b=document.createElement("button"); b.className="pick";
    b.appendChild(icon(o.id,40));
    const txt=document.createElement("div");
    const lvl = o.lv===0 ? "신규" : ("Lv "+o.lv+" → "+(o.lv+1));
    const desc = o.kind==="w" ? (o.lv===0?D.desc:D.up(o.lv+1)) : D.desc;
    txt.innerHTML='<span class="n">'+esc(D.name)+'</span>'
      +'<span class="lvl">'+lvl+'</span><span class="d">'+esc(desc)+'</span>';
    b.appendChild(txt);
    b.onclick=()=>{
      if(o.kind==="w") g.weapons[o.id]=(g.weapons[o.id]||0)+1;
      else { g.perks[o.id]=(g.perks[o.id]||0)+1; applyPerks(g); }
      S("place"); closeOverlay(); g.paused=false; syncSlots(g);
    };
    box.appendChild(b);
  });
  openOverlay();
}
function openOverlay(){ $("#ov").classList.add("on"); }
function closeOverlay(){ $("#ov").classList.remove("on"); }

/* ── HUD ─────────────────────────────────────────────────────── */
function syncSlots(g){
  const el=$("#slots"); el.innerHTML="";
  for(const id in g.weapons){
    const d=document.createElement("div"); d.className="slot";
    d.appendChild(icon(id,34));
    const b=document.createElement("b"); b.textContent=g.weapons[id]; d.appendChild(b);
    d.title=WEAPONS[id].name+" Lv"+g.weapons[id];
    el.appendChild(d);
  }
}
function syncHud(g){
  const P=g.P;
  $("#clock").innerHTML=clockStr(g.t)+"<small>"+(hourOf(g.t)>=17?"곧 퇴근":"근무 중")+"</small>";
  $("#daybar i").style.width=(g.t/DAY*100).toFixed(1)+"%";
  $("#lv b").textContent=g.lv;
  $("#kills b").textContent=g.kills;
  $("#hpn").textContent=Math.max(0,Math.ceil(P.hp))+" / "+P.maxhp;
  $("#hpb i").style.width=clamp(P.hp/P.maxhp,0,1)*100+"%";
  $("#xpb i").style.width=clamp(g.xp/g.next,0,1)*100+"%";
  $("#toast").textContent=g.toast;
}

/* ── 화면 ────────────────────────────────────────────────────── */
function renderStart(){
  const card=$("#card");
  card.innerHTML=`
    <h1 class="ttl">정시 퇴근</h1>
    <div class="sub">09:00 출근. 18:00까지 버티면 정시 퇴근입니다.</div>
    <div class="hint" style="margin:0 0 4px">
      이동 <b>WASD</b> 또는 <b>방향키</b> · 공격은 자동입니다<br>
      적을 처리하면 경험치가 떨어집니다. 주우면 레벨이 오르고 무기를 고릅니다.<br>
      12:00 · 15:00 · 17:00 정각에 큰 게 옵니다.
    </div>
    <label>오늘 누구 때문에 힘드셨나요? (적 대사가 됩니다)</label>
    <input id="grudge" maxlength="40" placeholder="예: 이거 오늘 안에 되죠?" autocomplete="off">
    <button class="primary" id="go">출근</button>
    <div class="hint">M — 음소거</div>`;
  $("#go").onclick=()=>{
    S("resume");
    start(($("#grudge").value||"").trim()||"이거 오늘 안에 되죠?");
  };
  openOverlay();
}
function renderEnd(g){
  const win=g.over==="win";
  const acc=win?"var(--good)":"var(--bad)";
  $("#card").innerHTML=`
    <h1 class="ttl" style="color:${acc}">${win?"정시 퇴근":"야근 확정"}</h1>
    <div class="sub">${win?"18:00. 가방 들고 나왔습니다.":clockStr(g.t)+" — 자리에서 쓰러졌습니다."}</div>
    <div class="tally">
      <div><b class="num">${g.kills}</b><span>처리</span></div>
      <div><b class="num">${clockStr(g.t)}</b><span>도달 시각</span></div>
      <div><b class="num">${g.lv}</b><span>레벨</span></div>
      <div><b class="num">${g.comboBest}</b><span>최고 연속</span></div>
      <div><b class="num">${Math.round(g.dmgDealt).toLocaleString()}</b><span>누적 피해</span></div>
    </div>
    <div class="hint" style="margin-top:6px">${esc(g.grudge)} — ${win?"이제 안 들립니다.":"내일 또 듣습니다."}</div>
    <button class="primary" id="again" style="background:${acc}">다시 출근</button>`;
  $("#again").onclick=()=>{ S("select"); start(g.grudge); };
  openOverlay();
}

/* ── 루프 ────────────────────────────────────────────────────── */
function resize(){
  /* 렌더 배율 상한. 바닥 패턴을 매 프레임 화면 전체에 채우기 때문에
     DPR 2에서는 픽셀 수가 4배가 되어 프레임이 무너진다(측정: 61 → 23 FPS).
     어두운 플랫 벡터라 1배로 그려도 육안 차이가 거의 없다. */
  DPR=Math.min(1.35,window.devicePixelRatio||1);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ZOOM=calcZoom();
}
function start(grudge){
  closeOverlay();
  G=newGame(grudge); applyPerks(G); syncSlots(G);
  let last=performance.now();
  const loop=now=>{
    const g=G; if(!g||g.over) return;
    let dt=(now-last)/1000; last=now;
    dt=Math.min(dt,0.05)*(window.__fast||1);
    if(g.hitstop>0){ g.hitstop-=dt; dt*=0.12; }   // 히트스톱
    if(!g.paused) step(g,dt);
    if(!G||G.over) return;
    draw(g); syncHud(g);
    raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop);
}

/* ── 입력 ────────────────────────────────────────────────────── */
addEventListener("keydown",e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  keys[k]=true;
  if(k==="m" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); toggleMute();
  }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
});
addEventListener("keyup",e=>{ keys[e.key.length===1?e.key.toLowerCase():e.key]=false; });
addEventListener("blur",()=>{ for(const k in keys) keys[k]=false; });

function toggleMute(){
  if(!window.SFX) return;
  S("resume"); window.SFX.setMuted(!window.SFX.muted);
  const b=$("#mute"), m=!!window.SFX.muted;
  b.setAttribute("aria-pressed",m?"true":"false");
  b.setAttribute("aria-label",m?"소리 켜기":"소리 끄기");
  if(!m) S("select");
}

/* ── 부팅 ────────────────────────────────────────────────────── */
cv=$("#cv"); ctx=cv.getContext("2d");
resize(); addEventListener("resize",resize);
$("#mute").onclick=toggleMute;
(function(){ const m=!!(window.SFX&&window.SFX.muted);
  $("#mute").setAttribute("aria-pressed",m?"true":"false"); })();
window.__g=()=>G;                       // 테스트 훅
window.__api={WEAPONS,PERKS,E,SCHED,BOSSES,DAY,hourOf,clockStr,spawnRing,start};
renderStart();

</script>
