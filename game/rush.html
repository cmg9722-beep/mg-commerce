<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>정시 퇴근 — 오늘도 6시에 나간다</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
:root{--bg:#0b0e14;--panel:#141922;--line:#232a36;--ink:#e8ecf4;--dim:#7d8699;
      --accent:#f5c451;--good:#57d98a;--bad:#ff6b6b;--blue:#9ec8ff;--deep:#6f9fd8;
      /* 칩·기록칸 — 기존에 없던 컴포넌트라 토큰을 새로 둔다 */
      --cell:#171d27;--chip-g:#16251c;--chip-gb:#24402f;--chip-gt:#9fd9b6;
      --chip-a:#251f12;--chip-ab:#46391f;--surf2:#1a2029;--quote:#1a1416}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  font-family:'Gothic A1',"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.ttl{font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400}
.num{font-variant-numeric:tabular-nums}
#wrap{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}

/* ── 상단 HUD ── */
#hud{position:absolute;top:0;left:0;right:0;padding:10px 58px 10px 14px;z-index:5;pointer-events:none;
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(11,14,20,.92),rgba(11,14,20,0))}
#clock{font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-size:30px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.5px}
#clock small{font-size:12px;color:var(--dim);font-family:inherit;margin-left:6px}
#daybar{flex:1;min-width:60px;height:8px;background:#0b0d12;border-radius:5px;overflow:hidden;
  border:1px solid var(--line);position:relative}
#daybar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6f9fd8,#9ec8ff);
  border-radius:5px}
#daybar u{position:absolute;top:-3px;width:2px;height:14px;background:#3b4658}
#lv{font-size:13px;color:var(--dim)}
#lv b{color:var(--accent);font-size:17px}
#kills{font-size:13px;color:var(--dim)}
#kills b{color:var(--ink);font-size:17px}
#zone{font-size:12px;color:var(--faint,#5b6577);white-space:nowrap}
#zone b{color:var(--ink);font-size:14px;font-weight:800;margin-left:4px}
#zone.open b{color:var(--good)}
#pause{position:absolute;top:46px;right:14px;width:38px;height:38px;pointer-events:auto;
  background:rgba(20,25,34,.9);border:1px solid var(--line);border-radius:9px;
  color:var(--dim);font-size:12px;letter-spacing:1px;cursor:pointer;z-index:6}
#pause:hover{color:var(--ink)}
#pausecard{text-align:center}
#pausecard .pr{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
#rnd{font-size:12px;white-space:nowrap;border-radius:999px;padding:4px 11px;
  border:1px solid var(--line);background:var(--panel)}
#rnd.good{color:var(--good);border-color:#24402f;background:#16251c}
#rnd.bad{color:var(--bad);border-color:#4a2a2e;background:#231519}
#rnd.fun{color:var(--blue);border-color:#2a3a4e;background:#151d27}
#rnd small{opacity:.7;margin-left:5px}
#repl{font-size:13px;color:var(--dim);white-space:nowrap}
#repl b{color:var(--blue);font-size:17px}
#repl.warn b{color:var(--accent)}
#repl.hot b{color:var(--bad)}
#todo{font-size:13px;color:var(--dim)}
#todo b{color:var(--bad);font-size:17px}
#todo.ok b{color:var(--good)}
#daybar.ot i{background:linear-gradient(90deg,#b93b3b,#ff6b6b)}

/* 체력 + 경험치 */
#bars{position:absolute;left:14px;right:14px;bottom:12px;z-index:5;pointer-events:none}
.bar{height:12px;background:#0b0d12;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:100%;border-radius:6px;transition:width .08s linear}
#hpb i{background:linear-gradient(90deg,#b93b3b,#ff6b6b)}
#xpb i{background:linear-gradient(90deg,#d9a94e,#f5c451);width:0}
#hplab{font-size:11px;color:var(--dim);display:flex;justify-content:space-between}

/* 무기 슬롯 */
#slots{position:absolute;top:56px;left:14px;z-index:5;display:flex;gap:6px;pointer-events:none}
.slot{width:42px;height:42px;background:rgba(20,25,34,.9);border:1px solid var(--line);
  border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}
.slot canvas{position:static;width:34px;height:34px}
.slot b{position:absolute;right:2px;bottom:0;font-size:10px;color:var(--accent)}

/* ── 로비 ──────────────────────────────────────────────────
   타이틀에서 HUD를 안 숨기면 09:00 · 1/9 · 체력바가 오버레이 너머로
   비친다. 「게임 도중 멈춘 화면」으로 읽혀서 미완성 인상의 절반이
   여기서 나왔다. 게임이 돌 때만 보여준다. */
body.lobby #hud, body.lobby #slots, body.lobby #bars, body.lobby #toast{display:none}
/* 하단 고정 — 「출근」이 접힘 아래로 밀리면 안 된다.
   폰에서 통계가 두 줄로 꺾이면 버튼이 스크롤 밖으로 나갔다. */
.dock{position:sticky;bottom:-24px;z-index:2;margin:18px -24px -24px;padding:16px 24px 20px;
  background:linear-gradient(180deg,rgba(24,28,36,0) 0,var(--panel) 22%)}
.dock .primary{margin-top:0}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.nav button{background:#232936;color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:11px 6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.2}
.nav button:hover{border-color:var(--accent)}
.nav button small{font-size:10px;color:var(--dim);font-weight:400}
/* 최고 점수 — 「내가 잘하고 있나」를 한 숫자로 */
.hi{display:flex;align-items:baseline;gap:8px;margin:2px 0 0}
.hi b{font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400;
  font-size:30px;line-height:1;color:var(--accent)}
.hi span{font-size:12px;color:var(--dim)}
/* 아홉 구역 — 어디까지 갔는지가 글자 없이 읽혀야 한다 */
.zmap{display:flex;gap:3px;margin:12px 0 0}
.zmap i{flex:1;height:6px;border-radius:2px;background:#242a36}
.zmap i.on{background:var(--accent)}
.zmap i.now{background:var(--good)}
.zlab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:5px}
/* 해금 진행 — 다음에 뭐가 오는지 */
.unl{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12px;color:var(--dim)}
.unl .dots{display:flex;gap:3px}
.unl .dots i{width:12px;height:4px;border-radius:2px;background:#2c3442}
.unl .dots i.on{background:var(--accent)}
.unl b{color:var(--ink)}
/* 설정 줄 */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 2px;border-bottom:1px solid var(--line)}
.setrow:last-of-type{border-bottom:0}
.setrow .k{font-size:14px;font-weight:700}
.setrow .k small{display:block;font-size:11.5px;color:var(--dim);font-weight:400;margin-top:2px}
.tg{flex:none;width:52px;height:30px;border-radius:15px;border:1px solid var(--line);
  background:#1a1f29;position:relative;cursor:pointer;padding:0}
.tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#5a6478;transition:left .14s,background .14s}
.tg.on{background:#26402f;border-color:#3f7a52}
.tg.on i{left:26px;background:var(--good)}

/* ── 오버레이(레벨업/시작/결과) ── */
#ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,15,.82);padding:20px}
#ov.on{display:flex}
#card{width:100%;max-width:760px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:24px;max-height:92vh;overflow:auto}
@media (max-width:560px){
  #card{padding:16px;border-radius:12px}
  #card h1{font-size:24px}
  .picks{grid-template-columns:1fr}
  .shop{grid-template-columns:1fr;max-height:40vh}
  .primary,.ghost{padding:15px}
  .pick{padding:12px}
  #clock{font-size:22px}
  .title{flex-wrap:wrap;gap:4px 12px}
  .title h1{font-size:36px !important;white-space:nowrap}
  #toast{top:134px}
  #hud{padding:8px 50px 8px 10px;gap:8px}
  #kills,#lv,#todo,#zone,#repl{font-size:10px}
  #rnd{font-size:10px;padding:3px 8px}
  #repl b{font-size:12px}
  #zone b{font-size:12px}
  #kills b,#lv b,#todo b{font-size:15px}
  #daybar{min-width:40px}
}
/* 아주 좁은 화면 — 「처리」는 결과 화면에도 나오니 접고,
   오늘의 목표인 「미결」과 하루 진행 막대를 살린다. */
@media (max-width:430px){
  #kills,#lv,#clock small{display:none}
  #zone{font-size:0}                      /* 「7 / 9」는 접고 구역 이름만 */
  #zone b{font-size:12px;margin-left:0;max-width:96px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
  #todo{white-space:nowrap}
  #daybar{min-width:88px}
  .slot{width:36px;height:36px}
  .slot canvas{width:28px;height:28px}
}
#card h1{font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400;
  font-size:30px;margin:0 0 6px}
#card .sub{color:var(--dim);font-size:14px;margin-bottom:18px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pick{background:#232936;border:1px solid var(--line);border-radius:10px;padding:14px;
  cursor:pointer;text-align:left;color:var(--ink);font-family:inherit;display:flex;gap:12px;align-items:flex-start}
.pick:hover{border-color:var(--accent);background:#2c3342}
.pick.evo{border-color:var(--accent);background:linear-gradient(180deg,#2f2a1c,#232936);
  box-shadow:0 0 0 1px rgba(245,196,81,.35),0 6px 24px rgba(245,196,81,.12)}
.pick.evo .n{color:var(--accent)}
.pick.evo .lvl{color:var(--good)}
.pick canvas{position:static;width:40px;height:40px;flex:none}
.pick .n{font-weight:800;font-size:14px;display:block}
.pick .lvl{font-size:11px;color:var(--accent);display:block;margin:1px 0 4px}
.pick .d{font-size:12px;color:var(--dim);line-height:1.45}
.primary{background:var(--accent);color:#17191f;border:0;border-radius:8px;font-weight:800;
  padding:13px;width:100%;margin-top:16px;font-size:15px;font-family:inherit;cursor:pointer}
.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:8px;
  padding:11px;width:100%;margin-top:8px;font-family:inherit;cursor:pointer}
input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);
  background:#0b0d12;color:var(--ink);font-size:14px;font-family:inherit}
label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
.tally{display:flex;gap:26px;margin:18px 0 4px;flex-wrap:wrap}
/* 기록 격자 — 숫자가 주인공 */
.crow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;margin:20px 0 0;
  background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cstat{background:var(--cell);padding:14px 14px 12px;display:flex;flex-direction:column;gap:3px}
.cstat b{font-size:26px;line-height:1;
  font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400}
.cstat span{font-size:11px;color:var(--dim)}
/* 기록 여덟 칸 — auto-fit에 맡기면 6+2로 꺾여 빈칸 넷이 남는다 */
.crow.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){ .crow.four{grid-template-columns:repeat(2,1fr)} }
/* 적용 중인 영구 능력 — 한 줄 텍스트로는 뭐가 켜졌는지 안 읽힌다 */
.mbon{margin-top:12px;padding:10px 12px;border:1px solid #2a3a2f;border-radius:8px;
  background:#101a14;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mbon>.k{font-size:11px;font-weight:800;color:var(--good);letter-spacing:.5px;flex:none}
/* 업적 — 오늘 해낸 것 */
.achrow{margin-top:12px;padding:10px 12px;border:1px solid #3a3320;border-radius:8px;
  background:#191507;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.achrow>.k{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.5px;flex:none}
.achs{display:flex;gap:6px;flex-wrap:wrap}
.achip{font-size:12px;font-weight:700;color:var(--accent);background:#2a2210;
  border:1px solid #4a3c18;border-radius:999px;padding:4px 10px}
.achip b{color:var(--good);font-weight:800;margin-left:6px}
/* 업적 갤러리 */
.achgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:14px}
.achcard{display:flex;gap:10px;align-items:flex-start;background:var(--cell);
  border:1px solid var(--line);border-radius:10px;padding:11px}
.achcard.on{border-color:#4a3c18;background:#191507}
.achcard canvas{position:static;width:30px;height:30px;flex:none;opacity:.35}
.achcard.on canvas{opacity:1}
.achcard .n{font-weight:800;font-size:13px;display:block;color:var(--dim)}
.achcard.on .n{color:var(--accent)}
.achcard .d{font-size:11.5px;color:var(--dim);line-height:1.4;display:block;margin-top:2px}
.achcard .r{font-size:11px;color:var(--good);font-weight:700;display:block;margin-top:3px}
.mbon .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;color:var(--chip-gt);background:var(--chip-g);border:1px solid var(--chip-gb);
  border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.gold{color:var(--accent);background:var(--chip-a);border-color:var(--chip-ab);font-weight:800}
/* 무기 칩 — 레벨업·결과에서 현재 구성을 보여준다 */
.wrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px}
.wrow .k{font-size:11px;color:var(--dim);margin-right:2px}
.wchip{display:flex;align-items:center;gap:6px;background:var(--surf2);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px 4px 6px;font-size:12px}
.wchip canvas{position:static;width:18px;height:18px;flex:none}
.wchip b{font-size:11px;color:var(--accent);font-weight:800}
.wchip.evo{background:#251f12;border-color:#46391f;color:var(--accent);font-weight:800}
.wchip.empty{background:#12161d;border:1px dashed var(--line);color:#59627a;padding:4px 10px}
/* 상점 머리 — 잔액이 늘 보여야 살지 말지 판단한다 */
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.bal{text-align:right;flex:none}
.bal b{display:block;font-size:30px;line-height:1;color:var(--accent);
  font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400}
.bal span{font-size:11px;color:var(--dim)}
.rule{height:1px;background:var(--line);margin:18px 0 0}
/* 결과 머리 — 이겼는지가 0.2초 안에 읽혀야 한다 */
.rhead{display:flex;align-items:center;gap:14px}
.rbar{width:8px;height:44px;border-radius:4px;flex:none}
.quote{margin-top:18px;padding:14px 16px;border-left:2px solid var(--bad);
  background:var(--quote);border-radius:0 8px 8px 0}
.quote .q{font-size:15px;color:var(--ink)}
.quote .a{font-size:12px;color:var(--dim);margin-top:5px}
.nextday{display:flex;align-items:baseline;gap:12px;background:var(--cell);
  border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 9px 9px 0;padding:12px 16px;margin-top:14px}
.nextday .nd{font-family:'Black Han Sans',sans-serif;font-size:13px;color:var(--accent);
  white-space:nowrap}
.nextday .nt{font-size:13.5px;color:var(--dim)}
.nextday .nt b{color:var(--ink)}
.earnrow{margin-top:18px;display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;background:var(--cell);border:1px solid var(--line);border-radius:10px}
.earnrow .k{font-size:13px;color:var(--dim)}
.earnrow b{font-size:26px;line-height:1;color:var(--accent);
  font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400}
.earnrow span{font-size:12px;color:var(--dim);margin-left:10px}
.earn{margin:14px 0 2px;font-size:14px;color:var(--dim)}
.earn b{color:var(--accent);font-size:20px;font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin-top:14px;
  max-height:46vh;overflow:auto;padding-right:4px}
.buy{position:relative;background:#232936;border:1px solid var(--line);border-radius:10px;
  padding:12px 12px 16px;text-align:left;color:var(--ink);font-family:inherit;cursor:pointer;
  display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.buy:hover:not(:disabled){border-color:var(--accent);background:#2c3342}
.buy:disabled{cursor:default}
.buy.poor{opacity:.55}
.buy.maxed{opacity:.8;border-color:#2a3a2f;background:#1a221c}
.buy.maxed .bn{color:#9fd9b6}
.buy.maxed .bl{color:var(--good)}
.buy.once{background:linear-gradient(180deg,#2f2a1c,#232936);border-color:var(--chip-ab)}
.buy.once .bn{color:var(--accent)}
.buy .tag{font-size:10px;color:#0b0e14;background:var(--accent);border-radius:999px;
  padding:2px 7px;font-weight:800;justify-self:end;align-self:center}
.buy .bn{font-weight:800;font-size:14px}
.buy .bl{font-size:11px;color:var(--dim);text-align:right;align-self:center}
.buy .bd{grid-column:1/3;font-size:12px;color:var(--dim);line-height:1.45}
.buy .bc{grid-column:1/3;font-size:12px;color:var(--accent);font-weight:800;margin-top:3px}
.buy.maxed .bc{color:var(--good)}
.buy .bar{position:absolute;left:12px;right:12px;bottom:8px;height:3px;background:#0b0d12;border-radius:2px;overflow:hidden}
.buy .bar i{display:block;height:100%;background:var(--accent)}
.buy.maxed .bar i{background:var(--good)}
.tally div{display:flex;flex-direction:column}
.tally b{font-size:26px;font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400}
.tally span{font-size:11px;color:var(--dim)}
.hint{color:var(--dim);font-size:12px;margin-top:14px;line-height:1.6}
.story{background:linear-gradient(180deg,#171d27,#141922);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:15px 18px;margin-top:14px}
.story .sd{font-family:'Black Han Sans',sans-serif;font-size:13px;color:var(--accent);
  letter-spacing:.04em;margin-bottom:6px}
.story .sl{font-size:15px;color:var(--ink);line-height:1.65}
.story .sn{font-size:12px;color:var(--faint,#5b6577);margin-top:9px}
.story .sn b{color:var(--dim)}
.how{display:flex;flex-direction:column;gap:10px;margin:16px 0 4px}
.hw{display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:start;
  background:var(--cell);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.hw>b{font-family:'Black Han Sans',sans-serif;font-weight:400;color:var(--accent);
  font-size:17px;line-height:1.1;text-align:center}
.hw div{font-size:12.5px;color:var(--dim);line-height:1.55}
.hw span{display:block;color:var(--ink);font-weight:700;font-size:13.5px;margin-bottom:2px}
.hintrow{color:var(--dim);font-size:12px;margin-top:16px;line-height:1.7;
  display:flex;gap:18px;flex-wrap:wrap}
.hintrow b{color:var(--ink)}
.title{display:flex;align-items:baseline;gap:12px}
.title h1{font-size:44px !important;letter-spacing:-.5px;line-height:1;margin:0 !important}
.title .when{font-size:12px;color:var(--dim);letter-spacing:2px;font-weight:800}
.slot.evo{border-color:var(--chip-ab)}
.slot.evo b{color:var(--accent)}
#mute{position:absolute;top:10px;right:14px;z-index:30;width:34px;height:34px;padding:0;
  display:flex;align-items:center;justify-content:center;background:rgba(20,25,34,.86);
  border:1px solid var(--line);color:var(--dim);border-radius:8px;cursor:pointer}
#mute:hover{border-color:var(--accent);color:var(--ink)}
#mute .x{display:none}
#mute[aria-pressed="true"]{color:var(--bad)}
#mute[aria-pressed="true"] .wave{display:none}
#mute[aria-pressed="true"] .x{display:block}
#toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);z-index:6;
  font-weight:800;font-size:15px;color:var(--accent);text-shadow:0 2px 10px #000;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="clock" class="num">09:00<small>출근</small></div>
    <div id="daybar"><i></i></div>
    <div id="lv">Lv <b class="num">1</b></div>
    <div id="kills">처리 <b class="num">0</b></div>
    <div id="zone">1 / 9 <b>지하 주차장</b></div>
    <div id="todo" class="ok">미결 <b class="num">0</b></div>
    <div id="repl" style="display:none">대체율 <b class="num">0%</b></div>
    <div id="rnd" style="display:none"></div>
    <button id="pause" aria-label="일시정지">❚❚</button>
  </div>
  <div id="slots"></div>
  <div id="bars">
    <div id="hplab"><span>체력</span><span id="hpn" class="num">100 / 100</span></div>
    <div class="bar" id="hpb"><i></i></div>
    <div class="bar" id="xpb"><i></i></div>
  </div>
  <div id="toast"></div>
  <button id="mute" type="button" aria-pressed="false" title="소리 켜기/끄기 (M)" aria-label="소리 끄기">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9h3l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
      <g class="wave"><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.7 6.5a8 8 0 0 1 0 11"/></g>
      <g class="x"><path d="M16.5 9.5l5 5"/><path d="M21.5 9.5l-5 5"/></g>
    </svg>
  </button>
  <div id="ov"><div id="card"></div></div>
</div>

<script>
/* _audio.js — 「출근 저지」 사운드 엔진
   Web Audio 런타임 합성 전용: 오실레이터 + 자체 생성 노이즈 버퍼만 사용.
   오디오 파일·네트워크·base64 샘플 없음 (file:// 더블클릭 오프라인 동작).
   전역은 window.SFX 하나만 노출한다.
   사운드 방향: 「형광등 꺼진 사무실」 — 건조하고 작고 종이 같은 소리. */
(function () {
  "use strict";

  var LS_KEY = "chulgeun.muted";
  var MAX_VOICES = 28;      // 동시 보이스 상한 — 떼로 죽는 게임이라 여유가 필요하다
  var MASTER_LEVEL = 0.46;  // 마스터 헤드룸 (뒤에 컴프레서가 물려 있다)

  var ctx = null, master = null, noiseBuf = null, outTail = null;
  var masterNow = 0;              // master.gain 목표값의 JS 그림자 (.value 게터는 입력이 끊기면 stale)
  var live = 0, created = 0, dropped = 0;   // 보이스 수명 계측
  var muted = readMuted();

  function readMuted() {
    try { return localStorage.getItem(LS_KEY) === "1"; } catch (e) { return false; }
  }
  function writeMuted(b) {
    try { localStorage.setItem(LS_KEY, b ? "1" : "0"); } catch (e) {}
  }

  /* ── 고빈도 사운드 스로틀 (ms) ── */
  /* 초당 여러 번 나는 소리는 막아야 한다. 관통탄이 한 프레임에 여덟을
     맞히면 여덟 번 울리는데, 귀는 그걸 구분하지 못하고 합산만 커진다 */
  var THROTTLE = { shoot: 26, hit: 22, chew: 160, select: 40, coin: 18 };
  var lastAt = { shoot: -1e9, hit: -1e9, chew: -1e9, select: -1e9, coin: -1e9 };
  function gate(name) {
    var t = Date.now();
    if (t - lastAt[name] < THROTTLE[name]) return false;
    lastAt[name] = t;
    return true;
  }

  /* ── 컨텍스트 지연 생성 (로드 시점엔 절대 만들지 않는다) ── */
  function ensure() {
    var A = window.AudioContext || window.webkitAudioContext;
    if (!A) return null;
    if (!ctx) {
      try { ctx = new A(); } catch (e) { ctx = null; return null; }
      master = ctx.createGain();
      masterNow = muted ? 0 : MASTER_LEVEL;
      master.gain.value = masterNow;
      var tail = master;
      try {                                  // 안전망 컴프레서
        var comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.knee.value = 20; comp.ratio.value = 12;
        comp.attack.value = 0.002; comp.release.value = 0.15;
        master.connect(comp); tail = comp;
      } catch (e) {}
      outTail = tail;                        // 계측용 — 실제 출력 직전 노드
      tail.connect(ctx.destination);
      // 화이트 노이즈 버퍼 — 1초, 1회만 생성해서 전 사운드가 공유
      var n = Math.max(1, Math.floor(ctx.sampleRate));
      noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      setTimeout(sampleDecode, 0);             // 컨텍스트가 생겼으니 샘플을 굽는다
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") {
      try { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    return ctx;
  }

  /* 사운드 공통 진입: 컨텍스트 확보 + 보이스 상한. 음수면 재생 불가 */
  function ready() {
    if (muted) return -1;                    // 음소거면 스케줄 자체를 생략
    var c = ensure();
    if (!c) return -1;
    if (live >= MAX_VOICES) { dropped++; return -1; }
    return c.currentTime;
  }

  /* ── 보이스: 소스 → (필터) → 게인 → 마스터. 끝나면 반드시 해제 ──
     o: { a:어택초, flat:유지형 엔벌로프, filter:[type,f0,f1,Q], rate:재생속도 } */
  function voice(src, t0, dur, peak, o) {
    var nodes = [src], head = src;
    if (o && o.filter) {
      var f = ctx.createBiquadFilter();
      f.type = o.filter[0];
      f.frequency.setValueAtTime(o.filter[1], t0);
      if (o.filter[2]) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.filter[2]), t0 + dur);
      if (o.filter[3]) f.Q.value = o.filter[3];
      head.connect(f); head = f; nodes.push(f);
    }
    var g = ctx.createGain(), a = (o && o.a) || 0.004;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + a);
    if (o && o.flat) {                        // 버즈용: 어택-유지-릴리즈
      g.gain.setValueAtTime(peak, t0 + Math.max(a, dur - 0.02));
      g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    } else {                                  // 기본: 즉시 감쇠 (건조한 소리)
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    }
    head.connect(g); g.connect(master); nodes.push(g);
    live++; created++;
    src.onended = function () {               // 누수 방지: 전 노드 disconnect
      live--; src.onended = null;
      for (var i = 0; i < nodes.length; i++) { try { nodes[i].disconnect(); } catch (e) {} }
    };
    src.start(t0);
    src.stop(t0 + dur + 0.03);
  }

  function tone(t0, dur, peak, type, f0, f1, o) {
    var osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    voice(osc, t0, dur, peak, o);
  }

  function noise(t0, dur, peak, o) {
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    if (o && o.rate) src.playbackRate.value = o.rate;
    voice(src, t0, dur, peak, o);
  }

  /* ══════════ 사운드 정의 ══════════ */

  /* 설치 — 책상에 사물을 내려놓는 "턱" 소리. 유닛별 재질 차이 */
  var PLACE = {
    water:  { f: 150, f1: 48,  dur: 0.20, tp: "sine",     tv: 0.20, bp: 240,  np: 0.09, q: 6 },   // 물통 — 공명하는 빈 통
    wall:   { f: 100, f1: 40,  dur: 0.16, tp: "triangle", tv: 0.24, bp: 170,  np: 0.11, q: 1.5 }, // 파티션 — 묵직한 판
    copy:   { f: 185, f1: 72,  dur: 0.12, tp: "triangle", tv: 0.20, bp: 850,  np: 0.09, q: 1 },   // 복사기 — 기계 몸통
    stap:   { f: 330, f1: 140, dur: 0.06, tp: "square",   tv: 0.10, bp: 2600, np: 0.09, q: 2 },   // 스테이플러 — 금속 딸깍
    quit:   { f: 520, f1: 300, dur: 0.05, tp: "triangle", tv: 0.05, bp: 3600, np: 0.13, q: 0.8, paper: true } // 사직서 — 종이 놓기
  };
  // 학생 팩은 같은 역할의 재질로 매핑
  PLACE.vend = PLACE.water; PLACE.locker = PLACE.wall; PLACE.book = PLACE.copy;
  PLACE.pencil = PLACE.stap; PLACE.leave = PLACE.quit;

  function hashId(s) {
    s = String(s); var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function place(unitId) {
    var t0 = ready(); if (t0 < 0) return;
    var p = PLACE[unitId];
    if (!p) {                                 // 모르는 id — 해시로 재질을 변주
      var h = hashId(unitId);
      p = { f: 120 + h % 140, f1: 45 + h % 40, dur: 0.13, tp: "triangle",
            tv: 0.18, bp: 300 + h % 900, np: 0.10, q: 1.2 };
    }
    tone(t0, p.dur, p.tv, p.tp, p.f, p.f1);
    noise(t0, p.paper ? 0.09 : 0.05, p.np, { filter: ["bandpass", p.bp, p.bp * 0.6, p.q], a: 0.002 });
  }

  /* 발사 — 트레이에서 종이가 빠지는 "특". 초당 10회에도 거슬리지 않게 아주 짧고 작게 */
  function shoot(unitId) {
    if (!gate("shoot")) return;
    var t0 = ready(); if (t0 < 0) return;
    var hi = unitId === "stap" || unitId === "pencil";     // 스테이플러 계열은 더 딱딱하게
    var f = (hi ? 5200 : 3000) * (0.92 + Math.random() * 0.16);
    noise(t0, hi ? 0.028 : 0.042, hi ? 0.16 : 0.14,
          { filter: ["bandpass", f, f * 0.45, hi ? 1.6 : 1.1], a: 0.002 });
  }

  /* 명중 — 타격음은 세 겹으로 쌓는다. 한 겹이라도 빠지면 얇게 들린다.
       ① 트랜지언트  0~12ms, 아주 밝은 「딱」. 귀가 「닿았다」를 먼저 안다
       ② 몸통        음정이 빠르게 떨어지며 「맞았다」의 무게를 만든다
       ③ 서브        저역. 이게 없으면 화면은 흔들리는데 소리는 가볍다
     각 겹의 음량을 낮추고 겹 수를 늘린다 — 총량은 그대로 두고 두께만 키운다. */
  function hit() {
    if (!gate("hit")) return;
    var t0 = ready(); if (t0 < 0) return;
    var v = 0.92 + Math.random() * 0.16;                 // 연타가 기계음이 되지 않게
    noise(t0, 0.012, 0.20, { filter: ["highpass", 4200, 5400, 0.7], a: 0.0005 });
    noise(t0, 0.035, 0.23, { filter: ["bandpass", 2700 * v, 900, 1.2], a: 0.0012 });
    tone(t0, 0.070, 0.22, "triangle", 320 * v, 96, { a: 0.0015 });
    tone(t0 + 0.004, 0.085, 0.16, "sine", 128 * v, 52, { a: 0.002 });
  }

  /* 처치 — 종이 구겨짐 + 몸통이 떨어지는 둔중음.
     콤보가 쌓이면 음이 한 칸씩 올라간다(펜타토닉). 사이렌이 아니라 음악이 되게. */
  var LADDER = [1, 1.125, 1.25, 1.5, 1.6875, 2, 2.25, 2.5, 3];
  function kill(boss, combo) {
    var t0 = ready(); if (t0 < 0) return;
    var step = LADDER[Math.min(LADDER.length - 1, Math.floor((combo || 0) / 6))];
    if (boss) {
      noise(t0, 0.010, 0.24, { filter: ["highpass", 5000, 6200, 0.7], a: 0.0004 }); // 트랜지언트
      noise(t0, 0.34, 0.30, { filter: ["bandpass", 1400, 300, 0.8], a: 0.003, rate: 0.8 });
      tone(t0, 0.055, 0.26, "square", 180, 70, { a: 0.001 });          // 어택
      tone(t0 + 0.02, 0.46, 0.42, "sine", 108, 34, { a: 0.004 });      // 몸통
      tone(t0 + 0.02, 0.46, 0.18, "triangle", 54, 22, { a: 0.004 });   // 서브
    } else {
      noise(t0, 0.13, 0.23, { filter: ["bandpass", 1900, 520, 0.9], a: 0.0015 });
      tone(t0, 0.045, 0.17, "triangle", 420 * step, 180 * step, { a: 0.001 });
      tone(t0 + 0.015, 0.13, 0.21, "sine", 190 * step, 78, { a: 0.003 });
      tone(t0 + 0.008, 0.105, 0.14, "sine", 84, 44, { a: 0.002 });   // 쓰러지는 무게
    }
  }

  /* 갉아먹기 — 둔한 반복음. 아무리 많이 물어뜯어도 초당 5회 이하 */
  function chew() {
    if (!gate("chew")) return;
    var t0 = ready(); if (t0 < 0) return;
    noise(t0, 0.09, 0.24, { filter: ["lowpass", 520, 220, 1], a: 0.0015, rate: 0.7 });
    tone(t0, 0.10, 0.22, "triangle", 96, 52, { a: 0.002 });
  }

  /* 자원 획득 — 게임에서 유일하게 밝은 소리. 작은 보상 */
  function coin() {
    var t0 = ready(); if (t0 < 0) return;
    tone(t0, 0.22, 0.14, "sine", 1245, 1245, { a: 0.002 });
    tone(t0, 0.09, 0.05, "sine", 2530, 2530, { a: 0.002 });
  }

  /* 사직서/조퇴증 — 종이 찢기 → 낮은 둔중음. 게임에서 제일 큰 소리지만 여전히 건조하게 */
  function nuke() {
    var t0 = ready(); if (t0 < 0) return;
    noise(t0, 0.34, 0.42, { filter: ["bandpass", 3600, 280, 0.8], a: 0.006 });          // 찢기
    tone(t0, 0.10, 0.34, "square", 300, 90, { a: 0.001 });                              // 어택
    noise(t0 + 0.14, 0.60, 0.30, { filter: ["lowpass", 220, 70, 0.7], a: 0.008, rate: 0.55 }); // 럼블
    tone(t0 + 0.15, 0.65, 0.62, "sine", 96, 30, { a: 0.005 });                          // 둔중음
    tone(t0 + 0.15, 0.65, 0.22, "triangle", 48, 20, { a: 0.005 });                      // 서브
  }

  /* 보스 등장 — 낮은 드론이 부풀었다 멎는다 (~1.2초). 놀래키지 않는다 */
  /* 보스 등장 — 원래 52/55.5Hz 서브 드론뿐이었다. 폰 스피커는 200Hz
     아래를 못 낸다. 게임에서 제일 중요한 순간이 모바일에서 무음이었다.
     저역은 그대로 두되(헤드폰에서는 그게 무게다) 중역을 얹는다. */
  function bossIn() {
    var t0 = ready(); if (t0 < 0) return;
    tone(t0, 1.2, 0.15, "sawtooth", 52, 47, { a: 0.75, filter: ["lowpass", 270, 130, 4] });
    tone(t0, 1.2, 0.15, "sawtooth", 55.5, 50, { a: 0.75, filter: ["lowpass", 270, 130, 4] });
    tone(t0, 1.1, 0.03, "sine", 208, 197, { a: 0.7 });   // 형광등 험 같은 잔음
    /* 폰에서 실제로 들리는 몫 — 문이 닫히는 듯한 중역 한 방 + 낮은 화음 */
    noise(t0, 0.30, 0.30, { filter: ["bandpass", 620, 520, 0.9], a: 0.004 });
    tone(t0 + 0.02, 0.95, 0.20, "triangle", 312, 208, { a: 0.02 });
    tone(t0 + 0.02, 0.95, 0.13, "triangle", 416, 277, { a: 0.02 });
    tone(t0 + 0.02, 0.70, 0.07, "square", 624, 416, { a: 0.03, filter: ["lowpass", 2400, 1200, 1] });
  }

  /* 보스 예비동작 — 돌진·충격파가 나가기 0.45~0.55초 전에 울린다.
     그동안 소리는 「나간 뒤」에만 있었다. 미리 들리면 귀로 피할 수 있고,
     그때부터 그건 반사신경이 아니라 실력이 된다. */
  function windup() {
    var t0 = ready(); if (t0 < 0) return;
    noise(t0, 0.42, 0.26, { filter: ["bandpass", 700, 500, 1.2], a: 0.14, rate: 1.2 });
    tone(t0, 0.44, 0.20, "sawtooth", 180, 620, { a: 0.10, filter: ["lowpass", 1800, 3000, 1] });
  }
  /* 18:00 — 정시가 지났다. 형광등 릴레이가 탁 하고 절반이 꺼진다.
     여기서도 저역만 쓰면 폰에서 아무 일도 안 일어난 게 된다. */
  function overtimeIn() {
    var t0 = ready(); if (t0 < 0) return;
    noise(t0, 0.05, 0.34, { filter: ["highpass", 1400, 900, 0.8], a: 0.0005 });   // 릴레이 탁
    noise(t0 + 0.06, 0.10, 0.16, { filter: ["bandpass", 900, 700, 0.9], a: 0.002 });
    tone(t0, 1.5, 0.10, "sawtooth", 240, 120, { a: 0.01, filter: ["lowpass", 1200, 380, 2] });
    tone(t0 + 0.04, 1.4, 0.05, "sine", 120, 60, { a: 0.02 });                     // 험이 꺼진다
  }
  /* 문이 열린다 — 카드키 삑 두 번. 팡파르가 아니라 물리적인 소리여야
     「나가도 된다」로 읽힌다(그동안 승리 징글을 판당 아홉 번 썼다). */
  function doorOpen() {
    var t0 = ready(); if (t0 < 0) return;
    tone(t0, 0.07, 0.14, "square", 1760, 1760, { a: 0.002 });
    tone(t0 + 0.11, 0.09, 0.16, "square", 2637, 2637, { a: 0.002 });
    noise(t0 + 0.20, 0.22, 0.09, { filter: ["lowpass", 900, 420, 1], a: 0.02 });  // 문이 밀린다
  }
  /* 문을 지난다 — 짧은 훅 + 5도. 다음 구역으로 넘어간 게 귀로 닫혀야 한다 */
  function doorThru() {
    var t0 = ready(); if (t0 < 0) return;
    noise(t0, 0.30, 0.13, { filter: ["bandpass", 1100, 900, 0.8], a: 0.03, rate: 0.9 });
    tone(t0 + 0.02, 0.30, 0.10, "triangle", 392, 588, { a: 0.006 });
    tone(t0 + 0.02, 0.30, 0.07, "triangle", 262, 392, { a: 0.006 });
  }
  /* 맞았다 — 그동안 적이 갉는 소리(chew)를 그대로 썼다.
     내가 맞은 건지 남이 맞은 건지 귀로 구분이 안 됐다. */
  function hurt() {
    var t0 = ready(); if (t0 < 0) return;
    noise(t0, 0.13, 0.22, { filter: ["bandpass", 320, 260, 0.9], a: 0.001 });
    tone(t0, 0.16, 0.17, "sawtooth", 150, 62, { a: 0.001, filter: ["lowpass", 900, 300, 1] });
  }
  /* 체력이 얼마 안 남았다 — 야근엔 시간이 곧 체력이라, 경고가 없으면
     갑자기 죽는다. 두 번 치는 심장. */
  function lowhp() {
    var t0 = ready(); if (t0 < 0) return;
    tone(t0, 0.13, 0.14, "sine", 74, 52, { a: 0.004 });
    tone(t0 + 0.19, 0.16, 0.10, "sine", 66, 46, { a: 0.004 });
    /* 폰에서 실제로 들리는 몫 — 가슴을 치는 둔탁한 중역 */
    noise(t0, 0.11, 0.22, { filter: ["bandpass", 420, 300, 1.1], a: 0.002 });
    noise(t0 + 0.19, 0.13, 0.16, { filter: ["bandpass", 360, 260, 1.1], a: 0.002 });
    tone(t0, 0.12, 0.10, "triangle", 296, 208, { a: 0.003 });
    tone(t0 + 0.19, 0.14, 0.07, "triangle", 264, 185, { a: 0.003 });
  }

  /* UI 클릭 — 아주 작은 클릭 */
  function select() {
    if (!gate("select")) return;
    var t0 = ready(); if (t0 < 0) return;
    noise(t0, 0.02, 0.10, { filter: ["highpass", 2500, 0, 0.7], a: 0.001 });
  }

  /* 설치 불가 / 자원 부족 — 짧고 밋밋한 버즈 */
  function deny() {
    var t0 = ready(); if (t0 < 0) return;
    tone(t0, 0.14, 0.07, "square", 110, 106, { a: 0.005, flat: true, filter: ["lowpass", 900, 0, 0.8] });
  }

  /* 승리 — 짧게 올라가며 매듭. 팡파르 아님 */
  /* 레벨업 — 짧은 상승 아르페지오. 보상이라는 걸 귀로 알아야 한다 */
  function levelup() {
    var t0 = ready(); if (t0 < 0) return;
    var f = [523, 659, 784, 1047];
    for (var i = 0; i < f.length; i++)
      tone(t0 + i * 0.055, 0.26, 0.20, "triangle", f[i], f[i], { a: 0.004 });
    tone(t0, 0.34, 0.12, "sine", 131, 131, { a: 0.006 });
  }

  function win() {
    var t0 = ready(); if (t0 < 0) return;
    var notes = [349.2, 440, 523.3, 698.5];
    for (var i = 0; i < notes.length; i++) {
      var last = i === notes.length - 1;
      tone(t0 + i * 0.13, last ? 0.5 : 0.28, last ? 0.13 : 0.10, "triangle", notes[i], notes[i], { a: 0.006 });
    }
  }

  /* 패배 — 미끄러지듯 내려가는 하강 */
  function lose() {
    var t0 = ready(); if (t0 < 0) return;
    var notes = [392, 311.1, 261.6, 196];
    for (var i = 0; i < notes.length; i++) {
      tone(t0 + i * 0.18, 0.35, 0.10, "sine", notes[i], notes[i] * 0.93, { a: 0.008 });
    }
  }

  /* ══════════ 제어 ══════════ */

  function setMuted(b) {
    b = !!b;
    muted = b; api.muted = b;
    writeMuted(b);
    if (ctx && master) {                      // 즉시·완전 소거: 게인 자체를 램프
      try {
        var t = ctx.currentTime, g = master.gain;
        var target = b ? 0 : MASTER_LEVEL;
        g.cancelScheduledValues(t);
        g.setValueAtTime(masterNow, t);       // .value 게터는 믿지 않는다 (stale 가능)
        g.linearRampToValueAtTime(target, t + 0.03);
        masterNow = target;
      } catch (e) {}
    }
  }

  function resume() { ensure(); }

  /* 어떤 상황에서도 게임 루프에 예외를 던지지 않는다 */
  function safe(fn) {
    return function () { try { return fn.apply(null, arguments); } catch (e) {} };
  }

  /* ── 배경음 ────────────────────────────────────────────────────
     음원 파일이 아니라 합성이다. 파일 하나 구조를 지키면서 하루가
     흘러가는 걸 귀로 느끼게 하려면 이쪽이 맞다 —
     시각이 갈수록 템포가 빨라지고 화성이 조여든다.

     구성은 셋뿐이다. 더 넣으면 총소리와 싸운다.
       베이스   한 박자에 한 번. 하루의 맥박
       아르페지오 네 음. 오전엔 느슨하고 오후엔 촘촘해진다
       하이햇   오후부터 들어온다. 초조함

     음계: A 단조 펜타토닉. 어느 두 음을 겹쳐도 불협이 안 난다 —
     타격음이 아무 때나 끼어드는 게임이라 이게 중요하다. */
  var bgm = null;                         // { gain, timer, step, tense }
  var BGM_ROOT = 55;                      // A1
  var PENTA = [0, 3, 5, 7, 10];           // 단조 펜타토닉
  function bgmNote(t0, hz, dur, peak, type, o) {
    if (!ctx || muted) return;
    try {
      var osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = type || "triangle";
      osc.frequency.setValueAtTime(hz, t0);
      if (o && o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(peak, t0 + (o && o.a || 0.012));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(bgm.gain);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
      osc.onended = function () { try { osc.disconnect(); g.disconnect(); } catch (e) {} };
    } catch (e) {}
  }
  function bgmHat(t0, peak) {
    if (!ctx || muted || !noiseBuf) return;
    try {
      var src = ctx.createBufferSource(); src.buffer = noiseBuf;
      var f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7200;
      var g = ctx.createGain();
      g.gain.setValueAtTime(peak, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.035);
      src.connect(f); f.connect(g); g.connect(bgm.gain);
      src.start(t0); src.stop(t0 + 0.05);
      src.onended = function () { try { src.disconnect(); f.disconnect(); g.disconnect(); } catch (e) {} };
    } catch (e) {}
  }
  function bgmTick() {
    if (!bgm || !ctx || bgm.music) return;
    var t = ctx.currentTime + 0.06;
    var k = bgm.tense;                    // 0=아침 1=마감
    var i = bgm.step;
    /* 베이스 — 4스텝마다. 오후엔 5도를 오간다 */
    if (i % 4 === 0) {
      var root = BGM_ROOT * (i % 16 < 8 ? 1 : (k > 0.5 ? 1.3348 : 1.1892));
      bgmNote(t, root, 0.42, 0.16 + k * 0.05, "triangle", { a: 0.02 });
    }
    /* 아르페지오 — 오전엔 두 스텝에 한 번, 오후엔 매 스텝 */
    if (k > 0.45 || i % 2 === 0) {
      var deg = PENTA[(i + (i >> 2)) % PENTA.length];
      var oct = k > 0.7 && i % 8 === 6 ? 8 : 4;
      var hz = BGM_ROOT * Math.pow(2, (deg + 12 * oct) / 12);
      bgmNote(t, hz, 0.17 + (1 - k) * 0.08, 0.055 + k * 0.03, "square", { a: 0.006 });
    }
    /* 하이햇 — 오후부터 */
    if (k > 0.35 && i % 2 === 1) bgmHat(t, 0.028 + k * 0.03);
    bgm.step = (i + 1) % 16;
    var bpm = 84 + k * 54;                // 84 → 138
    bgm.timer = setTimeout(bgmTick, (60 / bpm / 2) * 1000);
  }
  /* ── 샘플 효과음 ───────────────────────────────────────────────
     원래는 게임 쪽에서 <audio> 풀 5개로 틀었다. 그게 만든 문제들:
       · master를 안 거쳐서 음소거도 마스터 볼륨도 안 먹었다
       · 안전망 컴프레서를 안 거쳐서 떼로 죽을 때 합산이 그대로 나갔다
       · 합성 쪽에만 있던 스로틀이 없어, 한 프레임에 여덟 대를 맞히면
         풀 5개가 동시에 시작하고 셋은 currentTime=0으로 강제 재시작됐다
       · HTMLAudio는 모바일에서 지연이 크다
       · 콤보에 따라 처치음이 올라가던 사다리가 사라졌다(인자를 버렸다)
     전부 Web Audio로 옮기면 한 번에 풀린다. */
  var SMP = { src: {}, buf: {}, state: 0 };      // 0=미시작 1=디코드중 2=끝
  function sampleSrc(map) {
    for (var k in map) if (!SMP.src[k]) SMP.src[k] = map[k];
  }
  function sampleDecode() {
    if (!ctx || SMP.state) return;
    SMP.state = 1;
    var names = Object.keys(SMP.src);
    Promise.all(names.map(function (k) {
      return fetch(SMP.src[k]).then(function (r) { return r.arrayBuffer(); })
        .then(function (ab) { return ctx.decodeAudioData(ab); })
        .then(function (b) { SMP.buf[k] = b; })
        .catch(function () {});                  // 하나가 실패해도 나머지는 산다
    })).then(function () { SMP.state = 2; });
  }
  function sampleReady(name) { return !!SMP.buf[name]; }
  function playSample(name, vol, rate) {
    var b = SMP.buf[name]; if (!b) return false;
    if (!ensure()) return false;
    if (muted) return true;                      // 처리는 했다 — 합성으로 새지 않게
    if (THROTTLE[name] !== undefined && !gate(name)) return true;
    if (live >= MAX_VOICES) { dropped++; return true; }
    try {
      var s = ctx.createBufferSource(), g = ctx.createGain();
      s.buffer = b;
      if (rate) s.playbackRate.value = rate;
      g.gain.value = vol === undefined ? 0.6 : vol;
      s.connect(g); g.connect(master);           // master 앞 — 음소거가 먹어야 한다
      live++; created++;
      s.onended = function () { live--; try { s.disconnect(); g.disconnect(); } catch (e) {} };
      s.start();
      return true;
    } catch (e) { return false; }
  }

  /* ── 음악 — 두 겹을 겹쳐 하루를 따라간다 ────────────────────
     합성 아르페지오는 사각파 한 음씩이라 「띡 띡 띡」으로 들렸다.
     그건 음악이 아니라 삐 소리다. 실제 게임들은 합성하지 않고 곡을 깐다.

     그래서 CC0(저작권 포기) 샘플 팩에서 같은 곡의 레이어 둘을 가져왔다 —
     패드와 드럼. 같은 곡이라 조와 템포가 처음부터 맞는다.
     둘을 따로 틀고 게인만 움직인다: 아침엔 패드만 멀리서, 오후엔 드럼이
     붙고, 마감이 가까울수록 저역 필터가 열려 앞으로 나온다.
     곡을 바꾸는 게 아니라 같은 곡이 조여 오는 것이라 끊기지 않는다.

     이 「시계에 맞춰 겹을 쌓는다」가 우리 요소다. 소재는 남의 것이지만
     하루가 조여 오는 방식은 이 게임이 정한 것이다.

     길이는 둘 다 497982샘플로 미리 잘라 뒀다. 그래도 Vorbis 디코드가
     끝에 패딩을 붙여 832샘플(19ms) 차이가 나므로, loopEnd를 둘 다
     악보상의 길이로 못 박는다 — 안 그러면 몇 분 뒤부터 박자가 밀린다. */
  var MUS = { src: null, buf: null, loading: 0, loop: 497982 / 44100 };
  function bgmSrc(pad, drum) { if (pad && drum) MUS.src = { pad: pad, drum: drum }; }
  function musDecode(then) {
    if (MUS.buf) { then(); return; }
    if (!MUS.src || MUS.loading) return;
    MUS.loading = 1;
    var names = ["pad", "drum"], out = {};
    Promise.all(names.map(function (k) {
      return fetch(MUS.src[k]).then(function (r) { return r.arrayBuffer(); })
        .then(function (ab) { return ctx.decodeAudioData(ab); })
        .then(function (b) { out[k] = b; });
    })).then(function () {
      MUS.buf = out; MUS.loading = 0; then();
    }).catch(function () { MUS.loading = 2; then(); });   // 2 = 실패, 합성으로 간다
  }
  /* 패드는 필터를 안 거친다. 이 패드는 원래 어두워서(2.6kHz 위가 −61dB)
     로우패스를 걸어도 1.9dB밖에 안 깎이고, 대신 폰 스피커에서 안 들릴
     위험만 커진다. 필터가 실제로 듣는 건 하이햇이 있는 드럼 쪽이다. */
  function musLayer(buf, t0, thru) {
    var s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = buf; s.loop = true; s.loopStart = 0; s.loopEnd = MUS.loop;
    g.gain.value = 0.0001;
    s.connect(g); g.connect(thru ? bgm.gain : bgm.filt);
    s.start(t0);
    return { src: s, gain: g, now: 0.0001, rate: s.playbackRate };
  }
  function musStart() {
    var t0 = ctx.currentTime + 0.06;
    bgm.pad = musLayer(MUS.buf.pad, t0, true);   // 패드는 필터 우회
    bgm.drum = musLayer(MUS.buf.drum, t0, false);
    bgm.music = 1;
    musMix(0, 1.6);
  }
  /* 게인·필터를 k에 맞춘다. 매 프레임 오는 값이라 변화가 작으면 건드리지 않는다 */
  function musMix(k, ramp) {
    if (!bgm || !bgm.music) return;
    var t = ctx.currentTime, r = ramp || 0.45;
    /* 하루가 갈수록 커져야 한다. 그리고 난이도가 정점인 마지막 한 시간에
       음악이 더 갈 데가 없으면 안 된다 — 드럼이 다 차는 지점을 0.75로 미룬다 */
    var padG  = 0.62 - k * 0.10;                       // 패드는 늘 깔린다
    var drumG = k < 0.22 ? 0.0001 : Math.min(1, (k - 0.22) / 0.53) * 0.95;
    var cut   = 900 * Math.pow(17.8, k);               // 900Hz → 16kHz (드럼에만)
    set(bgm.pad,  padG,  r, t); set(bgm.drum, drumG, r, t);
    if (Math.abs(cut - bgm.cutNow) / bgm.cutNow > 0.04) {
      bgm.cutNow = cut;
      try { bgm.filt.frequency.setTargetAtTime(cut, t, r * 0.5); } catch (e) {}
    }
    function set(L, v, rr, tt) {
      if (!L || Math.abs(v - L.now) < 0.02) return;
      L.now = v;
      try { L.gain.gain.setTargetAtTime(v, tt, rr * 0.5); } catch (e) {}
    }
  }
  function bgmStart() {
    var c = ensure(); if (!c) return;
    if (bgm) return;
    var g = ctx.createGain();
    g.gain.value = 0.0001;
    var filt = ctx.createBiquadFilter();
    filt.type = "lowpass"; filt.frequency.value = 900; filt.Q.value = 0.6;
    filt.connect(g);
    /* master 뒤(outTail=컴프레서)에 물리면 음소거도 마스터 볼륨도 음악을
       비켜간다. 반드시 master 앞이어야 한다 */
    g.connect(master);
    g.gain.linearRampToValueAtTime(0.52, ctx.currentTime + 1.4);   // 천천히 들어온다
    bgm = { gain: g, filt: filt, cutNow: 900, timer: null, step: 0, tense: 0, ot: 0,
            music: 0, pad: null, drum: null };
    var mine = bgm;
    musDecode(function () {
      if (bgm !== mine || bgm.music) return;
      if (MUS.buf) musStart();
      else bgmTick();                                   // 음원이 없거나 실패 — 합성으로
    });
    if (!MUS.src) bgmTick();
  }
  function bgmStop() {
    if (!bgm) return;
    clearTimeout(bgm.timer);
    try { bgm.gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.5); } catch (e) {}
    var old = bgm; bgm = null;
    setTimeout(function () {
      try { if (old.pad) old.pad.src.stop(); } catch (e) {}
      try { if (old.drum) old.drum.src.stop(); } catch (e) {}
      try { old.gain.disconnect(); } catch (e) {}
      try { old.filt.disconnect(); } catch (e) {}
    }, 900);
  }
  /* 게임이 매 프레임 알려준다: 0=09시 1=18시 */
  function bgmTense(v, ot) {
    if (!bgm) return;
    bgm.tense = Math.max(0, Math.min(1, v));
    if (!bgm.music) return;
    musMix(bgm.tense);
    /* 야근 — 에너지는 이미 최대라 더 올릴 게 없다. 대신 성격을 바꾼다.
       박자를 밀고(170→최대 184BPM) 낮의 위안인 패드를 걷어낸다.
       loopEnd는 버퍼 시간 기준이라 둘을 같이 밀면 동기는 유지된다. */
    var o = Math.max(0, Math.min(1, ot || 0));
    if (o === bgm.ot) return;
    bgm.ot = o;
    var t = ctx.currentTime, r = 1 + o * 0.082;
    try { bgm.pad.rate.setTargetAtTime(r, t, 4); } catch (e) {}
    try { bgm.drum.rate.setTargetAtTime(r, t, 4); } catch (e) {}
    try { bgm.pad.gain.gain.setTargetAtTime(0.52 - o * 0.40, t, 3); } catch (e) {}
    if (o > 0) bgm.pad.now = -1;                    // musMix가 다시 덮지 않게
  }

  var api = {
    place: safe(place),
    shoot: safe(shoot),
    hit: safe(hit),
    kill: safe(kill),
    chew: safe(chew),
    coin: safe(coin),
    nuke: safe(nuke),
    bossIn: safe(bossIn),
    windup: safe(windup),
    overtimeIn: safe(overtimeIn),
    doorOpen: safe(doorOpen),
    doorThru: safe(doorThru),
    hurt: safe(hurt),
    lowhp: safe(lowhp),
    select: safe(select),
    deny: safe(deny),
    levelup: safe(levelup),
    win: safe(win),
    lose: safe(lose),
    sampleSrc: safe(sampleSrc),
    sampleReady: sampleReady,
    playSample: safe(playSample),
    bgmSrc: safe(bgmSrc),
    bgmStart: safe(bgmStart),
    bgmStop: safe(bgmStop),
    bgmTense: safe(bgmTense),
    setMuted: safe(setMuted),
    muted: muted,
    resume: safe(resume),
    /* 테스트/디버그 계측 — 게임 코드는 사용하지 않음 */
    _debug: function () {
      return { live: live, created: created, dropped: dropped, ctx: ctx, master: master, out: outTail,
               masterGain: master ? master.gain.value : null, masterTarget: master ? masterNow : null,
               state: ctx ? ctx.state : null };
    }
  };
  window.SFX = api;
})();
</script>

<script>
/* ═══ 스프라이트 (design/ 아트 디렉션 기반) ═══ */
/* _sprites.js — 출근 저지 벡터 스프라이트
   아트 디렉션: design/Units.dc.html, design/Foes.dc.html (「형광등 꺼진 사무실」)
   전 함수 시그니처: (ctx, cx, cy, s) — cx,cy 중심, s = 정사각 박스 한 변(px).
   순수 Canvas2D 패스만 사용. 이모지/텍스트/이미지 없음. */
(function () {
  "use strict";

  /* ── 팔레트 ── */
  var PAPER = "#f2f5fa", PAPER2 = "#dfe6f2", PAPER3 = "#c3ccdb";
  var G1 = "#98a4b8", G2 = "#74829a", G3 = "#5d6a7f", G4 = "#4c5769", INK = "#2f3542";
  var BLUE = "#9ec8ff", BLUE2 = "#6f9fd8";
  var YEL = "#f5c451", YEL2 = "#d9a94e";
  var RED = "#ff6b6b", DRED = "#b93b3b";
  var SKIN = "#e8d3bd", HAIR = "#2f3542";

  /* 둥근 사각형 패스 (roundRect 폴리필 불요) */
  function rr(ctx, x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function frr(ctx, x, y, w, h, r, fill) {
    ctx.fillStyle = fill;
    rr(ctx, x, y, w, h, r);
    ctx.fill();
  }

  /* 72×72 디자인 좌표계로 진입 (Units.dc.html의 viewBox와 동일) */
  function in72(ctx, cx, cy, s) {
    ctx.save();
    ctx.translate(cx, cy);
    var k = s / 72;
    ctx.scale(k, k);
    ctx.translate(-36, -36);
  }

  /* ══════════ 설치 사물 (오른쪽을 향함) ══════════ */

  /* 정수기 — 흰 본체, 파란 물통, 파란 꼭지(오른쪽) */
  function water(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    frr(ctx, 20, 30, 32, 34, 3, PAPER2);          // 본체
    frr(ctx, 20, 30, 32, 8, 2, G1);               // 상단 밴드
    ctx.fillStyle = BLUE;                          // 거꾸로 꽂힌 물통
    ctx.beginPath();
    ctx.moveTo(28, 8); ctx.lineTo(44, 8);
    ctx.lineTo(41, 28); ctx.lineTo(31, 28);
    ctx.closePath(); ctx.fill();
    frr(ctx, 27, 4, 18, 6, 2, BLUE2);             // 물통 목
    frr(ctx, 38, 44, 8, 9, 2, BLUE2);             // 꼭지 — 진행 방향(오른쪽)
    ctx.restore();
  }

  /* 파티션 — 3단 접이식, 가운데가 가장 큼 */
  function wall(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    frr(ctx, 6, 18, 20, 42, 2, G3);
    frr(ctx, 46, 22, 18, 38, 2, G4);
    frr(ctx, 26, 12, 20, 48, 2, G2);
    ctx.restore();
  }

  /* 복사기 — 회색 몸통, 세워진 원고, 노란 배출 트레이(오른쪽) */
  function copy(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    frr(ctx, 10, 26, 48, 30, 4, PAPER3);          // 몸통
    frr(ctx, 10, 26, 48, 9, 3, G1);               // 상단 패널
    frr(ctx, 20, 8, 28, 18, 2, PAPER);            // 원고
    frr(ctx, 24, 13, 20, 2.5, 1, G1);
    frr(ctx, 24, 18, 14, 2.5, 1, G1);
    frr(ctx, 30, 44, 26, 14, 2, YEL);             // 배출 트레이 — 오른쪽
    ctx.restore();
  }

  /* 스테이플러 — 비스듬한 2단 몸체 + 파란 윗팔 */
  function stap(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    ctx.fillStyle = G4;                            // 받침
    ctx.beginPath();
    ctx.moveTo(8, 44); ctx.lineTo(56, 44);
    ctx.arcTo(61, 44, 61, 49, 5);
    ctx.lineTo(61, 55); ctx.lineTo(8, 55);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = G2;                            // 중간 몸체
    ctx.beginPath();
    ctx.moveTo(12, 26); ctx.lineTo(52, 26);
    ctx.arcTo(58, 26, 58, 32, 6);
    ctx.lineTo(58, 42); ctx.lineTo(12, 42);
    ctx.closePath(); ctx.fill();
    frr(ctx, 14, 18, 36, 8, 3, BLUE);             // 윗팔
    frr(ctx, 20, 46, 22, 4, 1, PAPER2);           // 심 배출구
    ctx.restore();
  }

  /* 사직서 — 흰 종이, 3줄 텍스트, 우하단 빨간 도장 */
  function quit(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    frr(ctx, 14, 6, 38, 52, 3, PAPER);
    frr(ctx, 21, 16, 24, 3, 1.5, G1);
    frr(ctx, 21, 24, 24, 3, 1.5, G1);
    frr(ctx, 21, 32, 16, 3, 1.5, G1);
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.arc(44, 46, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.4;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(40, 46); ctx.lineTo(43, 49); ctx.lineTo(49, 43);
    ctx.stroke();
    ctx.restore();
  }

  /* ══════════ 적 (왼쪽을 향해 걸어옴) ══════════ */
  /* 공통 몸: 발밑 그림자 + 몸통 라운드렉트 + 살색 머리 + 반원 머리카락.
     시선(눈 두 점)을 왼쪽으로 몰아 진행 방향을 표시. 소품도 왼쪽 손에. */

  function foeBase(ctx, torso, wide) {
    var tx = wide ? 18 : 22, tw = wide ? 40 : 32;   // 보스는 어깨가 넓다
    ctx.fillStyle = "rgba(0,0,0,.35)";               // 그림자
    ctx.beginPath();
    ctx.ellipse(38, 90, wide ? 24 : 21, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    frr(ctx, tx, 36, tw, 44, 9, torso);              // 몸통
    ctx.fillStyle = SKIN;                            // 머리
    ctx.beginPath(); ctx.arc(38, 22, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = HAIR;                            // 머리카락(윗 반원)
    ctx.beginPath(); ctx.arc(38, 20, 14, Math.PI, 0, false); ctx.closePath(); ctx.fill();
    ctx.fillStyle = INK;                             // 눈 — 왼쪽을 본다
    ctx.beginPath(); ctx.arc(29, 25, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(36, 25, 1.8, 0, Math.PI * 2); ctx.fill();
  }

  /* 76×96 디자인 좌표계로 진입 (Foes.dc.html의 viewBox와 동일) */
  function makeFoe(torso, wide, prop) {
    return function (ctx, cx, cy, s) {
      ctx.save();
      ctx.translate(cx, cy);
      var k = s / 96;
      ctx.scale(k, k);
      ctx.translate(-38, -48);
      foeBase(ctx, torso, wide);
      if (prop) prop(ctx);
      ctx.restore();
    };
  }

  var foes = {
    /* 인턴 — 목걸이 사원증 */
    intern: makeFoe("#8b97ab", false, function (ctx) {
      frr(ctx, 30, 40, 16, 5, 2, G4);               // 스트랩 클립
      frr(ctx, 34, 44, 8, 14, 2, BLUE);             // 카드
    }),
    /* 사원 — 빨간 넥타이 */
    staff: makeFoe("#6d7d96", false, function (ctx) {
      ctx.fillStyle = RED;
      ctx.beginPath();
      ctx.moveTo(38, 40); ctx.lineTo(43, 45); ctx.lineTo(38, 63); ctx.lineTo(33, 45);
      ctx.closePath(); ctx.fill();
    }),
    /* 대리 — 옆구리의 노란 서류철 (진행 방향 손) */
    senior: makeFoe("#5b7bab", false, function (ctx) {
      frr(ctx, 12, 50, 20, 16, 2, YEL);
      frr(ctx, 12, 50, 20, 4, 2, YEL2);
    }),
    /* 과장 — 앞에 든 운전대 */
    manager: makeFoe("#a8703f", false, function (ctx) {
      ctx.strokeStyle = INK; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(38, 56, 11, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(38, 56, 3, 0, Math.PI * 2); ctx.fill();
    }),
    /* 부장 — 어두운 서류가방 (진행 방향 손) */
    gm: makeFoe("#a04a4a", false, function (ctx) {
      frr(ctx, 15, 48, 8, 5, 2, INK);               // 손잡이
      frr(ctx, 8, 52, 22, 18, 3, INK);              // 가방
      ctx.fillStyle = "#1f232c";                    // 가방 이음선
      ctx.fillRect(8, 59, 22, 3);
    }),
    /* 회식조 — 치켜든 맥주잔 + 발그레한 볼 */
    drunk: makeFoe("#c99a3f", false, function (ctx) {
      frr(ctx, 16, 44, 14, 18, 2, YEL);             // 잔
      frr(ctx, 16, 44, 14, 5, 2, PAPER);            // 거품
      ctx.save();
      ctx.globalAlpha = 0.7; ctx.fillStyle = RED;    // 볼터치
      ctx.beginPath(); ctx.arc(30, 27, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(46, 27, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }),
    /* 점검단(보스) — 줄 그어진 흰 클립보드, 어깨 넓음 */
    audit: makeFoe(DRED, true, function (ctx) {
      frr(ctx, 6, 44, 24, 30, 2, PAPER);            // 보드
      frr(ctx, 6, 44, 24, 6, 2, G1);                // 클립
      ctx.fillStyle = G1;
      ctx.fillRect(11, 55, 14, 2.5);
      ctx.fillRect(11, 61, 14, 2.5);
      ctx.fillRect(11, 67, 9, 2.5);
    })
  };

  /* ══════════ 내 자리 — 옆에서 본 사무용 의자 (오른쪽을 향함) ══════════ */
  function seat(ctx, cx, cy, s) {
    in72(ctx, cx, cy, s);
    frr(ctx, 16, 8, 11, 34, 5, BLUE2);              // 등받이 (왼쪽 = 뒤)
    frr(ctx, 16, 36, 36, 11, 5, BLUE2);             // 좌판 — 오른쪽으로 열림
    frr(ctx, 30, 47, 7, 12, 2, G4);                 // 기둥
    frr(ctx, 16, 58, 36, 5, 2.5, G4);               // 다리
    ctx.fillStyle = INK;                            // 바퀴
    ctx.beginPath(); ctx.arc(20, 65, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(48, 65, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  window.SPRITES = {
    units: { water: water, wall: wall, copy: copy, stap: stap, quit: quit },
    foes: foes,
    seat: seat
  };
})();
</script>

<script>
/* _rank_chars.js — 「정시 퇴근」 직급 캐릭터 v3 (동작 개편판)
   ────────────────────────────────────────────────────────────────
   v2의 문제: 전원 정지 포즈 한 장. 엔진이 기울이기/스케일로 움직임을
   흉내냈고, 맞아도 몸이 반응하지 않았다.
   이 판의 원칙: **몸이 직접 움직인다.** 걷고, 맞고, 쓰러진다.

   전 함수 시그니처: (ctx, cx, cy, s, pose)
   · pose = { a:"walk"|"hit"|"die"|"attack"|"idle", p:0..1, t:초 }
   · pose 생략 → 중립 서기(v2와 동일한 실루엣). 미지의 a → idle.
   · cx,cy = 중심, s = 박스 한 변. 적 52px, 보스 76px.
   · 순수 Canvas2D 패스만. save/restore 짝 맞춤 — 상태 누수 0.
   · 전원 왼쪽을 본다. 엔진이 좌우 반전.
   · 발은 지면선 cy + 0.34*s (설계좌표 y=+34). die만 예외 —
     끝 프레임은 그 선 위에 눕는다. 걷기는 한 발이 항상 땅에 붙는다.
   · 설계 좌표계: 100×100 유닛, 중심 (0,0), 지면 y=+34.

   동작 설계:
   · walk  p 0→1 반복. 무릎 굽는 진짜 보행 — 든 발은 앞으로만 움직이고
           디딤발은 항상 땅. 몸은 한 사이클에 두 번 출렁(sin²),
           팔은 다리와 반대 스윙, 머리는 반 박자 늦게 따라온다.
   · hit   p 0→1 한 번(~0.15s). 보는 방향 반대(+x)로 젖혀진다 —
           머리 스냅, 상체 아치, 팔 튕김, 앞다리 버팀. p=0.35 최대.
   · die   p 0→1 한 번(~0.4s). 무릎 꺾임 → 뒤로 회전 → 지면선에 눕기.
           불투명 유지(페이드는 엔진 몫).
   · attack 기본은 앞으로 숙이며 뻗기. hero만 결재도장 풀스윙.
   · idle  t 기반 호흡 — 서 있는 군중이 얼어붙지 않게. */
(function () {
  "use strict";

  /* ── 팔레트 — v2 계승 ── */
  var SKIN  = "#e8d3bd";
  var HAIR  = "#262b38";
  var INKD  = "#1d2129";
  var PAPER = "#f2f5fa", PAPER2 = "#dfe6f2";
  var OUT   = "rgba(6,8,13,0.85)";
  var YEL   = "#f5c451", YEL2 = "#d9a94e";
  var RED   = "#ff6b6b";
  var BLUE  = "#6f9fd8";

  /* ── 직급 팔레트 ───────────────────────────────────────────────
     원래는 사원·대리·회식조·신입·본부장 다섯이 전부 남회색이었다.
     40px에서는 색 계열이 곧 정체다 — 값만 다르면 같은 놈으로 읽힌다.
     실제로 플레이한 사람이 「다 똑같고 색상만 다르다」고 했고, 실물 크기로
     나란히 놓고 보니 맞는 말이었다.

     같은 장르 오픈소스의 적 시트를 열어 보니 답이 분명했다 — 32px인데
     갈색·황갈·강철청·적회·파란 덩어리·남색 로브·살구로 계열이 전부 다르고,
     밝은 놈과 어두운 놈이 섞여 있었다. 사무실이라 다 정장이라는 건
     핑계였다. 여기서는 계열과 명도를 함께 벌린다.

     밝은 축: 인턴(흰 셔츠) · 인사팀(가장 밝고 각짐) · 신입(노랑)
     어두운 축: 점검단 · 대표이사
     그 사이를 계열로 나눈다: 남색 · 청록 · 갈색 · 적 · 주황 · 크라프트 · 자주 */
  var C_INTERN = "#c2c9d4", C_INTERN2 = "#a4abb8", C_INTERN3 = "#8e95a3";
  var C_STAFF  = "#46689b", C_STAFF2  = "#375380";   // 남색 — 기준점
  var C_SENIOR = "#4b8f86", C_SENIOR2 = "#3b736c";   // 청록
  var C_MGR    = "#9a7a4a", C_MGR2    = "#7e623a";   // 갈색 — 배가 나온다
  var TIE_MGR  = "#e08a3c";
  var C_GM     = "#a8433f", C_GM2     = "#87332f";   // 적 — 이미 잘 읽혔다
  var C_AUDIT  = "#3a4254", C_AUDIT2  = "#2d3444", C_AUDIT3 = "#222836";
  var C_DRUNK  = "#e07a3c", C_DRUNK2  = "#bd6130";   // 주황 — 가장 튄다
  var AMBER    = "#e0aa4b";
  var TROUS    = "#2b3140", TROUS2 = "#222735";
  var C_ROOK   = "#dcb13c", C_ROOK2   = "#b88f2c";   // 노랑 — 급한 놈
  var C_HR     = "#dfe4ec", C_HR2     = "#bcc3ce";   // 흰 셔츠 — 가장 밝고 각짐
  var C_VEND   = "#8a6b47", C_VEND2   = "#6f5638";   // 크라프트 — 상자를 안았다
  var C_CHIEF  = "#5b3a6e", C_CHIEF2  = "#472c56";   // 자주 — 보스는 튀어야 한다
  var C_CEO    = "#22283a", C_CEO2    = "#1a1f2d";

  /* ── 음영 톤 — 광원은 왼쪽 위(보는 방향). 오른쪽이 그늘 ── */
  var SH  = "rgba(9,11,18,0.20)";     // 몸통 그늘면
  var SH2 = "rgba(9,11,18,0.30)";     // 턱밑·목 그림자
  var LT  = "rgba(255,255,255,0.14)"; // 빛 받는 왼쪽 모서리
  var HL  = "rgba(255,255,255,0.22)"; // 머리카락 하이라이트

  /* ── 공용 도형 (v2 그대로) ── */
  function rrPath(ctx, x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function box(ctx, x, y, w, h, r, fill) {
    rrPath(ctx, x, y, w, h, r);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.7; ctx.stroke();
  }
  function disc(ctx, x, y, r, fill) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 1.7; ctx.stroke();
  }
  function limb(ctx, x1, y1, x2, y2, w, color) {
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = OUT; ctx.lineWidth = w + 2.2; ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
  }
  function stroke(ctx, color, w, fn) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.beginPath(); fn(ctx); ctx.stroke();
  }
  function dot(ctx, x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function hairCap(ctx, hx, hy, hr, drop) {
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.arc(hx, hy, hr, Math.PI, 0, false);
    ctx.lineTo(hx + hr, hy + 1.5);
    ctx.quadraticCurveTo(hx + hr * 0.4, hy - hr * 0.15 + drop,
                         hx, hy - hr * 0.3 + drop);
    ctx.quadraticCurveTo(hx - hr * 0.6, hy - hr * 0.45 + drop,
                         hx - hr, hy - hr * 0.25);
    ctx.closePath(); ctx.fill();
  }
  function unit(ctx, cx, cy, s, fn) {
    ctx.save();
    ctx.translate(cx, cy);
    var k = s / 100;
    ctx.scale(k, k);
    fn(ctx);
    ctx.restore();
  }

  /* ── 음영 도구 ── */

            foll = sstep((M.p - 0.6) / 0.4);

  /* ══════════ 대표이사 — 최종. 코트 자락, 금테, 안 서두른다 ══════════ */
  function ceo(ctx, cx, cy, s, pose) {

  /* ══════════ 자동화 로봇 — 사람이 아니다. 실루엣부터 달라야 한다 ══════════
     직급 12종이 전부 「정장 입은 사람」이라, 이것만은 각지고 다리가 없다.
     바퀴로 미끄러지고, 팔은 집게고, 얼굴 자리에 화면이 있다. */
  /* 외곽선 없는 둥근 채움 — 로봇 패널용 */
  function fillR(ctx, x, y, w, h, r, col) { ctx.fillStyle = col; rrPath(ctx, x, y, w, h, r); ctx.fill(); }
  function botunit(ctx, cx, cy, s, pose) {
    unit(ctx, cx, cy, s, function (ctx) {
      var M = motion(pose, G.hero);
      var a = M.a, p = M.p, t = M.t;
      var roll = a === "walk" ? Math.sin(p * 6.2831853) : 0;
      var dead = a === "die";
      ctx.save();
      if (dead) {                                   // 쓰러짐 — 옆으로 넘어가며 꺼진다
        var k = sstep(p / 0.7);
        ctx.translate(0, 34); ctx.rotate(-1.35 * k); ctx.translate(0, -34);
        ctx.globalAlpha = 1 - 0.35 * sstep((p - 0.6) / 0.4);
      }
      if (a === "hit") { var hk = p < 0.35 ? Math.sin(p / 0.35 * 1.5708) : Math.cos((p - 0.35) / 0.65 * 1.5708);
                         ctx.translate(4.5 * hk, 1.2 * hk); }
      /* 바퀴 — 다리가 없다 */
      fillR(ctx, -17, 20, 34, 12, 6, "#23272f");
      dot(ctx, -10 + roll * 2, 26, 5, "#3a4049");
      dot(ctx, 10 + roll * 2, 26, 5, "#3a4049");
      /* 몸통 — 각진 금속 상자 */
      box(ctx, -18, -14, 36, 36, 3, "#8f959e");
      ctx.fillStyle = SH; rrPath(ctx, 3, -14, 15, 36, 3); ctx.fill();
      litL(ctx, -16.4, -12, 32);
      fillR(ctx, -12, 4, 24, 8, 1.5, "#4a505a");      // 환기구
      stroke(ctx, "#6a7078", 1.4, function (c) {
        c.moveTo(-10, 6); c.lineTo(10, 6); c.moveTo(-10, 9.5); c.lineTo(10, 9.5); });
      dot(ctx, -12, -8, 2.2, dead ? "#5a4040" : "#57d98a");   // 전원 램프
      /* 집게 팔 — 서류를 들고 있다 */
      var sw = a === "walk" ? Math.sin(p * 6.2831853) * 0.22 : 0;
      pivot(ctx, -18, -8, 0.30 + sw, function (ctx) {
        limb(ctx, -18, -8, -30, 6, 5, "#6b7079");
        fillR(ctx, -35, 2, 10, 9, 1.5, "#4a505a");
        if (!dead) { fillR(ctx, -39, -6, 15, 11, 1, PAPER);
                     stroke(ctx, PAPER2, 1.1, function (c) {
                       c.moveTo(-36, -2); c.lineTo(-28, -2); c.moveTo(-36, 1); c.lineTo(-30, 1); }); }
      });
      pivot(ctx, 18, -8, -0.30 - sw, function (ctx) {
        limb(ctx, 18, -8, 30, 6, 5, "#6b7079");
        fillR(ctx, 25, 2, 10, 9, 1.5, "#4a505a");
      });
      /* 머리 — 화면. 눈이 아니라 표시등이다 */
      ctx.save();
      ctx.translate(0, -1.2 * Math.abs(roll));
      box(ctx, -15, -33, 30, 21, 3, "#787e88");
      fillR(ctx, -12, -30, 24, 15, 2, dead ? "#232830" : "#1b2a3a");
      if (!dead) {
        ctx.fillStyle = "#7fe0c0";
        ctx.fillRect(-8, -25 + Math.sin(t * 2.2) * 0.6, 5, 4);
        ctx.fillRect(3, -25 + Math.sin(t * 2.2) * 0.6, 5, 4);
        ctx.fillStyle = "rgba(127,224,192,.22)";     // 화면 잔광
        ctx.fillRect(-12, -30, 24, 15);
      } else {
        stroke(ctx, "#4a5058", 1.6, function (c) {   // 꺼진 화면 — X
          c.moveTo(-7, -26); c.lineTo(-2, -21); c.moveTo(-2, -26); c.lineTo(-7, -21);
          c.moveTo(2, -26); c.lineTo(7, -21); c.moveTo(7, -26); c.lineTo(2, -21); });
      }
      fillR(ctx, -3, -37, 6, 5, 1, "#5a6069");         // 안테나
      dot(ctx, 0, -39, 2.4, dead ? "#5a4040" : "#ff6b6b");
      ctx.restore();
      ctx.restore();
    });
  }

  /* ── 사무집기 ─────────────────────────────────────────────────
     위에서 내려다본 물건들. 사람이 아니라서 다리도 팔도 없고, 대신
     그림자와 윤곽만으로 「저건 부술 수 있는 것」으로 읽혀야 한다.

<script>
/* _backdrop.js — 「정시 퇴근」 필드 배경: 형광등 꺼진 심야 사무실 바닥
   아트 디렉션: design/README.md 「형광등 꺼진 사무실」(Fluorescent Night)

   위에서 수직으로 내려다본 오픈플랜 사무실. 카펫타일 바닥 위에 파티션으로
   둘러싼 책상 섬(4~6석)이 놓이고, 그 사이가 통로다. 천장 형광등은 대부분
   꺼져 있고 몇 개만 켜져 바닥에 푸른 빛 웅덩이를 남긴다. 무드는 전부
   빛 웅덩이가 담당하고, 가구는 스프라이트와 싸우지 않도록 저대비 실루엣.

   계약:
     window.BACKDROP = { office: fn }
     fn(ctx, W, H, camX, camY, t)
       ctx        게임 컨텍스트. 균등 스케일 변환 하에서도 동작(논리 px로만 그림)
       W, H       뷰포트 논리 픽셀 크기 (리사이즈 가능)
       camX, camY 뷰포트 좌상단의 월드 좌표 (screen = world - cam)
       t          경과 초 — 형광등 하나의 간헐적 깜빡임에만 사용

   규칙:
     · 대비 상한 #2a3444 (r42 g52 b68). 예외는 켜진 형광등 관과 직근 글로우뿐,
       화면의 몇 % 이하.
     · 구조 주기 528px(책상·카펫), 조명 변주 주기 1056px(2×2 블록 매크로 타일).

       패턴 반복은 브라우저가 랩 샘플링하므로 이음새가 원리적으로 없다.

(function () {

  /* 팔레트 — 「형광등 꺼진 심야 사무실」로 잡았더니 대비 상한이

     기법이 아니라 방향이 문제였다. 불을 켠 낮 사무실로 바꾼다.

  var FLOOR = "#4a443b";           // 카펫 (어두운 쪽) — #3a3630은 아직 「어두운 갈색」으로 읽혀 한 단계 올렸다
  var FLOOR2 = "#524c42";          // 카펫 체커 밝은 쪽
  var PART = "#6d6a62";            // 파티션 — 회색 패브릭
  var DESK = "#8a6b47";            // 책상 — 나무
  var DESKEDGE = "#a2825b";
  var DARKOBJ = "#2c3038";         // 모니터 등 짙은 사물 (검은 구멍이 되지 않게 살짝 띄운다)

  var PAPER = "#e6e2d8", PAPER2 = "#cfcabf";   // 책상 위 서류 — 흰 종이
  var METAL = "#9a9ca3", METAL2 = "#7c7f87";   // 복합기·정수기 본체
  var CONC  = "#6f6c65";                       // 기둥 콘크리트

    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);

    c.translate(cx, cy);

    c.fillStyle = "#2b2f38";

    for (var col = 0; col < 2; col++) {
      var sgn = col === 0 ? -1 : 1;
      for (var row = 0; row < rows; row++) {

        frr(c, x0 + 3, y0 + 3, DW - 6, DH - 6, 4, DESK);
        c.lineWidth = 1; c.strokeStyle = DESKEDGE;
        rr(c, x0 + 3, y0 + 3, DW - 6, DH - 6, 4); c.stroke();

        var mx = sgn < 0 ? -20 : 14;
        frr(c, mx, yc - 15, 6, 30, 2, DARKOBJ);
        c.fillStyle = "#1f232b";
        c.fillRect(sgn < 0 ? mx + 6 : mx - 5, yc - 3, 5, 6);

        frr(c, sgn < 0 ? -48 : 34, yc - 12, 14, 24, 2, "#3d424c");
        /* 잡동사니 — 자리마다 조금씩 다르게 */

          c.rotate((rnd() - 0.5) * 0.5);

          c.beginPath();
          c.arc(sgn < 0 ? -62 : 62, yc + (rnd() - 0.5) * 26, 3.5, 0, Math.PI * 2);

        c.fillStyle = CHAIR2;                    // 등받이 호

        c.arc(chx, chy, 6.2, sgn < 0 ? 2.2 : 5.34, sgn < 0 ? -2.2 : 0.94, true);

  /* ── 소품 (전부 위에서 본 모습, 저대비) ─────────────────────── */

  function printer(c, x, y, rot) {
    c.save(); c.translate(x, y); c.rotate(rot);

    frr(c, -18, -11, 36, 10, 2, METAL2);        // 급지 트레이
    frr(c, -14, 3, 28, 9, 2, PAPER);            // 배지 용지
    c.restore();
  }
  function cooler(c, x, y) {
    c.save(); c.translate(x, y);
    frr(c, -12, -12, 24, 24, 6, "#d9dde3");     // 본체 — 흰 정수기
    c.fillStyle = "#7fb0dc";                    // 물통
    c.beginPath(); c.arc(0, 0, 9, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#5d8fbf";
    c.beginPath(); c.arc(0, 0, 4, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  function plant(c, x, y, rnd) {
    c.save(); c.translate(x, y);
    c.fillStyle = "#6b4a33";                    // 화분 — 테라코타
    c.beginPath(); c.arc(0, 0, 11, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#3f7a4a";                    // 잎 — 위에서 본 로제트
    for (var i = 0; i < 7; i++) {
      var a = (i / 7) * Math.PI * 2 + rnd() * 0.5;
      c.save(); c.rotate(a);
      c.beginPath(); c.ellipse(8, 0, 8, 3.4, 0, 0, Math.PI * 2); c.fill();

    c.beginPath(); c.arc(0, 0, 4.5, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  function pillar(c, x, y) {                    // 기둥 + 화이트보드

    c.fillRect(-17, -17, 34, 34);
    c.fillStyle = CONC;

    }

  }

  /* 낮 사무실에서는 천장을 그리지 않는다 — 위에서 본 바닥에 등기구가 놓이면

  function darkFixture(c, x, y, horiz) {}

  /* 켜진 등 스프라이트 — 264×264 캔버스 1장에 구워 재사용 (베이크·깜빡이 공용) */
  var litSprite = null;

    g2.addColorStop(0, la(0.22));          // 관 바로 아래

    c.fillStyle = g2;
    c.save(); c.scale(1.6, 0.62);

  /* 켜진 등 위치 — 매크로(4×4 쿼드런트) 안에서 3개, 그중 1개가 깜빡이 담당.

     삐져나가지 않아 랩 패스 없이도 이음새가 없다. */
  var LIT_Q = [[1, 1], [3, 2]];                 // 상시 점등 (베이크)
  var FLICK_Q = [0, 3];                         // 깜빡이 (라이브)
  var FLICK_X = FLICK_Q[0] * Q + 132;
  var FLICK_Y = FLICK_Q[1] * Q + 132;

  /* 깜빡임 — 125ms 슬롯 해시. 거의 항상 1(정지 화면과 동일),

  /* ── 구역별 생김새 ────────────────────────────────────────────

     나무 책상이다. 구역이 바뀌었다는 걸 화면이 말해야 한다.

  var LOOKS = [
    { f:"#45454a", f2:"#4c4c51", grid:"lot",    line:"rgba(230,230,235,.10)", set:"cars"     },
    { f:"#605a50", f2:"#6a6459", grid:"slab",   line:"rgba(255,250,235,.09)", set:"lobby"    },
    { f:"#4a443b", f2:"#524c42", grid:"carpet", line:"rgba(120,150,200,.045)",set:"desks"    },
    { f:"#4f4e49", f2:"#575651", grid:"tile",   line:"rgba(255,255,255,.06)", set:"canteen"  },
    { f:"#3f4450", f2:"#464c58", grid:"carpet", line:"rgba(150,175,215,.05)", set:"corridor" },
    { f:"#3e4a42", f2:"#45524a", grid:"carpet", line:"rgba(150,200,170,.05)", set:"meeting"  },
    { f:"#57554f", f2:"#5f5d57", grid:"tile",   line:"rgba(255,255,255,.07)", set:"pantry"   },
    { f:"#4a3c3c", f2:"#524343", grid:"carpet", line:"rgba(220,180,170,.045)",set:"exec"     },
    { f:"#54402c", f2:"#5c4732", grid:"plank",  line:"rgba(255,220,170,.06)", set:"ceo"      },
  ];
  var lookOf = function (z) { return LOOKS[Math.max(0, Math.min(LOOKS.length - 1, z | 0))]; };

  /* ── 구역 소품 원형 ── */
  function pillar(c, x, y, r) {                       // 기둥

  }
  function car(c, x, y, rot, col) {                   // 차 — 위에서 본 실루엣

  function longTable(c, x, y, w, h, top, leg) {       // 긴 테이블

  /* 구역 소품 배치 — 쿼드런트 하나를 채운다 */
  function fillQuad(c, set, qx, qy, rb) {
    if (set === "cars") {
      c.strokeStyle = "rgba(240,240,245,.20)"; c.lineWidth = 3;          // 주차 구획선

      if (rb() < 0.55) car(c, qx + 31, qy, Math.PI, ["#5a6b86", "#7a5a5a", "#4f5f52"][(rb() * 3) | 0]);
      if (rb() < 0.4) pillar(c, qx + 90, qy - 80);
    } else if (set === "lobby") {
      if (rb() < 0.5) counter(c, qx, qy, 150, 44, "#6b5a44", "#8a7a5e");
      else { sofa(c, qx - 40, qy, 96, "#5a5f6e"); planter(c, qx + 70, qy + 10, true); }
      if (rb() < 0.45) pillar(c, qx + 92, qy - 86);
    } else if (set === "canteen") {

      if (rb() < 0.35) counter(c, qx, qy - 96, 150, 34, "#6d6f76", "#9aa0a8");
    } else if (set === "corridor") {
      doorway(c, qx, qy - 92, true); doorway(c, qx, qy + 92, true);
      if (rb() < 0.4) planter(c, qx + 80, qy, false);
    } else if (set === "meeting") {
      longTable(c, qx, qy, 190, 74, "#7a5f3f", "#4f545e");
      if (rb() < 0.5) board(c, qx, qy - 104);
    } else if (set === "pantry") {
      counter(c, qx, qy - 80, 160, 38, "#8d8a83", "#c9c6bd");
      if (rb() < 0.6) cabinet(c, qx - 60, qy + 40);
      if (rb() < 0.6) planter(c, qx + 60, qy + 40, false);
    } else if (set === "exec") {
      frame(c, qx - 70, qy - 96); frame(c, qx + 10, qy - 96);
      if (rb() < 0.6) planter(c, qx + 80, qy + 20, true);
      if (rb() < 0.4) sofa(c, qx - 30, qy + 40, 110, "#6b4f4f");

  function getTile(zone) {
    var key = zone | 0;
    if (tiles[key]) return tiles[key];
    var LK = lookOf(key);
    var FLOOR = LK.f, FLOOR2 = LK.f2;
    var cv = document.createElement("canvas");
    cv.width = TS; cv.height = TS;
    var c = cv.getContext("2d");
    var i, j, x, y;

    /* 1. 바닥 — 구역마다 패턴이 다르다 */
    c.fillStyle = FLOOR; c.fillRect(0, 0, TS, TS);
    var U = LK.grid === "slab" ? 132 : LK.grid === "plank" ? 176 : CARPET;
    if (LK.grid === "plank") {                       // 마루 — 긴 널
      c.fillStyle = FLOOR2;
      for (j = 0; j < TS / 44; j++) if (j & 1) c.fillRect(0, j * 44, TS, 44);
      c.strokeStyle = LK.line; c.lineWidth = 1; c.beginPath();
      for (j = 0; j <= TS / 44; j++) { c.moveTo(0, j * 44 + 0.5); c.lineTo(TS, j * 44 + 0.5); }
      for (j = 0; j < TS / 44; j++)                  // 널 이음매를 엇갈리게
        for (i = 0; i <= TS / U; i++) {
          var ox2 = (j & 1) ? U / 2 : 0;
          c.moveTo(m(i * U + ox2, TS) + 0.5, j * 44); c.lineTo(m(i * U + ox2, TS) + 0.5, j * 44 + 44);
        }
      c.stroke();
    } else if (LK.grid === "lot") {                  // 주차장 — 이음매 없는 콘크리트 판
      c.fillStyle = FLOOR2;
      for (j = 0; j < TS / 264; j++)
        for (i = 0; i < TS / 264; i++) if ((i + j) & 1) c.fillRect(i * 264, j * 264, 264, 264);
      c.strokeStyle = LK.line; c.lineWidth = 1.5; c.beginPath();
      for (i = 0; i <= TS / 264; i++) {
        c.moveTo(i * 264 + 0.5, 0); c.lineTo(i * 264 + 0.5, TS);
        c.moveTo(0, i * 264 + 0.5); c.lineTo(TS, i * 264 + 0.5);
      }
      c.stroke();
    } else {                                         // 카펫타일 · 대리석 · 타일 — 체커
      c.fillStyle = FLOOR2;
      for (j = 0; j < TS / U; j++)
        for (i = 0; i < TS / U; i++) if ((i + j) & 1) c.fillRect(i * U, j * U, U, U);
      c.strokeStyle = LK.line; c.lineWidth = LK.grid === "slab" ? 1.6 : 1;
      c.beginPath();
      for (i = 0; i <= TS / U; i++) {
        c.moveTo(i * U + 0.5, 0); c.lineTo(i * U + 0.5, TS);
        c.moveTo(0, i * U + 0.5); c.lineTo(TS, i * U + 0.5);

    }

    var rd = rng(0x5eed);
    for (i = 0; i < 26; i++) {

      gg.addColorStop(0, dark ? "rgba(0,0,0,.05)" : la(0.018));
      gg.addColorStop(1, "rgba(0,0,0,0)");

    /* 3. 통로 — 쿼드런트 경계선을 따라 살짝 닳은 카펫 (그리드에 정렬 → 이음새 없음) */
    c.fillStyle = "rgba(0,0,0,.055)";
    for (i = 0; i < 4; i++) {
      c.fillRect(m(i * Q - 20, TS), 0, 40, TS);
      c.fillRect(0, m(i * Q - 20, TS), TS, 40);
    }

    /* 4. 블록 4개 — 같은 문법, 다른 배치의 가구 */
    for (var bj = 0; bj < 2; bj++)

          if (qi < nClu) {
            cluster(c, qx, qy, rb() < 0.5, rb() < 0.45 ? 2 : 3, rb);
          } else if (rb() < 0.8) {

            p(c, qx + (rb() - 0.5) * 90, qy + (rb() - 0.5) * 90, rb);
            if (rb() < 0.35) {

              p(c, qx + (rb() - 0.5) * 130, qy + (rb() - 0.5) * 130, rb);

    for (j = 0; j < 4; j++)

            c.drawImage(lit, x - 132, y - 132);
      }

    var pat = c.createPattern(cv, "repeat");
    tiles[key] = { cv: cv, pattern: pat };
    return tiles[key];
  }

  /* ── 비네트 (뷰포트 크기별 캐시, 최대 4개) ───────────────────── */
  var vigCache = {}, vigKeys = [];
  function getVig(W, H) {
    var key = W + "x" + H;
    if (vigCache[key]) return vigCache[key];
    var cv = document.createElement("canvas");
    cv.width = Math.max(1, W); cv.height = Math.max(1, H);
    var c = cv.getContext("2d");
    var R = Math.hypot(W, H) / 2;
    var g = c.createRadialGradient(W / 2, H / 2, R * 0.42, W / 2, H / 2, R * 1.02);
    g.addColorStop(0, "rgba(28,22,14,0)");
    g.addColorStop(1, "rgba(28,22,14,.26)");
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    vigCache[key] = cv; vigKeys.push(key);
    if (vigKeys.length > 4) delete vigCache[vigKeys.shift()];
    return cv;
  }

  /* ── 매 프레임 ─────────────────────────────────────────────── */
  /* ── 하루의 빛 ──────────────────────────────────────────────
     이 게임은 09:00에서 18:00까지 하루가 흐르는 게임인데, 배경은
     처음부터 끝까지 「형광등 꺼진 심야 사무실」 하나였다. 아침도
     밤처럼 어두웠다. 하루가 흐르는 게 화면에 없으니 7분 내내
     같은 방에 있는 것처럼 보였다 — 「배경이 구리다」의 절반이 이것이다.

     빛만 바꾼다. 가구를 다시 그리는 게 아니라 창으로 들어오는 빛의
     색과 세기가 시간을 따라간다. 아침은 푸르고 서늘하게, 정오는
     희고 밝게, 오후는 노랗게 기울고, 17시부터 주황으로 물들고,
     야근은 형광등만 남아 시퍼렇게 식는다. */
  var DAYLIGHT = [
    { h: 0.00, c: [122, 150, 186], a: 0.30 },   // 09시 — 서늘한 아침빛
    { h: 0.22, c: [168, 186, 204], a: 0.34 },   // 11시 — 밝아진다
    { h: 0.36, c: [206, 208, 196], a: 0.38 },   // 12시 — 정오, 가장 밝다
    { h: 0.58, c: [214, 178, 122], a: 0.32 },   // 14시 — 노랗게 기운다
    { h: 0.80, c: [206, 128, 74],  a: 0.28 },   // 16시 — 오후가 익는다
    { h: 0.94, c: [176, 86, 62],   a: 0.22 },   // 17시 반 — 석양
    { h: 1.00, c: [58, 74, 104],   a: 0.16 },   // 18시 — 창밖이 꺼진다
    { h: 1.40, c: [38, 50, 76],    a: 0.20 },   // 야근 — 형광등만 남아 식는다
  ];
  function dayTint(u) {
    var A = DAYLIGHT[0], B = DAYLIGHT[DAYLIGHT.length - 1];
    for (var i = 0; i < DAYLIGHT.length - 1; i++) {
      if (u >= DAYLIGHT[i].h && u <= DAYLIGHT[i + 1].h) { A = DAYLIGHT[i]; B = DAYLIGHT[i + 1]; break; }
      if (u > DAYLIGHT[DAYLIGHT.length - 1].h) { A = B = DAYLIGHT[DAYLIGHT.length - 1]; }
    }
    var k = B.h === A.h ? 0 : (u - A.h) / (B.h - A.h);
    k = k < 0 ? 0 : k > 1 ? 1 : k;
    return { r: A.c[0] + (B.c[0] - A.c[0]) * k,
             g: A.c[1] + (B.c[1] - A.c[1]) * k,
             b: A.c[2] + (B.c[2] - A.c[2]) * k,
             a: A.a + (B.a - A.a) * k };
  }
  function office(ctx, W, H, camX, camY, t, zone, day) {
    var tile = getTile(zone);

    /* rush.html은 ZOOM(≥1.15) 스케일 변환 아래에서 줌 미적용 VW/VH를 넘긴다.
       채우기는 W×H로 해도 안전하게 넘치지만(잘림), 화면 고정인 비네트는
       실제 보이는 논리 영역에 맞춰야 중심이 플레이어에 온다. */
    var effW = W, effH = H;
    try {
      var tr = ctx.getTransform();
      if (tr && tr.a > 0 && tr.d > 0 && ctx.canvas) {
        effW = Math.min(W, ctx.canvas.width / tr.a);
        effH = Math.min(H, ctx.canvas.height / tr.d);
      }
    } catch (e) { /* getTransform 미지원 환경 — W/H 그대로 */ }

    ctx.save();
    /* 베이스 레이어의 책임 — 이전 프레임이 남긴 합성 상태에 흔들리지 않는다.
       restore가 호출자 상태를 그대로 되돌린다. */
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    /* 바닥 — 패턴 원점을 월드 그리드에 맞춰 뷰포트 전체를 1회 채움 */
    var ox = -m(camX, TS), oy = -m(camY, TS);
    ctx.translate(ox, oy);
    ctx.fillStyle = tile.pattern;
    ctx.fillRect(-ox, -oy, W, H);
    ctx.translate(-ox, -oy);

    /* 깜빡이 형광등 — 보이는 매크로 인스턴스마다 라이브로 */
    var lv = flickLevel(t);
    if (lv > 0.004) {
      var spr = getLitSprite();
      var i0 = Math.floor((camX + FLICK_X - 132) / TS) - 1;
      var i1 = Math.floor((camX + W - FLICK_X + 132) / TS) + 1;
      var j0 = Math.floor((camY + FLICK_Y - 132) / TS) - 1;
      var j1 = Math.floor((camY + H - FLICK_Y + 132) / TS) + 1;
      ctx.globalAlpha = lv;
      for (var j = j0; j <= j1; j++)
        for (var i = i0; i <= i1; i++) {
          var sx = i * TS + FLICK_X - 132 - camX;
          var sy = j * TS + FLICK_Y - 132 - camY;
          if (sx > W || sy > H || sx + 264 < 0 || sy + 264 < 0) continue;
          ctx.drawImage(spr, sx, sy);
        }
