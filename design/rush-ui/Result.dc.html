<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
  <style>
    body{margin:0;font-family:'Gothic A1',"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
      background:#0b0e14;color:#e8ecf4;-webkit-font-smoothing:antialiased}
    a{color:#f5c451} a:hover{color:#d9a94e}
    .ttl{font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400}
    .num{font-variant-numeric:tabular-nums}
  </style>
</helmet>
<div style="width:1000px;height:760px;position:relative;overflow:hidden;background:#0b0e14">
  <div style="position:absolute;inset:0;background:rgba(8,10,15,.86);
    display:flex;align-items:center;justify-content:center;padding:20px">
    <div style="width:100%;max-width:760px;background:#141922;border:1px solid #232a36;
      border-radius:14px;padding:24px">

      <!-- 결과: 이겼는지가 0.2초 안에 읽혀야 한다 -->
      <div style="display:flex;align-items:center;gap:14px">
        <span style="width:8px;height:44px;border-radius:4px;background:#57d98a;display:block"></span>
        <div>
          <h1 class="ttl" style="font-size:38px;margin:0;line-height:1;color:#57d98a">정시 퇴근</h1>
          <div style="color:#7d8699;font-size:14px;margin-top:6px">18:00. 가방 들고 나왔습니다.</div>
        </div>
      </div>

      <!-- 기록 -->
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;
        margin-top:22px;background:#232a36;border:1px solid #232a36;border-radius:10px;overflow:hidden">
        <div style="background:#171d27;padding:15px 14px 13px;display:flex;flex-direction:column;gap:3px">
          <b class="ttl num" style="font-size:28px;line-height:1">5,127</b>
          <span style="font-size:11px;color:#7d8699">처리</span>
        </div>
        <div style="background:#171d27;padding:15px 14px 13px;display:flex;flex-direction:column;gap:3px">
          <b class="ttl num" style="font-size:28px;line-height:1;color:#ff6b6b">2,324</b>
          <span style="font-size:11px;color:#7d8699">최고 연속</span>
        </div>
        <div style="background:#171d27;padding:15px 14px 13px;display:flex;flex-direction:column;gap:3px">
          <b class="ttl num" style="font-size:28px;line-height:1">22</b>
          <span style="font-size:11px;color:#7d8699">레벨</span>
        </div>
        <div style="background:#171d27;padding:15px 14px 13px;display:flex;flex-direction:column;gap:3px">
          <b class="ttl num" style="font-size:28px;line-height:1">1,055,540</b>
          <span style="font-size:11px;color:#7d8699">누적 피해</span>
        </div>
      </div>

      <!-- 마지막에 들고 있던 무기 — 이번 판이 어떤 판이었는지의 요약 -->
      <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span style="font-size:11px;color:#7d8699;margin-right:2px">마지막 구성</span>
        <span style="display:flex;align-items:center;gap:6px;background:#251f12;border:1px solid #46391f;
          border-radius:999px;padding:4px 10px 4px 6px">
          <span style="width:16px;height:16px;border-radius:4px;background:#f5c451;display:block"></span>
          <span style="font-size:12px;color:#f5c451;font-weight:800">전결</span></span>
        <span style="display:flex;align-items:center;gap:6px;background:#251f12;border:1px solid #46391f;
          border-radius:999px;padding:4px 10px 4px 6px">
          <span style="width:16px;height:16px;border-radius:4px;background:#f5c451;display:block"></span>
          <span style="font-size:12px;color:#f5c451;font-weight:800">카페인 중독</span></span>
        <span style="display:flex;align-items:center;gap:6px;background:#1a2029;border:1px solid #232a36;
          border-radius:999px;padding:4px 10px 4px 6px">
          <span style="width:16px;height:16px;border-radius:4px;background:#9ec8ff;display:block"></span>
          <span style="font-size:12px">회의 소집 <b class="num" style="color:#f5c451">6</b></span></span>
        <span style="display:flex;align-items:center;gap:6px;background:#1a2029;border:1px solid #232a36;
          border-radius:999px;padding:4px 10px 4px 6px">
          <span style="width:16px;height:16px;border-radius:4px;background:#c3ccdb;display:block"></span>
          <span style="font-size:12px">사내 메신저 <b class="num" style="color:#f5c451">7</b></span></span>
      </div>

      <!-- 그날의 한마디 -->
      <div style="margin-top:18px;padding:14px 16px;border-left:2px solid #ff6b6b;background:#1a1416;
        border-radius:0 8px 8px 0">
        <div style="font-size:15px;color:#e8ecf4">“이거 오늘 안에 되죠?”</div>
        <div style="font-size:12px;color:#7d8699;margin-top:5px">— 이제 안 들립니다.</div>
      </div>

      <!-- 보상 -->
      <div style="margin-top:18px;display:flex;align-items:center;justify-content:space-between;
        padding:13px 16px;background:#171d27;border:1px solid #232a36;border-radius:10px">
        <span style="font-size:13px;color:#7d8699">오늘의 경력</span>
        <div style="display:flex;align-items:baseline;gap:10px">
          <b class="ttl num" style="font-size:26px;color:#f5c451;line-height:1">+402</b>
          <span class="num" style="font-size:12px;color:#7d8699">보유 1,686</span>
        </div>
      </div>

      <button style="background:#57d98a;color:#0e1a13;border:0;border-radius:8px;font-weight:800;
        padding:15px;width:100%;margin-top:16px;font-size:16px;font-family:inherit;cursor:pointer">
        다시 출근</button>
      <button style="background:transparent;color:#e8ecf4;border:1px solid #232a36;border-radius:8px;
        padding:13px;width:100%;margin-top:8px;font-family:inherit;font-size:14px;cursor:pointer;
        display:flex;align-items:center;justify-content:center;gap:8px">
        <span>자기계발</span><span style="color:#f5c451;font-weight:800">경력 1,686</span></button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
