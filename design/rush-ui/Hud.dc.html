<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
  <style>
    body{margin:0;font-family:'Gothic A1',"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
      background:#0b0e14;color:#e8ecf4;-webkit-font-smoothing:antialiased}
    a{color:#f5c451} a:hover{color:#d9a94e}
    .ttl{font-family:'Black Han Sans',"Malgun Gothic",sans-serif;font-weight:400}
    .num{font-variant-numeric:tabular-nums}
  </style>
</helmet>
<div style="width:1100px;height:660px;position:relative;overflow:hidden;
  background:#0b0e14">

  <!-- 필드(개략) — HUD가 무엇 위에 얹히는지 보이려고 최소한만 -->
  <div style="position:absolute;inset:0;opacity:.55">
    <div style="position:absolute;left:150px;top:120px;width:260px;height:150px;border-radius:14px;
      border:1px solid #1b2330;background:#12171f"></div>
    <div style="position:absolute;right:170px;top:96px;width:300px;height:170px;border-radius:14px;
      border:1px solid #1b2330;background:#12171f"></div>
    <div style="position:absolute;right:210px;top:150px;width:220px;height:8px;border-radius:3px;
      background:#cfe4ff;box-shadow:0 0 60px 20px rgba(158,200,255,.26)"></div>
    <div style="position:absolute;left:210px;bottom:120px;width:320px;height:160px;border-radius:14px;
      border:1px solid #1b2330;background:#12171f"></div>
  </div>
  <div style="position:absolute;left:50%;top:50%;width:230px;height:230px;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle,rgba(245,196,81,.16),rgba(245,196,81,0) 70%)"></div>

  <!-- 상단 HUD -->
  <div style="position:absolute;top:0;left:0;right:0;padding:10px 58px 10px 14px;
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,rgba(11,14,20,.92),rgba(11,14,20,0))">
    <div class="ttl num" style="font-size:30px;line-height:1;letter-spacing:.5px">17:15<span
      style="font-size:12px;color:#7d8699;margin-left:6px">곧 퇴근</span></div>
    <div style="flex:1;height:8px;background:#0b0d12;border-radius:5px;overflow:hidden;
      border:1px solid #232a36;position:relative">
      <i style="display:block;height:100%;width:91%;border-radius:5px;
        background:linear-gradient(90deg,#6f9fd8,#9ec8ff)"></i>
      <u style="position:absolute;top:-3px;left:33%;width:2px;height:14px;background:#3b4658"></u>
      <u style="position:absolute;top:-3px;left:55%;width:2px;height:14px;background:#3b4658"></u>
      <u style="position:absolute;top:-3px;left:78%;width:2px;height:14px;background:#3b4658"></u>
    </div>
    <div style="font-size:13px;color:#7d8699">Lv <b class="num" style="color:#f5c451;font-size:17px">19</b></div>
    <div style="font-size:13px;color:#7d8699">처리 <b class="num" style="color:#e8ecf4;font-size:17px">2,407</b></div>
  </div>

  <!-- 음소거 -->
  <div style="position:absolute;top:10px;right:14px;width:34px;height:34px;border-radius:8px;
    background:rgba(20,25,34,.86);border:1px solid #232a36;display:flex;align-items:center;justify-content:center">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#7d8699" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9h3l5-4v14l-5-4H4z" fill="#7d8699" stroke="none"/>
      <path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.7 6.5a8 8 0 0 1 0 11"/></svg>
  </div>

  <!-- 무기 슬롯 -->
  <div style="position:absolute;top:56px;left:14px;display:flex;gap:6px">
    <div style="width:42px;height:42px;background:rgba(20,25,34,.9);border:1px solid #46391f;border-radius:8px;
      position:relative;display:flex;align-items:center;justify-content:center">
      <span style="width:26px;height:26px;border-radius:6px;background:#f5c451;display:block"></span>
      <b class="num" style="position:absolute;right:3px;bottom:0;font-size:10px;color:#f5c451">★</b></div>
    <div style="width:42px;height:42px;background:rgba(20,25,34,.9);border:1px solid #232a36;border-radius:8px;
      position:relative;display:flex;align-items:center;justify-content:center">
      <span style="width:26px;height:26px;border-radius:6px;background:#c3ccdb;display:block"></span>
      <b class="num" style="position:absolute;right:3px;bottom:0;font-size:10px;color:#f5c451">6</b></div>
    <div style="width:42px;height:42px;background:rgba(20,25,34,.9);border:1px solid #232a36;border-radius:8px;
      position:relative;display:flex;align-items:center;justify-content:center">
      <span style="width:26px;height:26px;border-radius:6px;background:#9ec8ff;display:block"></span>
      <b class="num" style="position:absolute;right:3px;bottom:0;font-size:10px;color:#f5c451">5</b></div>
    <div style="width:42px;height:42px;background:rgba(20,25,34,.9);border:1px solid #232a36;border-radius:8px;
      position:relative;display:flex;align-items:center;justify-content:center">
      <span style="width:26px;height:26px;border-radius:6px;background:#6f9fd8;display:block"></span>
      <b class="num" style="position:absolute;right:3px;bottom:0;font-size:10px;color:#f5c451">3</b></div>
  </div>

  <!-- 보스 체력바 -->
  <div style="position:absolute;left:50%;top:64px;transform:translateX(-50%);width:560px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
      <span style="font-size:12px;font-weight:800;color:#ff6b6b">점검단 · 격노</span>
      <span class="num" style="font-size:12px;color:#7d8699">1,820 / 3,400</span>
    </div>
    <div style="height:12px;background:#241016;border:1px solid #5a2b2f;border-radius:3px;overflow:hidden">
      <i style="display:block;height:100%;width:54%;background:linear-gradient(90deg,#b93b3b,#ff6b6b)"></i>
    </div>
  </div>

  <!-- 콤보 -->
  <div style="position:absolute;left:50%;top:30%;transform:translateX(-50%);text-align:center">
    <div class="ttl num" style="font-size:64px;line-height:1;color:#ff6b6b;
      text-shadow:0 3px 0 rgba(11,14,20,.8)">298</div>
    <div style="font-size:14px;font-weight:800;color:rgba(232,236,244,.75);margin-top:6px">연속 처리</div>
  </div>

  <!-- 토스트 -->
  <div style="position:absolute;left:50%;top:110px;transform:translateX(-50%);
    font-weight:800;font-size:15px;color:#f5c451;text-shadow:0 2px 10px #000">
    믹스커피 — 체력 회복</div>

  <!-- 하단 바 -->
  <div style="position:absolute;left:14px;right:14px;bottom:12px">
    <div style="font-size:11px;color:#7d8699;display:flex;justify-content:space-between">
      <span>체력</span><span class="num">140 / 175</span></div>
    <div style="height:12px;background:#0b0d12;border:1px solid #232a36;border-radius:6px;overflow:hidden;margin-top:6px">
      <i style="display:block;height:100%;width:80%;border-radius:6px;
        background:linear-gradient(90deg,#b93b3b,#ff6b6b)"></i></div>
    <div style="height:12px;background:#0b0d12;border:1px solid #232a36;border-radius:6px;overflow:hidden;margin-top:6px">
      <i style="display:block;height:100%;width:36%;border-radius:6px;
        background:linear-gradient(90deg,#d9a94e,#f5c451)"></i></div>
  </div>

  <!-- 터치 조이스틱 -->
  <div style="position:absolute;left:190px;bottom:150px;width:124px;height:124px;border-radius:50%;
    border:2px solid rgba(158,200,255,.30);background:rgba(11,14,20,.28)">
    <div style="position:absolute;left:62px;top:26px;width:44px;height:44px;border-radius:50%;
      background:rgba(158,200,255,.62);transform:translate(-50%,0)"></div>
  </div>
</div>
</x-dc>
</body>
</html>
